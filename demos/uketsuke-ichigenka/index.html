<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>受付一元化＋進捗自動連絡 デモ | 業務棚卸しから始める中小企業のAI導入</title>
<meta name="description" content="電話・Webフォーム・LINE・来店の受付を1つの台帳にまとめ、工程が進むたびに自動で連絡する仕組みのデモ。業務棚卸し・受付・管理画面・導入後の数字の4画面。工務店／歯科医院／自動車整備で切り替えられます。数値はデモ用の想定値です。">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
/* ==================================================================
   意匠は索引ページ（リポジトリ直下の index.html）と共通です。
   :root のトークンは索引ページからそのまま持ってきています。
   このファイルで新しい色・書体・寸法のトークンは作っていません。
================================================================== */
:root {
  --c-base:         #ffffff;
  --c-paper:        #f5f1e8;
  --c-ink:          #1b1c1e;
  --c-ink-2:        #4c4f54;
  --c-ink-3:        #7d8087;
  --c-rule:         #ddd7c8;
  --c-rule-strong:  #b3ab98;
  --c-accent:       #2d4257;
  --c-accent-tint:  #eef1f3;
  --c-caution:      #9c463b;
  --c-caution-tint: #f3e9e6;
  --font-mincho: "Hiragino Mincho ProN","Yu Mincho","YuMincho","MS PMincho","Noto Serif JP",serif;
  --font-gothic: "Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","YuGothic",Meiryo,"Noto Sans JP",sans-serif;
  --fs-note:  13px;  --fs-body: 15px;  --fs-sub: 18px;  --fs-head: 24px;  --fs-title: 33px;
  --lh-body: 1.9;  --lh-head: 1.45;  --ls-body: 0.04em;  --ls-head: 0.06em;
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 16px;  --sp-4: 32px;  --sp-5: 64px;
  --rule-1: 1px;  --rule-2: 2px;
}

html { -webkit-text-size-adjust: 100%; }

/* Tailwind の preflight は実行時に head の末尾へ挿入されるため、
   body と a はセレクタの詳細度を上げて上書きされないようにしています。 */
html body {
  margin: 0;
  background: var(--c-base);
  color: var(--c-ink);
  font-family: var(--font-gothic);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  letter-spacing: var(--ls-body);
  text-align: left;
}

*, *::before, *::after { border-radius: 0; box-shadow: none; }

body a {
  color: var(--c-accent);
  text-decoration: underline;
  text-underline-offset: 3px;
}

body a:hover { text-decoration-thickness: 2px; }

:focus-visible { outline: var(--rule-2) solid var(--c-accent); outline-offset: 2px; }

/* ------------------------------------------------------------------
   版面
------------------------------------------------------------------ */
.p-topbar { border-top: 3px solid var(--c-accent); }

.p-sheet {
  max-width: 940px;
  margin: 0 auto;
  padding: 0 var(--sp-3);
}

.p-main { padding-top: var(--sp-4); padding-bottom: var(--sp-5); }

/* ------------------------------------------------------------------
   ヘッダー
------------------------------------------------------------------ */
.p-masthead { padding-top: var(--sp-4); padding-bottom: var(--sp-4); }

.p-masthead__kicker {
  font-size: var(--fs-note);
  letter-spacing: var(--ls-head);
  color: var(--c-ink-3);
  margin: 0 0 var(--sp-2);
}

.p-masthead__title {
  font-family: var(--font-mincho);
  font-size: var(--fs-title);
  line-height: var(--lh-head);
  letter-spacing: var(--ls-head);
  font-weight: 600;
  color: var(--c-ink);
  margin: 0;
  padding-bottom: var(--sp-3);
  border-bottom: var(--rule-2) solid var(--c-accent);
}

.p-masthead__lead {
  margin: var(--sp-3) 0 0;
  max-width: 40em;
  color: var(--c-ink-2);
}

.p-masthead__meta {
  margin: var(--sp-3) 0 0;
  font-size: var(--fs-note);
  color: var(--c-ink-3);
}

.p-masthead__meta a { margin-left: var(--sp-2); }

/* ------------------------------------------------------------------
   注記帯
------------------------------------------------------------------ */
.p-notice {
  margin-top: var(--sp-4);
  background: var(--c-caution-tint);
  border-left: 3px solid var(--c-caution);
  padding: var(--sp-3);
}

.p-notice__title {
  margin: 0 0 var(--sp-1);
  font-size: var(--fs-note);
  font-weight: 700;
  letter-spacing: var(--ls-head);
  color: var(--c-caution);
}

.p-notice__body {
  margin: 0;
  font-size: var(--fs-note);
  line-height: 1.8;
  color: var(--c-ink-2);
}

/* 「このデモについて」の展開部 */
.p-about {
  margin-top: var(--sp-3);
  background: var(--c-paper);
  border-top: var(--rule-2) solid var(--c-rule-strong);
  padding: var(--sp-3);
}

.p-about p { margin: 0 0 var(--sp-2); font-size: var(--fs-note); line-height: 1.85; color: var(--c-ink-2); }
.p-about p:last-child { margin-bottom: 0; }
.p-about strong { color: var(--c-ink); font-weight: 700; }

.p-about__list { margin: 0; padding: 0; list-style: none; border-top: var(--rule-1) solid var(--c-rule); }
.p-about__list li {
  padding: var(--sp-2) 0;
  border-bottom: var(--rule-1) solid var(--c-rule);
  font-size: var(--fs-note);
  line-height: 1.8;
  color: var(--c-ink-2);
}

/* ------------------------------------------------------------------
   節見出し
------------------------------------------------------------------ */
.p-heading {
  margin: 0 0 var(--sp-3);
  padding-bottom: var(--sp-2);
  border-bottom: var(--rule-2) solid var(--c-rule-strong);
}

.p-heading__no {
  display: block;
  font-size: var(--fs-note);
  letter-spacing: var(--ls-head);
  color: var(--c-accent);
  margin-bottom: var(--sp-1);
}

.p-heading__text {
  font-family: var(--font-mincho);
  font-size: var(--fs-head);
  line-height: var(--lh-head);
  letter-spacing: var(--ls-head);
  font-weight: 600;
  margin: 0;
}

.p-lead {
  margin: 0 0 var(--sp-4);
  max-width: 42em;
  color: var(--c-ink-2);
}

/* ------------------------------------------------------------------
   操作（業種切替・ボタン）
------------------------------------------------------------------ */
.p-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: var(--sp-2);
  padding-bottom: var(--sp-3);
  font-size: var(--fs-note);
  color: var(--c-ink-3);
}

.p-toolbar__label { letter-spacing: var(--ls-head); }

.p-btn {
  font-family: var(--font-gothic);
  font-size: var(--fs-note);
  letter-spacing: var(--ls-body);
  color: var(--c-accent);
  background: var(--c-accent-tint);
  border: var(--rule-1) solid var(--c-rule-strong);
  padding: var(--sp-1) var(--sp-2);
  cursor: pointer;
}

.p-btn:hover { background: var(--c-base); }
.p-btn:disabled { color: var(--c-ink-3); background: var(--c-base); border-color: var(--c-rule); cursor: not-allowed; }

.p-btn--main {
  font-size: var(--fs-body);
  font-weight: 700;
  background: var(--c-base);
  border: var(--rule-2) solid var(--c-accent);
  padding: var(--sp-2) var(--sp-3);
}

.p-btn--main:hover { background: var(--c-accent-tint); }
.p-btn--main:disabled { border-color: var(--c-rule-strong); }

.p-btn--caution { color: var(--c-caution); background: var(--c-caution-tint); border-color: var(--c-caution); }
.p-btn--caution:hover { background: var(--c-base); }

.p-btn--link {
  background: transparent;
  border: 0;
  padding: 0;
  color: var(--c-accent);
  text-decoration: underline;
  text-underline-offset: 3px;
  cursor: pointer;
  font-family: var(--font-gothic);
  font-size: var(--fs-note);
}

/* 業種の切替 */
.p-choice {
  font-family: var(--font-gothic);
  font-size: var(--fs-note);
  letter-spacing: var(--ls-body);
  color: var(--c-ink-2);
  background: var(--c-base);
  border: var(--rule-1) solid var(--c-rule-strong);
  padding: var(--sp-1) var(--sp-2);
  cursor: pointer;
}

.p-choice:hover { background: var(--c-accent-tint); }

.p-choice[aria-pressed="true"] {
  color: var(--c-accent);
  font-weight: 700;
  background: var(--c-accent-tint);
  border-color: var(--c-accent);
}

/* ------------------------------------------------------------------
   タブ（4画面）
------------------------------------------------------------------ */
.p-tabs {
  display: flex;
  overflow-x: auto;
  border-top: var(--rule-1) solid var(--c-rule);
  border-bottom: var(--rule-2) solid var(--c-rule-strong);
}

.p-tab {
  flex: 0 0 auto;
  display: block;
  white-space: nowrap;
  padding: var(--sp-2) var(--sp-3);
  margin-bottom: -2px;
  font-size: var(--fs-note);
  color: var(--c-ink-2);
  border-bottom: 3px solid transparent;
}

body a.p-tab { text-decoration: none; }
body a.p-tab:hover { background: var(--c-accent-tint); }

body a.p-tab[aria-current="page"] {
  color: var(--c-accent);
  font-weight: 700;
  border-bottom-color: var(--c-accent);
}

.p-tab__no { font-family: var(--font-mincho); margin-right: var(--sp-1); }

/* ------------------------------------------------------------------
   区画（罫線で区切る）
------------------------------------------------------------------ */
.p-block { margin: 0 0 var(--sp-4); }

.p-block__head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--sp-2);
  border-top: var(--rule-2) solid var(--c-accent);
  padding: var(--sp-2) 0;
}

.p-block__label {
  margin: 0;
  font-size: var(--fs-note);
  font-weight: 700;
  letter-spacing: var(--ls-head);
  color: var(--c-accent);
}

.p-block__caption { margin: 0; font-size: var(--fs-note); color: var(--c-ink-3); }

.p-note {
  margin: var(--sp-2) 0 0;
  font-size: var(--fs-note);
  line-height: 1.8;
  color: var(--c-ink-2);
}

.p-note--sub { color: var(--c-ink-3); }

.p-caution {
  margin: var(--sp-3) 0;
  background: var(--c-caution-tint);
  border-left: 3px solid var(--c-caution);
  padding: var(--sp-2) var(--sp-3);
  font-size: var(--fs-note);
  line-height: 1.8;
  color: var(--c-ink-2);
}

.p-caution strong { color: var(--c-caution); font-weight: 700; }

.p-cols { display: grid; gap: var(--sp-4); }
.p-cols--2 { grid-template-columns: 1fr 1fr; }
.p-cols--admin { grid-template-columns: 250px minmax(0, 1fr); gap: var(--sp-4); }

/* ------------------------------------------------------------------
   数字（索引ページの p-figure に合わせています）
------------------------------------------------------------------ */
.p-stats {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  border-top: var(--rule-2) solid var(--c-accent);
  border-bottom: var(--rule-1) solid var(--c-rule-strong);
}

.p-stats--4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }

.p-stats > div {
  padding: var(--sp-2) var(--sp-3) var(--sp-3) 0;
  border-left: var(--rule-1) solid var(--c-rule);
  padding-left: var(--sp-3);
}

.p-stats > div:first-child { border-left: 0; padding-left: 0; }

.p-stat__label {
  margin: 0 0 var(--sp-1);
  font-size: var(--fs-note);
  letter-spacing: var(--ls-head);
  color: var(--c-ink-2);
}

.p-stat__num {
  margin: 0;
  font-size: var(--fs-head);
  line-height: 1.3;
  font-weight: 700;
  color: var(--c-accent);
  letter-spacing: 0.01em;
  font-feature-settings: "tnum" 1;
}

.p-stat__unit { font-size: var(--fs-note); font-weight: 500; margin-left: 2px; }
.p-stat__note { margin: var(--sp-1) 0 0; font-size: var(--fs-note); line-height: 1.7; color: var(--c-ink-3); }

/* ------------------------------------------------------------------
   表（索引ページの一覧と同じ罫線の取り方）
------------------------------------------------------------------ */
.p-table {
  width: 100%;
  border-collapse: collapse;
  border-top: var(--rule-2) solid var(--c-rule-strong);
  border-bottom: var(--rule-2) solid var(--c-rule-strong);
  font-size: var(--fs-note);
}

.p-table th, .p-table td {
  padding: var(--sp-2);
  border-bottom: var(--rule-1) solid var(--c-rule);
  text-align: left;
  vertical-align: top;
  line-height: 1.75;
}

.p-table thead th {
  background: var(--c-paper);
  font-weight: 700;
  color: var(--c-ink-2);
  letter-spacing: var(--ls-head);
  white-space: nowrap;
}

.p-table tbody tr:last-child td { border-bottom: 0; }

.p-table .is-num {
  text-align: right;
  white-space: nowrap;
  font-feature-settings: "tnum" 1;
}

.p-table__name { display: block; font-size: var(--fs-body); color: var(--c-ink); line-height: 1.6; }
.p-table__note { display: block; margin-top: 2px; font-size: var(--fs-note); color: var(--c-ink-3); line-height: 1.7; }
.p-table__total { font-weight: 700; color: var(--c-ink); }
.p-table__before { color: var(--c-ink-3); }
.p-table__after { font-weight: 700; color: var(--c-accent); }

/* 横棒（区分内の相対比較） */
.p-bar {
  display: block;
  height: 6px;
  margin-top: var(--sp-1);
  background: var(--c-paper);
  border: var(--rule-1) solid var(--c-rule);
}

.p-bar__fill { display: block; height: 100%; }

/* 分類の札 */
.p-kind {
  display: inline-block;
  white-space: nowrap;
  font-size: var(--fs-note);
  line-height: 1.6;
  padding: 0 var(--sp-1);
  border: var(--rule-1) solid currentColor;
}

.p-kind--auto  { color: var(--c-accent); }
.p-kind--semi  { color: var(--c-ink-2); }
.p-kind--human { color: var(--c-ink-3); }

.p-kinds { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-3); margin-bottom: var(--sp-4); }
.p-kinds > div { border-top: var(--rule-1) solid var(--c-rule-strong); padding-top: var(--sp-2); }

/* ------------------------------------------------------------------
   定義の並び（入口・調査データなど）
------------------------------------------------------------------ */
.p-defs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: var(--rule-1) solid var(--c-rule-strong); }

.p-defs > div {
  padding: var(--sp-2) var(--sp-3) var(--sp-3) 0;
  border-bottom: var(--rule-1) solid var(--c-rule);
}

.p-defs__t { margin: 0; font-size: var(--fs-body); color: var(--c-ink); }
.p-defs__d { margin: var(--sp-1) 0 0; font-size: var(--fs-note); line-height: 1.7; color: var(--c-ink-3); }

.p-rows { margin: 0; padding: 0; list-style: none; border-top: var(--rule-1) solid var(--c-rule); }

.p-rows li {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--sp-3);
  padding: var(--sp-2) 0;
  border-bottom: var(--rule-1) solid var(--c-rule);
  font-size: var(--fs-note);
  color: var(--c-ink-2);
}

.p-rows__v { flex: 0 0 auto; font-weight: 700; color: var(--c-accent); font-feature-settings: "tnum" 1; }

.p-steps { margin: 0; padding: 0; list-style: none; border-top: var(--rule-1) solid var(--c-rule); }

.p-steps li {
  display: flex;
  gap: var(--sp-3);
  padding: var(--sp-2) 0;
  border-bottom: var(--rule-1) solid var(--c-rule);
  font-size: var(--fs-note);
  line-height: 1.8;
  color: var(--c-ink-2);
}

.p-steps__no { flex: 0 0 auto; width: 2em; font-family: var(--font-mincho); color: var(--c-accent); }

/* ------------------------------------------------------------------
   受付フォーム
------------------------------------------------------------------ */
.p-form { border-top: var(--rule-2) solid var(--c-accent); padding-top: var(--sp-3); }

.p-field { margin-bottom: var(--sp-3); }

.p-field__label {
  display: block;
  margin-bottom: var(--sp-1);
  font-size: var(--fs-note);
  font-weight: 700;
  letter-spacing: var(--ls-head);
  color: var(--c-ink-2);
}

.p-field__req { margin-left: var(--sp-2); font-weight: 400; color: var(--c-caution); }

.p-input {
  display: block;
  width: 100%;
  box-sizing: border-box;
  font-family: var(--font-gothic);
  font-size: var(--fs-body);
  line-height: 1.7;
  letter-spacing: var(--ls-body);
  color: var(--c-ink);
  background: var(--c-base);
  border: var(--rule-1) solid var(--c-rule-strong);
  padding: var(--sp-1) var(--sp-2);
}

.p-input:focus { border-color: var(--c-accent); outline: var(--rule-2) solid var(--c-accent); outline-offset: 0; }

.p-field__err { margin: var(--sp-1) 0 0; font-size: var(--fs-note); color: var(--c-caution); }

.p-range {
  width: 100%;
  max-width: 320px;
  accent-color: var(--c-accent);
  cursor: pointer;
}

.p-wage { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-3); padding: var(--sp-3) 0 0; }
.p-wage__label { font-size: var(--fs-note); font-weight: 700; letter-spacing: var(--ls-head); color: var(--c-ink-2); }
.p-wage__value { font-size: var(--fs-body); font-weight: 700; color: var(--c-accent); font-feature-settings: "tnum" 1; }

/* ------------------------------------------------------------------
   判定と自動返信
------------------------------------------------------------------ */
.p-verdict { border-left: 3px solid var(--c-accent); background: var(--c-accent-tint); padding: var(--sp-3); margin-bottom: var(--sp-3); }
.p-verdict--urgent { border-left-color: var(--c-caution); background: var(--c-caution-tint); }

.p-verdict__title { margin: 0 0 var(--sp-2); font-size: var(--fs-note); font-weight: 700; letter-spacing: var(--ls-head); color: var(--c-accent); }
.p-verdict--urgent .p-verdict__title { color: var(--c-caution); }
.p-verdict__body { margin: 0; font-size: var(--fs-note); line-height: 1.8; color: var(--c-ink-2); }

.p-tags { display: flex; flex-wrap: wrap; gap: var(--sp-1); margin: var(--sp-2) 0 0; padding: 0; list-style: none; }

.p-tags li {
  font-size: var(--fs-note);
  line-height: 1.7;
  padding: 0 var(--sp-1);
  border: var(--rule-1) solid var(--c-rule-strong);
  color: var(--c-ink-2);
  background: var(--c-base);
}

.p-tags--caution li { border-color: var(--c-caution); color: var(--c-caution); background: var(--c-caution-tint); }

.p-mail {
  background: var(--c-paper);
  border-top: var(--rule-2) solid var(--c-rule-strong);
  border-bottom: var(--rule-1) solid var(--c-rule-strong);
  padding: var(--sp-3);
}

.p-mail__meta { margin: 0 0 var(--sp-2); font-size: var(--fs-note); color: var(--c-ink-3); }
.p-mail__subject { margin: 0 0 var(--sp-2); font-family: var(--font-mincho); font-size: var(--fs-sub); line-height: var(--lh-head); font-weight: 600; }
.p-mail p { margin: 0 0 var(--sp-2); font-size: var(--fs-note); line-height: 1.85; color: var(--c-ink); }

.p-mail__label { margin: var(--sp-3) 0 var(--sp-1); font-size: var(--fs-note); font-weight: 700; letter-spacing: var(--ls-head); color: var(--c-accent); }

.p-mail dl { margin: 0; border-top: var(--rule-1) solid var(--c-rule-strong); }
.p-mail dl > div { display: flex; gap: var(--sp-3); padding: var(--sp-1) 0; border-bottom: var(--rule-1) solid var(--c-rule); }
.p-mail dt { flex: 0 0 auto; width: 7em; font-size: var(--fs-note); color: var(--c-ink-3); }
.p-mail dd { flex: 1 1 auto; min-width: 0; margin: 0; font-size: var(--fs-note); color: var(--c-ink); white-space: pre-wrap; word-break: break-word; }

.p-empty { border-top: var(--rule-1) solid var(--c-rule-strong); border-bottom: var(--rule-1) solid var(--c-rule-strong); padding: var(--sp-3) 0; }
.p-empty p { margin: 0 0 var(--sp-2); font-size: var(--fs-note); line-height: 1.8; color: var(--c-ink-2); }
.p-empty p:last-child { margin-bottom: 0; }

/* ------------------------------------------------------------------
   管理画面
------------------------------------------------------------------ */
.p-cases {
  border-top: var(--rule-2) solid var(--c-rule-strong);
  border-bottom: var(--rule-2) solid var(--c-rule-strong);
  max-height: 520px;
  overflow-y: auto;
}

.p-case {
  display: block;
  width: 100%;
  box-sizing: border-box;
  text-align: left;
  font-family: inherit;
  color: inherit;
  background: var(--c-base);

const fmtNum = (n) => n.toLocaleString("ja-JP");

const nowLabel = () => {
  const d = new Date();
  return `${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}`;
};

// 緊急判定：語句一致。判定に使った語をそのまま返します（根拠を画面に出すため）
const detectUrgent = (text, words) => {
  const t = String(text || "");
  const hits = words.filter((w) => t.includes(w));
  return { urgent: hits.length > 0, hits };
};

const seedCases = (indKey) =>
  INDUSTRIES[indKey].seeds.map((s, i) => ({
    id: `${indKey}-${i + 1}`,
    no: `R-2026-${101 + i}`,
    ...s,
    history: s.history.map((h) => ({ ...h })),
  }));

// 分類ごとの罫線・棒の色。索引ページのトークンだけで濃淡を作っています。
const kindColor = (kind) =>
  kind === "auto" ? "var(--c-accent)" : kind === "semi" ? "var(--c-ink-2)" : "var(--c-rule-strong)";

/* ------------------------------------------------------------------
   5. 小さな表示部品
------------------------------------------------------------------ */
function Heading({ no, title, desc }) {
  return (
    <React.Fragment>
      <div className="p-heading">
        <span className="p-heading__no">{no}</span>
        <h2 className="p-heading__text">{title}</h2>
      </div>
      <p className="p-lead">{desc}</p>
    </React.Fragment>
  );
}

function Block({ label, caption, children }) {
  return (
    <div className="p-block">
      <div className="p-block__head">
        <p className="p-block__label">{label}</p>
        {caption ? <p className="p-block__caption">{caption}</p> : null}
      </div>
      {children}
    </div>
  );
}

function KindTag({ kind }) {
  return <span className={`p-kind p-kind--${kind}`}>{CONFIG.kinds[kind].label}</span>;
}

function Bar({ ratio, kind }) {
  return (
    <span className="p-bar">
      <span
        className="p-bar__fill"
        style={{ width: `${Math.max(2, ratio * 100)}%`, backgroundColor: kindColor(kind) }}
      />
    </span>
  );
}

/* ==================================================================
   画面① 業務棚卸し
================================================================== */
function InventoryTab({ ind, wage, setWage }) {
  const rows = ind.tasks.map((t) => ({ ...t, total: t.min * t.cnt }));
  const office = rows.filter((r) => r.group === "office");
  const core = rows.filter((r) => r.group === "core");

  const officeTotal = office.reduce((s, r) => s + r.total, 0);
  const coreTotal = core.reduce((s, r) => s + r.total, 0);
  const saved = office.reduce((s, r) => s + r.total * CONFIG.kinds[r.kind].cut, 0);
  const officeMax = Math.max.apply(null, office.map((r) => r.total));
  const coreMax = Math.max.apply(null, core.map((r) => r.total));

  const TaskTable = ({ list, max, label, caption }) => (
    <Block label={label} caption={caption}>
      <table className="p-table">
        <thead>
          <tr>
            <th scope="col">工程</th>
            <th scope="col" className="is-num">1件あたり</th>
            <th scope="col" className="is-num">月間件数</th>
            <th scope="col" className="is-num">月の合計</th>
            <th scope="col">分類</th>
          </tr>
        </thead>
        <tbody>
          {list.map((r) => (
            <tr key={r.name}>
              <td>
                <span className="p-table__name">{r.name}</span>
                <span className="p-table__note">{r.note}</span>
                <Bar ratio={r.total / max} kind={r.kind} />
              </td>
              <td className="is-num" data-label="1件あたり">{r.min}分</td>
              <td className="is-num" data-label="月間件数">{fmtNum(r.cnt)}件</td>
              <td className="is-num" data-label="月の合計">
                <span className="p-table__total">{fmtH(r.total)}時間</span>
              </td>
              <td data-label="分類"><KindTag kind={r.kind} /></td>
            </tr>
          ))}
        </tbody>
      </table>
    </Block>
  );

  return (
    <div>
      <Heading
        no="①"
        title="業務棚卸し"
        desc="ツールを選ぶ前に、いまどの作業に何時間かかっているかを一覧にします。AI導入の失敗は「棚卸しをせずにツールだけ入れた」ケースに集中しています。先に時間の大きい工程を特定し、そのうえで自動化の可否を1件ずつ判断します。"
      />

      {/* 背景 */}
      <div className="p-cols p-cols--2">
        <Block label="なぜ棚卸しから始めるか">
          <ul className="p-rows">
            {FACTS.adoption.map((f) => (
              <li key={f.label}>
                <span>{f.label}</span>
                <span className="p-rows__v">{f.value}</span>
              </li>
            ))}
          </ul>
          <p className="p-note">
            出典：{FACTS.adoptionSource}。導入が進まない理由の上位2つは、ツールの性能ではなく
            「どこに使うか分からない」「進める人がいない」でした。棚卸しは、この2つに直接答えるための作業です。
          </p>
        </Block>

        <Block label="人が張り付いている作業">
          <ul className="p-rows">
            {FACTS.jobs.map((f) => (
              <li key={f.label}>
                <span style={{ flex: "1 1 auto", minWidth: 0 }}>
                  {f.label}
                  <Bar ratio={f.value / FACTS.jobs[0].value} kind="auto" />
                </span>
                <span className="p-rows__v">{fmtNum(f.value)}万件</span>
              </li>
            ))}
          </ul>
          <p className="p-note">
            {FACTS.jobsSource}。求人票にこれだけ並んでいるということは、それだけの人数がこの作業に充てられているということです。
            この3つは、下の表の上位とほぼ重なります。
          </p>
        </Block>
      </div>

      {/* サマリ */}
      <Block label={`${ind.label}での集計`} caption="デモ用の想定値">
        <div className="p-stats">
          <div>
            <p className="p-stat__label">受付・事務まわりの合計</p>
            <p className="p-stat__num">
              {fmtH(officeTotal)}
              <span className="p-stat__unit">時間 / 月</span>
            </p>
            <p className="p-stat__note">自動化を検討する対象</p>
          </div>
          <div>
            <p className="p-stat__label">このうち削減できる見込み</p>
            <p className="p-stat__num">
              {fmtH(saved)}
              <span className="p-stat__unit">時間 / 月</span>
            </p>
            <p className="p-stat__note">
              対象業務の {Math.round((saved / officeTotal) * 100)}%（年 {fmtH(saved * 12)}時間）
            </p>
          </div>
          <div>
            <p className="p-stat__label">人件費換算</p>
            <p className="p-stat__num">{fmtYen(hoursOf(saved) * wage)}<span className="p-stat__unit">/ 月</span></p>
            <p className="p-stat__note">年 {fmtYen(hoursOf(saved) * wage * 12)}</p>
          </div>
        </div>

        <div className="p-wage">
          <label className="p-wage__label" htmlFor="wage">時給（人件費換算に使用）</label>
          <input
            id="wage"
            type="range"
            className="p-range"
            min={CONFIG.wageMin}
            max={CONFIG.wageMax}
            step={100}
            value={wage}
            onChange={(e) => setWage(Number(e.target.value))}
          />
          <span className="p-wage__value">{fmtYen(wage)} / 時</span>
        </div>

        <p className="p-note">
          削減率は分類ごとの仮置きです。自動化できる＝{CONFIG.kinds.auto.cut * 100}%減、半自動化＝{CONFIG.kinds.semi.cut * 100}%減、
          人がやるべき＝0%。実際の案件では、この率を工程ごとの実測値に置き換えます。
        </p>
      </Block>

      {/* 分類の凡例 */}
      <div className="p-kinds">
        {Object.keys(CONFIG.kinds).map((k) => (
          <div key={k}>
            <KindTag kind={k} />
            <p className="p-note">{CONFIG.kinds[k].hint}</p>
          </div>
        ))}
      </div>

      <TaskTable
        list={office.slice().sort((a, b) => b.total - a.total)}
        max={officeMax}
        label="受付・事務まわり（自動化の検討対象）"
        caption="棒はこの区分内での相対比較"
      />

      <div className="p-caution">
        <strong>下の{core.length}工程は、はじめから自動化の対象外にしています。</strong>
        {ind.coreWord}のような中核業務は「人がやるべき」に分類し、上の削減見込みには一切含めていません。
        事務作業を減らすのは、この中核業務に時間を戻すためです。逆にすると、品質が落ちて売上が下がります。
      </div>

      <TaskTable
        list={core.slice().sort((a, b) => b.total - a.total)}
        max={coreMax}
        label={`中核業務（自動化の対象外・別掲）　合計 ${fmtH(coreTotal)}時間 / 月`}
        caption="棒はこの区分内での相対比較"
      />

      <p className="p-note">
        棚卸しは、この画面に載せている{ind.tasks.length}工程では足りません。実際の導入では30〜50工程まで洗い出します。
        件数と所要時間は、担当者への聞き取りと、可能なものは実測（通話履歴・送信履歴・タイムスタンプ）で埋めます。
        この画面の数値は、すべてデモ用の想定値です。
      </p>
    </div>
  );
}

/* ==================================================================
   画面② 受付（顧客側）
================================================================== */
function IntakeTab({ ind, indKey, onSubmit }) {
  const blank = () => {
    const o = {};
    ind.form.fields.forEach((f) => {
      o[f.key] = f.type === "select" ? f.options[0] : "";
    });
    return o;
  };
  const [values, setValues] = useState(blank);
  const [errors, setErrors] = useState({});
  const [result, setResult] = useState(null);
  const [showWords, setShowWords] = useState(false);

  // 業種が変わったらフォームを初期化する
  const [lastInd, setLastInd] = useState(indKey);
  if (lastInd !== indKey) {
    setLastInd(indKey);
    setValues(blank());
    setErrors({});
    setResult(null);
  }

  const set = (k, v) => setValues((p) => ({ ...p, [k]: v }));

  const fillSample = (which) => {
    setValues(Object.assign(blank(), ind.form.samples[which]));
    setErrors({});
    setResult(null);
  };

  const submit = (e) => {
    e.preventDefault();
    const err = {};
    ind.form.fields.forEach((f) => {
      if (f.required && !String(values[f.key] || "").trim()) err[f.key] = "入力してください";
    });
    setErrors(err);
    if (Object.keys(err).length) {
      setResult(null);
      return;
    }
    const scanText = ind.form.fields.filter((f) => f.scan).map((f) => values[f.key]).join("\n");
    const judged = detectUrgent(scanText, ind.urgentWords);
    const no = onSubmit(values, judged.urgent, judged.hits);
    setResult({ values: Object.assign({}, values), urgent: judged.urgent, hits: judged.hits, no: no, at: nowLabel() });
  };

  return (
    <div>
      <Heading
        no="②"
        title="受付（お客さま側の画面）"
        desc={`電話・${ind.channels[1].label}・LINE・${ind.channels[3].label}のどこから来ても、同じ台帳の1行になります。受付と同時に自動返信が出るため、一次返信が担当者の在席状況に左右されません。`}
      />

      {/* チャネル */}
      <Block label="4つの入口から、1つの台帳へ">
        <div className="p-defs">
          {ind.channels.map((c) => (
            <div key={c.key}>
              <p className="p-defs__t">{c.label}</p>
              <p className="p-defs__d">{c.note}</p>
            </div>
          ))}
        </div>
        <p className="p-note">
          入口ごとにノート・Excel・トーク画面と保管場所が分かれていると、同じ{ind.customerWord}の予定が二重に入ります。
          台帳を1つにするだけで、重複と「どこに書いたか分からない」が同時になくなります。集約先が、③の管理画面の受付台帳です。
        </p>
      </Block>

      <div className="p-cols p-cols--2">
        {/* フォーム */}
        <div>
          <Block label={`${ind.orgName}　お問い合わせフォーム`}>
            <p className="p-note">{ind.form.lead}</p>

            <div className="p-toolbar" style={{ paddingTop: "var(--sp-3)" }}>
              <span className="p-toolbar__label">入力例で試す</span>
              <button type="button" className="p-btn" onClick={() => fillSample("normal")}>通常のご相談</button>
              <button type="button" className="p-btn p-btn--caution" onClick={() => fillSample("urgent")}>緊急のご相談</button>
            </div>

            <form onSubmit={submit} className="p-form" noValidate>
              {ind.form.fields.map((f) => (
                <div className="p-field" key={f.key}>
                  <label className="p-field__label" htmlFor={`f-${f.key}`}>
                    {f.label}
                    {f.required ? <span className="p-field__req">必須</span> : null}
                  </label>
                  {f.type === "select" ? (
                    <select
                      id={`f-${f.key}`}
                      className="p-input"
                      value={values[f.key]}
                      onChange={(e) => set(f.key, e.target.value)}
                    >
                      {f.options.map((o) => (
                        <option key={o} value={o}>{o}</option>
                      ))}
                    </select>
                  ) : f.type === "textarea" ? (
                    <textarea
                      id={`f-${f.key}`}
                      className="p-input"
                      rows={4}
                      value={values[f.key]}
                      placeholder={f.placeholder}
                      onChange={(e) => set(f.key, e.target.value)}
                    />
                  ) : (
                    <input
                      id={`f-${f.key}`}
                      className="p-input"
                      type="text"
                      value={values[f.key]}
                      placeholder={f.placeholder}
                      onChange={(e) => set(f.key, e.target.value)}
                    />
                  )}
                  {errors[f.key] ? <p className="p-field__err">{errors[f.key]}</p> : null}
                </div>
              ))}

              <button type="submit" className="p-btn p-btn--main">この内容で送信する</button>

              <p className="p-note p-note--sub">
                これはデモです。入力内容はどこにも保存・送信されません。ブラウザのメモリ上にだけ置き、
                ページを再読み込みすると消えます（localStorage・Cookie・外部送信のいずれも使っていません）。
              </p>
            </form>
          </Block>
        </div>

        {/* 自動返信 */}
        <div>
          {!result ? (
            <Block label="自動返信">
              <div className="p-empty">
                <p>送信すると、ここに自動返信の文面が出ます。</p>
                <p>
                  本文に緊急語が含まれていた場合は「緊急」と判定し、判定の根拠になった語をそのまま表示します。
                  左の「緊急のご相談」で試せます。
                </p>
              </div>
            </Block>
          ) : (
            <Block label="自動返信" caption={`${result.at} 送信・担当者の操作なし`}>
              {/* 判定 */}
              <div className={result.urgent ? "p-verdict p-verdict--urgent" : "p-verdict"}>
                <p className="p-verdict__title">
                  {result.urgent ? "緊急と判定しました" : "通常の受付として登録しました"}
                </p>
                {result.urgent ? (
                  <React.Fragment>
                    <p className="p-verdict__body">本文に次の語が含まれていたため、緊急と判定しました。</p>
                    <ul className="p-tags p-tags--caution">
                      {result.hits.map((w) => (
                        <li key={w}>{w}</li>
                      ))}
                    </ul>
                    <p className="p-verdict__body" style={{ marginTop: "var(--sp-2)" }}>
                      判定と同時に、担当者へ通知しました。③の受付一覧でも「緊急」の印がつきます。
                    </p>
                  </React.Fragment>
                ) : (
                  <p className="p-verdict__body">本文に緊急語は含まれていませんでした。通常の順番で対応します。</p>
                )}

                <p style={{ margin: "var(--sp-2) 0 0" }}>
                  <button type="button" className="p-btn--link" onClick={() => setShowWords((v) => !v)}>
                    {showWords ? "判定に使う語の一覧を閉じる" : `判定に使う語の一覧を見る（${ind.urgentWords.length}語）`}
                  </button>
                </p>
                {showWords ? (
                  <React.Fragment>
                    <ul className="p-tags">
                      {ind.urgentWords.map((w) => (
                        <li key={w}>{w}</li>
                      ))}
                    </ul>
                    <p className="p-note p-note--sub">
                      語句一致による判定です。判定基準を画面から確認でき、業種ごとに追加・削除できることを優先しました。
                      本番では、ここに文脈の判定を足したうえで、判定に使った語は同じように表示し続けます
                      （なぜ緊急になったのか説明できない状態を作らないためです）。
                    </p>
                  </React.Fragment>
                ) : null}
              </div>

              {/* 自動返信の文面 */}
              <div className="p-mail">
                <p className="p-mail__meta">自動返信（{result.at} 送信）</p>
                <p className="p-mail__subject">【自動返信】お問い合わせを受け付けました（受付番号 {result.no}）</p>
                <p>{result.values.name} 様</p>
                <p>このたびはご連絡ありがとうございます。以下の内容で受け付けました。</p>
                <p>{result.urgent ? ind.reply.urgentLead : ind.reply.normalLead}</p>

                <p className="p-mail__label">受付内容</p>
                <dl>
                  {ind.form.fields.map((f) => (
                    <div key={f.key}>
                      <dt>{f.label}</dt>
                      <dd>{result.values[f.key]}</dd>
                    </div>
                  ))}
                </dl>

                <p className="p-mail__label">今後の流れ</p>
                <p>{ind.stages.join(" → ")}</p>
                <p>{ind.reply.closing}</p>
              </div>

              <p className="p-note">
                この受付は、③の管理画面の一覧に「{result.no}」として追加されています。タブを切り替えて確認できます。
              </p>
            </Block>
          )}
        </div>
      </div>
    </div>
  );
}

/* ==================================================================
   画面③ 管理画面（社内側）
================================================================== */
function channelLabel(ind, k) {
  const c = ind.channels.filter((x) => x.key === k)[0] || ind.channels[0];
  return c.label;
}

function Flow({ stages, current }) {
  return (
    <div className="p-flow">
      {stages.map((s, i) => (
        <span key={s} className={`p-flow__item ${i < current ? "is-done" : ""} ${i === current ? "is-now" : ""}`}>
          {s}
        </span>
      ))}
    </div>
  );
}

                </button>
                <span className="p-block__caption">
                  押した時点で{ind.customerWord}へ自動連絡が送られ、履歴に1行増えます
                </span>
              </div>
            </Block>

            {/* 履歴 */}
            <Block label="対応履歴" caption="自動＝担当者の操作なしに送信／担当＝人が対応">
              <ol className="p-hist">
                {sel.history.map((h, i) => (
                  <li key={i}>
                    <span className="p-hist__t">{h.t}</span>
                    <span className={h.kind === "auto" ? "p-mark p-mark--auto p-hist__kind" : "p-mark p-hist__kind"}>
                      {h.kind === "auto" ? "自動" : "担当"}
                    </span>
                    <span className="p-hist__text">{h.text}</span>
                  </li>
                ))}
              </ol>

              <div className="p-memo">
                <label className="p-field__label" htmlFor="memo" style={{ flex: "1 1 100%" }}>
                  担当者メモを追加（「担当」として記録されます）
                </label>
                <input
                  id="memo"
                  type="text"
                  className="p-input"
                  value={memo}
                  onChange={(e) => setMemo(e.target.value)}
                  placeholder="例：電話で日程を再調整。8/22 14:00で仮押さえ"
                />
                <button
                  type="button"
                  className="p-btn"
                  disabled={!memo.trim()}
                  onClick={() => {
                    addStaffNote(sel.id, memo.trim());
                    setMemo("");
                  }}
                >
                  追加
                </button>
              </div>
            </Block>

            <p className="p-note">
              自動と担当を分けて記録する理由は2つあります。1つは、{ind.customerWord}に何が届いているかを担当者が把握できること。
              もう1つは、「連絡していないのに連絡したことになっている」状態を作らないことです。
              自動送信の行は、送信時刻と文面がそのまま残ります。
            </p>
          </div>
        ) : null}
      </div>
    </div>
  );
}

/* ==================================================================
   画面④ 導入後の数字
================================================================== */
function ResultsTab({ ind, wage }) {
  const rows = ind.tasks.filter((t) => t.group === "office").map((t) => ({ ...t, total: t.min * t.cnt }));
  const officeTotal = rows.reduce((s, r) => s + r.total, 0);
  const saved = rows.reduce((s, r) => s + r.total * CONFIG.kinds[r.kind].cut, 0);
  const cutPct = Math.round((saved / officeTotal) * 100);

  return (
    <div>
      <Heading
        no="④"
        title="導入後の数字"
        desc="①の棚卸しで決めた対象に、②③の仕組みを入れた場合の比較です。すべてデモ用の想定値で、実在の企業の実績ではありません。実際の案件では、導入前に同じ4項目を1か月測ってから着手します。測っていない項目は、あとから効果を説明できないためです。"
      />

      <Block label="4つの指標" caption="デモ用の想定値">
        <table className="p-table">
          <thead>
            <tr>
              <th scope="col">指標</th>
              <th scope="col" className="is-num">導入前</th>
              <th scope="col" className="is-num">導入後</th>
            </tr>
          </thead>
          <tbody>
            {ind.metrics.map((m) => (
              <tr key={m.label}>
                <td>
                  <span className="p-table__name">{m.label}</span>
                  <span className="p-table__note">{m.note}</span>
                </td>
                <td className="is-num" data-label="導入前"><span className="p-table__before">{m.before}</span></td>
                <td className="is-num" data-label="導入後"><span className="p-table__after">{m.after}</span></td>
              </tr>
            ))}
          </tbody>
        </table>
      </Block>

      <Block label="削減時間の合計と人件費換算" caption="時給は①のスライダーと連動">
        <div className="p-stats p-stats--4">
          <div>
            <p className="p-stat__label">対象業務（導入前）</p>
            <p className="p-stat__num">{fmtH(officeTotal)}<span className="p-stat__unit">時間 / 月</span></p>
          </div>
          <div>
            <p className="p-stat__label">残る時間（導入後）</p>
            <p className="p-stat__num">{fmtH(officeTotal - saved)}<span className="p-stat__unit">時間 / 月</span></p>
          </div>
          <div>
            <p className="p-stat__label">削減時間</p>
            <p className="p-stat__num">{fmtH(saved)}<span className="p-stat__unit">時間 / 月</span></p>
            <p className="p-stat__note">年 {fmtH(saved * 12)}時間</p>
          </div>
          <div>
            <p className="p-stat__label">人件費換算（{fmtYen(wage)}/時）</p>
            <p className="p-stat__num">{fmtYen(hoursOf(saved) * wage)}<span className="p-stat__unit">/ 月</span></p>
            <p className="p-stat__note">年 {fmtYen(hoursOf(saved) * wage * 12)}</p>
          </div>
        </div>

        <div className="p-split">
          <span className="p-split__keep" style={{ width: `${((officeTotal - saved) / officeTotal) * 100}%` }} />
          <span className="p-split__cut" style={{ width: `${(saved / officeTotal) * 100}%` }} />
        </div>
        <p className="p-note p-note--sub">
          左が残る時間 {fmtH(officeTotal - saved)}時間 / 月、右が削減する時間 {fmtH(saved)}時間 / 月（対象業務の {cutPct}%）。
        </p>
        <p className="p-note">
          {ind.coreWord}などの中核業務は、この計算に含めていません（①で「人がやるべき」に分類し、自動化の対象外にしています）。
          削減した時間は人員削減ではなく、中核業務と、いま後回しになっている{ind.customerWord}対応に充てる前提で計算しています。
        </p>
      </Block>

      <div className="p-cols p-cols--2">
        <Block label="低評価の口コミに出ていた2つの言葉">
          <ul className="p-rows">
            <li>
              <span>「連絡が来ない」</span>
              <span className="p-rows__v">③の自動連絡</span>
            </li>
            <li>
              <span>「ネット予約と窓口予約が重複した」</span>
              <span className="p-rows__v">②の受付一元化</span>
            </li>
          </ul>
          <p className="p-note">
            {FACTS.reviewSource}では、低評価の最大の要因はこの2つでした。
            どちらも技術的に難しい問題ではなく、{ind.customerWord}が催促するまで情報が出てこない状態が失注につながっています。
            ②と③は、その2つだけを狙って作っています。
          </p>
        </Block>

        <Block label="この数字の出し方">
          <ol className="p-steps">
            <li>
              <span className="p-steps__no">一</span>
              <span>導入前に①の棚卸しを行い、工程ごとの所要時間と月間件数を確定させる（実際は30〜50工程）</span>
            </li>
            <li>
              <span className="p-steps__no">二</span>
              <span>上の4項目を、着手前に1か月そのまま測る。測っていない項目は効果を説明できない</span>
            </li>
            <li>
              <span className="p-steps__no">三</span>
              <span>「自動化できる」工程から順に入れ、1か月ごとに同じ4項目を測り直す</span>
            </li>
            <li>
              <span className="p-steps__no">四</span>
              <span>中核業務は対象外のまま維持する。ここを削ると、短期の時間削減と引き換えに売上が落ちる</span>
            </li>
          </ol>
          <p className="p-note">
            この画面の数値はすべてデモ用の想定値です。実際の削減幅は、現状の運用と件数によって変わります。
            棚卸しの結果によっては「いまは自動化しないほうがよい」という結論もあり得ます。
          </p>
        </Block>
      </div>
    </div>
  );
}

/* ==================================================================
   アプリ本体

   タブは URL のハッシュと対応します。
   #tanaoroshi / #uketsuke / #kanri / #suuji で直接開けます。
================================================================== */
const TABS = [
  { key: "tanaoroshi", no: "①", label: "業務棚卸し" },
  { key: "uketsuke",   no: "②", label: "受付" },
  { key: "kanri",      no: "③", label: "管理画面" },
  { key: "suuji",      no: "④", label: "導入後の数字" },
];

const tabFromHash = () => {
  const k = String(window.location.hash || "").replace(/^#/, "");
  return TABS.filter((t) => t.key === k).length ? k : TABS[0].key;
};

function App() {
  const indKeys = Object.keys(INDUSTRIES);
  const [indKey, setIndKey] = useState(indKeys[0]);
  const [tab, setTab] = useState(tabFromHash);
  const [wage, setWage] = useState(CONFIG.defaultWage);
  const [showAbout, setShowAbout] = useState(false);

  // 戻る・進む、および索引ページからの #付きリンクに追従します
  useEffect(() => {
    const onHash = () => setTab(tabFromHash());
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);

  const goTab = (e, key) => {
    e.preventDefault();
    if (String(window.location.hash).replace(/^#/, "") !== key) {
      window.location.hash = key;   // hashchange 経由で setTab されます
    }
    setTab(key);
  };

  // 業種ごとに受付台帳を持ちます（切り替えても、それぞれの進み具合は保たれます）
  const [ledger, setLedger] = useState(() => {
    const o = {};
    indKeys.forEach((k) => { o[k] = seedCases(k); });
    return o;
  });
  const [selectedId, setSelectedId] = useState(null);
  const [seq, setSeq] = useState(201);

  const ind = INDUSTRIES[indKey];
  const cases = ledger[indKey];
  const selId = cases.filter((c) => c.id === selectedId).length ? selectedId : (cases[0] && cases[0].id);

  const advance = (id) => {
    setLedger((prev) => {
      const list = prev[indKey].map((c) => {
        if (c.id !== id || c.stage >= ind.stages.length - 1) return c;
        const next = c.stage + 1;
        const way = c.summary.filter((kv) => kv[0] === "連絡方法")[0];
        return {
          ...c,
          stage: next,
          history: c.history.concat([
            {
              t: nowLabel(),
              kind: "auto",
              text: `「${ind.stages[next]}」に進んだことを自動連絡（${way ? way[1] : "登録済みの連絡先"}へ送信）`,
            },
          ]),
        };
      });
      return { ...prev, [indKey]: list };
    });
  };

  const addStaffNote = (id, text) => {
    setLedger((prev) => ({
      ...prev,
      [indKey]: prev[indKey].map((c) =>
        c.id === id ? { ...c, history: c.history.concat([{ t: nowLabel(), kind: "staff", text: text }]) } : c
      ),
    }));
  };

  // ②のフォーム送信 → 台帳の先頭に追加（ブラウザのメモリ上のみ）
  const handleIntake = (values, urgent, hits) => {
    const no = `R-2026-${seq}`;
    const id = `${indKey}-new-${seq}`;
    setSeq((s) => s + 1);
    const at = nowLabel();
    const summary = ind.form.fields
      .filter((f) => f.type !== "textarea" && f.key !== "name")
      .map((f) => [f.key === "reply" ? "連絡方法" : f.label, values[f.key]]);
    const history = [
      { t: at, kind: "auto", text: `受付完了の自動返信を送信（${values.reply || "登録済みの連絡先"}）` },
    ];
    if (urgent) {
      history.push({ t: at, kind: "auto", text: `緊急語「${hits.join("」「")}」を検知。担当者へ通知` });
    }
    const rec = {
      id: id, no: no, name: values.name, channel: "web", urgent: urgent, stage: 0, at: at,
      summary: summary, body: values.body || "", history: history,
    };
    setLedger((prev) => ({ ...prev, [indKey]: [rec].concat(prev[indKey]) }));
    setSelectedId(id);
    return no;
  };

  return (
    <React.Fragment>
      <div className="p-topbar" />

      <div className="p-sheet">
        {/* ---------------- ヘッダー ---------------- */}
        <header className="p-masthead">
          <p className="p-masthead__kicker">中小企業向け　業務改善・自動化サンプル集　デモ</p>
          <h1 className="p-masthead__title">{CONFIG.siteTitle}</h1>
          <p className="p-masthead__lead">
            {CONFIG.siteSubtitle}。電話・{ind.channels[1].label}・LINE・{ind.channels[3].label}の受付を1つの台帳にまとめ、
            工程が進むたびに自動で連絡する仕組みです。4つの画面と3業種を切り替えて動かせます。
          </p>
          <p className="p-masthead__meta">
            画面：業務棚卸し／受付／管理画面／導入後の数字　業種：{indKeys.map((k) => INDUSTRIES[k].label).join("／")}
            <a href="../../index.html">業務の悩み 索引へ戻る</a>
          </p>

          <div className="p-notice">
            <p className="p-notice__title">数値の扱いについて</p>
            <p className="p-notice__body">
              この画面に表示される所要時間・件数・導入後の数字は、すべて動作確認のためのデモ用の想定値です。
              実在する企業の実績値ではありません。受付フォームに入力した内容は、どこにも保存・送信されません
              （localStorage・Cookie・外部通信のいずれも使っていません）。
            </p>
          </div>

          <p style={{ margin: "var(--sp-3) 0 0" }}>
            <button type="button" className="p-btn" onClick={() => setShowAbout((v) => !v)}>
              {showAbout ? "このデモについて 閉じる" : "このデモについて"}
            </button>
          </p>

          {showAbout ? (
            <div className="p-about">
              <p>
                中小企業のAI導入率は{FACTS.adoption[0].value}にとどまり、最大の障壁は「具体的な活用場面が不明」
                {FACTS.adoption[1].value}、「導入を推進する人材がいない」{FACTS.adoption[2].value}でした（{FACTS.adoptionSource}）。
                このデモは、その2つに対する具体的な答えを1つ示すものです。順番は固定で、
                <strong>①業務棚卸し → ②受付の一元化 → ③進捗の自動連絡 → ④測り直し</strong>。
                ツールを先に入れて失敗する事例は、①を飛ばしたケースに集中しています。
              </p>
              <ul className="p-about__list">
                <li>所要時間・件数・導入後の数字は、すべてデモ用の想定値です。実在の企業の実績ではありません。</li>
                <li>受付フォームの入力内容は、どこにも保存・送信されません。リロードすると消えます。</li>
                <li>localStorage・Cookie・外部への通信は使っていません。1ファイルのHTMLで完結しています。</li>
              </ul>
            </div>
          ) : null}
        </header>

        {/* ---------------- 業種切替 ---------------- */}
        <div className="p-toolbar">
          <span className="p-toolbar__label">業種</span>
          {indKeys.map((k) => (
            <button
              key={k}
              type="button"
              className="p-choice"
              aria-pressed={k === indKey}
              onClick={() => setIndKey(k)}
            >
              {INDUSTRIES[k].label}
            </button>
          ))}
        </div>
        <p className="p-note p-note--sub" style={{ margin: "0 0 var(--sp-4)" }}>
          切り替えると、工程名・所要時間・月間件数・受付項目・ステージ名・緊急語が変わります。
          画面の構造とコードは完全に同じです。変えているのは、ファイル冒頭の INDUSTRIES の1オブジェクトだけです。
        </p>

        {/* ---------------- タブ ---------------- */}
        <nav className="p-tabs" aria-label="画面の切り替え">
          {TABS.map((tb) => (
            <a
              key={tb.key}
              className="p-tab"
              href={`#${tb.key}`}
              aria-current={tab === tb.key ? "page" : undefined}
              onClick={(e) => goTab(e, tb.key)}
            >
              <span className="p-tab__no">{tb.no}</span>{tb.label}
            </a>
          ))}
        </nav>

        {/* ---------------- 本体 ---------------- */}
        <main className="p-main">
          {tab === "tanaoroshi" && <InventoryTab ind={ind} wage={wage} setWage={setWage} />}
          {tab === "uketsuke" && <IntakeTab ind={ind} indKey={indKey} onSubmit={handleIntake} />}
          {tab === "kanri" && (
            <AdminTab
              ind={ind}
              cases={cases}
              selectedId={selId}
              setSelectedId={setSelectedId}
              advance={advance}
              addStaffNote={addStaffNote}
            />
          )}
          {tab === "suuji" && <ResultsTab ind={ind} wage={wage} />}
        </main>

        {/* ---------------- 奥付 ---------------- */}
        <footer className="p-colophon">
          <p>
            所要時間・件数・導入後の数字は、すべてデモ用の想定値です。実在する企業の実績を示すものではありません。
            受付フォームに入力した内容は、どこにも保存・送信されません（localStorage・Cookie・外部通信のいずれも使用していません）。
            ページを再読み込みすると、すべて初期状態に戻ります。
          </p>
          <p>引用した調査：{FACTS.adoptionSource}／{FACTS.jobsSource}／{FACTS.reviewSource}。</p>
          <p>
            各画面には、URLのハッシュで直接開けます。
            #tanaoroshi（業務棚卸し）／#uketsuke（受付）／#kanri（管理画面）／#suuji（導入後の数字）。
          </p>
          <p>React ＋ Tailwind CSS の1ファイル構成（CDN読み込み・ビルド不要）。意匠は索引ページと共通です。</p>
        </footer>
      </div>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
