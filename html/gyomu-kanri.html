<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>業務管理システム デモ | 拠点・権限・項目定義を設定で切り替え</title>
<meta name="description" content="人材管理・在庫管理・設備点検を同じ仕組みで扱う業務管理システムのデモ。拠点ごとのデータ分離と権限管理つき。項目定義を差し替えるだけで別業務の管理台帳になります。数値はデモ用の想定値です。">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
/* ==================================================================
   配色・字送りは索引ページ（リポジトリ直下の index.html）と同一です。
   このファイルで新しいトークンは定義していません。
================================================================== */
:root {
  --c-base:         #ffffff;
  --c-paper:        #f5f1e8;
  --c-ink:          #1b1c1e;
  --c-ink-2:        #4c4f54;
  --c-ink-3:        #7d8087;
  --c-rule:         #ddd7c8;
  --c-rule-strong:  #b3ab98;
  --c-accent:       #2d4257;
  --c-accent-tint:  #eef1f3;
  --c-caution:      #9c463b;
  --c-caution-tint: #f3e9e6;
  --font-mincho: "Hiragino Mincho ProN","Yu Mincho","YuMincho","MS PMincho","Noto Serif JP",serif;
  --font-gothic: "Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","YuGothic",Meiryo,"Noto Sans JP",sans-serif;
  --fs-note:  13px;  --fs-body: 15px;  --fs-sub: 18px;  --fs-head: 24px;  --fs-title: 33px;
  --lh-body: 1.9;  --lh-head: 1.45;  --ls-body: 0.04em;  --ls-head: 0.06em;
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 16px;  --sp-4: 32px;  --sp-5: 64px;
  --rule-1: 1px;  --rule-2: 2px;
}

html { -webkit-text-size-adjust: 100%; }

/* Tailwind の preflight は実行時に head の末尾へ挿入されるため、
   body と a はセレクタの詳細度を上げて上書きされないようにしています。 */
html body {
  margin: 0;
  background: var(--c-base);
  color: var(--c-ink);
  font-family: var(--font-gothic);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  letter-spacing: var(--ls-body);
  text-align: left;
}

*, *::before, *::after { border-radius: 0; box-shadow: none; }

body a {
  color: var(--c-accent);
  text-decoration: underline;
  text-underline-offset: 3px;
}

body a:hover { text-decoration-thickness: 2px; }

:focus-visible { outline: var(--rule-2) solid var(--c-accent); outline-offset: 2px; }

/* ------------------------------------------------------------------
   版面
------------------------------------------------------------------ */
.p-topbar { border-top: 3px solid var(--c-accent); }

.p-sheet {
  max-width: 940px;
  margin: 0 auto;
  padding: 0 var(--sp-3);
}

.p-section { padding-top: var(--sp-5); }

/* ------------------------------------------------------------------
   ヘッダー
------------------------------------------------------------------ */
.p-masthead { padding-top: var(--sp-4); padding-bottom: var(--sp-4); }

.p-masthead__kicker {
  font-size: var(--fs-note);
  letter-spacing: var(--ls-head);
  color: var(--c-ink-3);
  margin: 0 0 var(--sp-2);
}

.p-masthead__title {
  font-family: var(--font-mincho);
  font-size: var(--fs-title);
  line-height: var(--lh-head);
  letter-spacing: var(--ls-head);
  font-weight: 600;
  color: var(--c-ink);
  margin: 0;
  padding-bottom: var(--sp-3);
  border-bottom: var(--rule-2) solid var(--c-accent);
}

.p-masthead__lead {
  margin: var(--sp-3) 0 0;
  max-width: 40em;
  color: var(--c-ink-2);
}

.p-masthead__meta {
  margin: var(--sp-3) 0 0;
  font-size: var(--fs-note);
  color: var(--c-ink-3);
}

.p-masthead__meta a { margin-left: var(--sp-2); }

/* ------------------------------------------------------------------
   注記帯
------------------------------------------------------------------ */
.p-notice {
  margin-top: var(--sp-4);
  background: var(--c-caution-tint);
  border-left: 3px solid var(--c-caution);
  padding: var(--sp-3);
}

.p-notice__title {
  margin: 0 0 var(--sp-1);
  font-size: var(--fs-note);
  font-weight: 700;
  letter-spacing: var(--ls-head);
  color: var(--c-caution);
}

.p-notice__body {
  margin: 0;
  font-size: var(--fs-note);
  line-height: 1.8;
  color: var(--c-ink-2);
}

.p-notice__body + .p-notice__body { margin-top: var(--sp-2); }

/* ------------------------------------------------------------------
   節見出し
------------------------------------------------------------------ */
.p-heading {
  margin: 0 0 var(--sp-3);
  padding-bottom: var(--sp-2);
  border-bottom: var(--rule-2) solid var(--c-rule-strong);
}

.p-heading__no {
  display: block;
  font-size: var(--fs-note);
  letter-spacing: var(--ls-head);
  color: var(--c-accent);
  margin-bottom: var(--sp-1);
}

.p-heading__text {
  font-family: var(--font-mincho);
  font-size: var(--fs-head);
  line-height: var(--lh-head);
  letter-spacing: var(--ls-head);
  font-weight: 600;
  margin: 0;
}

.p-lead {
  margin: 0 0 var(--sp-3);
  max-width: 42em;
  color: var(--c-ink-2);
}

.p-note {
  margin: var(--sp-2) 0 0;
  font-size: var(--fs-note);
  line-height: 1.8;
  color: var(--c-ink-3);
}

/* ------------------------------------------------------------------
   区画
------------------------------------------------------------------ */
.p-block { margin: 0 0 var(--sp-4); }
.p-block:last-child { margin-bottom: 0; }

.p-block__label {
  margin: 0 0 var(--sp-1);
  font-size: var(--fs-note);
  font-weight: 700;
  letter-spacing: var(--ls-head);
  color: var(--c-accent);
}

.p-block__caption { margin: 0 0 var(--sp-2); font-size: var(--fs-note); color: var(--c-ink-3); }

/* ------------------------------------------------------------------
   操作
------------------------------------------------------------------ */
.p-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: var(--sp-2);
  margin-bottom: var(--sp-3);
  font-size: var(--fs-note);
  color: var(--c-ink-3);
}

.p-toolbar__spacer { flex: 1 1 auto; }

.p-btn {
  font-family: var(--font-gothic);
  font-size: var(--fs-note);
  letter-spacing: var(--ls-body);
  color: var(--c-accent);
  background: var(--c-accent-tint);
  border: var(--rule-1) solid var(--c-rule-strong);
  padding: var(--sp-1) var(--sp-2);
  cursor: pointer;
}

.p-btn:hover { background: var(--c-base); }

.p-btn[aria-pressed="true"] {
  background: var(--c-base);
  border-color: var(--c-accent);
  border-bottom-width: 3px;
  color: var(--c-accent);
  font-weight: 700;
}

.p-btn--main {
  border-color: var(--c-accent);
  border-bottom-width: 3px;
  font-weight: 700;
}

.p-btn--caution { color: var(--c-caution); background: var(--c-caution-tint); border-color: var(--c-caution); }
.p-btn--caution:hover { background: var(--c-base); }

.p-btn--link {
  border: 0;
  background: transparent;
  padding: 0;
  color: var(--c-accent);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.p-btn--link:hover { background: transparent; text-decoration-thickness: 2px; }

/* 業務の切り替え（罫線のタブ） */
.p-tabs {
  display: flex;
  overflow-x: auto;
  margin-bottom: var(--sp-3);
  border-top: var(--rule-1) solid var(--c-rule);
  border-bottom: var(--rule-2) solid var(--c-rule-strong);
}

.p-tab {
  flex: 0 0 auto;
  white-space: nowrap;
  font-family: var(--font-gothic);
  font-size: var(--fs-body);
  letter-spacing: var(--ls-body);
  padding: var(--sp-2) var(--sp-3);
  margin-bottom: -2px;
  color: var(--c-ink-2);
  background: var(--c-base);
  border: 0;
  border-bottom: 3px solid transparent;
  cursor: pointer;
}

.p-tab:hover { background: var(--c-accent-tint); }

.p-tab[aria-current="true"] {
  color: var(--c-accent);
  font-weight: 700;
  border-bottom-color: var(--c-accent);
}

.p-tab__no { font-family: var(--font-mincho); margin-right: var(--sp-1); }

/* ------------------------------------------------------------------
   入力
------------------------------------------------------------------ */
.p-field { margin-bottom: var(--sp-3); }

.p-field__label {
  display: block;
  margin-bottom: var(--sp-1);
  font-size: var(--fs-note);
  font-weight: 700;
  letter-spacing: var(--ls-head);
  color: var(--c-ink-2);
}

.p-field__req { margin-left: var(--sp-2); font-weight: 400; color: var(--c-caution); }
.p-field__err { margin: var(--sp-1) 0 0; font-size: var(--fs-note); color: var(--c-caution); }

.p-input {
  display: block;
  width: 100%;
  box-sizing: border-box;
  font-family: var(--font-gothic);
  font-size: var(--fs-body);
  line-height: 1.7;
  letter-spacing: var(--ls-body);
  color: var(--c-ink);
  background: var(--c-base);
  border: var(--rule-1) solid var(--c-rule-strong);
  padding: var(--sp-1) var(--sp-2);
}

.p-input:focus { border-color: var(--c-accent); outline: var(--rule-2) solid var(--c-accent); outline-offset: 0; }
.p-input:disabled { background: var(--c-paper); color: var(--c-ink-2); }
.p-input.is-err { border-color: var(--c-caution); }
.p-input--inline { display: inline-block; width: auto; max-width: 14em; }

/* ------------------------------------------------------------------
   一覧
------------------------------------------------------------------ */
.p-tablewrap {
  overflow-x: auto;
  border-top: var(--rule-2) solid var(--c-rule-strong);
  border-bottom: var(--rule-2) solid var(--c-rule-strong);
}

.p-table {
  width: 100%;
  min-width: 720px;
  border-collapse: collapse;
  font-size: var(--fs-note);
  line-height: 1.75;
}

.p-table th, .p-table td {
  padding: var(--sp-2);
  text-align: left;
  vertical-align: top;
  border-bottom: var(--rule-1) solid var(--c-rule);
}

.p-table thead th {
  background: var(--c-paper);
  font-weight: 700;
  color: var(--c-ink-2);
  letter-spacing: var(--ls-head);
  white-space: nowrap;
  border-bottom: var(--rule-1) solid var(--c-rule-strong);
}

.p-table tbody tr:last-child td { border-bottom: 0; }
.p-table tbody tr:hover td { background: var(--c-accent-tint); }
.p-table tbody tr.is-editing td { background: var(--c-accent-tint); }

.p-table .is-num { text-align: right; white-space: nowrap; font-feature-settings: "tnum" 1; }
.p-table .is-tight { white-space: nowrap; }
.p-table .is-act { text-align: right; white-space: nowrap; }

.p-table__name { display: block; font-size: var(--fs-body); color: var(--c-ink); line-height: 1.6; }
.p-table__note { display: block; margin-top: 2px; font-size: var(--fs-note); color: var(--c-ink-3); line-height: 1.7; }

/* 状態の札 */
.p-mark {
  display: inline-block;
  white-space: nowrap;
  font-size: var(--fs-note);
  line-height: 1.6;
  padding: 0 var(--sp-1);
  border: var(--rule-1) solid var(--c-rule-strong);
  color: var(--c-ink-2);
  background: var(--c-base);
}

.p-mark--accent  { border-color: var(--c-accent);  color: var(--c-accent);  background: var(--c-accent-tint); }
.p-mark--caution { border-color: var(--c-caution); color: var(--c-caution); background: var(--c-caution-tint); }
.p-mark--muted   { border-color: var(--c-rule);    color: var(--c-ink-3); }

.p-empty {
  border-top: var(--rule-1) solid var(--c-rule-strong);
  border-bottom: var(--rule-1) solid var(--c-rule-strong);
  padding: var(--sp-3) var(--sp-2);
}

.p-empty p { margin: 0 0 var(--sp-1); font-size: var(--fs-note); line-height: 1.8; color: var(--c-ink-2); }
.p-empty p:last-child { margin-bottom: 0; color: var(--c-ink-3); }

/* ------------------------------------------------------------------
   編集欄（画面の中に開きます。覆いかぶさる窓は使いません）
------------------------------------------------------------------ */
.p-editor {
  margin-bottom: var(--sp-4);
  border-top: var(--rule-2) solid var(--c-accent);
  border-bottom: var(--rule-2) solid var(--c-rule-strong);
}

.p-editor__head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--sp-2);
  padding: var(--sp-2) 0;
  border-bottom: var(--rule-1) solid var(--c-rule-strong);
}

.p-editor__title {
  margin: 0;
  font-family: var(--font-mincho);
  font-size: var(--fs-sub);
  line-height: var(--lh-head);
  letter-spacing: var(--ls-head);
  font-weight: 600;
}

.p-editor__meta { margin: 0; font-size: var(--fs-note); color: var(--c-ink-3); }
.p-editor__body { padding: var(--sp-3) 0 var(--sp-1); }

.p-editor__grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 0 var(--sp-4);
}

.p-editor__wide { grid-column: 1 / -1; }

.p-editor__foot {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--sp-2);
  padding: var(--sp-2) 0;
  border-top: var(--rule-1) solid var(--c-rule);
}

.p-editor__foot .p-toolbar__spacer { flex: 1 1 auto; }

/* ------------------------------------------------------------------
   定義の並び
------------------------------------------------------------------ */
.p-defs {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  border-top: var(--rule-1) solid var(--c-rule-strong);
  border-left: var(--rule-1) solid var(--c-rule);
}

.p-defs > div {
  padding: var(--sp-2) var(--sp-3) var(--sp-3);
  border-right: var(--rule-1) solid var(--c-rule);
  border-bottom: var(--rule-1) solid var(--c-rule);
}

.p-defs__t { margin: 0; font-size: var(--fs-note); letter-spacing: var(--ls-head); color: var(--c-ink-2); }

.p-defs__v {
  margin: var(--sp-1) 0 0;
  font-size: var(--fs-sub);
  font-weight: 700;
  color: var(--c-accent);
  line-height: var(--lh-head);
}

.p-defs__d { margin: var(--sp-1) 0 0; font-size: var(--fs-note); line-height: 1.7; color: var(--c-ink-3); }

.p-terms {
  background: var(--c-paper);
  border-top: var(--rule-2) solid var(--c-rule-strong);
  padding: var(--sp-3);
}

.p-terms dl { margin: 0; }

.p-terms dt {
  font-size: var(--fs-note);
  font-weight: 700;
  letter-spacing: var(--ls-head);
  color: var(--c-accent);
  margin-bottom: var(--sp-1);
}

.p-terms dd { margin: 0 0 var(--sp-3); color: var(--c-ink); }
.p-terms dd:last-of-type { margin-bottom: 0; }

.p-sources { margin: 0; padding: 0; list-style: none; border-top: var(--rule-1) solid var(--c-rule); }

.p-sources li {
  display: flex;
  gap: var(--sp-2);
  padding: var(--sp-3) var(--sp-2);
  border-bottom: var(--rule-1) solid var(--c-rule);
  font-size: var(--fs-note);
  line-height: 1.85;
  color: var(--c-ink-2);
}

.p-sources__no { flex: 0 0 auto; width: 3.6em; color: var(--c-ink-3); }
.p-sources__body { flex: 1 1 auto; }
.p-sources__body strong { font-weight: 700; color: var(--c-ink); }

/* ------------------------------------------------------------------
   奥付
------------------------------------------------------------------ */
.p-colophon {
  margin-top: var(--sp-4);
  padding-top: var(--sp-3);
  padding-bottom: var(--sp-5);
  border-top: var(--rule-2) solid var(--c-rule-strong);
  font-size: var(--fs-note);
  line-height: 1.8;
  color: var(--c-ink-3);
}

.p-colophon p { margin: 0 0 var(--sp-2); }
.p-colophon p:last-child { margin-bottom: 0; }

/* ------------------------------------------------------------------
   スマートフォン
------------------------------------------------------------------ */
@media (max-width: 640px) {
  :root {
    --fs-title: 26px;
    --fs-head: 20px;
    --fs-sub: 17px;
    --sp-5: 48px;
  }

  .p-input--inline { max-width: 100%; width: 100%; }
  .p-defs__v { font-size: var(--fs-body); }
}
</style>
</head>
<body>
<div id="root"></div>
<script>Babel.registerPreset("react-classic", { presets: [[Babel.availablePresets["react"], { runtime: "classic" }]] });</script>
<script type="text/babel" data-presets="react-classic">
const { useState, useMemo, useRef, useEffect } = React;

/* ==================================================================
   このデモについて

   ・拠点名・氏名・品名・件数は、すべてデモ用の想定値です。
     実在する企業・人物の情報ではありません。
   ・入力した内容はどこにも保存・送信されません。ブラウザのメモリ上に
     だけ置き、リロードすると初期状態に戻ります。
     localStorage / Cookie / 外部送信のいずれも使っていません。

   転用のしかた

   下の SCHEMAS（業務ごとの項目定義）を差し替えるだけで、別業務の
   管理台帳になります。画面側のコードは、項目の意味を一切知りません。
   実案件では、この定義を JSON / データベース側に外出しします。
================================================================== */

/* ------------------------------------------------------------------
   1. 業務ごとの項目定義。1業務＝1オブジェクト。
      ここに1つ足すと、画面上の切替タブが1つ増えます。
------------------------------------------------------------------ */
const SCHEMAS = {
  staff: {
    label: "人材管理",
    unit: "名",
    noun: "スタッフ",
    lead: "拠点ごとの在籍者を1つの台帳で持ちます。雇用区分と状態を項目として持たせ、休職・退職も履歴として残します。",
    fields: [
      { key: "name", label: "氏名", type: "text", required: true, primary: true },
      { key: "role", label: "職種", type: "select", options: ["調理", "接客", "清掃", "設備", "事務"], required: true },
      { key: "employment", label: "雇用区分", type: "select", options: ["正社員", "パート", "業務委託"], required: true },
      { key: "startedOn", label: "着任日", type: "date", required: true },
      { key: "status", label: "状態", type: "status", options: ["稼働中", "休職", "退職"], required: true },
      { key: "note", label: "備考", type: "textarea" },
    ],
  },
  stock: {
    label: "在庫管理",
    unit: "点",
    noun: "品目",
    lead: "拠点ごとの在庫を1つの台帳で持ちます。棚卸日を項目として持たせ、いつ数えた数字なのかが分かる形にします。",
    fields: [
      { key: "name", label: "品名", type: "text", required: true, primary: true },
      { key: "category", label: "分類", type: "select", options: ["消耗品", "備品", "食材", "資材"], required: true },
      { key: "qty", label: "在庫数", type: "number", required: true },
      { key: "checkedOn", label: "最終棚卸日", type: "date", required: true },
      { key: "status", label: "状態", type: "status", options: ["適正", "要発注", "欠品"], required: true },
      { key: "note", label: "備考", type: "textarea" },
    ],
  },
  inspection: {
    label: "設備点検",
    unit: "件",
    noun: "点検記録",
    lead: "拠点ごとの点検記録を1つの台帳で持ちます。点検者と判定を項目として持たせ、誰がいつ見て何と判断したかを残します。",
    fields: [
      { key: "name", label: "対象設備", type: "text", required: true, primary: true },
      { key: "kind", label: "点検区分", type: "select", options: ["日常", "月次", "法定"], required: true },
      { key: "inspector", label: "点検者", type: "text", required: true },
      { key: "checkedOn", label: "点検日", type: "date", required: true },
      { key: "status", label: "判定", type: "status", options: ["異常なし", "要観察", "要修理"], required: true },
      { key: "note", label: "所見", type: "textarea" },
    ],
  },
};

/* ------------------------------------------------------------------
   2. 拠点。1拠点＝1オブジェクト。
------------------------------------------------------------------ */
const TENANTS = [
  { id: "t1", name: "本店", note: "事務・接客が中心" },
  { id: "t2", name: "北営業所", note: "少人数。兼務が多い" },
  { id: "t3", name: "南工場", note: "設備と資材の管理が中心" },
];

/* ------------------------------------------------------------------
   3. 権限。scope が own の場合、所属拠点の行しか見えません。
------------------------------------------------------------------ */
const ROLES = {

function SectionLedger({ schema, role, rows, query, setQuery, editing, setEditing, onSave, onDelete, onExport, viewTenant, tenantOf }) {
  const editorRef = useRef(null);
  const cols = schema.fields.filter((f) => f.type !== "textarea");
  const longFields = schema.fields.filter((f) => f.type === "textarea");

  // 編集欄を開いたら、その位置まで画面を送ります。覆いかぶさる窓を使わないためです。
  useEffect(() => {
    if (editing && editorRef.current) {
      editorRef.current.scrollIntoView({ block: "nearest" });
    }
  }, [editing]);

  return (
    <section className="p-section" id="daicho">
      <Heading no="二" text={schema.label + "の台帳"} />

      <p className="p-lead">
        行の右端を選ぶと、この表のすぐ上に内容が開きます。画面を覆う窓は使いません。
        {role.canEdit
          ? "必須の項目が空のままでは保存できません。"
          : "現場スタッフの権限では、内容の確認だけができます。"}
      </p>

      <div className="p-toolbar">
        <span>
          {rows.length}
          {schema.unit}を表示中
        </span>
        <span className="p-toolbar__spacer" />
        <label htmlFor="q" style={{ letterSpacing: "var(--ls-head)" }}>検索</label>
        <input
          id="q"
          className="p-input p-input--inline"
          value={query}
          onChange={(e) => setQuery(e.target.value)}
          placeholder={schema.noun + "を検索"}
        />
        <button type="button" className="p-btn" onClick={onExport}>CSVで書き出す</button>
        {role.canEdit ? (
          <button
            type="button"
            className="p-btn p-btn--main"
            onClick={() => setEditing({ ...blankRecord(schema.fields), tenantId: viewTenant })}
          >
            {schema.noun}を追加する
          </button>
        ) : null}
      </div>

      {editing ? (
        <div ref={editorRef}>
          <RecordForm
            schema={schema}
            record={editing}
            readOnly={!role.canEdit}
            canDelete={role.canDelete && Boolean(editing.id)}
            tenantLocked={role.scope !== "all"}
            onCancel={() => setEditing(null)}
            onSave={onSave}
            onDelete={() => onDelete(editing.id)}
          />
        </div>
      ) : null}

      {rows.length === 0 ? (
        <div className="p-empty">
          <p>条件に合う{schema.noun}がありません。</p>
          <p>検索語を消すか、上の所属拠点を切り替えてください。</p>
        </div>
      ) : (
        <React.Fragment>
          <div className="p-tablewrap">
            <table className="p-table">
              <thead>
                <tr>
                  <th>拠点</th>
                  {cols.map((f) => (
                    <th key={f.key} className={f.type === "number" ? "is-num" : null}>{f.label}</th>
                  ))}
                  <th className="is-act">操作</th>
                </tr>
              </thead>
              <tbody>
                {rows.map((r) => (
                  <tr key={r.id} className={editing && editing.id === r.id ? "is-editing" : null}>
                    <td className="is-tight">{tenantOf(r.tenantId).name}</td>
                    {cols.map((f) => (
                      <td
                        key={f.key}
                        className={f.type === "number" || f.type === "date" ? "is-num" : f.primary ? null : "is-tight"}
                      >
                        {f.type === "status" ? (
                          <Mark value={r[f.key]} />
                        ) : f.primary ? (
                          <React.Fragment>
                            <span className="p-table__name">{r[f.key]}</span>
                            {longFields.map((lf) =>
                              String(r[lf.key] || "").trim() ? (
                                <span key={lf.key} className="p-table__note">
                                  {lf.label}：{r[lf.key]}
                                </span>
                              ) : null
                            )}
                          </React.Fragment>
                        ) : (
                          r[f.key]
                        )}
                      </td>
                    ))}
                    <td className="is-act">
                      <button type="button" className="p-btn p-btn--link" onClick={() => setEditing(r)}>
                        {role.canEdit ? "編集する" : "内容を見る"}
                      </button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <p className="p-note">
            表が画面に収まらないときは、表の中を横にスクロールできます。
            CSVには、いま表示している行と列がそのまま出ます。
          </p>
        </React.Fragment>
      )}
    </section>
  );
}

function RecordForm({ schema, record, readOnly, canDelete, tenantLocked, onCancel, onSave, onDelete }) {
  const [draft, setDraft] = useState(record);
  const [touched, setTouched] = useState(false);

  const missing = schema.fields.filter((f) => f.required && !String(draft[f.key] ?? "").trim());
  const set = (key, value) => setDraft((d) => ({ ...d, [key]: value }));

  const submit = () => {
    setTouched(true);
    if (missing.length > 0) return;
    onSave(draft);
  };

  return (
    <div className="p-editor">
      <div className="p-editor__head">
        <h3 className="p-editor__title">
          {record.id ? `${schema.noun}の${readOnly ? "内容" : "編集"}` : `${schema.noun}の追加`}
        </h3>
        <p className="p-editor__meta">
          {readOnly ? "この権限では変更できません" : "必須の項目を埋めると保存できます"}
        </p>
      </div>

      <div className="p-editor__body">
        <div className="p-editor__grid">
          <div className="p-field">
            <label className="p-field__label" htmlFor="f-tenant">拠点</label>
            <select
              id="f-tenant"
              className="p-input"
              value={draft.tenantId}
              disabled={readOnly || tenantLocked}
              onChange={(e) => set("tenantId", e.target.value)}
            >
              {TENANTS.map((t) => (
                <option key={t.id} value={t.id}>{t.name}</option>
              ))}
            </select>
            {tenantLocked && !readOnly ? (
              <p className="p-note" style={{ marginTop: "var(--sp-1)" }}>
                この権限では、自分の拠点以外には登録できません。
              </p>
            ) : null}
          </div>

          {schema.fields.map((f) => {
            const isMissing = touched && f.required && !String(draft[f.key] ?? "").trim();
            const cls = "p-input" + (isMissing ? " is-err" : "");
            const id = "f-" + f.key;
            return (
              <div className={"p-field" + (f.type === "textarea" ? " p-editor__wide" : "")} key={f.key}>
                <label className="p-field__label" htmlFor={id}>
                  {f.label}
                  {f.required ? <span className="p-field__req">必須</span> : null}
                </label>
                {f.type === "select" || f.type === "status" ? (
                  <select id={id} className={cls} value={draft[f.key]} disabled={readOnly} onChange={(e) => set(f.key, e.target.value)}>
                    {f.options.map((o) => (
                      <option key={o} value={o}>{o}</option>
                    ))}
                  </select>
                ) : f.type === "textarea" ? (
                  <textarea id={id} className={cls} rows={3} value={draft[f.key] ?? ""} disabled={readOnly} onChange={(e) => set(f.key, e.target.value)} />
                ) : (
                  <input
                    id={id}
                    className={cls}
                    type={f.type === "number" ? "number" : f.type === "date" ? "date" : "text"}
                    value={draft[f.key] ?? ""}
                    disabled={readOnly}
                    onChange={(e) => set(f.key, e.target.value)}
                  />
                )}
                {isMissing ? <p className="p-field__err">{f.label}を入力してください。</p> : null}
              </div>
            );
          })}
        </div>
      </div>

      <div className="p-editor__foot">
        {readOnly ? (
          <button type="button" className="p-btn" onClick={onCancel}>閉じる</button>
        ) : (
          <React.Fragment>
            <button type="button" className="p-btn p-btn--main" onClick={submit}>保存する</button>
            <button type="button" className="p-btn" onClick={onCancel}>やめる</button>
            {touched && missing.length > 0 ? (
              <span className="p-field__err" style={{ margin: 0 }}>
                未入力の必須項目が{missing.length}件あります。
              </span>
            ) : null}
            {canDelete ? (
              <React.Fragment>
                <span className="p-toolbar__spacer" />
                <button type="button" className="p-btn p-btn--caution" onClick={onDelete}>削除する</button>
              </React.Fragment>
            ) : null}
          </React.Fragment>
        )}
      </div>
    </div>
  );
}

        </li>
        <li>
          <span className="p-sources__no">注記4</span>
          <span className="p-sources__body">
            項目定義は、この画面ではファイル内の <strong>SCHEMAS</strong> に置いています。
            実案件では JSON またはデータベース側に外出しし、画面を変えずに項目を足せる形にします。
          </span>
        </li>
      </ul>

      <div className="p-colophon">
        <p>この画面は、業務改善・自動化のサンプルとして作成したものです。受注実績を示すものではありません。</p>
        <p>
          サンプル一覧は
          <a href="../index.html">業務の悩み 索引</a>
          にまとめています。
        </p>
      </div>
    </section>
  );
}

/* ==================================================================
   本体
================================================================== */
function App() {
  const [schemaKey, setSchemaKey] = useState("staff");
  const [roleKey, setRoleKey] = useState("admin");
  const [viewTenant, setViewTenant] = useState("t1");
  const [data, setData] = useState(SEED);
  const [query, setQuery] = useState("");
  const [editing, setEditing] = useState(null);

  const schema = SCHEMAS[schemaKey];
  const role = ROLES[roleKey];
  const rows = data[schemaKey];

  const visible = useMemo(() => {
    const scoped = role.scope === "all" ? rows : rows.filter((r) => r.tenantId === viewTenant);
    if (!query.trim()) return scoped;
    const q = query.trim().toLowerCase();
    return scoped.filter((r) =>
      schema.fields.some((f) => String(r[f.key] ?? "").toLowerCase().includes(q))
    );
  }, [rows, role.scope, viewTenant, query, schema.fields]);

  const tenantOf = (id) => TENANTS.find((t) => t.id === id);

  const exportCsv = () => {
    const header = ["拠点", ...schema.fields.map((f) => f.label)];
    const body = visible.map((r) => [tenantOf(r.tenantId).name, ...schema.fields.map((f) => r[f.key] ?? "")]);
    const csv = [header, ...body]
      .map((line) => line.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(","))
      .join("\r\n");
    const url = URL.createObjectURL(new Blob(["\uFEFF" + csv], { type: "text/csv" }));
    const a = document.createElement("a");
    a.href = url;
    a.download = `${schema.label}_${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const save = (record) => {
    setData((prev) => {
      const list = prev[schemaKey];
      const next = record.id
        ? list.map((r) => (r.id === record.id ? record : r))
        : [...list, { ...record, id: Math.max(0, ...list.map((r) => r.id)) + 1 }];
      return { ...prev, [schemaKey]: next };
    });
    setEditing(null);
  };

  const remove = (id) => {
    setData((prev) => ({ ...prev, [schemaKey]: prev[schemaKey].filter((r) => r.id !== id) }));
    setEditing(null);
  };

  const switchSchema = (k) => {
    setSchemaKey(k);
    setQuery("");
    setEditing(null);
  };

  return (
    <React.Fragment>
      <div className="p-topbar" />

      <div className="p-sheet">
        {/* ---------------- ヘッダー ---------------- */}
        <header className="p-masthead">
          <p className="p-masthead__kicker">中小企業向け　業務改善・自動化サンプル　台帳の一元化</p>
          <h1 className="p-masthead__title">業務管理システム デモ</h1>
          <p className="p-masthead__lead">
            人材管理・在庫管理・設備点検を、同じ1つの仕組みで扱います。
            拠点ごとにファイルを分けず、台帳は1つにして、見える範囲を権限で切り分けます。
            下の「業務」を切り替えると、同じ画面が別の台帳に変わります。変えているのは項目の定義だけです。
          </p>
          <p className="p-masthead__meta">
            業務：人材管理／在庫管理／設備点検　拠点：{TENANTS.map((t) => t.name).join("／")}
            <a href="../index.html">業務の悩み 索引へ戻る</a>
          </p>

          <div className="p-notice">
            <p className="p-notice__title">数値の扱いについて</p>
            <p className="p-notice__body">
              この画面に表示される拠点・件数・氏名などのデータは、すべて動作確認のためのデモ用の想定値です。
              実在する企業の実績値ではありません。
            </p>
            <p className="p-notice__body">
              追加・編集・削除した内容は、どこにも保存・送信されません
              （localStorage・Cookie・外部通信のいずれも使っていません）。画面を再読み込みすると初期状態に戻ります。
            </p>
          </div>
        </header>

        <SectionConditions
          schemaKey={schemaKey}
          setSchemaKey={switchSchema}
          roleKey={roleKey}
          setRoleKey={setRoleKey}
          viewTenant={viewTenant}
          setViewTenant={setViewTenant}
          role={role}
          tenant={tenantOf(viewTenant)}
          visibleCount={visible.length}
          schema={schema}
        />

        <SectionLedger
          schema={schema}
          role={role}
          rows={visible}
          query={query}
          setQuery={setQuery}
          editing={editing}
          setEditing={setEditing}
          onSave={save}
          onDelete={remove}
          onExport={exportCsv}
          viewTenant={viewTenant}
          tenantOf={tenantOf}
        />

        <SectionAccess roleKey={roleKey} />

        <SectionSchema schema={schema} schemaKey={schemaKey} />

        <SectionNotes />
      </div>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
