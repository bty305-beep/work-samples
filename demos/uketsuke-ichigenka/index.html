  return { urgent: hits.length > 0, hits };
};

function KindTag({ kind }) {

      ? "bg-[var(--c-primary)] text-white border-[var(--c-primary)]"
      : kind === "semi"
      ? "bg-[var(--c-accent-l)] text-[var(--c-accent-d)] border-[var(--c-accent)]"
      : "bg-white text-[var(--c-human)] border-[var(--c-human)]";
  return (
    <span className={`inline-block whitespace-nowrap rounded-full border px-2 py-0.5 text-[11px] font-bold ${cls}`}>
      {CONFIG.kinds[kind].label}

  );
}

function Note({ children, tone = "plain" }) {
  const cls =
    tone === "alert"
      ? "border-[var(--c-alert)] bg-[var(--c-alert-l)] text-[var(--c-alert)]"

      ? "border-[var(--c-ok)] bg-[var(--c-ok-l)] text-[var(--c-ok)]"
      : "border-[var(--c-line-s)] bg-[var(--c-primary-l)] text-[var(--c-sub)]";
  return <div className={`rounded-lg border px-3 py-2.5 text-xs leading-relaxed sm:text-[13px] ${cls}`}>{children}</div>;

            {/* 横棒グラフ（CSSの幅指定） */}
            <div className="mt-2 h-2 w-full overflow-hidden rounded-full bg-[var(--c-line)]">
              <div
                className="h-full rounded-full"
                style={{ width: `${Math.max(2, (r.total / max) * 100)}%`, backgroundColor: barColor(r.kind) }}
              />
            </div>
          </div>
        ))}
      </div>
    </div>
  );

  return (
    <div>
      <SectionTitle
        n="①"
        title="業務棚卸し"
        desc="ツールを選ぶ前に、いまどの作業に何時間かかっているかを一覧にします。AI導入の失敗は「棚卸しをせずにツールだけ入れた」ケースに集中しています。先に時間の大きい工程を特定し、そのうえで自動化の可否を1件ずつ判断します。"
      />

      {/* 背景 */}
      <div className="mb-6 grid gap-3 sm:grid-cols-2">
        <Card className="p-4">
          <p className="text-xs font-bold text-[var(--c-primary)]">なぜ棚卸しから始めるか</p>
          <div className="mt-3 space-y-2">
            {FACTS.adoption.map((f) => (
              <div key={f.label} className="flex items-baseline justify-between gap-3 border-b border-dashed border-[var(--c-line)] pb-2 last:border-0">
                <span className="text-[12px] leading-snug text-[var(--c-sub)]">{f.label}</span>
                <span className="shrink-0 text-base font-bold tabular-nums text-[var(--c-ink)]">{f.value}</span>
              </div>
            ))}
          </div>
          <p className="mt-3 text-[11px] leading-relaxed text-[var(--c-muted)]">
            出典：{FACTS.adoptionSource}。導入が進まない理由の上位2つは、ツールの性能ではなく
            「どこに使うか分からない」「進める人がいない」でした。棚卸しは、この2つに直接答えるための作業です。
          </p>
        </Card>

        <Card className="p-4">
          <p className="text-xs font-bold text-[var(--c-primary)]">人が張り付いている作業</p>
          <div className="mt-3 space-y-2.5">
            {FACTS.jobs.map((f) => (
              <div key={f.label}>
                <div className="flex items-baseline justify-between gap-3">
                  <span className="text-[12px] text-[var(--c-sub)]">{f.label}</span>
                  <span className="text-sm font-bold tabular-nums text-[var(--c-ink)]">{fmtNum(f.value)}万件</span>
                </div>
                <div className="mt-1 h-2 w-full overflow-hidden rounded-full bg-[var(--c-line)]">
                  <div
                    className="h-full rounded-full bg-[var(--c-accent)]"
                    style={{ width: `${(f.value / FACTS.jobs[0].value) * 100}%` }}
                  />
                </div>
              </div>
            ))}
          </div>
          <p className="mt-3 text-[11px] leading-relaxed text-[var(--c-muted)]">
            {FACTS.jobsSource}。求人票にこれだけ並んでいるということは、それだけの人数がこの作業に充てられているということです。
            この3つは、下の表の上位とほぼ重なります。
          </p>
        </Card>
      </div>

      {/* サマリ */}
      <Card className="mb-6 overflow-hidden">
        <div className="border-b border-[var(--c-line)] bg-[var(--c-primary)] px-4 py-3">
          <p className="text-sm font-bold text-white">{ind.label}での集計（デモ用の想定値）</p>
        </div>
        <div className="grid divide-y divide-[var(--c-line)] sm:grid-cols-3 sm:divide-x sm:divide-y-0">
          <div className="p-4">
            <p className="text-[11px] font-bold text-[var(--c-muted)]">受付・事務まわりの合計</p>
            <p className="mt-1 text-2xl font-bold tabular-nums text-[var(--c-ink)]">
              {fmtH(officeTotal)}
              <span className="ml-1 text-sm font-normal">時間 / 月</span>
            </p>
            <p className="mt-1 text-[11px] text-[var(--c-muted)]">自動化を検討する対象</p>
          </div>
          <div className="p-4">
            <p className="text-[11px] font-bold text-[var(--c-accent-d)]">このうち削減できる見込み</p>
            <p className="mt-1 text-2xl font-bold tabular-nums text-[var(--c-accent-d)]">
              {fmtH(saved)}
              <span className="ml-1 text-sm font-normal">時間 / 月</span>
            </p>
            <p className="mt-1 text-[11px] text-[var(--c-muted)]">
              対象業務の {Math.round((saved / officeTotal) * 100)}%（年 {fmtH(saved * 12)}時間）
            </p>
          </div>
          <div className="p-4">
            <p className="text-[11px] font-bold text-[var(--c-muted)]">人件費換算</p>
            <p className="mt-1 text-2xl font-bold tabular-nums text-[var(--c-ink)]">
              {fmtYen(hoursOf(saved) * wage)}
              <span className="ml-1 text-sm font-normal">/ 月</span>
            </p>
            <p className="mt-1 text-[11px] text-[var(--c-muted)]">年 {fmtYen(hoursOf(saved) * wage * 12)}</p>
          </div>
        </div>
        <div className="border-t border-[var(--c-line)] bg-[var(--c-bg)] px-4 py-3">
          <label className="flex flex-wrap items-center gap-3">
            <span className="text-xs font-bold text-[var(--c-sub)]">時給（人件費換算に使用）</span>
            <input
              type="range"
              min={CONFIG.wageMin}
              max={CONFIG.wageMax}
              step={100}
              value={wage}
              onChange={(e) => setWage(Number(e.target.value))}
              className="h-1.5 w-full min-w-[180px] max-w-xs flex-1 cursor-pointer appearance-none rounded-full bg-[var(--c-line-s)] accent-[var(--c-primary)]"
            />

              {fmtYen(wage)} / 時
            </span>
          </label>
          <p className="mt-2 text-[11px] leading-relaxed text-[var(--c-muted)]">
            削減率は分類ごとの仮置きです。自動化できる = {CONFIG.kinds.auto.cut * 100}%減、半自動化 = {CONFIG.kinds.semi.cut * 100}%減、
            人がやるべき = 0%。実際の案件では、この率を工程ごとの実測値に置き換えます。
          </p>

      </Card>

      {/* 分類の凡例 */}
      <div className="mb-5 grid gap-2 sm:grid-cols-3">
        {Object.keys(CONFIG.kinds).map((k) => (
          <div key={k} className="rounded-lg border border-[var(--c-line)] bg-[var(--c-surface)] p-3">
            <KindTag kind={k} />
            <p className="mt-2 text-[11px] leading-relaxed text-[var(--c-sub)]">{CONFIG.kinds[k].hint}</p>
          </div>
        ))}

      <Table
        list={office.slice().sort((a, b) => b.total - a.total)}
        max={officeMax}
        label="受付・事務まわり（自動化の検討対象）"
        caption="バーはこの区分内での相対比較"
      />

      <div className="mb-3">
        <Note tone="alert">
          <span className="font-bold">下の{core.length}工程は、はじめから自動化の対象外にしています。</span>
          {ind.coreWord}のような中核業務は「人がやるべき」に分類し、上の削減見込みには一切含めていません。
          事務作業を減らすのは、この中核業務に時間を戻すためです。逆にすると、品質が落ちて売上が下がります。
        </Note>
      </div>

      <Table
        list={core.slice().sort((a, b) => b.total - a.total)}
        max={coreMax}
        label={`中核業務（自動化の対象外・別掲）　合計 ${fmtH(coreTotal)}時間 / 月`}
        caption="バーはこの区分内での相対比較"
      />

      <Note>
        棚卸しは、この画面に載せている{ind.tasks.length}工程では足りません。実際の導入では30〜50工程まで洗い出します。
        件数と所要時間は、担当者への聞き取りと、可能なものは実測（通話履歴・送信履歴・タイムスタンプ）で埋めます。
        この画面の数値は、すべてデモ用の想定値です。
      </Note>
    </div>

}

/* ==================================================================
   画面② 受付（顧客側）
================================================================== */
function IntakeTab({ ind, indKey, onSubmit }) {
  const blank = () => {
    const o = {};
    ind.form.fields.forEach((f) => {
      o[f.key] = f.type === "select" ? f.options[0] : "";
    });
    return o;
  };
  const [values, setValues] = useState(blank);
  const [errors, setErrors] = useState({});
  const [result, setResult] = useState(null);
  const [showWords, setShowWords] = useState(false);

  // 業種が変わったらフォームを初期化する
  const [lastInd, setLastInd] = useState(indKey);
  if (lastInd !== indKey) {
    setLastInd(indKey);
    setValues(blank());
    setErrors({});
    setResult(null);
  }

  const set = (k, v) => setValues((p) => ({ ...p, [k]: v }));

  const fillSample = (which) => {
    setValues(Object.assign(blank(), ind.form.samples[which]));
    setErrors({});
    setResult(null);
  };

  const submit = (e) => {
    e.preventDefault();
    const err = {};
    ind.form.fields.forEach((f) => {
      if (f.required && !String(values[f.key] || "").trim()) err[f.key] = "入力してください";
    });
    setErrors(err);
    if (Object.keys(err).length) {
      setResult(null);
      return;
    }
    const scanText = ind.form.fields.filter((f) => f.scan).map((f) => values[f.key]).join("\n");
    const judged = detectUrgent(scanText, ind.urgentWords);
    const no = onSubmit(values, judged.urgent, judged.hits);
    setResult({ values: Object.assign({}, values), urgent: judged.urgent, hits: judged.hits, no: no, at: nowLabel() });
  };

  return (
    <div>
      <SectionTitle
        n="②"
        title="受付（お客さま側の画面）"
        desc={`電話・${ind.channels[1].label}・LINE・${ind.channels[3].label}のどこから来ても、同じ台帳の1行になります。受付と同時に自動返信が出るため、一次返信が担当者の在席状況に左右されません。`}
      />

      {/* チャネル図 */}
      <Card className="mb-6 p-4">
        <p className="text-xs font-bold text-[var(--c-primary)]">4つの入口 → 1つの台帳</p>
        <div className="mt-3 grid gap-2 sm:grid-cols-4">
          {ind.channels.map((c) => (
            <div key={c.key} className="rounded-lg border border-[var(--c-line)] bg-[var(--c-bg)] p-3">
              <p className="text-[13px] font-bold text-[var(--c-ink)]">{c.label}</p>
              <p className="mt-1 text-[11px] leading-snug text-[var(--c-muted)]">{c.note}</p>
            </div>
          ))}
        </div>
        <div className="mt-3 flex items-center gap-2">
          <div className="h-px flex-1 bg-[var(--c-line-s)]" />
          <span className="text-xs text-[var(--c-muted)]">↓ すべて同じ形で入る</span>
          <div className="h-px flex-1 bg-[var(--c-line-s)]" />
        </div>
        <div className="mt-3 rounded-lg border border-[var(--c-primary)] bg-[var(--c-primary-l)] px-3 py-2.5">
          <p className="text-[13px] font-bold text-[var(--c-primary-d)]">受付台帳（③の管理画面）</p>
          <p className="mt-1 text-[11px] leading-relaxed text-[var(--c-sub)]">
            入口ごとにノート・Excel・トーク画面と保管場所が分かれていると、同じ{ind.customerWord}の予定が二重に入ります。
            台帳を1つにするだけで、重複と「どこに書いたか分からない」が同時になくなります。
          </p>
        </div>
      </Card>

      <div className="grid gap-5 lg:grid-cols-2">
        {/* フォーム */}
        <Card className="overflow-hidden">
          <div className="border-b border-[var(--c-line)] bg-[var(--c-primary)] px-4 py-3">
            <p className="text-sm font-bold text-white">{ind.orgName}　お問い合わせフォーム</p>
            <p className="mt-1 text-[11px] leading-relaxed text-white/80">{ind.form.lead}</p>
          </div>
          <div className="border-b border-[var(--c-line)] bg-[var(--c-bg)] px-4 py-2.5">
            <p className="mb-2 text-[11px] font-bold text-[var(--c-sub)]">入力例で試す</p>
            <div className="flex flex-wrap gap-2">
              <button
                type="button"
                onClick={() => fillSample("normal")}
                className="rounded-full border border-[var(--c-line-s)] bg-white px-3 py-1.5 text-[11px] font-bold text-[var(--c-sub)] hover:border-[var(--c-primary)] hover:text-[var(--c-primary)]"
              >
                通常のご相談
              </button>
              <button
                type="button"
                onClick={() => fillSample("urgent")}
                className="rounded-full border border-[var(--c-alert)] bg-[var(--c-alert-l)] px-3 py-1.5 text-[11px] font-bold text-[var(--c-alert)] hover:opacity-80"
              >
                緊急のご相談
              </button>
            </div>
          </div>

          <form onSubmit={submit} className="space-y-3.5 p-4" noValidate>
            {ind.form.fields.map((f) => (
              <div key={f.key}>
                <label className="mb-1 flex items-center gap-2 text-[12px] font-bold text-[var(--c-sub)]">
                  {f.label}
                  {f.required && (
                    <span className="rounded bg-[var(--c-accent)] px-1.5 py-px text-[10px] font-bold text-white">必須</span>
                  )}
                </label>
                {f.type === "select" ? (
                  <select
                    value={values[f.key]}
                    onChange={(e) => set(f.key, e.target.value)}
                    className="w-full rounded-lg border border-[var(--c-line-s)] bg-white px-3 py-2 text-sm text-[var(--c-ink)] focus:border-[var(--c-primary)] focus:outline-none"
                  >
                    {f.options.map((o) => (
                      <option key={o} value={o}>{o}</option>
                    ))}
                  </select>
                ) : f.type === "textarea" ? (
                  <textarea
                    rows={4}
                    value={values[f.key]}
                    placeholder={f.placeholder}
                    onChange={(e) => set(f.key, e.target.value)}
                    className="w-full rounded-lg border border-[var(--c-line-s)] bg-white px-3 py-2 text-sm leading-relaxed text-[var(--c-ink)] focus:border-[var(--c-primary)] focus:outline-none"
                  />
                ) : (
                  <input
                    type="text"
                    value={values[f.key]}
                    placeholder={f.placeholder}
                    onChange={(e) => set(f.key, e.target.value)}
                    className="w-full rounded-lg border border-[var(--c-line-s)] bg-white px-3 py-2 text-sm text-[var(--c-ink)] focus:border-[var(--c-primary)] focus:outline-none"
                  />
                )}
                {errors[f.key] && <p className="mt-1 text-[11px] font-bold text-[var(--c-alert)]">{errors[f.key]}</p>}
              </div>
            ))}

            <button
              type="submit"
              className="w-full rounded-lg bg-[var(--c-primary)] px-4 py-3 text-sm font-bold text-white hover:bg-[var(--c-primary-d)]"
            >
              この内容で送信する
            </button>

            <p className="text-[11px] leading-relaxed text-[var(--c-muted)]">
              これはデモです。入力内容はどこにも保存・送信されません。ブラウザのメモリ上にだけ置き、
              ページを再読み込みすると消えます（localStorage・Cookie・外部送信のいずれも使っていません）。
            </p>
          </form>
        </Card>

        {/* 自動返信 */}
        <div className="space-y-4">
          {!result ? (
            <Card className="flex h-full min-h-[280px] flex-col items-center justify-center p-8 text-center">
              <p className="text-sm font-bold text-[var(--c-muted)]">送信すると、ここに自動返信の文面が出ます</p>
              <p className="mt-2 max-w-sm text-[12px] leading-relaxed text-[var(--c-muted)]">
                本文に緊急語が含まれていた場合は「緊急」と判定し、判定の根拠になった語をそのまま表示します。
                左の「緊急のご相談」ボタンで試せます。
              </p>
            </Card>
          ) : (
            <React.Fragment>
              {/* 判定 */}
              <Card className="overflow-hidden">
                <div className="px-4 py-2.5" style={{ backgroundColor: result.urgent ? "var(--c-alert)" : "var(--c-ok)" }}>
                  <p className="text-sm font-bold text-white">
                    {result.urgent ? "緊急と判定しました" : "通常の受付として登録しました"}
                  </p>
                </div>
                <div className="p-4">
                  {result.urgent ? (
                    <React.Fragment>
                      <p className="text-[13px] leading-relaxed text-[var(--c-ink)]">
                        本文に次の語が含まれていたため、緊急と判定しました。
                      </p>
                      <div className="mt-2 flex flex-wrap gap-1.5">
                        {result.hits.map((w) => (
                          <span
                            key={w}
                            className="rounded border border-[var(--c-alert)] bg-[var(--c-alert-l)] px-2 py-0.5 text-xs font-bold text-[var(--c-alert)]"
                          >
                            {w}
                          </span>
                        ))}
                      </div>
                      <p className="mt-3 text-[12px] leading-relaxed text-[var(--c-sub)]">
                        判定と同時に、担当者へ通知しました。③の受付一覧でも「緊急」の印がつきます。
                      </p>
                    </React.Fragment>
                  ) : (
                    <p className="text-[13px] leading-relaxed text-[var(--c-ink)]">
                      本文に緊急語は含まれていませんでした。通常の順番で対応します。
                    </p>
                  )}

                  <button
                    type="button"
                    onClick={() => setShowWords((v) => !v)}
                    className="mt-3 text-[11px] font-bold text-[var(--c-primary)] underline"
                  >
                    {showWords ? "判定に使う語の一覧を閉じる" : `判定に使う語の一覧を見る（${ind.urgentWords.length}語）`}
                  </button>
                  {showWords && (
                    <div className="mt-2 rounded-lg border border-[var(--c-line)] bg-[var(--c-bg)] p-3">
                      <div className="flex flex-wrap gap-1.5">
                        {ind.urgentWords.map((w) => (
                          <span key={w} className="rounded bg-white px-2 py-0.5 text-[11px] text-[var(--c-sub)] ring-1 ring-[var(--c-line)]">
                            {w}
                          </span>
                        ))}
                      </div>
                      <p className="mt-2 text-[11px] leading-relaxed text-[var(--c-muted)]">
                        語句一致による判定です。判定基準を画面から確認でき、業種ごとに追加・削除できることを優先しました。
                        本番では、ここに文脈の判定を足したうえで、判定に使った語は同じように表示し続けます
                        （なぜ緊急になったのか説明できない状態を作らないためです）。
                      </p>
                    </div>
                  )}
                </div>
              </Card>

              {/* 自動返信の文面 */}
              <Card className="overflow-hidden">
                <div className="border-b border-[var(--c-line)] bg-[var(--c-bg)] px-4 py-2.5">
                  <p className="text-xs font-bold text-[var(--c-sub)]">自動返信（{result.at} 送信・担当者の操作なし）</p>
                </div>
                <div className="space-y-3 p-4 text-[13px] leading-relaxed text-[var(--c-ink)]">
                  <p className="font-bold">【自動返信】お問い合わせを受け付けました（受付番号 {result.no}）</p>
                  <p>{result.values.name} 様</p>
                  <p>このたびはご連絡ありがとうございます。以下の内容で受け付けました。</p>
                  <p>{result.urgent ? ind.reply.urgentLead : ind.reply.normalLead}</p>
                  <div className="rounded-lg border border-[var(--c-line)] bg-[var(--c-bg)] p-3">
                    <p className="mb-2 text-[11px] font-bold text-[var(--c-muted)]">■ 受付内容</p>
                    <dl className="space-y-1.5">
                      {ind.form.fields.map((f) => (
                        <div key={f.key} className="grid grid-cols-[92px_minmax(0,1fr)] gap-2">
                          <dt className="text-[11px] text-[var(--c-muted)]">{f.label}</dt>
                          <dd className="whitespace-pre-wrap break-words text-[12px] text-[var(--c-ink)]">
                            {result.values[f.key]}
                          </dd>
                        </div>
                      ))}
                    </dl>
                  </div>
                  <div>
                    <p className="mb-1 text-[11px] font-bold text-[var(--c-muted)]">■ 今後の流れ</p>
                    <p className="text-[12px] text-[var(--c-sub)]">{ind.stages.join(" → ")}</p>
                  </div>
                  <p className="text-[12px] leading-relaxed text-[var(--c-sub)]">{ind.reply.closing}</p>
                </div>
              </Card>

              <Note tone="ok">
                この受付は、③の管理画面の一覧に「{result.no}」として追加されています。タブを切り替えて確認できます。
              </Note>
            </React.Fragment>
          )}
        </div>
      </div>
    </div>
  );
}

function ChannelBadge({ ind, k }) {
  const c = ind.channels.filter((x) => x.key === k)[0] || ind.channels[0];
  return (
    <span className="rounded border border-[var(--c-line-s)] bg-[var(--c-bg)] px-1.5 py-px text-[10px] font-bold text-[var(--c-sub)]">
      {c.label}
    </span>
  );
}

function Stepper({ stages, current }) {
  return (
    <div className="-mx-1 overflow-x-auto pb-1">
      <div className="flex min-w-max items-center gap-1 px-1">
        {stages.map((s, i) => {
          const done = i < current;
          const now = i === current;
          const style = now
            ? { backgroundColor: "var(--c-primary)", borderColor: "var(--c-primary)", color: "#fff" }
            : done
            ? { backgroundColor: "var(--c-primary-l)", borderColor: "var(--c-primary)", color: "var(--c-primary-d)" }
            : { backgroundColor: "#fff", borderColor: "var(--c-line)", color: "var(--c-muted)" };
          return (
            <React.Fragment key={s}>
              {i > 0 && (
                <div
                  className="h-0.5 w-4 shrink-0 sm:w-6"
                  style={{ backgroundColor: i <= current ? "var(--c-primary)" : "var(--c-line)" }}
                />
              )}
              <div className="shrink-0 rounded-full border px-2.5 py-1 text-[11px] font-bold" style={style}>
                {done ? "✓ " : ""}{s}
              </div>
            </React.Fragment>
          );
        })}
      </div>
    </div>
  );
}

const TABS = [
  { key: "inv",    label: "① 業務棚卸し" },
  { key: "intake", label: "② 受付" },
  { key: "admin",  label: "③ 管理画面" },
  { key: "result", label: "④ 導入後の数字" },
];

function App() {
  const indKeys = Object.keys(INDUSTRIES);
  const [indKey, setIndKey] = useState(indKeys[0]);
  const [tab, setTab] = useState("inv");
  const [wage, setWage] = useState(CONFIG.defaultWage);
  const [showAbout, setShowAbout] = useState(false);

  // 業種ごとに受付台帳を持ちます（切り替えても、それぞれの進み具合は保たれます）
  const [ledger, setLedger] = useState(() => {
    const o = {};
    indKeys.forEach((k) => { o[k] = seedCases(k); });
    return o;
  });
  const [selectedId, setSelectedId] = useState(null);
  const [seq, setSeq] = useState(201);

  const ind = INDUSTRIES[indKey];
  const cases = ledger[indKey];
  const selId = cases.filter((c) => c.id === selectedId).length ? selectedId : (cases[0] && cases[0].id);

  const t = CONFIG.theme;
  const cssVars = `
:root{
  --c-bg:${t.bg}; --c-surface:${t.surface}; --c-ink:${t.ink}; --c-sub:${t.sub};
  --c-muted:${t.muted}; --c-line:${t.line}; --c-line-s:${t.lineStrong};
  --c-primary:${t.primary}; --c-primary-d:${t.primaryDark}; --c-primary-l:${t.primaryLight};
  --c-accent:${t.accent}; --c-accent-d:${t.accentDark}; --c-accent-l:${t.accentLight};
  --c-human:${t.human}; --c-alert:${t.alert}; --c-alert-l:${t.alertLight};
  --c-ok:${t.ok}; --c-ok-l:${t.okLight};
}
body{ background:${t.bg}; color:${t.ink}; -webkit-text-size-adjust:100%; }
`;

  const advance = (id) => {
    setLedger((prev) => {
      const list = prev[indKey].map((c) => {
        if (c.id !== id || c.stage >= ind.stages.length - 1) return c;
        const next = c.stage + 1;
        const way = c.summary.filter((kv) => kv[0] === "連絡方法")[0];
        return {
          ...c,
          stage: next,
          history: c.history.concat([
            {
              t: nowLabel(),
              kind: "auto",
              text: `「${ind.stages[next]}」に進んだことを自動連絡（${way ? way[1] : "登録済みの連絡先"}へ送信）`,
            },
          ]),
        };
      });
      return { ...prev, [indKey]: list };
    });
  };

  const addStaffNote = (id, text) => {
    setLedger((prev) => ({
      ...prev,
      [indKey]: prev[indKey].map((c) =>
        c.id === id ? { ...c, history: c.history.concat([{ t: nowLabel(), kind: "staff", text: text }]) } : c
      ),
    }));
  };

  // ②のフォーム送信 → 台帳の先頭に追加（ブラウザのメモリ上のみ）
  const handleIntake = (values, urgent, hits) => {
    const no = `R-2026-${seq}`;
    const id = `${indKey}-new-${seq}`;
    setSeq((s) => s + 1);
    const at = nowLabel();
    const summary = ind.form.fields
      .filter((f) => f.type !== "textarea" && f.key !== "name")
      .map((f) => [f.key === "reply" ? "連絡方法" : f.label, values[f.key]]);
    const history = [
      { t: at, kind: "auto", text: `受付完了の自動返信を送信（${values.reply || "登録済みの連絡先"}）` },
    ];
    if (urgent) {
      history.push({ t: at, kind: "auto", text: `緊急語「${hits.join("」「")}」を検知。担当者へ通知` });
    }
    const rec = {
      id: id, no: no, name: values.name, channel: "web", urgent: urgent, stage: 0, at: at,
      summary: summary, body: values.body || "", history: history,
    };
    setLedger((prev) => ({ ...prev, [indKey]: [rec].concat(prev[indKey]) }));
    setSelectedId(id);
    return no;
  };

  return (
    <div className="min-h-screen">
      <style>{cssVars}</style>

      {/* ヘッダー */}
      <header className="border-b border-[var(--c-line)] bg-[var(--c-surface)]">
        <div className="mx-auto max-w-6xl px-4 py-4">
          <div className="flex flex-wrap items-start justify-between gap-3">
            <div>
              <h1 className="text-lg font-bold tracking-tight text-[var(--c-ink)] sm:text-xl">
                {CONFIG.siteTitle}
                <span className="ml-2 rounded bg-[var(--c-accent)] px-1.5 py-0.5 align-middle text-[10px] font-bold text-white">
                  デモ
                </span>
              </h1>
              <p className="mt-1 text-[12px] text-[var(--c-sub)]">{CONFIG.siteSubtitle}</p>
            </div>
            <button
              type="button"
              onClick={() => setShowAbout((v) => !v)}
              className="rounded-lg border border-[var(--c-line-s)] px-3 py-1.5 text-[11px] font-bold text-[var(--c-sub)] hover:border-[var(--c-primary)] hover:text-[var(--c-primary)]"
            >
              {showAbout ? "閉じる" : "このデモについて"}
            </button>
          </div>

          {showAbout && (
            <div className="mt-3 rounded-lg border border-[var(--c-line)] bg-[var(--c-bg)] p-4">
              <p className="text-[12px] leading-relaxed text-[var(--c-sub)]">
                中小企業のAI導入率は{FACTS.adoption[0].value}にとどまり、最大の障壁は「具体的な活用場面が不明」
                {FACTS.adoption[1].value}、「導入を推進する人材がいない」{FACTS.adoption[2].value}でした（{FACTS.adoptionSource}）。
                このデモは、その2つに対する具体的な答えを1つ示すものです。順番は固定で、
                <span className="font-bold text-[var(--c-ink)]">①業務棚卸し → ②受付の一元化 → ③進捗の自動連絡 → ④測り直し</span>。
                ツールを先に入れて失敗する事例は、①を飛ばしたケースに集中しています。
              </p>
              <ul className="mt-3 space-y-1 text-[11px] leading-relaxed text-[var(--c-muted)]">
                <li>・所要時間・件数・導入後の数字は、すべてデモ用の想定値です。実在の企業の実績ではありません。</li>
                <li>・受付フォームの入力内容は、どこにも保存・送信されません。リロードすると消えます。</li>
                <li>・localStorage・Cookie・外部への通信は使っていません。1ファイルのHTMLで完結しています。</li>
              </ul>
            </div>
          )}
        </div>

        {/* 業種切替 */}
        <div className="border-t border-[var(--c-line)] bg-[var(--c-bg)]">
          <div className="mx-auto max-w-6xl px-4 py-3">
            <div className="flex flex-wrap items-center gap-2">
              <span className="text-[11px] font-bold text-[var(--c-muted)]">業種</span>
              {indKeys.map((k) => (
                <button
                  key={k}
                  type="button"
                  onClick={() => setIndKey(k)}
                  className="rounded-full border px-3 py-1.5 text-[12px] font-bold"
                  style={
                    k === indKey
                      ? { backgroundColor: "var(--c-primary)", borderColor: "var(--c-primary)", color: "#fff" }
                      : { backgroundColor: "#fff", borderColor: "var(--c-line-s)", color: "var(--c-sub)" }
                  }
                >
                  {INDUSTRIES[k].label}
                </button>
              ))}
            </div>
            <p className="mt-2 text-[11px] leading-relaxed text-[var(--c-muted)]">
              切り替えると、工程名・所要時間・月間件数・受付項目・ステージ名・緊急語が変わります。
              <span className="font-bold text-[var(--c-sub)]">画面の構造とコードは完全に同じです。</span>
              変えているのは、ファイル冒頭の <code className="rounded bg-white px-1 py-px text-[10px] ring-1 ring-[var(--c-line)]">INDUSTRIES</code> の1オブジェクトだけです。
            </p>
          </div>
        </div>

        {/* タブ */}
        <div className="border-t border-[var(--c-line)] bg-[var(--c-surface)]">
          <div className="mx-auto max-w-6xl px-2">
            <div className="flex overflow-x-auto">
              {TABS.map((tb) => (
                <button
                  key={tb.key}
                  type="button"
                  onClick={() => setTab(tb.key)}
                  className="shrink-0 whitespace-nowrap px-3 py-3 text-[12px] font-bold sm:px-4 sm:text-[13px]"
                  style={
                    tab === tb.key
                      ? { color: "var(--c-primary)", borderBottom: "3px solid var(--c-primary)" }
                      : { color: "var(--c-muted)", borderBottom: "3px solid transparent" }
                  }
                >
                  {tb.label}
                </button>
              ))}
            </div>
          </div>
        </div>
      </header>

      <main className="mx-auto max-w-6xl px-4 py-6">
        {tab === "inv" && <InventoryTab ind={ind} wage={wage} setWage={setWage} />}
        {tab === "intake" && <IntakeTab ind={ind} indKey={indKey} onSubmit={handleIntake} />}
        {tab === "admin" && (
          <AdminTab
            ind={ind}
            cases={cases}
            selectedId={selId}
            setSelectedId={setSelectedId}
            advance={advance}
            addStaffNote={addStaffNote}
          />
        )}
        {tab === "result" && <ResultsTab ind={ind} wage={wage} />}
      </main>

      <footer className="mt-6 border-t border-[var(--c-line)] bg-[var(--c-surface)]">
        <div className="mx-auto max-w-6xl px-4 py-5">
          <p className="text-[11px] leading-relaxed text-[var(--c-muted)]">
            所要時間・件数・導入後の数字は、すべてデモ用の想定値です。実在の企業の実績を示すものではありません。
            受付フォームに入力した内容は、どこにも保存・送信されません（localStorage・Cookie・外部通信のいずれも使用していません）。
            ページを再読み込みすると、すべて初期状態に戻ります。
          </p>
          <p className="mt-2 text-[11px] leading-relaxed text-[var(--c-muted)]">
            引用した調査：{FACTS.adoptionSource}／{FACTS.jobsSource}／{FACTS.reviewSource}。
          </p>
          <p className="mt-2 text-[10px] text-[var(--c-muted)]">
            React + Tailwind CSS の1ファイル構成（CDN読み込み・ビルド不要）
          </p>
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
