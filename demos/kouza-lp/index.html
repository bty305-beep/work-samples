// 申込ボタン。遷移先は CONFIG.apply.url（申込フォームのデモ）です。
function ApplyButton({ size = "md", block = false, variant = "primary" }) {
  const sizes = {
    sm: "px-4 py-2 text-sm",
    md: "px-6 py-3 text-base",
    lg: "px-8 py-4 text-lg",
  };
  const variants = {
    primary: "bg-amber-500 text-blue-950 hover:bg-amber-400 shadow-sm",
    outline: "bg-white text-blue-900 border border-blue-900 hover:bg-blue-50",
  };
  return (
    <a
      href={CONFIG.apply.url}
      className={`inline-flex items-center justify-center gap-2 rounded-lg font-bold transition ${sizes[size]} ${variants[variant]} ${block ? "w-full" : ""}`}
    >
      {CONFIG.apply.label}
      <span aria-hidden="true">→</span>
    </a>
  );
}

function SectionTitle({ eyebrow, title, lead, align = "left" }) {
  return (
    <div className={`${align === "center" ? "text-center" : ""} mb-8`}>
      {eyebrow && (
        <p className="text-sm font-bold tracking-widest text-amber-600 mb-2">{eyebrow}</p>
      )}
      <h2 className="text-2xl md:text-3xl font-bold text-blue-950 leading-snug">{title}</h2>
      {lead && (
        <p className={`mt-3 text-neutral-600 leading-relaxed ${align === "center" ? "mx-auto max-w-2xl" : "max-w-3xl"}`}>
          {lead}
        </p>
      )}
    </div>
  );
}

function Mark({ value }) {
  if (value === "○") return <span className="text-blue-700 font-bold text-lg" title="あり">○</span>;
  if (value === "△") return <span className="text-amber-600 font-bold text-lg" title="一部あり">△</span>;
  if (value === "×") return <span className="text-neutral-300 font-bold text-lg" title="なし">×</span>;
  if (value === "—") return <span className="text-neutral-300">—</span>;
  return <span className="text-neutral-800 text-sm font-medium">{value}</span>;
}

/* ==================================================================
   4. 料金ページ
================================================================== */
function Pricing() {
  const groups = useMemo(() => {
    const map = new Map();
    CONFIG.compare.forEach((row) => {
      if (!map.has(row.group)) map.set(row.group, []);
      map.get(row.group).push(row);
    });
    return Array.from(map.entries());
  }, []);

  return (
    <div>
      <section className="bg-blue-950 text-white">
        <div className="max-w-6xl mx-auto px-4 py-12 md:py-16">

            価格はどちらの講座でも同じです。
          </p>
        </div>
      </section>

      {/* プランカード */}
      <section className="max-w-6xl mx-auto px-4 py-12">
        <div className="grid md:grid-cols-3 gap-5">
          {CONFIG.plans.map((p) => (
            <div
              key={p.id}
              className={`rounded-xl p-6 flex flex-col bg-white ${
                p.recommended ? "border-2 border-blue-900 shadow-lg" : "border border-neutral-200"
              }`}
            >
              <div className="h-6">
                {p.recommended && (
                  <span className="text-[11px] font-bold text-white bg-blue-900 rounded px-2 py-0.5">
                    もっとも選ばれています
                  </span>
                )}
              </div>
              <h2 className="mt-3 font-bold text-blue-950 text-xl">{p.name}</h2>
              <p className="mt-1 text-xs text-neutral-500">{p.forWhom}</p>
              <p className="mt-5">
                <span className="text-4xl font-bold text-blue-950">¥{p.price}</span>
              </p>
              <p className="text-xs text-neutral-500 mt-1">{p.priceNote}</p>
              <p className="mt-4 text-sm text-neutral-600 leading-relaxed grow">{p.summary}</p>
              <div className="mt-6">
                <ApplyButton block variant={p.recommended ? "primary" : "outline"} />
              </div>
            </div>
          ))}
        </div>
      </section>

      {/* 比較表 */}
      <section className="bg-neutral-100 border-y border-neutral-200">
        <div className="max-w-6xl mx-auto px-4 py-14">
          <SectionTitle
            eyebrow="COMPARISON"
            title="3プランの比較"
            lead="○ = あり、△ = 一部あり、× = なし。数字や期間が入る項目は、その内容を表示しています。"
          />
          <div className="bg-white border border-neutral-200 rounded-xl overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full min-w-[640px] text-left">
                <thead>
                  <tr className="bg-blue-950 text-white">
                    <th className="p-4 text-sm font-bold w-2/5">項目</th>
                    {CONFIG.plans.map((p) => (
                      <th key={p.id} className="p-4 text-center text-sm font-bold">
                        <span className={p.recommended ? "text-amber-300" : ""}>{p.name}</span>
                        <span className="block text-[11px] font-normal text-blue-200 mt-0.5">¥{p.price}</span>
                      </th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {groups.map(([groupName, rows]) => (
                    <React.Fragment key={groupName}>
                      <tr className="bg-neutral-100">
                        <th colSpan={CONFIG.plans.length + 1} className="px-4 py-2 text-xs font-bold text-neutral-600 tracking-wide">

                      </tr>
                      {rows.map((row) => (
                        <tr key={row.label} className="border-t border-neutral-200">

                            <td
                              key={i}
                              className={`p-4 text-center ${CONFIG.plans[i].recommended ? "bg-blue-50/60" : ""}`}

                              <Mark value={v} />

                        </tr>
                      ))}

                  ))}
                </tbody>

          <p className="mt-3 text-xs text-neutral-500">※ 横にスクロールできます。</p>
        </div>
      </section>

      {/* 選び方 */}

          {[

            { plan: "スタンダード", cond: "資格の勉強がはじめて、または独学で挫折した", body: "止まったときに聞ける相手がいるかどうかで、修了率が大きく変わります。迷ったらこのプランをおすすめします。" },
            { plan: "サポート", cond: "受験日が決まっている / 会社から期限を切られている", body: "月1回の面談で進捗を管理し、不合格時は無料で再受講できます。期限が決まっている方向けです。" },
          ].map((c) => (
            <div key={c.plan} className="border border-neutral-200 rounded-xl p-6 bg-white">
              <p className="text-xs font-bold text-amber-700 bg-amber-50 border border-amber-200 rounded px-2 py-1 inline-block">
                {c.plan}
              </p>
              <h3 className="mt-3 font-bold text-blue-950 leading-snug">{c.cond}</h3>
              <p className="mt-2 text-sm text-neutral-600 leading-relaxed">{c.body}</p>
            </div>
          ))}
        </div>
      </section>

      {/* 注意事項 */}
      <section className="bg-neutral-100 border-t border-neutral-200">
        <div className="max-w-6xl mx-auto px-4 py-12">
          <h2 className="font-bold text-blue-950 mb-4">お支払い・キャンセルについて</h2>
          <ul className="space-y-2">
            {CONFIG.priceNotes.map((n) => (
              <li key={n} className="flex gap-3 text-sm text-neutral-700 leading-relaxed">
                <span className="shrink-0 text-neutral-400">※</span>
                <span>{n}</span>
              </li>
            ))}
          </ul>
        </div>
      </section>

      <FinalCta />
    </div>
  );
}

/* ==================================================================
   5. よくある質問（提案として追加したページ）
================================================================== */
function Faq() {
  const cats = useMemo(() => ["すべて", ...Array.from(new Set(CONFIG.faq.map((f) => f.cat)))], []);
  const [cat, setCat] = useState("すべて");
  const [openIndex, setOpenIndex] = useState(0);

  const list = useMemo(
    () => CONFIG.faq.filter((f) => cat === "すべて" || f.cat === cat),
    [cat]
  );

  const selectCat = (c) => {
    setCat(c);
    setOpenIndex(0);
  };

  return (
    <div>
      <section className="bg-blue-950 text-white">
        <div className="max-w-6xl mx-auto px-4 py-12 md:py-16">
          <h1 className="text-2xl md:text-4xl font-bold">よくある質問</h1>
          <p className="mt-4 text-blue-100 leading-relaxed max-w-3xl">
            お申込み前にいただくご質問をまとめています。ここにない内容は、事務局（{CONFIG.site.mail}）へお問い合わせください。{CONFIG.site.hours}に対応しています。
          </p>
        </div>
      </section>

      <section className="max-w-4xl mx-auto px-4 py-12">
        <div className="flex flex-wrap gap-2 mb-8">
          {cats.map((c) => (
            <button
              key={c}
              onClick={() => selectCat(c)}
              className={`px-4 py-2 rounded-full text-sm border transition ${
                cat === c
                  ? "bg-blue-950 text-white border-blue-950 font-bold"
                  : "bg-white text-neutral-700 border-neutral-300 hover:border-blue-400"
              }`}
            >
              {c}
              <span className="ml-2 text-xs opacity-70">
                {c === "すべて" ? CONFIG.faq.length : CONFIG.faq.filter((f) => f.cat === c).length}
              </span>
            </button>
          ))}
        </div>

        <div className="space-y-3">
          {list.map((f, i) => {
            const open = openIndex === i;
            return (
              <div key={f.q} className="bg-white border border-neutral-200 rounded-xl overflow-hidden">
                <button
                  onClick={() => setOpenIndex(open ? -1 : i)}
                  className="w-full text-left p-5 flex items-start gap-4 hover:bg-neutral-50 transition"
                  aria-expanded={open}
                >
                  <span className="shrink-0 w-7 h-7 rounded-md bg-blue-950 text-white text-sm font-bold flex items-center justify-center">
                    Q
                  </span>
                  <span className="grow font-bold text-blue-950 leading-snug">{f.q}</span>
                  <span className={`shrink-0 text-neutral-400 transition-transform ${open ? "rotate-45" : ""}`}>＋</span>
                </button>
                {open && (
                  <div className="px-5 pb-5 pl-16">
                    <div className="border-l-2 border-amber-300 pl-4">
                      <p className="text-sm text-neutral-700 leading-relaxed">{f.a}</p>
                      <p className="mt-3 text-[11px] text-neutral-400">カテゴリ：{f.cat}</p>
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>

        <div className="mt-10 bg-blue-50 border border-blue-200 rounded-xl p-6">
          <h2 className="font-bold text-blue-950">解決しない場合</h2>
          <p className="mt-2 text-sm text-blue-900 leading-relaxed">
            事務局へメールでお問い合わせください（{CONFIG.site.mail}）。{CONFIG.site.hours}、原則1営業日以内に返信します。
            申込前のご相談だけでも構いません。無理におすすめすることはありません。
          </p>
        </div>
      </section>

      <FinalCta />
    </div>
  );
}

/* ==================================================================

/* ==================================================================
   アプリ本体
================================================================== */
function App() {
  const [page, setPage] = useState("home");

  // ページを切り替えたら先頭に戻します。
  useEffect(() => {
    window.scrollTo({ top: 0, behavior: "auto" });
  }, [page]);

  const course = CONFIG.courses.find((c) => c.id === page);

  return (
    <div className="min-h-screen bg-neutral-50 text-neutral-900 antialiased">
      <Nav page={page} setPage={setPage} />
      <main>
        {page === "home" && <Home setPage={setPage} />}
        {course && <CourseDetail course={course} setPage={setPage} />}
        {page === "price" && <Pricing />}
        {page === "faq" && <Faq />}
        {page === "voice" && <Voices />}
      </main>
      <Footer setPage={setPage} />

      {/* スマートフォン用の固定CTA。申込への導線を常に画面内に残します。 */}
      <div className="lg:hidden sticky bottom-0 z-30 bg-white/95 backdrop-blur border-t border-neutral-200 p-3">
        <ApplyButton block />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
