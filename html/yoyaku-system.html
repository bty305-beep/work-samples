<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>予約・受付システム デモ | ネット予約と電話予約を1つの台帳にまとめる</title>
<meta name="description" content="お客さま向けの予約画面と店舗向けの管理画面を持つ予約システムのデモです。ネットからの予約も電話で受けた予約も同じ台帳に入るため、二重予約が起きません。サロン・飲食店・教室に切り替えられます。掲載データはすべてデモ用の想定値です。">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
/* ------------------------------------------------------------------
   :root のトークンは索引ページ（リポジトリ直下の index.html）から
   そのまま持ってきています。ここで新しい色や寸法は作っていません。
------------------------------------------------------------------ */
:root {
  --c-base:         #ffffff;
  --c-paper:        #f5f1e8;
  --c-ink:          #1b1c1e;
  --c-ink-2:        #4c4f54;
  --c-ink-3:        #7d8087;
  --c-rule:         #ddd7c8;
  --c-rule-strong:  #b3ab98;
  --c-accent:       #2d4257;
  --c-accent-tint:  #eef1f3;
  --c-caution:      #9c463b;
  --c-caution-tint: #f3e9e6;
  --font-mincho: "Hiragino Mincho ProN","Yu Mincho","YuMincho","MS PMincho","Noto Serif JP",serif;
  --font-gothic: "Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","YuGothic",Meiryo,"Noto Sans JP",sans-serif;
  --fs-note:  13px;  --fs-body: 15px;  --fs-sub: 18px;  --fs-head: 24px;  --fs-title: 33px;
  --lh-body: 1.9;  --lh-head: 1.45;  --ls-body: 0.04em;  --ls-head: 0.06em;
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 16px;  --sp-4: 32px;  --sp-5: 64px;
  --rule-1: 1px;  --rule-2: 2px;
}

html { -webkit-text-size-adjust: 100%; }

/* Tailwind の preflight は実行時に head の末尾へ挿入されるため、
   body と a はセレクタの詳細度を上げて上書きされないようにしています。 */
html body {
  margin: 0;
  background: var(--c-base);
  color: var(--c-ink);
  font-family: var(--font-gothic);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  letter-spacing: var(--ls-body);
  text-align: left;
}

*, *::before, *::after { border-radius: 0; box-shadow: none; }

body a {
  color: var(--c-accent);
  text-decoration: underline;
  text-underline-offset: 3px;
}

body a:hover { text-decoration-thickness: 2px; }

:focus-visible { outline: var(--rule-2) solid var(--c-accent); outline-offset: 2px; }

/* ------------------------------------------------------------------
   版面
------------------------------------------------------------------ */
.p-topbar { border-top: 3px solid var(--c-accent); }

.p-sheet {
  max-width: 1080px;
  margin: 0 auto;
  padding: 0 var(--sp-3);
}

.p-section { padding-top: var(--sp-5); }
.p-section:last-of-type { padding-bottom: var(--sp-5); }

/* ------------------------------------------------------------------
   ヘッダー
------------------------------------------------------------------ */
.p-masthead { padding-top: var(--sp-4); padding-bottom: var(--sp-4); }

.p-masthead__kicker {
  font-size: var(--fs-note);
  letter-spacing: var(--ls-head);
  color: var(--c-ink-3);
  margin: 0 0 var(--sp-2);
}

.p-masthead__title {
  font-family: var(--font-mincho);
  font-size: var(--fs-title);
  line-height: var(--lh-head);
  letter-spacing: var(--ls-head);
  font-weight: 600;
  color: var(--c-ink);
  margin: 0;
  padding-bottom: var(--sp-3);
  border-bottom: var(--rule-2) solid var(--c-accent);
}

.p-masthead__lead {
  margin: var(--sp-3) 0 0;
  max-width: 42em;
  color: var(--c-ink-2);
}

.p-masthead__meta {
  margin: var(--sp-3) 0 0;
  font-size: var(--fs-note);
  color: var(--c-ink-3);
}

.p-masthead__meta a { margin-left: var(--sp-2); }

/* ------------------------------------------------------------------
   注記帯
------------------------------------------------------------------ */
.p-notice {
  margin-top: var(--sp-4);
  background: var(--c-caution-tint);
  border-left: 3px solid var(--c-caution);
  padding: var(--sp-3);
}

.p-notice__title {
  margin: 0 0 var(--sp-1);
  font-size: var(--fs-note);
  font-weight: 700;
  letter-spacing: var(--ls-head);
  color: var(--c-caution);
}

.p-notice__body {
  margin: 0 0 var(--sp-2);
  font-size: var(--fs-note);
  line-height: 1.8;
  color: var(--c-ink-2);
}

.p-notice__body:last-child { margin-bottom: 0; }

/* ------------------------------------------------------------------
   節見出し
------------------------------------------------------------------ */
.p-heading {
  margin: 0 0 var(--sp-3);
  padding-bottom: var(--sp-2);
  border-bottom: var(--rule-2) solid var(--c-rule-strong);
}

.p-heading__no {
  display: block;
  font-size: var(--fs-note);
  letter-spacing: var(--ls-head);
  color: var(--c-accent);
  margin-bottom: var(--sp-1);
}

.p-heading__text {
  font-family: var(--font-mincho);
  font-size: var(--fs-head);
  line-height: var(--lh-head);
  letter-spacing: var(--ls-head);
  font-weight: 600;
  margin: 0;
}

.p-lead {
  margin: 0 0 var(--sp-3);
  max-width: 44em;
  color: var(--c-ink-2);
}

.p-note {
  margin: var(--sp-2) 0 0;
  font-size: var(--fs-note);
  line-height: 1.8;
  color: var(--c-ink-3);
}

/* ------------------------------------------------------------------
   業種の切り替え
------------------------------------------------------------------ */
.p-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: var(--sp-2);
  padding-bottom: var(--sp-3);
  font-size: var(--fs-note);
  color: var(--c-ink-3);
}

.p-toolbar__label {
  flex: 0 0 auto;
  width: 4em;
  letter-spacing: var(--ls-head);
  color: var(--c-ink-2);
}

.p-choice {
  font-family: var(--font-gothic);
  font-size: var(--fs-note);
  letter-spacing: var(--ls-body);
  color: var(--c-ink-2);
  background: var(--c-base);
  border: var(--rule-1) solid var(--c-rule-strong);
  padding: var(--sp-1) var(--sp-2);
  cursor: pointer;
}

.p-choice:hover { background: var(--c-accent-tint); }

.p-choice[aria-pressed="true"] {
  color: var(--c-accent);
  font-weight: 700;
  background: var(--c-accent-tint);
  border-color: var(--c-accent);
}

/* ------------------------------------------------------------------
   画面の切り替え（罫線で下線を引くだけの札）
------------------------------------------------------------------ */
.p-tabs {
  display: flex;
  overflow-x: auto;
  border-top: var(--rule-1) solid var(--c-rule);
  border-bottom: var(--rule-2) solid var(--c-rule-strong);
}

.p-tab {
  flex: 0 0 auto;
  font-family: var(--font-gothic);
  font-size: var(--fs-note);
  letter-spacing: var(--ls-body);
  white-space: nowrap;
  padding: var(--sp-2) var(--sp-3);
  margin-bottom: -2px;
  color: var(--c-ink-2);
  background: transparent;
  border: 0;
  border-bottom: 3px solid transparent;
  cursor: pointer;
}

.p-tab:hover { background: var(--c-accent-tint); }

.p-tab[aria-current="page"] {
  color: var(--c-accent);
  font-weight: 700;
  border-bottom-color: var(--c-accent);
}

/* ------------------------------------------------------------------
   台帳が1つであることの説明
------------------------------------------------------------------ */
.p-scope {
  border-left: 3px solid var(--c-accent);
  background: var(--c-accent-tint);
  padding: var(--sp-3);
  margin-bottom: var(--sp-3);
}

.p-scope p { margin: 0; }
.p-scope__sub { margin-top: var(--sp-1) !important; font-size: var(--fs-note); color: var(--c-ink-2); }
.p-scope strong { font-weight: 700; color: var(--c-accent); }

/* 集計 */
.p-tiles {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--sp-3);
  margin-bottom: var(--sp-4);
}

.p-tile {
  border-top: var(--rule-2) solid var(--c-accent);
  border-bottom: var(--rule-1) solid var(--c-rule-strong);
  padding: var(--sp-2) 0 var(--sp-3);
  min-width: 0;
}

.p-tile__label {
  margin: 0 0 var(--sp-1);
  font-size: var(--fs-note);
  letter-spacing: var(--ls-head);
  color: var(--c-ink-2);
}

.p-tile__num {
  margin: 0;
  font-size: var(--fs-title);
  line-height: 1.25;
  font-weight: 700;
  color: var(--c-accent);
  font-feature-settings: "tnum" 1;
}

.p-tile__unit { font-size: var(--fs-sub); font-weight: 500; margin-left: 2px; }

.p-tile__sub {
  margin: var(--sp-1) 0 0;
  font-size: var(--fs-note);
  line-height: 1.7;
  color: var(--c-ink-3);
}

/* ------------------------------------------------------------------
   ボタン
------------------------------------------------------------------ */
.p-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--sp-2);
  margin-bottom: var(--sp-3);
}

.p-actions__spacer { flex: 1 1 auto; }

.p-btn {
  font-family: var(--font-gothic);
  font-size: var(--fs-note);
  letter-spacing: var(--ls-body);
  color: var(--c-accent);
  background: var(--c-accent-tint);
  border: var(--rule-1) solid var(--c-rule-strong);
  padding: var(--sp-1) var(--sp-2);
  cursor: pointer;
}

.p-btn:hover { background: var(--c-base); }
.p-btn:disabled { color: var(--c-ink-3); background: var(--c-base); border-color: var(--c-rule); cursor: not-allowed; }

.p-btn--main {
  font-size: var(--fs-body);
  font-weight: 700;
  background: var(--c-base);
  border: var(--rule-2) solid var(--c-accent);
  padding: var(--sp-2) var(--sp-3);
}

.p-btn--main:hover { background: var(--c-accent-tint); }

.p-btn--quiet { color: var(--c-ink-2); background: var(--c-base); }

/* ------------------------------------------------------------------
   選ぶ（メニュー・日付・時間）
------------------------------------------------------------------ */
.p-picks {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--sp-2);
}

.p-pick {
  font-family: var(--font-gothic);
  font-size: var(--fs-body);
  letter-spacing: var(--ls-body);
  text-align: left;
  color: var(--c-ink-2);
  background: var(--c-base);
  border: var(--rule-1) solid var(--c-rule-strong);
  padding: var(--sp-2);
  cursor: pointer;
  min-width: 0;
}

.p-pick:hover { background: var(--c-accent-tint); }

.p-pick[aria-pressed="true"] {
  background: var(--c-accent-tint);
  border-color: var(--c-accent);
}

.p-pick__name { display: block; font-weight: 700; color: var(--c-ink); line-height: var(--lh-head); }
.p-pick[aria-pressed="true"] .p-pick__name { color: var(--c-accent); }

.p-pick__meta {
  display: block;
  margin-top: var(--sp-1);
  font-size: var(--fs-note);
  color: var(--c-ink-2);
  font-feature-settings: "tnum" 1;
}

.p-slots { display: flex; flex-wrap: wrap; gap: var(--sp-2); }

.p-slot {
  font-family: var(--font-gothic);
  font-size: var(--fs-note);
  letter-spacing: var(--ls-body);
  min-width: 4.6em;
  text-align: center;
  color: var(--c-ink-2);
  background: var(--c-base);
  border: var(--rule-1) solid var(--c-rule-strong);
  padding: var(--sp-1) var(--sp-2);
  cursor: pointer;
  font-feature-settings: "tnum" 1;
}

.p-slot:hover:not(:disabled) { background: var(--c-accent-tint); }

.p-slot[aria-pressed="true"] {
  color: var(--c-accent);
  font-weight: 700;
  background: var(--c-accent-tint);
  border-color: var(--c-accent);
}

.p-slot:disabled {
  color: var(--c-ink-3);
  background: var(--c-paper);
  border-color: var(--c-rule);
  cursor: not-allowed;
  text-decoration: line-through;
}

.p-slot--closed:disabled { text-decoration: none; }

.p-slot__d1 { display: block; }
.p-slot__d2 { display: block; font-size: var(--fs-note); }

/* ------------------------------------------------------------------
   受付の完了
------------------------------------------------------------------ */
.p-done {
  border-top: var(--rule-2) solid var(--c-accent);
  border-bottom: var(--rule-1) solid var(--c-rule-strong);
  padding: var(--sp-2) 0 var(--sp-3);
  margin-bottom: var(--sp-4);
}

.p-done__label {
  margin: 0 0 var(--sp-1);
  font-size: var(--fs-note);
  font-weight: 700;
  letter-spacing: var(--ls-head);
  color: var(--c-accent);
}

.p-done__when {
  margin: 0;
  font-family: var(--font-mincho);
  font-size: var(--fs-head);
  line-height: var(--lh-head);
  letter-spacing: var(--ls-head);
  font-weight: 600;
  color: var(--c-ink);
  font-feature-settings: "tnum" 1;
}

.p-done__body { margin: var(--sp-1) 0 0; color: var(--c-ink-2); }
.p-done__note { margin: var(--sp-2) 0 0; font-size: var(--fs-note); color: var(--c-ink-3); }

/* ------------------------------------------------------------------
   時間軸
------------------------------------------------------------------ */
.p-scroll {
  overflow-x: auto;
  border-top: var(--rule-2) solid var(--c-rule-strong);
  border-bottom: var(--rule-2) solid var(--c-rule-strong);
}

/* 右端の目盛りは中央揃えで置くため、はみ出さないよう右に余白を取ります */
.p-chart { min-width: 640px; padding: var(--sp-3) 2em var(--sp-3) 0; }

.p-chart__axis { display: flex; align-items: flex-end; }

.p-chart__gutter { flex: 0 0 auto; width: 7em; }

.p-chart__ticks {
  position: relative;
  flex: 1 1 auto;
  height: 1.6em;
  font-size: var(--fs-note);
  color: var(--c-ink-3);
  font-feature-settings: "tnum" 1;
}

.p-chart__tick { position: absolute; transform: translateX(-50%); white-space: nowrap; }

.p-chart__row {
  display: flex;
  align-items: center;
  padding: var(--sp-1) 0;
  border-top: var(--rule-1) solid var(--c-rule);
}

.p-chart__name {
  flex: 0 0 auto;
  width: 7em;
  padding-right: var(--sp-2);
  box-sizing: border-box;
  font-size: var(--fs-note);
  color: var(--c-ink-2);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.p-chart__track {
  position: relative;
  flex: 1 1 auto;
  height: 30px;
  background: var(--c-paper);
  border: var(--rule-1) solid var(--c-rule);
}

.p-chart__bar {
  position: absolute;
  top: 0;
  height: 100%;
  display: flex;
  align-items: center;
  padding: 0 var(--sp-1);
  box-sizing: border-box;
  font-size: var(--fs-note);
  line-height: 1.3;
  color: var(--c-base);
  background: var(--c-accent);
  overflow: hidden;
  white-space: nowrap;
}

.p-chart__bar--visited { background: var(--c-ink-2); }
.p-chart__bar--noshow { background: var(--c-caution); }

.p-legend {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-3);
  margin: var(--sp-2) 0 0;
  padding: 0;
  list-style: none;
  font-size: var(--fs-note);
  color: var(--c-ink-2);
}

.p-legend__swatch {
  display: inline-block;
  width: 1.6em;
  height: 0.8em;
  margin-right: var(--sp-1);
  vertical-align: -1px;
  background: var(--c-accent);
  border: var(--rule-1) solid var(--c-rule-strong);
}

.p-legend__swatch--visited { background: var(--c-ink-2); }
.p-legend__swatch--noshow { background: var(--c-caution); }
.p-legend__swatch--free { background: var(--c-paper); }

/* ------------------------------------------------------------------
   表
------------------------------------------------------------------ */
.p-table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--fs-note);
  line-height: 1.75;
}

.p-table--ledger { min-width: 820px; }

.p-table th, .p-table td {
  padding: var(--sp-2);
  border-bottom: var(--rule-1) solid var(--c-rule);
  text-align: left;
  vertical-align: top;
}

.p-table thead th {
  background: var(--c-paper);
  border-bottom: var(--rule-1) solid var(--c-rule-strong);
  font-weight: 700;
  color: var(--c-ink-2);
  letter-spacing: var(--ls-head);
  white-space: nowrap;
}

.p-table tbody tr:last-child td { border-bottom: 0; }
.p-table tbody tr:hover td { background: var(--c-accent-tint); }

.p-table .is-time { white-space: nowrap; font-feature-settings: "tnum" 1; font-weight: 700; color: var(--c-ink); }
.p-table .is-plain { color: var(--c-ink-2); }
.p-table .is-act { text-align: right; white-space: nowrap; }

.p-table__name { display: block; color: var(--c-ink); }
.p-table__tel { display: block; font-size: var(--fs-note); color: var(--c-ink-3); font-feature-settings: "tnum" 1; }
.p-table__note { display: block; margin-top: 2px; font-size: var(--fs-note); color: var(--c-ink-2); white-space: normal; }

/* 札（受付経路・状態） */
.p-mark {
  display: inline-block;
  white-space: nowrap;
  font-size: var(--fs-note);
  letter-spacing: var(--ls-head);
  padding: 0 var(--sp-2);
  border: var(--rule-1) solid var(--c-rule-strong);
  background: var(--c-base);
  color: var(--c-ink-2);
}

.p-mark--strong { background: var(--c-accent-tint); border-color: var(--c-accent); color: var(--c-accent); font-weight: 700; }
.p-mark--muted { border-color: var(--c-rule); color: var(--c-ink-3); }
.p-mark--alert { background: var(--c-caution-tint); border-color: var(--c-caution); color: var(--c-caution); font-weight: 700; }

.p-empty {
  padding: var(--sp-4) var(--sp-2);
  border-top: var(--rule-2) solid var(--c-rule-strong);
  border-bottom: var(--rule-2) solid var(--c-rule-strong);
  color: var(--c-ink-2);
}

.p-empty p { margin: 0; }
.p-empty p + p { margin-top: var(--sp-1); font-size: var(--fs-note); color: var(--c-ink-3); }

/* ------------------------------------------------------------------
   入力
------------------------------------------------------------------ */
.p-form {
  border-top: var(--rule-2) solid var(--c-accent);
  border-bottom: var(--rule-2) solid var(--c-rule-strong);
  padding-bottom: var(--sp-3);
}

.p-form__head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: var(--sp-2);
  padding: var(--sp-2) 0 var(--sp-3);
  border-bottom: var(--rule-1) solid var(--c-rule);
}

.p-form__title {
  font-family: var(--font-mincho);
  font-size: var(--fs-sub);
  line-height: var(--lh-head);
  letter-spacing: var(--ls-head);
  font-weight: 600;
  margin: 0;
}

.p-form__when {
  font-size: var(--fs-note);
  color: var(--c-ink-2);
  font-feature-settings: "tnum" 1;
}

.p-form__grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--sp-3);
  padding-top: var(--sp-3);
}

.p-field { min-width: 0; }
.p-field--wide { grid-column: 1 / -1; }

.p-field__label {
  display: block;
  margin-bottom: var(--sp-1);
  font-size: var(--fs-note);
  font-weight: 700;
  letter-spacing: var(--ls-head);
  color: var(--c-ink-2);
}

.p-field__req { margin-left: var(--sp-2); font-weight: 400; color: var(--c-caution); }

.p-input {
  display: block;
  width: 100%;
  box-sizing: border-box;
  font-family: var(--font-gothic);
  font-size: var(--fs-body);
  line-height: 1.7;
  letter-spacing: var(--ls-body);
  color: var(--c-ink);
  background: var(--c-base);
  border: var(--rule-1) solid var(--c-rule-strong);
  padding: var(--sp-1) var(--sp-2);
}

.p-input:focus { border-color: var(--c-accent); }
.p-input.is-error { border-color: var(--c-caution); border-width: var(--rule-2); }

.p-field__err { margin: var(--sp-1) 0 0; font-size: var(--fs-note); color: var(--c-caution); }

.p-form__foot {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--sp-2);
  padding-top: var(--sp-3);
}

/* ------------------------------------------------------------------
   説明
------------------------------------------------------------------ */
.p-def { margin: 0 0 var(--sp-4); }

.p-def__label {
  margin: 0 0 var(--sp-1);
  font-size: var(--fs-note);
  font-weight: 700;
  letter-spacing: var(--ls-head);

<script type="text/babel" data-presets="react-classic">
const { useState, useMemo } = React;

/* ==================================================================
   業種定義。ここを差し替えるだけで別業種の予約システムになります。
   実案件では管理画面から編集できるようにし、DBに持たせます。

   例：
     ・自動車整備（resourceLabel = ピット、menus = 車検／オイル交換）
     ・写真スタジオ（resourceLabel = スタジオ、menus = 七五三／証明写真）

   画面のコードはメニュー名も担当名も直接持っていません。すべて下の
   menus / resources / open / close / closedDays / askFields を見て、
   選択肢・空き枠・入力欄・時間軸を組み立てています。
================================================================== */

const BUSINESSES = {
  salon: {
    label: "サロン・整体",
    shopName: "kotone 整体院",
    resourceLabel: "担当",
    slotMinutes: 30,
    open: "10:00",
    close: "19:00",
    closedDays: [1],
    resources: ["高梨", "白石"],
    menus: [
      { id: "m1", name: "全身整体", minutes: 60, price: 6600 },
      { id: "m2", name: "肩・首集中", minutes: 30, price: 3850 },
      { id: "m3", name: "産後骨盤ケア", minutes: 90, price: 9900 },
    ],
    askFields: [{ key: "note", label: "気になる部位・ご要望", type: "textarea" }],
  },
  restaurant: {
    label: "飲食店",
    shopName: "ビストロ 灯（あかり）",
    resourceLabel: "席",
    slotMinutes: 30,
    open: "17:30",
    close: "21:30",
    closedDays: [2],
    resources: ["カウンター", "テーブルA", "テーブルB", "個室"],
    menus: [
      { id: "m1", name: "ディナーコース", minutes: 120, price: 5500 },
      { id: "m2", name: "アラカルト利用", minutes: 90, price: 0 },
      { id: "m3", name: "貸切相談", minutes: 180, price: 0 },
    ],
    askFields: [
      { key: "people", label: "人数", type: "number" },
      { key: "note", label: "アレルギー・ご要望", type: "textarea" },
    ],
  },
  school: {
    label: "教室・スクール",
    shopName: "みなみ書道教室",
    resourceLabel: "講師",
    slotMinutes: 60,
    open: "14:00",
    close: "20:00",
    closedDays: [0, 3],
    resources: ["南 先生", "岡崎 先生"],
    menus: [
      { id: "m1", name: "体験レッスン", minutes: 60, price: 2200 },
      { id: "m2", name: "通常レッスン", minutes: 60, price: 4400 },
      { id: "m3", name: "作品仕上げ講座", minutes: 120, price: 8800 },
    ],
    askFields: [{ key: "note", label: "経験の有無・持ち物の相談", type: "textarea" }],
  },
};

/* 受付の入口。入口は複数ありますが、行き先の台帳は1つだけです。 */
const CHANNELS = {
  net: { label: "ネット", desc: "お客さま画面から入った予約" },
  phone: { label: "電話", desc: "店舗が電話で受けて台帳に入れた予約" },
};

/* 状態。tone は濃淡の区分名です。臙脂を使うのは alert だけにしています。 */
const STATUS = {
  reserved: { label: "予約済み", tone: "strong" },
  visited: { label: "来店済み", tone: "plain" },
  canceled: { label: "キャンセル", tone: "muted" },
  noshow: { label: "無断キャンセル", tone: "alert" },
};

const toMin = (hhmm) => {
  const [h, m] = hhmm.split(":").map(Number);
  return h * 60 + m;
};
const toHHMM = (min) => `${String(Math.floor(min / 60)).padStart(2, "0")}:${String(min % 60).padStart(2, "0")}`;
// 端末の暦日で組み立てます（協定世界時に寄せると、日付の表示と鍵がずれます）
const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const jpDay = ["日", "月", "火", "水", "木", "金", "土"];
const mdLabel = (dateStr) => {
  const [, m, d] = dateStr.split("-").map(Number);
  return `${m}月${d}日`;
};
const dayOfWeek = (dateStr) => {
  const [y, m, d] = dateStr.split("-").map(Number);
  return new Date(y, m - 1, d).getDay();
};

const today = new Date();
const dayAfter = (n) => {
  const d = new Date(today);
  d.setDate(d.getDate() + n);
  return d;
};

// 今日から7日のうち、営業している日だけを拾います。
// 定休日は曜日で決まるため、いつ開いても画面が定休日から始まらないようにしています。
const openOffsets = (biz) => [0, 1, 2, 3, 4, 5, 6].filter((n) => !biz.closedDays.includes(dayAfter(n).getDay()));
const firstOpenOffset = (biz) => (openOffsets(biz)[0] ?? 0);
const firstOpenDate = (biz) => ymd(dayAfter(firstOpenOffset(biz)));
// 見本の予約を置く日。n番目に営業している日を返します。
const seedDate = (bizKey, n) => {
  const offs = openOffsets(BUSINESSES[bizKey]);
  return ymd(dayAfter(offs[Math.min(n, offs.length - 1)] ?? 0));
};

const SEED = {
  salon: [
    { id: 1, date: seedDate("salon", 0), start: "11:00", menuId: "m1", resource: "高梨", name: "村瀬 咲", tel: "090-1234-5678", status: "visited", channel: "net", note: "腰の張り" },
    { id: 2, date: seedDate("salon", 0), start: "14:30", menuId: "m2", resource: "白石", name: "堀内 亮太", tel: "080-2222-1111", status: "reserved", channel: "phone", note: "" },
    { id: 3, date: seedDate("salon", 1), start: "10:00", menuId: "m3", resource: "高梨", name: "斉藤 みか", tel: "070-3333-4444", status: "reserved", channel: "net", note: "産後4ヶ月" },
  ],
  restaurant: [
    { id: 1, date: seedDate("restaurant", 0), start: "18:00", menuId: "m1", resource: "テーブルA", name: "金子", tel: "090-5555-6666", status: "reserved", channel: "phone", people: 4, note: "甲殻類アレルギーあり" },
    { id: 2, date: seedDate("restaurant", 0), start: "19:30", menuId: "m2", resource: "カウンター", name: "山内", tel: "080-7777-8888", status: "reserved", channel: "net", people: 2, note: "" },
  ],
  school: [
    { id: 1, date: seedDate("school", 0), start: "16:00", menuId: "m1", resource: "南 先生", name: "小林 楓", tel: "090-9999-0000", status: "reserved", channel: "net", note: "初めてです" },
  ],
};

/* ------------------------------------------------------------------
   空き枠の計算。お客さま画面と、店舗が電話予約を入れる画面の両方が
   この1つの関数を見ています。入口が違っても判定は同じです。
------------------------------------------------------------------ */
const buildSlots = (biz, rows, dateStr, menu) => {
  const list = [];
  const openMin = toMin(biz.open);
  const closeMin = toMin(biz.close);
  for (let t = openMin; t + menu.minutes <= closeMin; t += biz.slotMinutes) {
    const free = biz.resources.filter((res) => {
      return !rows.some((r) => {
        if (r.date !== dateStr || r.resource !== res) return false;
        if (r.status === "canceled") return false;
        const rMenu = biz.menus.find((m) => m.id === r.menuId);
        const rStart = toMin(r.start);
        const rEnd = rStart + (rMenu?.minutes ?? biz.slotMinutes);
        return t < rEnd && rStart < t + menu.minutes;
      });
    });
    list.push({ start: toHHMM(t), free });
  }
  return list;
};

const markClass = (tone) => (tone && tone !== "plain" ? `p-mark p-mark--${tone}` : "p-mark");

/* ==================================================================

================================================================== */
function App() {

      [bizKey]: prev[bizKey].map((r) => (r.id === id ? { ...r, status } : r)),

  const bizKeys = Object.keys(BUSINESSES);

  return (

      <div className="p-sheet">

            お客さまが自分で入れる予約画面と、店舗が見る管理画面です。

            片方が埋めた枠がもう片方から消えることを確かめられます。
          </p>
          <p className="p-masthead__meta">
            画面：お客さま画面／店舗の管理画面
            {"　"}業種：{bizKeys.map((k) => BUSINESSES[k].label).join("／")}
            {"　"}入口：{Object.keys(CHANNELS).map((k) => CHANNELS[k].label).join("／")}
            <a href="../index.html">業務の悩み 索引へ戻る</a>
          </p>

          <div className="p-notice">
            <p className="p-notice__title">数値の扱いについて</p>
            <p className="p-notice__body">
              この画面に表示される店舗名・お客さまの氏名・電話番号・予約・売上は、
              すべて動作確認のために用意したデモ用の想定値です。実在する店舗・人物・実績とは関係ありません。
            </p>
            <p className="p-notice__body">
              画面上で入れた予約は、ブラウザの中だけに保持されます。どこにも保存・送信されません
              （localStorage・Cookie・外部通信のいずれも使っていません）。ページを開き直すと最初の状態に戻ります。
            </p>
          </div>
        </header>

        {/* ---------------- 業種の切り替え ---------------- */}
        <div className="p-toolbar">
          <span className="p-toolbar__label">業種</span>
          {bizKeys.map((k) => (
            <button
              key={k}
              type="button"
              className="p-choice"
              aria-pressed={k === bizKey}
              onClick={() => switchBiz(k)}
            >
              {BUSINESSES[k].label}
            </button>
          ))}
        </div>

        <p className="p-note" style={{ margin: "0 0 var(--sp-4)" }}>
          切り替えると、店名・メニュー・{biz.resourceLabel}・営業時間・定休日・入力項目が変わります。
          画面の構造とコードは同じです。変えているのは、ファイル冒頭の BUSINESSES の1オブジェクトだけです。
        </p>

        {/* ---------------- 画面の切り替え ---------------- */}
        <nav className="p-tabs" aria-label="画面の切り替え">
          <button
            type="button"
            className="p-tab"
            aria-current={view === "customer" ? "page" : undefined}
            onClick={() => setView("customer")}

            お客さま画面

        {/* ---------------- 本体 ---------------- */}
        {view === "customer" ? (
          <CustomerView key={bizKey} biz={biz} rows={rows} onBook={addBooking} />

            </p>
          </div>

          <div className="p-def">

            <p className="p-def__body">

          </div>

          <div className="p-def">

              データベースに持たせます。
            </p>
          </div>

          <div className="p-def">
            <p className="p-def__label">この画面と納品物の違い</p>
            <p className="p-def__body">

              サンプルデータを埋め込んで、操作したときの動きだけをお見せしています。

          <div className="p-colophon">

/* ==================================================================
   お客さま画面
================================================================== */
function CustomerView({ biz, rows, onBook }) {
  const [menuId, setMenuId] = useState(biz.menus[0].id);
  const [dayOffset, setDayOffset] = useState(() => firstOpenOffset(biz));
  const [picked, setPicked] = useState(null);
  const [done, setDone] = useState(null);

  const menu = biz.menus.find((m) => m.id === menuId) ?? biz.menus[0];
  const days = [0, 1, 2, 3, 4, 5, 6].map(dayAfter);

  const targetDate = days[dayOffset];
  const dateStr = ymd(targetDate);
  const closed = biz.closedDays.includes(targetDate.getDay());

  const slots = useMemo(
    () => (closed ? [] : buildSlots(biz, rows, dateStr, menu)),
    [biz, rows, menu, dateStr, closed]
  );

  const phoneCount = rows.filter((r) => r.channel === "phone" && r.status !== "canceled").length;

  if (done) {
    const doneMenu = biz.menus.find((m) => m.id === done.menuId);
    return (
      <section className="p-section">
        <div className="p-heading">
          <span className="p-heading__no">受付の完了</span>
          <h2 className="p-heading__text">ご予約を受け付けました</h2>
        </div>

        <div className="p-done">
          <p className="p-done__label">ご予約日時</p>
          <p className="p-done__when">{mdLabel(done.date)}（{jpDay[dayOfWeek(done.date)]}） {done.start}</p>
          <p className="p-done__body">
            {doneMenu.name}（{doneMenu.minutes}分）／{biz.resourceLabel}：{done.resource}
          </p>
          <p className="p-done__note">確認のご連絡を {done.tel} 宛にお送りします。</p>
        </div>

        <div className="p-scope">
          <p>
            この予約は、<strong>店舗の台帳にそのまま入りました</strong>。
            上の「店舗の管理画面（予約台帳）」を開くと、いま入れた予約が
            <strong>受付：{CHANNELS.net.label}</strong>として1行増えています。
          </p>
          <p className="p-scope__sub">
            店舗が電話で受けた予約と同じ台帳・同じ並びです。
            {biz.resourceLabel}の{done.resource}はこの時間で埋まったので、
            電話で同じ枠を取ることはできません。空いている{biz.resourceLabel}がなくなれば、
            その時間はお客さま画面からも消えます。
          </p>
        </div>

        <p style={{ margin: "var(--sp-4) 0 0" }}>
          <button
            type="button"
            className="p-btn p-btn--main"
            onClick={() => { setDone(null); setPicked(null); }}
          >
            続けて予約する
          </button>
        </p>
      </section>
    );
  }

  return (
    <React.Fragment>
      <section className="p-section">
        <div className="p-heading">
          <span className="p-heading__no">一</span>
          <h2 className="p-heading__text">メニューを選ぶ</h2>
        </div>

        <p className="p-lead">
          {biz.shopName}　{biz.open}〜{biz.close}／定休日 {biz.closedDays.map((d) => jpDay[d]).join("・")}曜。
          所要時間はメニューごとに違います。選んだメニューの長さで空き枠を計算するため、
          90分のメニューでは、30分しか空いていない時間は選べません。
        </p>

        <div className="p-picks">
          {biz.menus.map((m) => (
            <button
              key={m.id}
              type="button"
              className="p-pick"
              aria-pressed={m.id === menuId}
              onClick={() => { setMenuId(m.id); setPicked(null); }}
            >
              <span className="p-pick__name">{m.name}</span>
              <span className="p-pick__meta">
                {m.minutes}分{m.price > 0 ? ` ／ ${m.price.toLocaleString()}円` : ""}
              </span>
            </button>
          ))}
        </div>
      </section>

      <section className="p-section">
        <div className="p-heading">
          <span className="p-heading__no">二</span>
          <h2 className="p-heading__text">日付を選ぶ</h2>
        </div>

        <p className="p-lead">定休日は選べません。設定の定休日をそのまま反映しています。</p>

        <div className="p-slots">
          {days.map((d, i) => {
            const isClosed = biz.closedDays.includes(d.getDay());
            return (
              <button
                key={i}
                type="button"
                className={`p-slot${isClosed ? " p-slot--closed" : ""}`}
                disabled={isClosed}
                aria-pressed={i === dayOffset}
                onClick={() => { setDayOffset(i); setPicked(null); }}
              >
                <span className="p-slot__d1">{d.getMonth() + 1}/{d.getDate()}</span>
                <span className="p-slot__d2">{jpDay[d.getDay()]}</span>
              </button>
            );
          })}
        </div>
      </section>

      <section className="p-section">
        <div className="p-heading">
          <span className="p-heading__no">三</span>
          <h2 className="p-heading__text">時間を選ぶ</h2>
        </div>

        <p className="p-lead">
          ここに出ている時間は、<strong>台帳の空きそのもの</strong>です。
          店舗が電話で受けて台帳に入れた予約（現在{phoneCount}件）も同じ台帳にあるため、
          その分だけ{biz.resourceLabel}の空きが減り、すべて埋まった時間は取り消し線が付いて選べません。
          ネットと電話で別々の枠を持っていないので、同じ{biz.resourceLabel}の同じ時間が二度埋まることがありません。
        </p>

        {closed ? (
          <div className="p-empty">
            <p>この日は定休日です。別の日付を選んでください。</p>
          </div>
        ) : (
          <React.Fragment>
            <div className="p-slots">
              {slots.map((s) => {
                const full = s.free.length === 0;
                return (
                  <button
                    key={s.start}
                    type="button"
                    className="p-slot"
                    disabled={full}
                    aria-pressed={picked?.start === s.start}
                    onClick={() => setPicked({ start: s.start, resource: s.free[0] })}
                  >
                    {s.start}
                  </button>
                );
              })}
            </div>
            {slots.every((s) => s.free.length === 0) ? (
              <p className="p-note">この日は空きがありません。別の日付をお試しください。</p>
            ) : (
              <p className="p-note">
                取り消し線の付いた時間は、{biz.resourceLabel}がすべて埋まっている時間です。
              </p>
            )}
          </React.Fragment>
        )}
      </section>

      {picked ? (
        <section className="p-section">
          <div className="p-heading">
            <span className="p-heading__no">四</span>
            <h2 className="p-heading__text">お名前とご連絡先</h2>
          </div>

          <BookingForm
            biz={biz}
            menu={menu}
            date={dateStr}
            picked={picked}
            channel="net"
            submitLabel="この内容で予約する"
            cancelLabel="時間を選び直す"
            onCancel={() => setPicked(null)}
            onSubmit={(b) => { onBook(b); setDone(b); setPicked(null); }}
          />
        </section>
      ) : null}
    </React.Fragment>
  );
}

/* ==================================================================
   入力欄。お客さま画面と、店舗の電話予約入力の両方で使います。
================================================================== */
function BookingForm({ biz, menu, date, picked, channel, submitLabel, cancelLabel, onCancel, onSubmit }) {
  const [form, setForm] = useState({ name: "", tel: "", ...Object.fromEntries(biz.askFields.map((f) => [f.key, ""])) });
  const [touched, setTouched] = useState(false);

  const invalid = { name: !form.name.trim(), tel: !/^[\d-]{10,}$/.test(form.tel.trim()) };
  const hasError = invalid.name || invalid.tel;

  const submit = () => {
    setTouched(true);
    if (hasError) return;
    onSubmit({ ...form, date, start: picked.start, resource: picked.resource, menuId: menu.id, status: "reserved", channel });
  };

  return (
    <div className="p-form">
      <div className="p-form__head">
        <h3 className="p-form__title">
          {mdLabel(date)}（{jpDay[dayOfWeek(date)]}） {picked.start}
        </h3>
        <span className="p-form__when">
          {menu.name}（{menu.minutes}分）／{biz.resourceLabel}：{picked.resource}／受付：{CHANNELS[channel].label}
        </span>
      </div>

      <div className="p-form__grid">
        <div className="p-field">
          <label className="p-field__label" htmlFor="fld-name">
            お名前<span className="p-field__req">必須</span>
          </label>
          <input
            id="fld-name"
            className={`p-input${touched && invalid.name ? " is-error" : ""}`}
            value={form.name}
            onChange={(e) => setForm({ ...form, name: e.target.value })}
          />
          {touched && invalid.name ? <p className="p-field__err">お名前を入力してください。</p> : null}
        </div>

        <div className="p-field">
          <label className="p-field__label" htmlFor="fld-tel">
            電話番号<span className="p-field__req">必須</span>
          </label>
          <input
            id="fld-tel"
            className={`p-input${touched && invalid.tel ? " is-error" : ""}`}
            value={form.tel}
            inputMode="tel"
            placeholder="090-1234-5678"
            onChange={(e) => setForm({ ...form, tel: e.target.value })}
          />
          {touched && invalid.tel ? <p className="p-field__err">ハイフンを含む電話番号を入力してください。</p> : null}
        </div>

        {biz.askFields.map((f) => (
          <div className={`p-field${f.type === "textarea" ? " p-field--wide" : ""}`} key={f.key}>
            <label className="p-field__label" htmlFor={`fld-${f.key}`}>{f.label}</label>
            {f.type === "textarea" ? (
              <textarea
                id={`fld-${f.key}`}
                className="p-input"
                rows={2}
                value={form[f.key]}
                onChange={(e) => setForm({ ...form, [f.key]: e.target.value })}
              />
            ) : (
              <input
                id={`fld-${f.key}`}
                className="p-input"
                type="number"
                value={form[f.key]}
                onChange={(e) => setForm({ ...form, [f.key]: e.target.value })}
              />
            )}
          </div>
        ))}
      </div>

      <div className="p-form__foot">
        <button type="button" className="p-btn p-btn--main" onClick={submit}>{submitLabel}</button>
        <button type="button" className="p-btn" onClick={onCancel}>{cancelLabel}</button>
      </div>
    </div>
  );
}

/* ==================================================================
   店舗の管理画面（予約台帳）
================================================================== */
function AdminView({ biz, rows, date, setDate, onStatus, onBook }) {
  const [phoneMenuId, setPhoneMenuId] = useState(biz.menus[0].id);
  const [phonePicked, setPhonePicked] = useState(null);
  const [justAdded, setJustAdded] = useState(null);

  const dayRows = rows
    .filter((r) => r.date === date)
    .sort((a, b) => toMin(a.start) - toMin(b.start));

  const openMin = toMin(biz.open);
  const closeMin = toMin(biz.close);
  const span = closeMin - openMin;

  const live = dayRows.filter((r) => r.status !== "canceled");
  const netCount = live.filter((r) => r.channel === "net").length;
  const phoneCount = live.filter((r) => r.channel === "phone").length;

  const sales = dayRows
    .filter((r) => r.status === "visited")
    .reduce((sum, r) => sum + (biz.menus.find((m) => m.id === r.menuId)?.price ?? 0), 0);

  const phoneMenu = biz.menus.find((m) => m.id === phoneMenuId) ?? biz.menus[0];
  const closed = biz.closedDays.includes(dayOfWeek(date));
  const phoneSlots = useMemo(
    () => (closed ? [] : buildSlots(biz, rows, date, phoneMenu)),
    [biz, rows, date, phoneMenu, closed]
  );

  const exportCsv = () => {
    const header = ["日付", "開始", "メニュー", biz.resourceLabel, "お名前", "電話番号", "受付", "状態", "備考"];
    const body = dayRows.map((r) => [
      r.date, r.start, biz.menus.find((m) => m.id === r.menuId)?.name ?? "",
      r.resource, r.name, r.tel, CHANNELS[r.channel]?.label ?? "", STATUS[r.status].label, r.note ?? "",
    ]);
    const csv = [header, ...body].map((l) => l.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\r\n");
    const url = URL.createObjectURL(new Blob(["\uFEFF" + csv], { type: "text/csv" }));
    const a = document.createElement("a");
    a.href = url;
    a.download = `予約_${date}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  };

  return (
    <React.Fragment>
      <section className="p-section">
        <div className="p-heading">
          <span className="p-heading__no">一</span>
          <h2 className="p-heading__text">予約台帳</h2>
        </div>

        <div className="p-scope">
          <p>
            台帳は<strong>この1つだけ</strong>です。ネットから入った予約も、
            電話で受けて店舗が入れた予約も、同じ台帳の同じ並びに入ります。
          </p>
          <p className="p-scope__sub">
            入口ごとに台帳を分けないので、どちらが最新かを突き合わせる作業がありません。
            ある枠が埋まれば、その時点で両方の入口から選べなくなります。
          </p>
        </div>

        <div className="p-actions">
          <label className="p-field__label" htmlFor="ledger-date" style={{ margin: 0 }}>日付</label>
          <input
            id="ledger-date"
            type="date"
            className="p-input"
            style={{ width: "auto" }}
            value={date}
            onChange={(e) => { setDate(e.target.value); setPhonePicked(null); setJustAdded(null); }}
          />
          <button type="button" className="p-btn" onClick={exportCsv} disabled={dayRows.length === 0}>
            CSVで書き出す
          </button>
          <span className="p-actions__spacer" />
          <span className="p-note" style={{ margin: 0 }}>
            {mdLabel(date)}（{jpDay[dayOfWeek(date)]}）{closed ? "／定休日" : ""}
          </span>
        </div>

        <div className="p-tiles">
          <div className="p-tile">
            <p className="p-tile__label">この日の予約</p>
            <p className="p-tile__num">{live.length}<span className="p-tile__unit">件</span></p>
            <p className="p-tile__sub">キャンセルを除いた件数です。</p>
          </div>
          <div className="p-tile">
            <p className="p-tile__label">うち{CHANNELS.net.label}から</p>
            <p className="p-tile__num">{netCount}<span className="p-tile__unit">件</span></p>
            <p className="p-tile__sub">{CHANNELS.net.desc}。</p>
          </div>
          <div className="p-tile">
            <p className="p-tile__label">うち{CHANNELS.phone.label}から</p>
            <p className="p-tile__num">{phoneCount}<span className="p-tile__unit">件</span></p>
            <p className="p-tile__sub">{CHANNELS.phone.desc}。</p>
          </div>
          <div className="p-tile">
            <p className="p-tile__label">来店済みの売上</p>
            <p className="p-tile__num">{sales.toLocaleString()}<span className="p-tile__unit">円</span></p>
            <p className="p-tile__sub">状態が来店済みの行だけを合計しています。</p>
          </div>
        </div>

        <p className="p-note" style={{ marginTop: 0 }}>
          入口の内訳は台帳の集計です。入口が2つに分かれていても、数えている台帳は1つです。
        </p>
      </section>

      {/* ---------------- 二 時間軸 ---------------- */}
      <section className="p-section">
        <div className="p-heading">
          <span className="p-heading__no">二</span>
          <h2 className="p-heading__text">{biz.resourceLabel}ごとの空き状況</h2>
        </div>

        <p className="p-lead">
          横軸が時間、行が{biz.resourceLabel}です。帯が入っているところが埋まっている時間で、
          紙色のままのところが空いている時間です。ネットの予約も電話の予約も同じ帯として並びます。
        </p>

        <div className="p-scroll">
          <div className="p-chart">
            <div className="p-chart__axis">
              <div className="p-chart__gutter" />
              <div className="p-chart__ticks">
                {Array.from({ length: Math.floor(span / 60) + 1 }, (_, i) => (
                  <span key={i} className="p-chart__tick" style={{ left: `${((i * 60) / span) * 100}%` }}>
                    {toHHMM(openMin + i * 60)}
                  </span>
                ))}
              </div>
            </div>

            {biz.resources.map((res) => (
              <div key={res} className="p-chart__row">
                <div className="p-chart__name">{res}</div>
                <div className="p-chart__track">
                  {dayRows
                    .filter((r) => r.resource === res && r.status !== "canceled")
                    .map((r) => {
                      const m = biz.menus.find((x) => x.id === r.menuId);
                      const left = ((toMin(r.start) - openMin) / span) * 100;
                      const width = ((m?.minutes ?? biz.slotMinutes) / span) * 100;
                      const mod = r.status === "visited" ? " p-chart__bar--visited" : r.status === "noshow" ? " p-chart__bar--noshow" : "";
                      return (
                        <div
                          key={r.id}
                          className={`p-chart__bar${mod}`}
                          title={`${r.start} ${r.name}様 ${m?.name ?? ""}（受付：${CHANNELS[r.channel]?.label ?? ""}）`}
                          style={{ left: `${left}%`, width: `${width}%` }}
                        >
                          {r.name}
                        </div>
                      );
                    })}
                </div>
              </div>
            ))}
          </div>
        </div>

        <ul className="p-legend">
          <li><span className="p-legend__swatch" />{STATUS.reserved.label}</li>
          <li><span className="p-legend__swatch p-legend__swatch--visited" />{STATUS.visited.label}</li>
          <li><span className="p-legend__swatch p-legend__swatch--noshow" />{STATUS.noshow.label}</li>
          <li><span className="p-legend__swatch p-legend__swatch--free" />空き</li>
        </ul>

        <p className="p-note">
          画面が狭いときは、時間軸を横にスクロールできます。帯の上に指を置くと、
          お客さまのお名前とメニュー、どちらの入口から入った予約かが出ます。
        </p>
      </section>

      {/* ---------------- 三 予約一覧 ---------------- */}
      <section className="p-section">
        <div className="p-heading">
          <span className="p-heading__no">三</span>
          <h2 className="p-heading__text">この日の予約一覧</h2>
        </div>

        <p className="p-lead">
          状態を変えると、時間軸の帯と上の集計がその場で変わります。
          来店済みにすると売上に乗り、キャンセルにすると枠が空いて、
          お客さま画面にも空きとして戻ります。
        </p>

        {dayRows.length === 0 ? (
          <div className="p-empty">
            <p>この日の予約はまだありません。</p>
            <p>下の「電話で受けた予約を台帳に入れる」から入れられます。</p>
          </div>
        ) : (
          <div className="p-scroll">
            <table className="p-table p-table--ledger">
              <thead>
                <tr>
                  <th>開始</th>
                  <th>メニュー</th>
                  <th>{biz.resourceLabel}</th>
                  <th>お客さま</th>
                  <th>受付</th>
                  <th>状態</th>
                  <th />
                </tr>
              </thead>
              <tbody>
                {dayRows.map((r) => (
                  <tr key={r.id}>
                    <td className="is-time">{r.start}</td>
                    <td className="is-plain">{biz.menus.find((m) => m.id === r.menuId)?.name}</td>
                    <td className="is-plain">{r.resource}</td>
                    <td>
                      <span className="p-table__name">{r.name}</span>
                      <span className="p-table__tel">{r.tel}</span>
                      {r.note ? <span className="p-table__note">{r.note}</span> : null}
                    </td>
                    <td><span className="p-mark">{CHANNELS[r.channel]?.label ?? "—"}</span></td>
                    <td><span className={markClass(STATUS[r.status].tone)}>{STATUS[r.status].label}</span></td>
                    <td className="is-act">
                      <select
                        className="p-input"
                        style={{ width: "auto", fontSize: "var(--fs-note)" }}
                        value={r.status}
                        aria-label={`${r.name}様の状態`}
                        onChange={(e) => onStatus(r.id, e.target.value)}
                      >
                        {Object.keys(STATUS).map((k) => (
                          <option key={k} value={k}>{STATUS[k].label}</option>
                        ))}
                      </select>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </section>

      {/* ---------------- 四 電話予約の入力 ---------------- */}
      <section className="p-section">
        <div className="p-heading">
          <span className="p-heading__no">四</span>
          <h2 className="p-heading__text">電話で受けた予約を台帳に入れる</h2>
        </div>

        <p className="p-lead">
          電話が鳴ったときに、店舗の人がその場で入れる画面です。
          ここに出る空き枠は、お客さま画面が見ているものと<strong>同じ台帳の同じ判定</strong>です。
          ネットで先に埋まった枠は、ここに出てきません。逆に、ここで入れた予約は、
          その瞬間からお客さま画面で選べなくなります。
        </p>

        {justAdded ? (
          <div className="p-scope">
            <p>
              <strong>{mdLabel(justAdded.date)}（{jpDay[dayOfWeek(justAdded.date)]}） {justAdded.start}</strong>
              　{justAdded.name}様の予約を、受付：{CHANNELS.phone.label}として台帳に入れました。
            </p>
            <p className="p-scope__sub">
              上の一覧と時間軸に反映されています。お客さま画面の「時間を選ぶ」からも、この枠は消えています。
            </p>
          </div>
        ) : null}

        {closed ? (
          <div className="p-empty">
            <p>{mdLabel(date)}（{jpDay[dayOfWeek(date)]}）は定休日です。</p>
            <p>上の日付を変えると、その日の空き枠が出ます。</p>
          </div>
        ) : (
          <React.Fragment>
            <p className="p-field__label">メニュー</p>
            <div className="p-picks">
              {biz.menus.map((m) => (
                <button
                  key={m.id}
                  type="button"
                  className="p-pick"
                  aria-pressed={m.id === phoneMenuId}
                  onClick={() => { setPhoneMenuId(m.id); setPhonePicked(null); }}
                >
                  <span className="p-pick__name">{m.name}</span>
                  <span className="p-pick__meta">
                    {m.minutes}分{m.price > 0 ? ` ／ ${m.price.toLocaleString()}円` : ""}
                  </span>
                </button>
              ))}
            </div>

            <p className="p-field__label" style={{ marginTop: "var(--sp-4)" }}>
              {mdLabel(date)}（{jpDay[dayOfWeek(date)]}）の空き枠
            </p>
            <div className="p-slots">
              {phoneSlots.map((s) => {
                const full = s.free.length === 0;
                return (
                  <button
                    key={s.start}
                    type="button"
                    className="p-slot"
                    disabled={full}
                    aria-pressed={phonePicked?.start === s.start}
                    onClick={() => { setPhonePicked({ start: s.start, resource: s.free[0] }); setJustAdded(null); }}
                  >
                    {s.start}
                  </button>
                );
              })}
            </div>

            {phoneSlots.every((s) => s.free.length === 0) ? (
              <p className="p-note">この日は空きがありません。別の日付をお試しください。</p>
            ) : (
              <p className="p-note">
                取り消し線の付いた時間は、ネット・電話どちらかの予約で
                {biz.resourceLabel}がすべて埋まっている時間です。
              </p>
            )}

            {phonePicked ? (
              <div style={{ marginTop: "var(--sp-4)" }}>
                <BookingForm
                  biz={biz}
                  menu={phoneMenu}
                  date={date}
                  picked={phonePicked}
                  channel="phone"
                  submitLabel="この内容で台帳に入れる"
                  cancelLabel="時間を選び直す"
                  onCancel={() => setPhonePicked(null)}
                  onSubmit={(b) => { onBook(b); setJustAdded(b); setPhonePicked(null); }}
                />
              </div>
            ) : null}
          </React.Fragment>
        )}
      </section>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
