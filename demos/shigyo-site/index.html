/* ==================================================================

/* ==================================================================
   設定オブジェクトからCSSを組み立てます。
   以降のコードは THEME を直接参照せず、CSS変数だけを見ます。
================================================================== */
function buildCss(t) {
  return `
:root{
  --c-primary:${t.color.primary}; --c-primary-dark:${t.color.primaryDark};
  --c-primary-soft:${t.color.primarySoft}; --c-accent:${t.color.accent};
  --c-accent-soft:${t.color.accentSoft}; --c-ink:${t.color.ink};
  --c-muted:${t.color.inkMuted}; --c-line:${t.color.line};
  --c-bg:${t.color.bg}; --c-surface:${t.color.surface};
  --c-warn:${t.color.warnBorder}; --c-warn-soft:${t.color.warnSoft};
  --f-heading:${t.font.heading}; --f-body:${t.font.body};
  --fs-h1:${t.font.h1}; --fs-h2:${t.font.h2}; --fs-h3:${t.font.h3};
  --fs-h4:${t.font.h4}; --fs-h5:${t.font.h5};
  --fs-base:${t.font.base}; --fs-small:${t.font.small};
  --lh:${t.font.lineHeight}; --lh-head:${t.font.lineHeightHeading};
  --sp-section:${t.space.section}; --sp-block:${t.space.block};
  --w-container:${t.space.container}; --w-narrow:${t.space.containerNarrow};
  --radius:${t.space.radius};
}
body{ font-family:var(--f-body); color:var(--c-ink); background:var(--c-bg);
      font-size:var(--fs-base); line-height:var(--lh); -webkit-font-smoothing:antialiased; }
.ss-container{ max-width:var(--w-container); margin-inline:auto; padding-inline:20px; }
.ss-narrow{ max-width:var(--w-narrow); }
.ss-section{ padding-block:var(--sp-section); }

/* --- セクション見出し（トップページ用） --- */
.ss-sec-head{ text-align:center; margin-bottom:2.5rem; }
.ss-sec-head .en{ display:block; font-family:var(--f-heading); letter-spacing:.22em;
  font-size:var(--fs-small); color:var(--c-accent); margin-bottom:.5rem; }
.ss-sec-head .ja{ font-family:var(--f-heading); font-size:var(--fs-h2);
  line-height:var(--lh-head); font-weight:600; color:var(--c-primary); }
.ss-sec-head .ja::after{ content:""; display:block; width:44px; height:2px;
  background:var(--c-accent); margin:.9rem auto 0; }

/* --- ボタン --- */
.ss-btn{ display:inline-flex; align-items:center; justify-content:center; gap:.5rem;
  background:var(--c-primary); color:#fff; padding:.9rem 1.9rem; border-radius:var(--radius);
  font-weight:600; letter-spacing:.04em; transition:background .15s; border:1px solid var(--c-primary); }
.ss-btn:hover{ background:var(--c-primary-dark); }
.ss-btn-accent{ background:var(--c-accent); border-color:var(--c-accent); }
.ss-btn-accent:hover{ background:#8d6f31; }
.ss-btn-outline{ display:inline-flex; align-items:center; justify-content:center; gap:.5rem;
  background:transparent; color:var(--c-primary); border:1px solid var(--c-primary);
  padding:.9rem 1.9rem; border-radius:var(--radius); font-weight:600; transition:background .15s; }
.ss-btn-outline:hover{ background:var(--c-primary-soft); }

/* --- カード --- */
.ss-card{ background:var(--c-surface); border:1px solid var(--c-line);
  border-radius:var(--radius); }

/* ==================================================================
   記事本文のスタイル（.entry）
   WordPressでは「投稿本文」を包む要素にこのクラスを付けます。
   投稿画面で見出しやリストを選ぶだけで、以下の見た目になります。
================================================================== */
.entry{ font-size:var(--fs-base); line-height:var(--lh); }
.entry > * + *{ margin-top:var(--sp-block); }

.entry h2{ font-family:var(--f-heading); font-size:var(--fs-h2); font-weight:600;
  line-height:var(--lh-head); color:var(--c-primary); background:var(--c-primary-soft);
  border-left:5px solid var(--c-primary); border-radius:0 var(--radius) var(--radius) 0;
  padding:.85rem 1.1rem; margin-top:3.25rem; }
.entry > section:first-child > h2:first-child{ margin-top:1.5rem; }
.entry h3{ font-family:var(--f-heading); font-size:var(--fs-h3); font-weight:600;
  line-height:var(--lh-head); color:var(--c-primary); border-bottom:1px solid var(--c-line);
  padding-bottom:.6rem; margin-top:2.5rem; position:relative; }
.entry h3::after{ content:""; position:absolute; left:0; bottom:-1px; width:70px; height:2px;
  background:var(--c-accent); }
.entry h4{ font-size:var(--fs-h4); font-weight:700; line-height:var(--lh-head);
  color:var(--c-ink); padding-left:.85rem; border-left:3px solid var(--c-accent);
  margin-top:2rem; }
.entry h5{ font-size:var(--fs-h5); font-weight:700; line-height:var(--lh-head);
  color:var(--c-muted); margin-top:1.5rem; letter-spacing:.04em; }
.entry h5::before{ content:"■"; color:var(--c-accent); margin-right:.4rem; font-size:.8em; }

.entry p{ margin-top:var(--sp-block); }
.entry a{ color:var(--c-primary); text-decoration:underline; text-underline-offset:3px; }
.entry a:hover{ color:var(--c-accent); }
.entry strong{ font-weight:700; background:linear-gradient(transparent 62%, var(--c-accent-soft) 62%); }

/* 順序なしリスト */
.entry ul{ list-style:none; padding-left:0; }
.entry ul li{ position:relative; padding-left:1.5rem; margin-top:.7rem; }
.entry ul li::before{ content:""; position:absolute; left:.35rem; top:.72em;
  width:7px; height:7px; background:var(--c-accent); border-radius:50%; }
/* 順序つきリスト */
.entry ol{ list-style:none; padding-left:0; counter-reset:ss-ol; }
.entry ol li{ position:relative; padding-left:2.2rem; margin-top:.9rem; counter-increment:ss-ol; }
.entry ol li::before{ content:counter(ss-ol); position:absolute; left:0; top:.15em;
  width:1.6rem; height:1.6rem; border-radius:50%; background:var(--c-primary); color:#fff;
  font-size:.8rem; font-weight:700; display:flex; align-items:center; justify-content:center;
  font-family:var(--f-body); }
.entry li > ul, .entry li > ol{ margin-top:.5rem; }

/* 表 */
.ss-table-wrap{ overflow-x:auto; }
.entry table, table.ss-table{ width:100%; border-collapse:collapse; font-size:var(--fs-small);
  background:var(--c-surface); border:1px solid var(--c-line); }
.entry th, table.ss-table th{ background:var(--c-primary-soft); color:var(--c-primary);
  font-weight:700; text-align:left; padding:.8rem 1rem; border:1px solid var(--c-line);
  white-space:nowrap; }
.entry td, table.ss-table td{ padding:.8rem 1rem; border:1px solid var(--c-line);
  vertical-align:top; }
.entry tbody tr:nth-child(even) td, table.ss-table tbody tr:nth-child(even) td{ background:#fafbfc; }
.ss-table-note{ font-size:var(--fs-small); color:var(--c-muted); margin-top:.6rem; }

/* 引用 */
.entry blockquote, blockquote.ss-quote{ border-left:3px solid var(--c-accent);
  background:var(--c-surface); padding:1.2rem 1.4rem; color:var(--c-muted);
  font-size:var(--fs-small); line-height:1.85; }
.entry blockquote cite, blockquote.ss-quote cite{ display:block; margin-top:.7rem;
  font-style:normal; font-size:.8rem; color:var(--c-muted); }
.entry blockquote cite::before, blockquote.ss-quote cite::before{ content:"— "; }

/* 注意書きボックス */
.ss-note{ border:1px solid var(--c-line); border-left:4px solid var(--c-primary);
  background:var(--c-primary-soft); border-radius:0 var(--radius) var(--radius) 0;
  padding:1.1rem 1.3rem; font-size:var(--fs-small); line-height:1.85; }
.ss-note .ss-note-title{ font-weight:700; color:var(--c-primary); display:flex;

.ss-note.is-warn{ border-left-color:var(--c-warn); background:var(--c-warn-soft); }
.ss-note.is-warn .ss-note-title{ color:var(--c-warn); }
.ss-note.is-point{ border-left-color:var(--c-accent); background:var(--c-accent-soft); }
.ss-note.is-point .ss-note-title{ color:#8d6f31; }
.ss-note > * + *{ margin-top:.6rem; }
.ss-note ul li::before{ top:.65em; }

/* よくある質問 */
.ss-faq{ border:1px solid var(--c-line); border-radius:var(--radius);
  background:var(--c-surface); overflow:hidden; }
.ss-faq + .ss-faq{ margin-top:.75rem; }
.ss-faq-q{ width:100%; display:flex; gap:.85rem; align-items:flex-start; text-align:left;
  padding:1.1rem 1.2rem; font-weight:700; color:var(--c-primary); background:transparent;
  transition:background .15s; }
.ss-faq-q:hover{ background:var(--c-primary-soft); }
.ss-faq-mark{ flex:none; width:1.6rem; height:1.6rem; border-radius:50%;
  display:flex; align-items:center; justify-content:center; font-size:.8rem;
  font-family:var(--f-heading); font-weight:700; }
.ss-faq-mark.q{ background:var(--c-primary); color:#fff; }
.ss-faq-mark.a{ background:var(--c-accent-soft); color:var(--c-accent); border:1px solid var(--c-accent); }
.ss-faq-a{ display:flex; gap:.85rem; align-items:flex-start; padding:0 1.2rem 1.2rem;
  font-size:var(--fs-small); line-height:1.9; color:var(--c-ink); }
.ss-faq-icon{ margin-left:auto; flex:none; color:var(--c-muted); transition:transform .2s; }
.ss-faq.is-open .ss-faq-icon{ transform:rotate(180deg); }

/* パンくず */
.ss-crumbs{ font-size:.8rem; color:var(--c-muted); }
.ss-crumbs a:hover{ color:var(--c-primary); text-decoration:underline; }
.ss-crumbs span[aria-current]{ color:var(--c-ink); }

/* 目次 */
.ss-toc{ background:var(--c-surface); border:1px solid var(--c-line);
  border-radius:var(--radius); padding:1.2rem 1.3rem; }
.ss-toc-title{ font-family:var(--f-heading); font-weight:700; color:var(--c-primary);
  font-size:var(--fs-h4); padding-bottom:.7rem; border-bottom:1px solid var(--c-line);
  margin-bottom:.8rem; }
.ss-toc ol{ list-style:none; counter-reset:toc; }
.ss-toc li{ counter-increment:toc; margin-top:.55rem; font-size:var(--fs-small);
  line-height:1.6; }
.ss-toc a{ display:flex; gap:.6rem; color:var(--c-ink); }
.ss-toc a::before{ content:counter(toc,decimal-leading-zero); color:var(--c-accent);
  font-weight:700; font-size:.78rem; flex:none; }
.ss-toc a:hover{ color:var(--c-primary); text-decoration:underline; }

/* 見出しの上の小ラベル */
.ss-eyebrow{ display:inline-block; font-size:.75rem; letter-spacing:.16em; font-weight:700;
  color:var(--c-accent); }

/* パターン集の解説チップ */
.ss-spec{ font-size:.78rem; color:var(--c-muted); background:#fbfcfd;
  border-top:1px dashed var(--c-line); padding:.7rem .95rem; line-height:1.7; }
.ss-chip{ display:inline-block; font-size:.7rem; font-weight:700; letter-spacing:.06em;
  background:var(--c-primary); color:#fff; border-radius:3px; padding:.15rem .5rem;
  margin-right:.5rem; font-family:var(--f-body); }

/* デモ用スイッチャー */
.ss-switch{ background:#111a24; }
.ss-switch button{ font-size:.82rem; padding:.5rem 1.1rem; border-radius:var(--radius);
  color:#c8d2dd; transition:.15s; }
.ss-switch button:hover{ color:#fff; background:#1e2b38; }
.ss-switch button[data-on="1"]{ background:var(--c-accent); color:#fff; font-weight:700; }

html{ scroll-behavior:smooth; }
[id]{ scroll-margin-top:96px; }
`;
}

        <PatternGroup
          no="06"
          title="本文・強調・ボタン"
          desc="本文の行間は広めに設定しています。士業サイトは文章量が多くなるため、詰めるより空ける方が読み進めてもらえます。"
        >
          <Pattern block="段落・リード文・強調" note="投稿画面で「段落」ブロックに入力した文章は、この見た目になります。太字にした箇所には自動で下線マーカーが付きます。リンクは基調色の下線付きです。">
            <div className="entry">
              <p style={{ marginTop: 0, fontSize: "1.05rem" }}>
                リード文は、通常の本文より少し大きく設定しています。ページの冒頭に1段落だけ置きます。
              </p>
              <p>
                通常の段落です。<strong>強調したい箇所</strong>は太字にすると、下線のマーカーが付きます。
                本文中から<a href="#top">他のページへのリンク</a>を張ることもできます。
                1文を短く区切ると読みやすくなります。
              </p>
            </div>
          </Pattern>

          <Pattern block="ボタン" note="投稿画面で「ボタン」ブロックを挿入し、種類を選ぶとこの見た目になります。相談へ進んでほしい箇所に置きます。色の指定は不要で、種類を選ぶだけです。">
            <div className="flex flex-wrap gap-3">
              <button className="ss-btn">基本のボタン</button>
              <button className="ss-btn ss-btn-accent">申し込みボタン</button>
              <button className="ss-btn-outline">枠線のボタン</button>
            </div>
          </Pattern>

          <Pattern block="目次" note="投稿画面で「目次」ブロックを挿入すると、そのページのH2を自動で拾って一覧にします。見出しを増減しても、目次は手で直す必要がありません。">
            <div className="ss-toc" style={{ maxWidth: "22rem" }}>
              <div className="ss-toc-title">このページの内容</div>
              <ol>
                {SUBPAGE.sections.map((s) => <li key={s.id}><a href={"#" + s.id}>{s.title}</a></li>)}
              </ol>
            </div>
          </Pattern>
        </PatternGroup>

        {/* 設定オブジェクト */}
        <PatternGroup
          no="07"
          title="色と文字の設定"
          desc="ここに並ぶ値は、ファイル冒頭の設定オブジェクト1か所で決まっています。事務所のカラーに合わせて変更する場合、この値を書き換えるだけで3画面すべてに反映されます。"
        >
          <Pattern block="カラーパレット" note="WordPress化する際は、この値をテーマ設定（theme.json）に移します。投稿画面の色選択にも、ここで決めた色だけが並びます。ページごとに色がばらつくことを防げます。">
            <div className="grid gap-3 sm:grid-cols-2">
              {tokens.map((t) => (
                <div key={t.name} className="flex items-center gap-3 border p-3" style={{ borderColor: "var(--c-line)", borderRadius: "var(--radius)" }}>
                  <div className="w-10 h-10 flex-none border" style={{ background: t.value, borderColor: "var(--c-line)", borderRadius: "4px" }} />
                  <div className="min-w-0">
                    <div className="text-xs font-bold">{t.name}</div>
                    <div className="text-[11px] tabular-nums" style={{ color: "var(--c-muted)" }}>{t.value}　{t.use}</div>
                  </div>
                </div>
              ))}
            </div>
          </Pattern>

          <Pattern block="文字サイズ・余白" note="文字サイズは画面幅に応じて自動で伸縮します（スマートフォンでは小さく、大画面では大きく）。投稿者が個別にサイズを指定する必要はありません。">
            <div className="ss-table-wrap">
              <table className="ss-table">
                <thead><tr><th>項目</th><th>設定値</th><th>用途</th></tr></thead>
                <tbody>
                  <tr><td>見出しの書体</td><td className="text-xs">明朝体</td><td>H1・H2・数字。信頼感を出す箇所</td></tr>
                  <tr><td>本文の書体</td><td className="text-xs">ゴシック体</td><td>本文全般。画面での可読性を優先</td></tr>
                  <tr><td>H1</td><td className="text-xs tabular-nums">{THEME.font.h1}</td><td>ページタイトル（1ページに1つ）</td></tr>
                  <tr><td>H2</td><td className="text-xs tabular-nums">{THEME.font.h2}</td><td>章見出し</td></tr>
                  <tr><td>H3 / H4 / H5</td><td className="text-xs tabular-nums">{THEME.font.h3} / {THEME.font.h4} / {THEME.font.h5}</td><td>下位の見出し</td></tr>
                  <tr><td>本文</td><td className="text-xs tabular-nums">{THEME.font.base}（行間 {THEME.font.lineHeight}）</td><td>段落・リスト</td></tr>
                  <tr><td>セクション余白</td><td className="text-xs tabular-nums">{THEME.space.section}</td><td>大きな区切りの上下</td></tr>
                  <tr><td>本文の最大幅</td><td className="text-xs tabular-nums">{THEME.space.containerNarrow}</td><td>1行が長くなりすぎないように制限</td></tr>
                </tbody>
              </table>
            </div>
          </Pattern>
        </PatternGroup>
      </div>
    </div>
  );
}

/* ==================================================================
   デモ用のスイッチャーと注記
================================================================== */
const SCREENS = [
  { id: "home", label: "① トップページ", note: "ファーストビューから問い合わせまで。ラフデザインをいただければ、その構成に合わせて作り替えます。" },
  { id: "sub", label: "② 下層ページのベース", note: "「相続税申告」を例にした1枚です。この構造をコピーして、他の業務ページを量産します。" },
  { id: "patterns", label: "③ 見出し・パーツ集", note: "H2〜H5・リスト・表・注意書きなど、下層ページを組み立てる部品の一覧です。" },
];

function App() {
  const [screen, setScreen] = useState("home");
  const css = useMemo(() => buildCss(THEME), []);
  const current = SCREENS.find((s) => s.id === screen);

  const go = (id) => {
    setScreen(id);
    window.scrollTo({ top: 0, behavior: "auto" });
  };

  return (
    <div id="top">
      <style>{css}</style>

      {/* デモ用スイッチャー（実際のサイトには入りません） */}
      <div className="ss-switch sticky top-0 z-50 text-white">
        <div className="ss-container py-2.5 flex flex-wrap items-center gap-2">
          <span className="text-[10px] tracking-[.18em] opacity-60 mr-1">DEMO</span>
          {SCREENS.map((s) => (
            <button key={s.id} data-on={screen === s.id ? "1" : "0"} onClick={() => go(s.id)}>
              {s.label}
            </button>
          ))}
          <span className="hidden xl:block text-[11px] opacity-55 ml-auto">画面を切り替えてご確認いただけます</span>
        </div>
      </div>
      <div className="ss-switch border-t border-white/10 text-white/60">
        <div className="ss-container pt-1 pb-2.5 text-[11px] leading-relaxed">{current.note}</div>
      </div>

      {screen === "home" && <TopPage onNav={go} />}
      {screen === "sub" && <SubPage onNav={go} />}
      {screen === "patterns" && <PatternsPage />}

      {/* 注記（全画面共通） */}
      <div style={{ background: "#111a24" }} className="text-white/70">
        <div className="ss-container py-8">
          <div className="border-l-4 pl-4" style={{ borderColor: "var(--c-accent)" }}>
            <div className="text-xs font-bold tracking-widest mb-2" style={{ color: "#d9c48f" }}>本デモについて</div>
            <p className="text-sm leading-loose">
              本デモはデザインと構造の確認用です。実装はWordPressテーマとして行い、
              見出しやリストは投稿画面から選択できるブロックとして登録します。
            </p>
            <p className="text-xs leading-loose mt-3 opacity-70">
              画面上部の切り替えタブは、3画面をまとめてご確認いただくためのもので、実際のサイトには含まれません。
              掲載している事務所名・料金・実績はすべてサンプルです。
            </p>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
