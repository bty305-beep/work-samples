/* ------------------------------------------------------------------

------------------------------------------------------------------ */
function Figure({ item }) {
  return (
    <div className="p-figure">
      <p className="p-figure__label">{item.figureLabel}</p>
      {item.figure ? (
        <p className="p-figure__num">
          {item.figure}
          <span className="p-figure__unit">{item.unit}</span>
        </p>
      ) : null}
      <p className="p-figure__note">{item.figureNote}</p>
      {item.source ? <p className="p-figure__src">{item.source}</p> : null}
    </div>
  );
}

function Panel({ item }) {
  return (
    <div className="p-panel" id={`panel-${item.no}`} role="region" aria-label={item.title}>
      <div className="p-panel__inner">
        <Figure item={item} />

        <div className="p-def">
          <p className="p-def__label">何が起きているか</p>
          <p className="p-def__body">{item.what}</p>
        </div>

        <div className="p-def">
          <p className="p-def__label">解決の型</p>
          <p className="p-def__body">{item.how}</p>
        </div>

        <div className="p-demo">
          <p className="p-demo__label">動くデモ</p>
          {item.demos.length > 0 ? (
            <React.Fragment>
              <ul className="p-demo__list">
                {item.demos.map((d) => (
                  <li key={d.href + d.label}>
                    <a href={d.href}>{d.label}</a>
                    <span className="p-demo__kind">{d.kind}</span>
                  </li>
                ))}
              </ul>
              <p className="p-demo__caution">
                デモ画面に表示される数値は、すべて動作確認のための想定値です。実在する企業の実績値ではありません。
              </p>
            </React.Fragment>
          ) : (
            <p className="p-demo__none">
              現時点で公開しているデモはありません。仕組みとしては対応可能です。
            </p>
          )}
        </div>
      </div>
    </div>
  );
}

function Item({ item, open, onToggle }) {
  return (
    <div className="p-item">
      <button
        type="button"
        className="p-item__btn"
        aria-expanded={open}
        aria-controls={`panel-${item.no}`}
        onClick={onToggle}
      >
        <span className="p-item__row">
          <span className="p-item__no">{item.no}</span>
          <span className="p-item__main">
            <span className="p-item__title">{item.title}</span>
            <span className="p-item__cat">分類：{item.cat}</span>
          </span>
          <span className="p-item__state">{open ? "閉じる" : "開く"}</span>
        </span>
      </button>
      {open ? <Panel item={item} /> : null}
    </div>
  );
}
