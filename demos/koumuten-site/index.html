}

function Btn({ children, onClick, href, kind = "primary", className = "", ...rest }) {
  const base = "inline-flex items-center justify-center gap-2 rounded-md px-5 py-3 text-sm font-bold transition";
  const kinds = {
    primary: "bg-[var(--c-accent)] text-white hover:opacity-90 shadow-sm",
    dark: "bg-[var(--c-primary)] text-white hover:bg-[var(--c-primary-dark)]",
    ghost: "border border-[var(--c-line)] bg-white text-[var(--c-primary-dark)] hover:bg-[var(--c-tint)]",
  };
  const cls = `${base} ${kinds[kind]} ${className}`;
  if (href) return <a href={href} className={cls} {...rest}>{children}</a>;
  return <button onClick={onClick} className={cls} {...rest}>{children}</button>;
}

const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[A-Za-z]{2,}$/;
const TEL_RE = /^0\d{9,10}$/;              // ハイフンを除いた10〜11桁
const ZIP_RE = /^\d{7}$/;                  // ハイフンを除いた7桁
const KANA_RE = /^[ぁ-んー\s　]+$/;

const FIELDS = [
  { key: "type", label: "ご相談の種類", type: "radio", options: SITE.contact.types, required: true },
  { key: "name", label: "お名前", type: "text", required: true, ph: "宮下 太郎", col: 1 },
  { key: "kana", label: "ふりがな", type: "text", required: true, ph: "みやした たろう", col: 1, note: "ひらがなでご入力ください" },
  { key: "area", label: "工事場所（市区町村）", type: "select", options: AREA_OPTIONS, required: true, col: 1 },
  { key: "zip", label: "郵便番号", type: "text", required: false, ph: "000-0000", col: 1, note: "任意。ハイフンあり・なしどちらでも" },
  { key: "tel", label: "電話番号", type: "tel", required: true, ph: "090-0000-0000", col: 1 },
  { key: "email", label: "メールアドレス", type: "email", required: true, ph: "you@example.com", col: 1 },
  { key: "route", label: "ご希望の連絡方法", type: "radio", options: SITE.contact.routes, required: true },
  { key: "budget", label: "ご予算", type: "select", options: SITE.contact.budgets, required: false, col: 1, note: "任意。未定のままで構いません" },
  { key: "timing", label: "ご希望の時期", type: "select", options: SITE.contact.timings, required: false, col: 1, note: "任意" },
  { key: "body", label: "ご相談の内容", type: "textarea", required: true, ph: "築28年の戸建てです。冬に浴室が寒いのが気になっており、可能であればキッチンもあわせて相談したいです。", note: "10文字以上。現在の状況やお困りごとをそのままお書きください" },
  { key: "agree", label: "個人情報の取り扱いに同意する", type: "checkbox", required: true },
];

function validate(v) {
  const e = {};
  FIELDS.forEach((f) => {
    const raw = v[f.key];
    const val = typeof raw === "string" ? raw.trim() : raw;
    if (f.required && !val) {
      e[f.key] =
        f.type === "checkbox" ? "確認のうえチェックしてください"
        : f.type === "radio" || f.type === "select" ? "ご選択ください"
        : "ご入力ください";
      return;
    }
    if (!val) return;
    if (f.key === "kana" && !KANA_RE.test(val)) e.kana = "ひらがなでご入力ください（例：みやした たろう）";
    if (f.key === "tel" && !TEL_RE.test(String(val).replace(/[-\s－ー]/g, ""))) e.tel = "電話番号の形式が正しくありません（例：090-0000-0000）";
    if (f.key === "email" && !EMAIL_RE.test(val)) e.email = "メールアドレスの形式が正しくありません（例：you@example.com）";
    if (f.key === "zip" && !ZIP_RE.test(String(val).replace(/[-\s－ー]/g, ""))) e.zip = "郵便番号は7桁でご入力ください（例：000-0000）";
    if (f.key === "body" && String(val).length < 10) e.body = "10文字以上でご入力ください（現状のご不便だけでも構いません）";
  });
  return e;
}

function ContactPage({ goTo, showIntent, openIntent, prefill }) {
  const [v, setV] = useState({
    type: "", name: "", kana: "", area: "", zip: "", tel: "", email: "",
    route: "", budget: "", timing: "", body: prefill ? `施工事例「${prefill.title}」を見て相談したいです。` : "", agree: false,
  });
  const [errors, setErrors] = useState({});
  const [touched, setTouched] = useState({});
  const [sent, setSent] = useState(false);
  const topRef = useRef(null);

  const set = (k, val) => {
    setV((p) => {
      const next = Object.assign({}, p, { [k]: val });
      if (touched[k] || errors[k]) setErrors(validate(next));
      return next;
    });
  };
  const blur = (k) => {
    setTouched((p) => Object.assign({}, p, { [k]: true }));
    setErrors(validate(v));
  };

  const outOfArea = v.area === "上記以外の地域";
  const errorList = Object.keys(errors);

  const submit = (ev) => {
    ev.preventDefault();
    const e = validate(v);
    setErrors(e);
    const all = {};
    FIELDS.forEach((f) => (all[f.key] = true));
    setTouched(all);
    if (Object.keys(e).length > 0) {
      const first = document.querySelector(`[data-field="${Object.keys(e)[0]}"]`);
      if (first) first.scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }
    setSent(true);
    if (topRef.current) topRef.current.scrollIntoView({ behavior: "smooth", block: "start" });
  };

  if (sent) {
    return (
      <div ref={topRef}>
        <PageHead en="CONTACT" ja="送信が完了しました" />
        <Section>
          <div className="mx-auto max-w-2xl rounded-lg border border-[var(--c-line)] bg-white p-8 text-center">
            <div className="mx-auto grid h-14 w-14 place-items-center rounded-full bg-[var(--c-primary)] text-2xl text-white">✓</div>
            <h2 className="mt-4 text-xl font-bold text-[var(--c-primary-dark)]">お問い合わせありがとうございます</h2>
            <p className="mt-3 text-[13px] leading-relaxed text-neutral-600">
              {v.name} 様<br />
              内容を確認のうえ、<b>1営業日以内</b>に{v.route === "電話" ? "お電話" : v.route === "メール" ? "メール" : "ご希望の方法"}でご連絡いたします。<br />
              お急ぎの場合は、お電話でも承っております。
            </p>
            <div className="mx-auto mt-5 max-w-sm rounded-lg bg-[var(--c-tint)] p-4">
              <TelBlock compact />
            </div>
            <p className="mt-4 text-[11px] text-neutral-500">
              ※ これはデモです。送信内容はどこにも保存・送信されません（実案件では管理画面への保存と自動返信メールを実装します）。
            </p>
            <div className="mt-6 flex justify-center gap-3">
              <Btn kind="ghost" onClick={() => goTo("home")}>ホームに戻る</Btn>
              <Btn kind="dark" onClick={() => { setSent(false); setV(Object.assign({}, v, { agree: false })); }}>入力画面に戻る</Btn>
            </div>
          </div>
        </Section>
      </div>
    );
  }

  return (
    <div ref={topRef}>
      <PageHead en="CONTACT" ja="お問い合わせ" lead="ご相談・現地調査・お見積りは無料です。しつこい営業はいたしません。" />

      <Section>
        <div className="grid gap-8 lg:grid-cols-[1.5fr_1fr]">
          <div>
            <WhyBadge anchor="tel" show={showIntent} onOpen={openIntent}
              text="フォームページでも、電話番号を同じ大きさで先に置きます。フォームを開いてから電話に切り替える人がいるためです。" />

            <div className="mb-6 grid gap-3 sm:grid-cols-2">
              <div className="rounded-lg border border-[var(--c-line)] bg-[var(--c-tint)] p-4">
                <TelBlock compact />
              </div>
              <div className="rounded-lg border border-[var(--c-line)] bg-[var(--c-tint)] p-4">
                <p className="text-[11px] font-semibold tracking-wider text-neutral-500">フォームでのご相談</p>
                <p className="mt-1 text-[15px] font-bold text-[var(--c-primary-dark)]">24時間受付・1営業日以内に返信</p>
                <p className="mt-1.5 text-[11px] text-neutral-500">お名前・連絡先・ご相談内容だけでも構いません</p>
              </div>
            </div>

            {errorList.length > 0 && Object.keys(touched).length > 0 && (
              <div className="mb-5 rounded-lg border border-rose-300 bg-rose-50 p-4">
                <p className="text-[13px] font-bold text-rose-700">未入力・形式に誤りのある項目が {errorList.length} 件あります</p>
                <ul className="mt-2 space-y-1">
                  {errorList.map((k) => {
                    const f = FIELDS.find((x) => x.key === k);
                    return (
                      <li key={k}>
                        <button
                          onClick={() => {
                            const el = document.querySelector(`[data-field="${k}"]`);
                            if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
                          }}
                          className="text-[12px] text-rose-700 underline underline-offset-2"
                        >
                          {f ? f.label : k}：{errors[k]}
                        </button>
                      </li>
                    );
                  })}
                </ul>
              </div>
            )}

            <form onSubmit={submit} noValidate className="space-y-5 rounded-lg border border-[var(--c-line)] bg-white p-5 sm:p-6">
              <Field f={FIELDS[0]} v={v} set={set} blur={blur} errors={errors} touched={touched} />

              <div className="grid gap-5 sm:grid-cols-2">
                {["name", "kana"].map((k) => (
                  <Field key={k} f={FIELDS.find((f) => f.key === k)} v={v} set={set} blur={blur} errors={errors} touched={touched} />
                ))}
              </div>

              <div>
                <WhyBadge anchor="area" show={showIntent} onOpen={openIntent}
                  text="工事場所は自由入力ではなく選択式にしています。エリア外を選ぶとその場で表示が出ます（送信は止めません）。" />
                <div className="grid gap-5 sm:grid-cols-2">
                  <Field f={FIELDS.find((f) => f.key === "area")} v={v} set={set} blur={blur} errors={errors} touched={touched} />
                  <Field f={FIELDS.find((f) => f.key === "zip")} v={v} set={set} blur={blur} errors={errors} touched={touched} />
                </div>
                {outOfArea && (
                  <div className="mt-3 rounded-lg border border-[var(--c-accent)] bg-[var(--c-accent)]/10 p-3.5">
                    <p className="text-[13px] font-bold text-[var(--c-primary-dark)]">対応エリア外の可能性があります</p>
                    <p className="mt-1.5 text-[12px] leading-relaxed text-neutral-700">
                      通常の対応エリアは <b>{SITE.areas.primary.join("・")}</b>（近隣：{SITE.areas.secondary.join("・")}）です。
                      {SITE.areas.note} このままご送信いただいて構いません。対応が難しい場合は、近隣の信頼できる工務店をご紹介いたします。
                    </p>
                  </div>
                )}
              </div>

              <div className="grid gap-5 sm:grid-cols-2">
                {["tel", "email"].map((k) => (
                  <Field key={k} f={FIELDS.find((f) => f.key === k)} v={v} set={set} blur={blur} errors={errors} touched={touched} />
                ))}
              </div>

              <Field f={FIELDS.find((f) => f.key === "route")} v={v} set={set} blur={blur} errors={errors} touched={touched} />

              <div className="grid gap-5 sm:grid-cols-2">
                {["budget", "timing"].map((k) => (
                  <Field key={k} f={FIELDS.find((f) => f.key === k)} v={v} set={set} blur={blur} errors={errors} touched={touched} />
                ))}
              </div>

              <Field f={FIELDS.find((f) => f.key === "body")} v={v} set={set} blur={blur} errors={errors} touched={touched} />

              <div className="rounded-lg bg-[var(--c-tint)] p-4">
                <p className="text-[11px] leading-relaxed text-neutral-600">
                  ご記入いただいた情報は、ご相談への回答とお見積りの作成にのみ使用します。
                  ご本人の同意なく第三者へ提供することはありません。
                </p>
                <div className="mt-3">
                  <Field f={FIELDS.find((f) => f.key === "agree")} v={v} set={set} blur={blur} errors={errors} touched={touched} />
                </div>
              </div>

              <Btn onClick={undefined} className="w-full !py-4 text-[15px]" type="submit">
                この内容で送信する
              </Btn>
              <p className="text-center text-[11px] text-neutral-500">
                デモのため送信内容は保存されません／入力チェックのみ動作します
              </p>
            </form>
          </div>

          <aside className="space-y-4 lg:sticky lg:top-32 lg:h-fit">
            <AreaBlock />
            <div className="rounded-lg border border-[var(--c-line)] bg-white p-5">
              <p className="text-[13px] font-bold text-[var(--c-primary-dark)]">お問い合わせの前によくいただく質問</p>
              <div className="mt-3 space-y-3">
                {[
                  { q: "見積りだけでも大丈夫ですか", a: "はい。他社さまとの比較のためのお見積りも承っております。無料です。" },
                  { q: "現地調査は何をしますか", a: "1〜2時間ほど、床下・小屋裏を含めて確認します。図面がなくても対応できます。" },
                  { q: "しつこい営業はありますか", a: "こちらからの連絡は、お見積り提出後に一度だけです。" },
                ].map((f) => (
                  <div key={f.q}>
                    <p className="text-[12px] font-bold text-[var(--c-primary-dark)]">Q. {f.q}</p>
                    <p className="mt-0.5 text-[12px] leading-relaxed text-neutral-600">A. {f.a}</p>
                  </div>
                ))}
              </div>
            </div>
            <div className="rounded-lg bg-[var(--c-primary)] p-5 text-white">
              <p className="text-[13px] font-bold">お急ぎの方はお電話が確実です</p>
              <a href={`tel:${SITE.company.tel.replace(/-/g, "")}`} className="mt-2 block text-2xl font-bold tracking-tight">☎ {SITE.company.tel}</a>
              <p className="mt-1 text-[11px] opacity-80">{SITE.company.telLabel}</p>
            </div>
          </aside>
        </div>
      </Section>
    </div>
  );
}

function Field({ f, v, set, blur, errors, touched }) {
  const err = touched[f.key] && errors[f.key];
  const base = `w-full rounded-md border bg-white px-3.5 py-2.5 text-[14px] outline-none transition focus:ring-2 focus:ring-[var(--c-primary)]/25 ${
    err ? "border-rose-400 bg-rose-50/40" : "border-[var(--c-line)] focus:border-[var(--c-primary)]"
  }`;

  return (
    <div data-field={f.key}>
      {f.type !== "checkbox" && (
        <label className="mb-1.5 flex items-center gap-2 text-[13px] font-bold text-[var(--c-primary-dark)]">
          {f.label}
          <span className={`rounded px-1.5 py-0.5 text-[10px] font-bold ${f.required ? "bg-[var(--c-accent)] text-white" : "bg-neutral-100 text-neutral-500"}`}>
            {f.required ? "必須" : "任意"}
          </span>
        </label>
      )}

      {f.type === "text" || f.type === "tel" || f.type === "email" ? (
        <input
          type={f.type === "text" ? "text" : f.type}
          inputMode={f.type === "tel" ? "tel" : f.type === "email" ? "email" : undefined}
          value={v[f.key]}
          placeholder={f.ph}
          onChange={(e) => set(f.key, e.target.value)}
          onBlur={() => blur(f.key)}
          className={base}
        />
      ) : null}

      {f.type === "textarea" && (
        <textarea
          rows={5}
          value={v[f.key]}
          placeholder={f.ph}
          onChange={(e) => set(f.key, e.target.value)}
          onBlur={() => blur(f.key)}
          className={base}
        />
      )}

      {f.type === "select" && (
        <select value={v[f.key]} onChange={(e) => set(f.key, e.target.value)} onBlur={() => blur(f.key)} className={base}>
          <option value="">選択してください</option>
          {f.options.map((o) => <option key={o} value={o}>{o}</option>)}
        </select>
      )}

      {f.type === "radio" && (
        <div className="flex flex-wrap gap-2">
          {f.options.map((o) => (
            <button
              key={o}
              type="button"
              onClick={() => { set(f.key, o); blur(f.key); }}
              className={`rounded-md border px-4 py-2.5 text-[13px] font-semibold transition ${
                v[f.key] === o
                  ? "border-[var(--c-primary)] bg-[var(--c-primary)] text-white"
                  : err
                  ? "border-rose-400 bg-rose-50/40 text-neutral-700"
                  : "border-[var(--c-line)] bg-white text-neutral-700 hover:border-[var(--c-primary)]"
              }`}
            >
              {o}
            </button>
          ))}
        </div>
      )}

      {f.type === "checkbox" && (
        <label className="flex cursor-pointer items-start gap-2.5">
          <input
            type="checkbox"
            checked={!!v[f.key]}
            onChange={(e) => { set(f.key, e.target.checked); blur(f.key); }}
            className="mt-0.5 h-5 w-5 shrink-0 accent-[var(--c-primary)]"
          />
          <span className="text-[13px] font-bold text-[var(--c-primary-dark)]">
            {f.label}
            <span className="ml-2 rounded bg-[var(--c-accent)] px-1.5 py-0.5 text-[10px] text-white">必須</span>
          </span>
        </label>
      )}

      {f.note && !err && <p className="mt-1 text-[11px] text-neutral-500">{f.note}</p>}
      {err && <p className="mt-1 flex items-center gap-1 text-[12px] font-semibold text-rose-600">⚠ {errors[f.key]}</p>}
    </div>
  );
}

/* ---------- 全ページ共通のCTA ---------- */
function ContactCta({ goTo, showIntent, openIntent }) {
  return (
    <div className="bg-[var(--c-primary-dark)]">
      <div className="mx-auto max-w-6xl px-4 py-12 sm:px-6 sm:py-16">
        <div className="text-center text-white">
          <h2 className="text-xl font-bold sm:text-2xl">まずは「これ、いくらくらい？」からで構いません</h2>
          <p className="mx-auto mt-3 max-w-2xl text-[13px] leading-relaxed text-white/80">
            ご相談・現地調査・お見積りはすべて無料です。金額の目安だけ知りたい、という段階でも遠慮なくご連絡ください。
            お電話であれば、その場でおおよその範囲をお答えできます。
          </p>
        </div>
        <div className="mx-auto mt-7 grid max-w-3xl gap-4 sm:grid-cols-2">
          <a href={`tel:${SITE.company.tel.replace(/-/g, "")}`} className="rounded-lg bg-white p-5 text-center transition hover:opacity-95">
            <p className="text-[11px] font-semibold text-neutral-500">お電話でのご相談</p>
            <p className="mt-1 text-2xl font-bold tracking-tight text-[var(--c-primary-dark)] sm:text-3xl">☎ {SITE.company.tel}</p>
            <p className="mt-1 text-[11px] text-neutral-500">{SITE.company.telLabel}</p>
          </a>
          <button onClick={() => goTo("contact")} className="rounded-lg bg-[var(--c-accent)] p-5 text-center text-white transition hover:opacity-95">
            <p className="text-[11px] font-semibold text-white/80">フォームでのご相談</p>
            <p className="mt-1 text-xl font-bold sm:text-2xl">無料相談・見積りを依頼</p>
            <p className="mt-1 text-[11px] text-white/80">24時間受付／1営業日以内に返信</p>
          </button>
        </div>
        <div className="mx-auto mt-4 max-w-3xl">
          <WhyBadge anchor="tel" show={showIntent} onOpen={openIntent}
            text="全ページの末尾に、電話とフォームを同じ大きさで並べています。どちらに寄せても片方の層を落とすためです。" />
        </div>
      </div>
    </div>
  );
}

function Footer({ goTo }) {
  return (
    <footer className="border-t border-[var(--c-line)] bg-[var(--c-tint)]">
      <div className="mx-auto grid max-w-6xl gap-8 px-4 py-12 sm:px-6 lg:grid-cols-3">
        <div>
          <p className="text-[17px] font-bold text-[var(--c-primary-dark)]">{SITE.company.name}</p>
          <p className="mt-1 text-[10px] tracking-[0.2em] text-neutral-500">{SITE.company.nameEn}</p>
          <p className="mt-3 text-[12px] leading-relaxed text-neutral-600">
            {SITE.company.address}<br />
            {SITE.company.license}
          </p>
          <a href={`tel:${SITE.company.tel.replace(/-/g, "")}`} className="mt-3 block text-xl font-bold text-[var(--c-primary-dark)]">☎ {SITE.company.tel}</a>
          <p className="text-[11px] text-neutral-500">{SITE.company.telLabel}</p>
        </div>
        <div>
          <p className="text-[12px] font-bold text-[var(--c-primary-dark)]">対応エリア</p>
          <p className="mt-2 text-[13px] leading-relaxed text-neutral-700">{SITE.areas.primary.join("・")}</p>
          <p className="mt-1 text-[12px] text-neutral-600">近隣：{SITE.areas.secondary.join("・")}</p>
          <p className="mt-1.5 text-[11px] leading-relaxed text-neutral-500">{SITE.areas.note}</p>
        </div>
        <div>
          <p className="text-[12px] font-bold text-[var(--c-primary-dark)]">サイトマップ</p>
          <div className="mt-2 grid grid-cols-2 gap-y-1.5">
            {[
              ["home", "トップ"], ["works", "施工事例一覧"], ["work-detail", "施工事例の詳細"],
              ["reform", "リフォームのご案内"], ["company", "会社案内"], ["contact", "お問い合わせ"],
            ].map(([k, l]) => (
              <button key={k} onClick={() => goTo(k)} className="text-left text-[12px] text-neutral-600 hover:text-[var(--c-accent)]">{l}</button>
            ))}
          </div>
        </div>
      </div>
      <div className="border-t border-[var(--c-line)] py-4 text-center text-[11px] text-neutral-500">
        © {SITE.company.name} — このページは提案用のデモです。社名・実績・写真はすべて架空のものです。
      </div>
    </footer>
  );
}

/* スマホ用の固定CTA（電話 / フォームを常時表示） */
function MobileBar({ goTo }) {
  return (
    <div className="fixed inset-x-0 bottom-0 z-30 grid grid-cols-2 gap-px border-t border-[var(--c-line)] bg-[var(--c-line)] lg:hidden">
      <a href={`tel:${SITE.company.tel.replace(/-/g, "")}`} className="flex flex-col items-center justify-center bg-white py-2.5">
        <span className="text-[15px] font-bold text-[var(--c-primary-dark)]">☎ 電話で相談</span>
        <span className="text-[10px] text-neutral-500">{SITE.company.telLabel}</span>
      </a>
      <button onClick={() => goTo("contact")} className="flex flex-col items-center justify-center bg-[var(--c-accent)] py-2.5 text-white">
        <span className="text-[15px] font-bold">無料見積り</span>
        <span className="text-[10px] opacity-85">24時間受付</span>
      </button>
    </div>
  );
}

/* ================================================================== */
function App() {
  const [page, setPage] = useState("home");
  const [workId, setWorkId] = useState(SITE.workDetail.workId);
  const [prefill, setPrefill] = useState(null);
  const [showIntent, setShowIntent] = useState(false);
  const [focus, setFocus] = useState(null);

  const goTo = (p, id, pf) => {
    if (p === "work-detail") setWorkId(id || SITE.workDetail.workId);
    setPrefill(p === "contact" ? pf || null : null);
    setPage(p);
    window.scrollTo({ top: 0, behavior: "auto" });
  };

  const openIntent = (anchor) => {
    setFocus(anchor);
    setShowIntent(true);
  };

  return (
    <div className="min-h-screen pb-16 lg:pb-0">
      <ThemeVars />
      <Header page={page} goTo={goTo} showIntent={showIntent} setShowIntent={setShowIntent} openIntent={openIntent} />

      {page === "home" && <HomePage goTo={goTo} showIntent={showIntent} openIntent={openIntent} />}
      {page === "works" && <WorksPage goTo={goTo} showIntent={showIntent} openIntent={openIntent} />}
      {page === "work-detail" && <WorkDetailPage workId={workId} goTo={goTo} showIntent={showIntent} openIntent={openIntent} />}
      {page === "reform" && <ReformPage goTo={goTo} showIntent={showIntent} openIntent={openIntent} />}
      {page === "company" && <CompanyPage goTo={goTo} showIntent={showIntent} openIntent={openIntent} />}
      {page === "contact" && <ContactPage goTo={goTo} showIntent={showIntent} openIntent={openIntent} prefill={prefill} />}

      <Footer goTo={goTo} />
      <MobileBar goTo={goTo} />
      <IntentPanel open={showIntent} onClose={() => setShowIntent(false)} focus={focus} setFocus={setFocus} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
