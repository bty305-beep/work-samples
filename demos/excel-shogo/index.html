<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Excel突合の自動化 デモ | 銀行明細と帳簿を一致・不一致・要確認に分ける</title>
<meta name="description" content="銀行入金明細と売掛帳を突き合わせ、一致・不一致・要確認の3分類で出力するデモです。表記ゆれの正規化ルールを画面上で切り替えると、要確認の件数が変わる様子を確認できます。掲載データはすべて架空です。">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root {
  --c-base:         #ffffff;
  --c-paper:        #f5f1e8;
  --c-ink:          #1b1c1e;
  --c-ink-2:        #4c4f54;
  --c-ink-3:        #7d8087;
  --c-rule:         #ddd7c8;
  --c-rule-strong:  #b3ab98;
  --c-accent:       #2d4257;
  --c-accent-tint:  #eef1f3;
  --c-caution:      #9c463b;
  --c-caution-tint: #f3e9e6;
  --font-mincho: "Hiragino Mincho ProN","Yu Mincho","YuMincho","MS PMincho","Noto Serif JP",serif;
  --font-gothic: "Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","YuGothic",Meiryo,"Noto Sans JP",sans-serif;
  --fs-note:  13px;  --fs-body: 15px;  --fs-sub: 18px;  --fs-head: 24px;  --fs-title: 33px;
  --lh-body: 1.9;  --lh-head: 1.45;  --ls-body: 0.04em;  --ls-head: 0.06em;
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 16px;  --sp-4: 32px;  --sp-5: 64px;
  --rule-1: 1px;  --rule-2: 2px;
}

html { -webkit-text-size-adjust: 100%; }

/* Tailwind の preflight は実行時に head の末尾へ挿入されるため、
   body と a はセレクタの詳細度を上げて上書きされないようにしています。 */
html body {
  margin: 0;
  background: var(--c-base);
  color: var(--c-ink);
  font-family: var(--font-gothic);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  letter-spacing: var(--ls-body);
  text-align: left;
}

*, *::before, *::after { border-radius: 0; box-shadow: none; }

body a {
  color: var(--c-accent);
  text-decoration: underline;
  text-underline-offset: 3px;
}

body a:hover { text-decoration-thickness: 2px; }

:focus-visible { outline: var(--rule-2) solid var(--c-accent); outline-offset: 2px; }

/* ------------------------------------------------------------------
   版面
------------------------------------------------------------------ */
.p-topbar { border-top: 3px solid var(--c-accent); }

.p-sheet {
  max-width: 1080px;
  margin: 0 auto;
  padding: 0 var(--sp-3);
}

.p-section { padding-top: var(--sp-5); }
.p-section:last-of-type { padding-bottom: var(--sp-5); }

/* ------------------------------------------------------------------
   ヘッダー
------------------------------------------------------------------ */
.p-masthead { padding-top: var(--sp-4); padding-bottom: var(--sp-4); }

.p-masthead__kicker {
  font-size: var(--fs-note);
  letter-spacing: var(--ls-head);
  color: var(--c-ink-3);
  margin: 0 0 var(--sp-2);
}

.p-masthead__title {
  font-family: var(--font-mincho);
  font-size: var(--fs-title);
  line-height: var(--lh-head);
  letter-spacing: var(--ls-head);
  font-weight: 600;
  color: var(--c-ink);
  margin: 0;
  padding-bottom: var(--sp-3);
  border-bottom: var(--rule-2) solid var(--c-accent);
}

.p-masthead__lead {
  margin: var(--sp-3) 0 0;
  max-width: 42em;
  color: var(--c-ink-2);
}

.p-masthead__meta {
  margin: var(--sp-3) 0 0;
  font-size: var(--fs-note);
  color: var(--c-ink-3);
}

/* ------------------------------------------------------------------
   注記帯
------------------------------------------------------------------ */
.p-notice {
  margin-top: var(--sp-4);
  background: var(--c-caution-tint);
  border-left: 3px solid var(--c-caution);
  padding: var(--sp-3);
}

.p-notice__title {
  margin: 0 0 var(--sp-1);
  font-size: var(--fs-note);
  font-weight: 700;
  letter-spacing: var(--ls-head);
  color: var(--c-caution);
}

.p-notice__body {
  margin: 0 0 var(--sp-2);
  font-size: var(--fs-note);
  line-height: 1.8;
  color: var(--c-ink-2);
}

.p-notice__body:last-child { margin-bottom: 0; }

/* ------------------------------------------------------------------
   節見出し
------------------------------------------------------------------ */
.p-heading {
  margin: 0 0 var(--sp-3);
  padding-bottom: var(--sp-2);
  border-bottom: var(--rule-2) solid var(--c-rule-strong);
}

.p-heading__no {
  display: block;
  font-size: var(--fs-note);
  letter-spacing: var(--ls-head);
  color: var(--c-accent);
  margin-bottom: var(--sp-1);
}

.p-heading__text {
  font-family: var(--font-mincho);
  font-size: var(--fs-head);
  line-height: var(--lh-head);
  letter-spacing: var(--ls-head);
  font-weight: 600;
  margin: 0;
}

.p-lead {
  margin: 0 0 var(--sp-3);
  max-width: 44em;
  color: var(--c-ink-2);
}

.p-note {
  margin: var(--sp-2) 0 0;
  font-size: var(--fs-note);
  line-height: 1.8;
  color: var(--c-ink-3);
}

.p-note--caution { color: var(--c-caution); }

/* ------------------------------------------------------------------
   2表の並置
------------------------------------------------------------------ */
.p-pair {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--sp-3);
}

.p-card {
  border-top: var(--rule-2) solid var(--c-accent);
  border-bottom: var(--rule-1) solid var(--c-rule-strong);
  min-width: 0;
}

.p-card__head { padding: var(--sp-2) 0; }

.p-card__title {
  font-family: var(--font-mincho);
  font-size: var(--fs-sub);
  line-height: var(--lh-head);
  letter-spacing: var(--ls-head);
  font-weight: 600;
  margin: 0;
}

.p-card__meta {
  margin: var(--sp-1) 0 0;
  font-size: var(--fs-note);
  line-height: 1.7;
  color: var(--c-ink-3);
}

/* ------------------------------------------------------------------
   表
------------------------------------------------------------------ */
.p-scroll {
  overflow-x: auto;
  border-top: var(--rule-1) solid var(--c-rule);
}

.p-table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--fs-note);
  line-height: 1.7;
}

.p-table--pair { min-width: 380px; }
.p-table--result { min-width: 1060px; }

.p-table th {
  background: var(--c-paper);
  border-bottom: var(--rule-1) solid var(--c-rule-strong);
  padding: var(--sp-2);
  text-align: left;
  font-weight: 700;
  letter-spacing: var(--ls-head);
  color: var(--c-ink-2);
  white-space: nowrap;
}

.p-table td {
  border-bottom: var(--rule-1) solid var(--c-rule);
  padding: var(--sp-2);
  vertical-align: top;
  color: var(--c-ink);
}

.p-table tr:last-child td { border-bottom: 0; }

.p-table__num {
  text-align: right;
  white-space: nowrap;
  font-feature-settings: "tnum" 1;
}

.p-table__id {
  color: var(--c-ink-3);
  white-space: nowrap;
  font-feature-settings: "tnum" 1;
}

.p-table__date { white-space: nowrap; font-feature-settings: "tnum" 1; }

.p-table__name { min-width: 11em; }

.p-table__reason { min-width: 22em; }

.p-table__none { color: var(--c-ink-3); }

.p-table tr.is-review td,
.p-table tr.is-diff td { background: var(--c-caution-tint); }

/* ------------------------------------------------------------------
   ルール切り替え
------------------------------------------------------------------ */
.p-rules {
  margin: 0;
  padding: 0;
  list-style: none;
  border-top: var(--rule-2) solid var(--c-rule-strong);
  border-bottom: var(--rule-2) solid var(--c-rule-strong);
}

.p-rule { border-bottom: var(--rule-1) solid var(--c-rule); }
.p-rule:last-child { border-bottom: 0; }

.p-rule__label {
  display: flex;
  align-items: flex-start;
  gap: var(--sp-2);
  padding: var(--sp-3) var(--sp-2);
  cursor: pointer;
}

.p-rule__label:hover { background: var(--c-accent-tint); }

.p-rule__box {
  flex: 0 0 auto;
  margin-top: 6px;
  width: 16px;
  height: 16px;
  accent-color: var(--c-accent);
}

.p-rule__body { flex: 1 1 auto; min-width: 0; }

.p-rule__name {
  display: block;
  font-weight: 700;
  line-height: var(--lh-head);
}

.p-rule__desc {
  display: block;
  margin-top: var(--sp-1);
  font-size: var(--fs-note);
  line-height: 1.8;
  color: var(--c-ink-2);
}

.p-rule__ex {
  display: block;
  margin-top: var(--sp-1);
  font-size: var(--fs-note);
  color: var(--c-ink-3);
}

.p-rule__hit {
  flex: 0 0 auto;
  font-size: var(--fs-note);
  color: var(--c-accent);
  white-space: nowrap;
  padding-top: 2px;
}

/* 許容範囲 */
.p-fields {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-3);
  margin-top: var(--sp-3);
}

.p-field { flex: 1 1 240px; min-width: 0; }

.p-field__label {
  display: block;
  font-size: var(--fs-note);
  font-weight: 700;
  letter-spacing: var(--ls-head);
  color: var(--c-accent);
  margin-bottom: var(--sp-1);
}

.p-field__row { display: flex; align-items: center; gap: var(--sp-2); }

.p-field__input {
  flex: 1 1 auto;
  min-width: 0;
  font-family: var(--font-gothic);
  font-size: var(--fs-body);
  color: var(--c-ink);
  background: var(--c-base);
  border: var(--rule-1) solid var(--c-rule-strong);
  padding: var(--sp-2);
  text-align: right;
  font-feature-settings: "tnum" 1;
}

.p-field__unit { flex: 0 0 auto; font-size: var(--fs-note); color: var(--c-ink-2); }

.p-field__note {
  margin: var(--sp-1) 0 0;
  font-size: var(--fs-note);
  line-height: 1.8;
  color: var(--c-ink-3);
}

/* ------------------------------------------------------------------
   ボタン
------------------------------------------------------------------ */
.p-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--sp-2);
  margin-top: var(--sp-4);
}

.p-btn {
  font-family: var(--font-gothic);
  font-size: var(--fs-note);
  letter-spacing: var(--ls-body);
  color: var(--c-accent);
  background: var(--c-accent-tint);
  border: var(--rule-1) solid var(--c-rule-strong);
  padding: var(--sp-2) var(--sp-3);
  cursor: pointer;
}

.p-btn:hover { background: var(--c-base); }

.p-btn--primary {
  font-size: var(--fs-body);
  font-weight: 700;
  color: var(--c-base);
  background: var(--c-accent);
  border-color: var(--c-accent);
  padding: var(--sp-2) var(--sp-4);
}

.p-btn--primary:hover { background: var(--c-ink); border-color: var(--c-ink); }

.p-actions__note { font-size: var(--fs-note); color: var(--c-ink-3); }

/* ------------------------------------------------------------------
   集計タイル
------------------------------------------------------------------ */
.p-tiles {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--sp-3);
  margin-bottom: var(--sp-4);
}

.p-tile {
  border-top: var(--rule-2) solid var(--c-accent);
  border-bottom: var(--rule-1) solid var(--c-rule-strong);
  padding: var(--sp-2) 0 var(--sp-3);
}

.p-tile--caution { border-top-color: var(--c-caution); }

.p-tile__label {
  margin: 0 0 var(--sp-1);
  font-size: var(--fs-note);
  letter-spacing: var(--ls-head);
  color: var(--c-ink-2);
}

.p-tile__num {
  margin: 0;
  font-size: var(--fs-title);
  line-height: 1.25;
  font-weight: 700;
  color: var(--c-accent);
  font-feature-settings: "tnum" 1;
}

.p-tile--caution .p-tile__num { color: var(--c-caution); }

.p-tile__unit { font-size: var(--fs-sub); font-weight: 500; margin-left: 2px; }

.p-tile__sub {
  margin: var(--sp-1) 0 0;
  font-size: var(--fs-note);
  line-height: 1.7;
  color: var(--c-ink-2);
}

/* 分類の説明 */
.p-legend {
  margin: 0 0 var(--sp-4);
  padding: var(--sp-3);
  background: var(--c-paper);
  border-top: var(--rule-2) solid var(--c-rule-strong);
}

.p-legend dl { margin: 0; }

.p-legend dt {
  font-size: var(--fs-note);
  font-weight: 700;
  letter-spacing: var(--ls-head);
  color: var(--c-accent);
  margin-bottom: var(--sp-1);
}

.p-legend dd {
  margin: 0 0 var(--sp-2);
  font-size: var(--fs-note);
  line-height: 1.8;
  color: var(--c-ink-2);
}

.p-legend dd:last-of-type { margin-bottom: 0; }

/* ------------------------------------------------------------------
   絞り込み
------------------------------------------------------------------ */
.p-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-2);
  margin-bottom: var(--sp-3);
}

.p-tab {
  font-family: var(--font-gothic);
  font-size: var(--fs-note);
  color: var(--c-ink-2);
  background: var(--c-base);
  border: var(--rule-1) solid var(--c-rule-strong);
  padding: var(--sp-1) var(--sp-3);
  cursor: pointer;
}

.p-tab:hover { background: var(--c-accent-tint); }

.p-tab[aria-pressed="true"] {
  color: var(--c-base);
  background: var(--c-accent);
  border-color: var(--c-accent);
  font-weight: 700;
}

/* 分類ラベル */
.p-badge {
  display: inline-block;
  font-size: var(--fs-note);
  font-weight: 700;
  letter-spacing: var(--ls-head);
  padding: 1px var(--sp-2);
  border: var(--rule-1) solid var(--c-rule-strong);
  background: var(--c-accent-tint);
  color: var(--c-accent);
  white-space: nowrap;
}

.p-badge--caution {
  background: var(--c-caution-tint);
  color: var(--c-caution);
  border-color: var(--c-caution);
}

/* 理由 */
.p-reasons { margin: 0; padding: 0; list-style: none; }

.p-reasons li {
  padding-left: 12px;
  border-left: var(--rule-2) solid var(--c-rule-strong);
  margin-bottom: var(--sp-1);
  line-height: 1.7;
}

.p-reasons li:last-child { margin-bottom: 0; }
.p-reasons li.is-warn { border-left-color: var(--c-caution); color: var(--c-caution); }

.p-empty {
  padding: var(--sp-4) var(--sp-2);
  color: var(--c-ink-3);
  border-top: var(--rule-1) solid var(--c-rule);
  border-bottom: var(--rule-1) solid var(--c-rule);
}

/* ------------------------------------------------------------------
   手作業との比較
------------------------------------------------------------------ */
.p-calc {
  margin: var(--sp-4) 0 0;
  padding: 0;
  list-style: none;
  border-top: var(--rule-2) solid var(--c-rule-strong);
}

.p-calc li {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-2);
  align-items: baseline;
  padding: var(--sp-3) var(--sp-2);
  border-bottom: var(--rule-1) solid var(--c-rule);
}

.p-calc__label { flex: 1 1 16em; color: var(--c-ink-2); font-size: var(--fs-note); }

.p-calc__value {
  flex: 0 0 auto;
  font-size: var(--fs-sub);
  font-weight: 700;
  font-feature-settings: "tnum" 1;
}

.p-calc__value--caution { color: var(--c-caution); }
.p-calc__value--accent { color: var(--c-accent); }

.p-calc__detail { flex: 1 1 100%; font-size: var(--fs-note); color: var(--c-ink-3); }

/* ------------------------------------------------------------------
   納品物の説明
------------------------------------------------------------------ */
.p-def { margin: 0 0 var(--sp-4); }

.p-def__label {
  margin: 0 0 var(--sp-1);
  font-size: var(--fs-note);
  font-weight: 700;
  letter-spacing: var(--ls-head);
  color: var(--c-accent);
}

.p-def__body { margin: 0; color: var(--c-ink); max-width: 44em; }

.p-code {
  margin: var(--sp-3) 0 0;
  padding: var(--sp-3);
  background: var(--c-paper);
  border-left: 3px solid var(--c-rule-strong);
  font-family: "SFMono-Regular", Consolas, "Courier New", monospace;
  font-size: var(--fs-note);
  line-height: 1.8;
  color: var(--c-ink);
  overflow-x: auto;
  white-space: pre;
}

.p-colophon {
  margin-top: var(--sp-4);
  padding-top: var(--sp-3);
  border-top: var(--rule-2) solid var(--c-rule-strong);
  font-size: var(--fs-note);
  color: var(--c-ink-3);
}

.p-colophon p { margin: 0 0 var(--sp-1); }
.p-colophon p:last-child { margin-bottom: 0; }

/* ------------------------------------------------------------------
   スマートフォン
------------------------------------------------------------------ */
@media (max-width: 860px) {
  .p-pair { grid-template-columns: 1fr; gap: var(--sp-4); }
  .p-tiles { grid-template-columns: 1fr; gap: var(--sp-3); }
}

@media (max-width: 640px) {
  :root {
    --fs-title: 26px;
    --fs-head: 20px;
    --fs-sub: 17px;
    --sp-5: 48px;
  }

  .p-sheet { padding: 0 var(--sp-2); }
  .p-tile__num { font-size: 28px; }
  .p-btn--primary { width: 100%; text-align: center; }
}
</style>
</head>
<body>
<div id="root"></div>
<script>Babel.registerPreset("react-classic", { presets: [[Babel.availablePresets["react"], { runtime: "classic" }]] });</script>
<script type="text/babel" data-presets="react-classic">
const { useState, useMemo } = React;

/* ==================================================================
   突合の設定。ここを差し替えるだけで、別の突合業務に転用できます。

   例：
     ・請求書と入金明細（key = 請求先／振込依頼人）
     ・受注一覧と出荷一覧（key = 注文番号）
     ・在庫表と棚卸表（key = 商品コード、amount = 数量）

   画面のコードは列名を直接持っていません。すべて下の columns と
   keyField / dateField / amountField を見て組み立てています。
================================================================== */

const RECON_CONFIG = {
  jobName: "銀行入金明細と売掛帳の突合",
  period: "2026年8月",
  defaultYear: 2026,

  // 左の表（突合の起点にする側）
  left: {
    label: "銀行入金明細",
    source: "インターネットバンキングから書き出したCSV",
    keyField: "摘要",
    dateField: "日付",
    amountField: "金額",
    kindField: "区分",      // 突合の対象かどうかを判定する列（なければ null）
    kindTarget: "入金",     // この値でない行は、対象外として要確認に回します
    columns: [
      { key: "日付", label: "取引日", type: "date" },
      { key: "摘要", label: "摘要（振込依頼人）", type: "text" },
      { key: "区分", label: "区分", type: "text" },
      { key: "金額", label: "入出金額", type: "amount" },
    ],
  },

  // 右の表（突き合わせる相手）
  right: {
    label: "売掛帳（帳簿）",
    source: "会計ソフトから書き出したExcel",
    keyField: "取引先",
    dateField: "日付",
    amountField: "金額",
    kindField: null,
    kindTarget: null,
    columns: [
      { key: "日付", label: "計上日", type: "date" },
      { key: "取引先", label: "取引先", type: "text" },
      { key: "伝票番号", label: "伝票番号", type: "text" },
      { key: "金額", label: "金額", type: "amount" },
    ],
  },

  // 許容範囲。0 にすると、1円・1日の違いも不一致として拾います。
  tolerance: { amountYen: 0, dateDays: 0 },

  // 名寄せの候補として提示する一致度の下限（0〜1）。
  // これを超えても自動で一致にはせず、必ず人の確認に回します。
  similarThreshold: 0.68,

  // 手作業との比較の初期値
  manual: { rowsPerMonth: 300, secondsPerRow: 25, setupMinutes: 5 },
};

/* ------------------------------------------------------------------
   正規化ルール。画面のチェックボックスは、この配列から作っています。
   ルールを足すときは、ここに1件書けば画面にも反映されます。
------------------------------------------------------------------ */

const CORP_PATTERN = /株式会社|カブシキガイシャ|カブシキカイシャ|有限会社|ユウゲンガイシャ|合同会社|㈱|㈲|\(株\)|\(有\)|\(同\)|\(カ\)|\(ユ\)|カ\)|\(カ|ユ\)|\(ユ/g;

/* ==================================================================
   ここから下が突合の処理です。列名は設定から読むため、
   別の業務に差し替えても、この部分は書き換えません。
================================================================== */

// 取引先名の正規化。有効なルールだけを順に通します。
function normalizeName(raw, rules) {
  let s = String(raw == null ? "" : raw);
  NAME_RULES.forEach((r) => {
    if (rules[r.id]) s = r.apply(s);
  });
  return s.trim();
}

// 金額の読み取り。全角の数字は「全角と半角を同一視する」が有効なときだけ読めます。
function parseAmount(raw, rules) {
  let s = String(raw == null ? "" : raw);
  if (rules.width) s = s.normalize("NFKC");
  s = s.replace(/[,，\s　円¥￥]/g, "");
  if (s === "" || !/^-?\d+(\.\d+)?$/.test(s)) return null;
  return Number(s);
}

const pad2 = (n) => String(n).padStart(2, "0");

// 日付の読み取り。書式のゆれを吸収して、内部では同じ形にそろえます。
function parseDate(raw, defaultYear) {
  const s = String(raw == null ? "" : raw).normalize("NFKC").trim();
  let m;

  m = s.match(/^(\d{4})[/\-.年](\d{1,2})[/\-.月](\d{1,2})日?$/);
  if (m) return `${m[1]}-${pad2(m[2])}-${pad2(m[3])}`;

  m = s.match(/^(\d{4})(\d{2})(\d{2})$/);
  if (m) return `${m[1]}-${m[2]}-${m[3]}`;

  m = s.match(/^(?:令和|R)\s*(\d{1,2})[/\-.年](\d{1,2})[/\-.月](\d{1,2})日?$/i);
  if (m) return `${2018 + Number(m[1])}-${pad2(m[2])}-${pad2(m[3])}`;

  m = s.match(/^(\d{1,2})[/月](\d{1,2})日?$/);
  if (m) return `${defaultYear}-${pad2(m[1])}-${pad2(m[2])}`;

  return null;
}

const dayDiff = (a, b) => {
  if (!a || !b) return null;
  const t = (v) => { const p = v.split("-").map(Number); return Date.UTC(p[0], p[1] - 1, p[2]); };
  return Math.round((t(a) - t(b)) / 86400000);
};

const fmtDate = (iso) => {
  if (!iso) return "";
  const p = iso.split("-").map(Number);
  return `${p[0]}年${p[1]}月${p[2]}日`;
};

const yen = (n) => (n == null ? "—" : `${n.toLocaleString("ja-JP")}円`);

// 2文字ずつに切って重なりを見る、素朴な一致度（0〜1）です。
function similarity(a, b) {
  if (!a || !b) return 0;
  if (a === b) return 1;
  const grams = (s) => { const g = []; for (let i = 0; i < s.length - 1; i += 1) g.push(s.slice(i, i + 2)); return g; };
  const A = grams(a);
  const B = grams(b);
  if (!A.length || !B.length) return 0;
  const bag = new Map();
  A.forEach((g) => bag.set(g, (bag.get(g) || 0) + 1));
  let hit = 0;
  B.forEach((g) => {
    const c = bag.get(g) || 0;
    if (c > 0) { hit += 1; bag.set(g, c - 1); }
  });
  return (2 * hit) / (A.length + B.length);
}

// 表記ゆれを吸収するのに、どのルールが効いたかを調べます。
function rulesThatMattered(rawA, rawB, rules) {
  const hits = [];
  NAME_RULES.forEach((r) => {
    if (!rules[r.id]) return;
    const without = Object.assign({}, rules);
    without[r.id] = false;
    if (normalizeName(rawA, without) !== normalizeName(rawB, without)) hits.push(r.label);
  });
  return hits;
}

function prepare(row, side, rules) {
  const rawName = row[side.keyField];
  const rawDate = row[side.dateField];
  return {
    row,
    side,
    rawName,
    rawDate,
    key: normalizeName(rawName, rules),
    amount: parseAmount(row[side.amountField], rules),
    // 日付ルールを外しているときは、書式をそろえずに文字どおり比べます。
    date: rules.date ? parseDate(rawDate, RECON_CONFIG.defaultYear) : null,
    dateText: String(rawDate == null ? "" : rawDate).trim(),
    offTarget: side.kindField ? row[side.kindField] !== side.kindTarget : false,
  };
}

// 1組の候補について、一致・不一致・要確認を決めます。
function classifyPair(L, R, rules, tol) {
  const reasons = [];
  let status = "match";

  // 取引先
  if (L.rawName !== R.rawName) {
    const hits = rulesThatMattered(L.rawName, R.rawName, rules);
    reasons.push({
      tone: "info",
      text: `表記ゆれを正規化して名寄せしました（「${L.rawName}」と「${R.rawName}」）。${hits.length ? "効いたルール：" + hits.join("／") : ""}`,
    });
  }

  // 金額
  if (L.amount == null || R.amount == null) {
    status = "review";
    const side = L.amount == null ? RECON_CONFIG.left.label : RECON_CONFIG.right.label;
    reasons.push({
      tone: "warn",
      text: `${side}の金額を数値として読み取れません（全角の数字などが入っています）。金額を比べられないため、人の確認に回します。`,
    });
  } else {
    // 全角の数字を読み取ったときは、そのことを理由に残します。
    [[L, RECON_CONFIG.left], [R, RECON_CONFIG.right]].forEach((pair) => {
      const item = pair[0];
      const side = pair[1];
      const raw = item.row[side.amountField];
      if (parseAmount(raw, { width: false }) === null) {
        reasons.push({
          tone: "info",
          text: `${side.label}の金額が全角で入っていましたが、数値として読み取りました（「${raw}」→ ${yen(item.amount)}）。`,
        });
      }
    });

    const diff = L.amount - R.amount;
    if (Math.abs(diff) > tol.amountYen) {
      status = "diff";
      reasons.push({
        tone: "warn",
        text: `金額が違います。${RECON_CONFIG.left.label} ${yen(L.amount)}／${RECON_CONFIG.right.label} ${yen(R.amount)}　差額 ${yen(Math.abs(diff))}`,
      });
    } else if (diff !== 0) {
      reasons.push({ tone: "info", text: `金額の差 ${yen(Math.abs(diff))} は、許容差 ${yen(tol.amountYen)} の範囲内です。` });
    }
  }

  // 日付
  if (rules.date) {
    if (L.date && R.date) {
      const d = dayDiff(L.date, R.date);
      if (Math.abs(d) > tol.dateDays) {
        if (status !== "review") status = "diff";
        reasons.push({
          tone: "warn",
          text: `日付が${Math.abs(d)}日ずれています。${RECON_CONFIG.left.label} ${fmtDate(L.date)}／${RECON_CONFIG.right.label} ${fmtDate(R.date)}`,
        });
      } else {
        if (d !== 0) {
          reasons.push({ tone: "info", text: `日付の${Math.abs(d)}日のずれは、許容範囲内として一致にしています。` });
        }
        if (L.dateText !== R.dateText) {
          reasons.push({ tone: "info", text: `日付の書式の違いを吸収しました（「${L.dateText}」と「${R.dateText}」は同じ日です）。` });
        }
      }
    } else {
      status = "review";
      reasons.push({ tone: "warn", text: `日付を読み取れない書式です（「${L.dateText}」／「${R.dateText}」）。` });
    }
  } else if (L.dateText !== R.dateText) {
    if (status !== "review") status = "diff";
    reasons.push({
      tone: "warn",
      text: `日付が違います（「${L.dateText}」と「${R.dateText}」）。書式の違いだけかもしれませんが、「日付の書式の違いを吸収する」を外しているため、文字どおり比べています。`,
    });
  }

  // 対象外の行
  if (L.offTarget) {
    status = "review";
    reasons.push({
      tone: "warn",
      text: `${RECON_CONFIG.left.label}の区分が「${L.row[RECON_CONFIG.left.kindField]}」です。消し込みの対象かどうかを確認してください。`,
    });
  }

  if (status === "match") {
    reasons.unshift({ tone: "info", text: "取引先・日付・金額が、決めたルールの範囲で一致しました。" });
  }

  return { status, reasons };
}

/* ------------------------------------------------------------------
   突合の本体。
   ① 正規化した取引先名が同じ行どうしを突き合わせる
   ② 残った行は、名称の近い相手を候補として出す（自動一致にはしない）
   ③ それでも残った行は、片方にしかない行として要確認に回す
------------------------------------------------------------------ */
function reconcile(rules, tol) {
  const L = LEFT_ROWS.map((r) => prepare(r, RECON_CONFIG.left, rules));
  const R = RIGHT_ROWS.map((r) => prepare(r, RECON_CONFIG.right, rules));

  const byKey = new Map();
  R.forEach((r, i) => {
    if (!byKey.has(r.key)) byKey.set(r.key, []);
    byKey.get(r.key).push(i);
  });
  const leftKeys = new Set(L.map((l) => l.key));

  const usedRight = new Set();
  const results = [];
  const pending = [];

  // ① 同じ取引先どうしを突き合わせる
  L.forEach((l) => {
    const candidates = (byKey.get(l.key) || []).filter((i) => !usedRight.has(i));
    if (!candidates.length) { pending.push(l); return; }

    // 候補が複数あるときは、金額と日付がもっとも近い行を選びます。
    let best = candidates[0];
    let bestScore = Infinity;
    candidates.forEach((i) => {
      const r = R[i];
      const amountGap = (l.amount == null || r.amount == null) ? 1e9 : Math.abs(l.amount - r.amount);
      const dateGap = (rules.date && l.date && r.date)
        ? Math.abs(dayDiff(l.date, r.date))
        : (l.dateText === r.dateText ? 0 : 30);
      const score = amountGap + dateGap * 1000;
      if (score < bestScore) { bestScore = score; best = i; }
    });

    usedRight.add(best);
    const verdict = classifyPair(l, R[best], rules, tol);
    if (candidates.length > 1) {
      verdict.reasons.push({
        tone: "info",
        text: `同じ取引先の候補が${candidates.length}件ありました。金額と日付がもっとも近い行を対応づけています。`,
      });
    }
    results.push({ id: l.row.id, left: l, right: R[best], status: verdict.status, reasons: verdict.reasons });
  });

  // ② 残った行に、名称の近い相手がいないかを見る
  const leftovers = [];
  pending.forEach((l) => {
    let best = -1;
    let bestSim = 0;
    R.forEach((r, i) => {
      if (usedRight.has(i)) return;
      const sim = similarity(l.key, r.key);
      if (sim > bestSim) { bestSim = sim; best = i; }
    });

    if (best >= 0 && bestSim >= RECON_CONFIG.similarThreshold) {
      usedRight.add(best);
      const r = R[best];
      const reasons = [{
        tone: "warn",
        text: `取引先名の近い行があります（「${l.rawName}」と「${r.rawName}」／一致度 ${Math.round(bestSim * 100)}％）。別の会社の可能性があるため、自動では一致にしません。`,
      }];
      if (l.amount != null && r.amount != null && l.amount === r.amount) {
        reasons.push({ tone: "info", text: `金額は ${yen(l.amount)} で一致しています。` });
      }
      if (rules.date && l.date && r.date && dayDiff(l.date, r.date) === 0) {
        reasons.push({ tone: "info", text: `日付は ${fmtDate(l.date)} で一致しています。` });
      }
      results.push({ id: l.row.id, left: l, right: r, status: "review", reasons });
      return;
    }
    leftovers.push(l);
  });

  // ③ 片方にしかない行
  leftovers.forEach((l) => {
    const reasons = [];
    if ((byKey.get(l.key) || []).length > 0) {
      reasons.push({
        tone: "warn",
        text: `同じ取引先の行が${RECON_CONFIG.right.label}にありますが、すでに別の行と対応づけ済みです。どの行に対応するかは、機械では決められません。`,
      });
    } else {
      reasons.push({ tone: "warn", text: `${RECON_CONFIG.right.label}に対応する行が見つかりません。` });
    }
    if (l.offTarget) {
      reasons.push({
        tone: "info",
        text: `区分が「${l.row[RECON_CONFIG.left.kindField]}」の行です。手数料や引き落としなど、売掛の消し込み対象ではない可能性があります。`,
      });
    }
    results.push({ id: l.row.id, left: l, right: null, status: "review", reasons });
  });

  R.forEach((r, i) => {
    if (usedRight.has(i)) return;
    const reasons = [];
    if (leftKeys.has(r.key)) {
      reasons.push({
        tone: "warn",
        text: `同じ取引先の行が${RECON_CONFIG.left.label}にありますが、すでに別の行と対応づけ済みです。同じ金額の取引が重複しているため、どちらに対応するかは機械では決められません。`,
      });
    } else {
      reasons.push({
        tone: "warn",
        text: `${RECON_CONFIG.left.label}に対応する行が見つかりません。入金がまだない、または現金で回収した可能性があります。`,
      });
    }
    results.push({ id: r.row.id, left: null, right: r, status: "review", reasons });
  });

  const counts = { match: 0, diff: 0, review: 0 };
  results.forEach((x) => { counts[x.status] += 1; });

  return { rows: results, counts, total: results.length };
}

const minutesText = (sec) => {
  const m = Math.round(sec / 60);
  if (m < 60) return `${m}分`;
  return `${Math.floor(m / 60)}時間${m % 60}分`;
};

            </div>
          </div>

          <ul className="p-calc">
            <li>
              <span className="p-calc__label">いまのやり方（全件を目で見る）</span>
              <span className="p-calc__value">{minutesText(manualSec)}</span>
              <span className="p-calc__detail">
                {rowsPerMonth.toLocaleString("ja-JP")}件 × {secondsPerRow}秒
              </span>
            </li>
            <li>
              <span className="p-calc__label">自動化した場合（不一致・要確認だけ目で見る）</span>
              <span className="p-calc__value p-calc__value--caution">{minutesText(autoSec)}</span>
              <span className="p-calc__detail">
                {humanRows.toLocaleString("ja-JP")}件（全体の{Math.round(humanRate * 100)}％）× {secondsPerRow}秒
                　＋　スクリプトの実行と結果の確認 {RECON_CONFIG.manual.setupMinutes}分
              </span>
            </li>
            <li>
              <span className="p-calc__label">1か月あたりの削減時間</span>
              <span className="p-calc__value p-calc__value--accent">{minutesText(savedSec)}</span>
              <span className="p-calc__detail">削減率 {savedRate}％</span>
            </li>
            <li>
              <span className="p-calc__label">年間に換算した削減時間</span>
              <span className="p-calc__value p-calc__value--accent">{minutesText(savedSec * 12)}</span>
              <span className="p-calc__detail">同じ件数が12か月続いた場合</span>
            </li>
          </ul>

          <p className="p-note p-note--caution">
            ここに出る数字は、すべて想定値です。実際の削減時間は、データの崩れ方と確認の丁寧さによって変わります。
            {hasRun ? "" : "「人が見る行の割合」は、上で突合を実行すると実際の結果に置き換わります。"}
          </p>
        </section>

        {/* ---------------- 五 実際にお渡しするもの ---------------- */}
        <section className="p-section">
          <div className="p-heading">
            <span className="p-heading__no">五</span>
            <h2 className="p-heading__text">実際にお渡しするもの</h2>
          </div>

          <div className="p-def">
            <p className="p-def__label">納品物</p>
            <p className="p-def__body">
              お手元のExcelファイル2つを読み込み、この画面と同じ処理を行うPythonスクリプトです。
              結果は「一致」「不一致」「要確認」のシートに分かれたExcelファイルとして書き出します。
              元のファイルは書き換えません。実行はコマンド1行、またはダブルクリックで動く形にします。
            </p>
          </div>

          <div className="p-def">
            <p className="p-def__label">突合ルールの持ち方</p>
            <p className="p-def__body">
              この画面で切り替えたルールは、納品物では設定ファイルに入ります。
              列名や許容範囲が変わっても、設定ファイルを直すだけで済みます。プログラムは触りません。
            </p>
            <p className="p-code">{`{
  "left":  { "path": "銀行明細.xlsx", "key": "摘要",   "date": "日付", "amount": "金額" },
  "right": { "path": "売掛帳.xlsx",   "key": "取引先", "date": "日付", "amount": "金額" },
  "rules": { "space": true, "width": true, "corp": true, "symbol": true, "date": true },
  "tolerance": { "amount_yen": 0, "date_days": 0 },
  "output": "突合結果_2026-08.xlsx"
}`}</p>
          </div>

          <div className="p-def">
            <p className="p-def__label">他の突合にも使えます</p>
            <p className="p-def__body">
              この画面のプログラムは、列名を直接持っていません。冒頭の設定を差し替えるだけで、
              請求書と入金明細、受注一覧と出荷一覧、在庫表と棚卸表といった突合にもそのまま使えます。
              合わせるものが変わっても、やっていることは同じです。
            </p>
          </div>

          <div className="p-def">
            <p className="p-def__label">この画面と納品物の違い</p>
            <p className="p-def__body">
              この画面はブラウザの中だけで動いており、Excelファイルの読み書きはしていません。
              サンプルデータを埋め込んで、処理の結果だけをお見せしています。
              ページを開き直すと最初の状態に戻ります（ブラウザへの保存は行っていません）。
            </p>
          </div>

          <div className="p-colophon">
            <p>掲載しているデータは、すべてデモ用の架空のものです。実在する企業・取引とは関係ありません。</p>
            <p>
              同じ処理のPythonスクリプトとサンプル出力は
              <a href="https://github.com/bty305-beep/work-samples/tree/main/excel-kit">Excel業務の自動化キット</a>
              に置いています。
            </p>
            <p>
              ほかのサンプルは
              <a href="../../">業務の悩み 索引</a>
              から見られます。
            </p>
          </div>
        </section>
      </div>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
