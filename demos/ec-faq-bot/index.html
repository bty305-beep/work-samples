const pct = (n) => `${(n * 100).toFixed(1)}%`;
const pctShort = (n) => `${Math.round(n * 100)}%`;

/* 現在の集計。BASELINE にデモ操作分を加算します。 */
function useStats(live) {
  return useMemo(() => {
    const total = BASELINE.total + live.total;
    const faq = BASELINE.faq + live.faq;
    const ai = BASELINE.ai + live.ai;
    const human = total - faq - ai;
    const rate = total > 0 ? (faq + ai) / total : 0;
    return {
      total, faq, ai, human, rate,
      faqShare: faq / total,
      aiShare: ai / total,
      humanShare: human / total,
      withDraft: BASELINE.humanWithDraft,
      inTarget: rate >= TARGET.min && rate <= TARGET.max,
    };
  }, [live]);
}

function CustomerChat({ stats, onResolve, onEscalate }) {
  const [stage, setStage] = useState("faq");     // faq | ai | escalate | closed
  const [log, setLog] = useState([{ from: "bot", text: BRAND.greeting }]);
  const [options, setOptions] = useState(FAQ_TREE);
  const [trail, setTrail] = useState([]);        // 選択済みのラベル
  const [pending, setPending] = useState(null);  // 回答表示後の「解決した？」
  const [input, setInput] = useState("");
  const [aiFails, setAiFails] = useState(0);
  const scroller = useRef(null);

  useEffect(() => {
    if (scroller.current) scroller.current.scrollTop = scroller.current.scrollHeight;
  }, [log, stage, pending]);

  const say = (from, text, extra) => setLog((p) => [...p, { from, text, ...extra }]);

  const reset = () => {
    setStage("faq");
    setLog([{ from: "bot", text: BRAND.greeting }]);
    setOptions(FAQ_TREE);
    setTrail([]);
    setPending(null);
    setInput("");
    setAiFails(0);
  };

  const chooseFaq = (node) => {
    say("user", node.label);
    setTrail((p) => [...p, node.label]);
    if (node.children) {
      say("bot", "詳しい内容をお選びください。");
      setOptions(node.children);
    } else {
      say("bot", node.answer, { answered: true });
      setOptions([]);
      setPending("faq");
    }
  };

  const faqSolved = () => {
    say("user", "解決しました");
    say("bot", "お役に立てて何よりです。ほかにご不明な点がありましたら、いつでもお声がけください。", { closing: true });
    setPending(null);
    setStage("closed");
    onResolve("faq");
  };

  const toAi = () => {
    say("user", "解決しませんでした");
    say(
      "bot",
      "承知しました。AIアシスタントが対応いたします。\nお困りの内容を、そのままの言葉でご記入ください。注文番号や商品名を添えていただけると、より正確にお答えできます。",
      { system: true }
    );
    setPending(null);
    setOptions([]);
    setStage("ai");
  };

  const askAi = (text) => {
    const q = text.trim();
    if (!q) return;
    say("user", q);
    setInput("");

    const scored = AI_RESPONSES.map((r) => ({
      r,
      hits: r.keywords.filter((k) => q.includes(k)).length,
    })).sort((a, b) => b.hits - a.hits);

    const best = scored[0];
    if (best && best.hits > 0) {
      say("bot", best.r.reply, { ai: true });
      setPending("ai");
    } else {
      say("bot", AI_FALLBACK, { ai: true });
      setPending("ai");
    }
  };

  const aiSolved = () => {
    say("user", "解決しました");
    say("bot", "ありがとうございます。またお困りの際はいつでもご相談ください。", { closing: true });
    setPending(null);
    setStage("closed");
    onResolve("ai");
  };

  const aiFailed = () => {
    say("user", "まだ解決していません");
    const n = aiFails + 1;
    setAiFails(n);
    setPending(null);
    if (n >= ESCALATE_AFTER) {
      say("bot", "お手数をおかけしております。担当者が直接確認いたしますので、以下をご記入ください。", { system: true });
      setStage("escalate");
    } else {
      say("bot", "失礼いたしました。別の言い方でもう一度お聞かせいただけますか。\nこのまま担当者におつなぎすることもできます。", { system: true });
    }
  };

  const submitEscalation = (payload) => {
    onEscalate(payload);
    say("user", `${SOURCES[payload.source].label} での連絡を希望`);
    say(
      "bot",
      `受付番号 SUP-2026-${String(Math.floor(1000 + trail.length * 7 + payload.body.length % 900)).slice(0, 4)} で承りました。\n担当者が確認のうえ、${ESCALATION_FORM.intro}\n\n${BRAND.hours}`,
      { closing: true }
    );
    setStage("closed");
  };

  return (
    <div className="grid gap-5 lg:grid-cols-[1fr_240px]">
      {/* チャット本体 */}
      <div className="overflow-hidden rounded-xl border border-stone-300 bg-white shadow-sm">
        <div className="flex items-center gap-3 border-b border-stone-200 bg-stone-50 px-4 py-3">
          <span className="flex h-8 w-8 items-center justify-center rounded-full bg-teal-700 text-xs font-bold text-white">
            CS
          </span>
          <div className="leading-tight">
            <p className="text-sm font-semibold text-stone-800">{BRAND.name} {BRAND.supportName}</p>
            <p className="text-[11px] text-stone-500">{BRAND.hours}</p>
          </div>
          <span
            className={`ml-auto rounded-full px-2 py-0.5 text-[11px] ring-1 ${
              stage === "faq"
                ? "bg-teal-50 text-teal-700 ring-teal-200"
                : stage === "ai"
                ? "bg-sky-50 text-sky-700 ring-sky-200"
                : stage === "escalate"
                ? "bg-amber-50 text-amber-700 ring-amber-200"
                : "bg-stone-100 text-stone-500 ring-stone-300"
            }`}
          >
            {stage === "faq" ? "選択式FAQ" : stage === "ai" ? "AI BOT 応対中" : stage === "escalate" ? "有人対応へ" : "対応完了"}
          </span>
        </div>

        <div ref={scroller} className="h-[26rem] space-y-3 overflow-y-auto bg-stone-50/60 px-4 py-4 sm:h-[30rem]">
          {log.map((m, i) => (
            <Bubble key={i} m={m} />
          ))}

          {stage === "escalate" && <EscalationForm onSubmit={submitEscalation} />}
        </div>

        {/* 操作エリア */}
        <div className="border-t border-stone-200 bg-white px-4 py-3">
          {pending && (
            <div className="flex flex-wrap gap-2">
              <button
                onClick={pending === "faq" ? faqSolved : aiSolved}
                className="rounded-md bg-teal-700 px-4 py-2 text-sm font-medium text-white hover:bg-teal-800"
              >
                解決しました
              </button>
              <button
                onClick={pending === "faq" ? toAi : aiFailed}
                className="rounded-md border border-stone-300 px-4 py-2 text-sm text-stone-700 hover:bg-stone-100"
              >
                {pending === "faq" ? "解決しなかった" : "まだ解決していません"}
              </button>
            </div>
          )}

          {!pending && stage === "faq" && options.length > 0 && (
            <div className="flex flex-wrap gap-2">
              {options.map((o) => (
                <button
                  key={o.id}
                  onClick={() => chooseFaq(o)}
                  className="rounded-md border border-teal-200 bg-teal-50 px-3 py-2 text-left text-sm text-teal-900 hover:border-teal-400 hover:bg-teal-100"
                >
                  {o.label}
                  {o.children && <span className="ml-1 text-teal-500">›</span>}
                </button>
              ))}
              {trail.length > 0 && (
                <button onClick={reset} className="rounded-md px-3 py-2 text-sm text-stone-500 underline underline-offset-4 hover:text-stone-700">
                  最初から選び直す
                </button>
              )}
            </div>
          )}

          {!pending && stage === "ai" && (
            <div className="space-y-2">
              <div className="flex gap-2">
                <input
                  value={input}
                  onChange={(e) => setInput(e.target.value)}
                  onKeyDown={(e) => { if (e.key === "Enter") askAi(input); }}
                  placeholder="お困りの内容をご記入ください"
                  className="flex-1 rounded-md border border-stone-300 px-3 py-2 text-sm outline-none focus:border-teal-500"
                />
                <button
                  onClick={() => askAi(input)}
                  className="rounded-md bg-teal-700 px-4 py-2 text-sm font-medium text-white hover:bg-teal-800"
                >
                  送信
                </button>
              </div>
              <div className="flex flex-wrap gap-1.5">
                {AI_SUGGESTIONS.map((s) => (
                  <button
                    key={s}
                    onClick={() => askAi(s)}
                    className="rounded-full border border-stone-300 px-2.5 py-1 text-[11px] text-stone-600 hover:border-teal-400 hover:text-teal-800"
                  >
                    {s}
                  </button>
                ))}
                <button
                  onClick={() => { say("user", "担当者につないでほしい"); setStage("escalate"); }}
                  className="rounded-full border border-amber-300 bg-amber-50 px-2.5 py-1 text-[11px] text-amber-800 hover:bg-amber-100"
                >
                  担当者につなぐ
                </button>
              </div>
            </div>
          )}

          {stage === "closed" && (
            <button
              onClick={reset}
              className="rounded-md border border-stone-300 px-4 py-2 text-sm text-stone-700 hover:bg-stone-100"
            >
              最初からやり直す
            </button>
          )}

          {stage === "escalate" && (
            <p className="text-xs text-stone-500">上のフォームにご記入のうえ、送信してください。</p>
          )}
        </div>
      </div>

      {/* 端に小さく：どの段階までで何割が解決するか */}
      <StageRail stage={stage} stats={stats} />
    </div>
  );
}

function Bubble({ m }) {
  if (m.from === "user") {
    return (
      <div className="flex justify-end">
        <div className="max-w-[85%] whitespace-pre-wrap rounded-2xl rounded-br-sm bg-teal-700 px-3.5 py-2 text-sm text-white">
          {m.text}
        </div>
      </div>
    );
  }
  return (
    <div className="flex justify-start">
      <div
        className={`max-w-[88%] whitespace-pre-wrap rounded-2xl rounded-bl-sm border px-3.5 py-2 text-sm leading-relaxed ${
          m.closing
            ? "border-teal-200 bg-teal-50 text-teal-900"
            : m.system
            ? "border-stone-200 bg-stone-100 text-stone-600"
            : "border-stone-200 bg-white text-stone-800"
        }`}
      >
        {m.ai && (
          <span className="mb-1 block text-[10px] font-medium tracking-wide text-sky-600">AI BOT（サーバー側で生成）</span>
        )}
        {m.text}

}

function EscalationForm({ onSubmit }) {
  const [draft, setDraft] = useState({ name: "", contact: "", orderNo: "", body: "" });
  const [source, setSource] = useState("form");
  const [touched, setTouched] = useState(false);

  const missing = ESCALATION_FORM.fields.filter((f) => f.required && !String(draft[f.key]).trim());

  const submit = () => {
    setTouched(true);
    if (missing.length > 0) return;
    onSubmit({ ...draft, source });
  };

  return (
    <div className="rounded-xl border border-amber-300 bg-white p-4">
      <p className="mb-1 text-sm font-semibold text-stone-800">担当者へのお問い合わせ</p>
      <p className="mb-3 text-xs text-stone-500">{ESCALATION_FORM.intro}</p>

      <div className="space-y-3">
        {ESCALATION_FORM.fields.map((f) => {
          const bad = touched && f.required && !String(draft[f.key]).trim();
          const base = `w-full rounded-md border px-3 py-2 text-sm outline-none focus:border-teal-500 ${
            bad ? "border-rose-400" : "border-stone-300"
          }`;
          return (
            <div key={f.key}>
              <label className="mb-1 block text-xs text-stone-500">
                {f.label}
                {f.required && <span className="ml-1 text-rose-500">必須</span>}
              </label>
              {f.type === "textarea" ? (
                <textarea
                  rows={3}
                  value={draft[f.key]}
                  placeholder={f.placeholder}
                  onChange={(e) => setDraft((p) => ({ ...p, [f.key]: e.target.value }))}
                  className={base}
                />
              ) : (
                <input
                  value={draft[f.key]}
                  placeholder={f.placeholder}
                  onChange={(e) => setDraft((p) => ({ ...p, [f.key]: e.target.value }))}
                  className={base}
                />
              )}
              {bad && <p className="mt-1 text-xs text-rose-600">{f.label}をご記入ください。</p>}
            </div>
          );
        })}

        <div>
          <label className="mb-1 block text-xs text-stone-500">ご希望の連絡方法</label>
          <div className="flex flex-wrap gap-2">
            {Object.entries(SOURCES).map(([k, s]) => (
              <button
                key={k}
                onClick={() => setSource(k)}
                className={`rounded-md border px-3 py-1.5 text-xs ${
                  source === k ? "border-teal-600 bg-teal-50 text-teal-800" : "border-stone-300 text-stone-600 hover:bg-stone-50"
                }`}
              >
                {s.label}
              </button>
            ))}
          </div>
        </div>
      </div>

      <button
        onClick={submit}
        className="mt-4 w-full rounded-md bg-amber-600 px-4 py-2 text-sm font-medium text-white hover:bg-amber-700"
      >
        この内容で担当者に送信する
      </button>
      <p className="mt-2 text-[11px] leading-relaxed text-stone-500">
        送信すると、運営側の一元管理画面に「人間対応必要」として追加されます。上部のタブから確認できます。
      </p>
    </div>
  );
}

/* 画面の端に小さく出す、段階ごとの想定解決率 */
function StageRail({ stage, stats }) {
  const shares = { faq: stats.faqShare, ai: stats.aiShare, human: stats.humanShare };
  const active = stage === "faq" ? "faq" : stage === "ai" ? "ai" : stage === "escalate" ? "human" : null;
  let cum = 0;

  return (
    <aside className="lg:sticky lg:top-20 lg:self-start">
      <div className="rounded-xl border border-stone-300 bg-white p-3">
        <p className="mb-0.5 text-[11px] font-semibold text-stone-600">この段階までで解決する割合</p>
        <p className="mb-3 text-[10px] leading-relaxed text-stone-400">直近30日の実績にもとづく想定値</p>

        <ol className="space-y-2">
          {STAGE_DEFS.map((s) => {
            const share = shares[s.key];
            if (s.key !== "human") cum += share;
            const isActive = active === s.key;
            return (
              <li
                key={s.key}
                className={`rounded-lg border px-2.5 py-2 ${
                  isActive ? "border-teal-400 bg-teal-50" : "border-stone-200 bg-stone-50"
                }`}
              >
                <div className="flex items-baseline justify-between gap-2">
                  <span className={`text-[11px] font-medium ${isActive ? "text-teal-900" : "text-stone-600"}`}>
                    {s.label}
                  </span>
                  <span className={`text-sm font-bold tabular-nums ${s.key === "human" ? "text-stone-500" : "text-teal-700"}`}>
                    {pctShort(share)}
                  </span>
                </div>
                {s.key !== "human" ? (
                  <p className="mt-0.5 text-[10px] text-stone-400">累計 {pctShort(cum)} がここまでで完結</p>
                ) : (
                  <p className="mt-0.5 text-[10px] text-stone-400">ここに到達するのは全体の{pctShort(share)}</p>
                )}
                <p className="mt-1 text-[10px] leading-relaxed text-stone-500">{s.desc}</p>
              </li>
            );
          })}
        </ol>

        <div className="mt-3 rounded-lg bg-teal-900 px-2.5 py-2 text-center text-teal-50">
          <p className="text-[10px] text-teal-300">有人対応 削減率</p>
          <p className="text-xl font-bold tabular-nums">{pct(stats.rate)}</p>
          <p className="text-[10px] text-teal-300">目標 {pctShort(TARGET.min)}–{pctShort(TARGET.max)}</p>
        </div>
      </div>
    </aside>
  );
}

/* ==================================================================
   【2】運営側の一元管理画面
================================================================== */

function AdminConsole({ stats, inbox, setInbox }) {
  const [openId, setOpenId] = useState(null);
  const [filterStatus, setFilterStatus] = useState("all");
  const [filterSource, setFilterSource] = useState("all");

  const counts = useMemo(() => {
    const c = { all: inbox.length };
    Object.keys(STATUSES).forEach((k) => (c[k] = inbox.filter((r) => r.status === k).length));
    return c;
  }, [inbox]);

  const rows = useMemo(
    () =>
      inbox.filter(
        (r) =>
          (filterStatus === "all" || r.status === filterStatus) &&
          (filterSource === "all" || r.source === filterSource)
      ),
    [inbox, filterStatus, filterSource]
  );

  const update = (id, patch) =>
    setInbox((p) => p.map((r) => (r.id === id ? { ...r, ...patch } : r)));

  return (
    <div className="space-y-5">
      <KpiPanel stats={stats} />

      {/* 絞り込み */}
      <div className="flex flex-wrap items-center gap-x-4 gap-y-2 rounded-xl border border-stone-300 bg-white px-4 py-3">
        <span className="text-xs font-semibold text-stone-600">受信トレイ</span>

        <div className="flex flex-wrap gap-1.5">
          <FilterChip active={filterStatus === "all"} onClick={() => setFilterStatus("all")}>
            すべて <span className="tabular-nums">{counts.all}</span>
          </FilterChip>
          {STATUS_ORDER.map((k) => (
            <FilterChip key={k} active={filterStatus === k} onClick={() => setFilterStatus(k)} dot={STATUSES[k].dot}>
              {STATUSES[k].label} <span className="tabular-nums">{counts[k]}</span>
            </FilterChip>
          ))}
        </div>

        <div className="ml-auto flex flex-wrap items-center gap-1.5">
          <span className="text-[11px] text-stone-400">流入元</span>
          <FilterChip active={filterSource === "all"} onClick={() => setFilterSource("all")}>すべて</FilterChip>
          {Object.entries(SOURCES).map(([k, s]) => (
            <FilterChip key={k} active={filterSource === k} onClick={() => setFilterSource(k)}>
              {s.label}
            </FilterChip>
          ))}
        </div>
      </div>

      {/* 一覧 */}
      <div className="overflow-hidden rounded-xl border border-stone-300 bg-white">
        {rows.length === 0 && (
          <p className="px-4 py-10 text-center text-sm text-stone-400">該当する問い合わせはありません。</p>
        )}
        {rows.map((r) => (
          <InboxRow
            key={r.id}
            row={r}
            open={openId === r.id}
            onToggle={() => setOpenId(openId === r.id ? null : r.id)}
            onUpdate={(patch) => update(r.id, patch)}
          />
        ))}
      </div>

      <p className="text-xs leading-relaxed text-stone-500">
        LINE・Gmail・問い合わせフォームは、サーバー側で受信した時点で同じ形式に変換しているため、
        担当者はこの1画面だけを見れば足ります。返信もこの画面から、届いた経路にそのまま返します。
      </p>
    </div>
  );
}

function FilterChip({ active, onClick, children, dot }) {
  return (
    <button
      onClick={onClick}
      className={`inline-flex items-center gap-1.5 rounded-full border px-2.5 py-1 text-[11px] transition ${
        active ? "border-teal-600 bg-teal-700 text-white" : "border-stone-300 bg-white text-stone-600 hover:bg-stone-50"
      }`}
    >
      {dot && <span className={`h-1.5 w-1.5 rounded-full ${active ? "bg-white" : dot}`} />}
      {children}
    </button>
  );
}

/* 削減率パネル：どの段階で何件減るかを見せる中心 */

  return (
    <section className="overflow-hidden rounded-xl border border-teal-900/30 bg-teal-900 text-teal-50 shadow-sm">
      <div className="grid gap-6 p-5 lg:grid-cols-[1fr_260px]">
        {/* 左：内訳と段階ごとの減り方 */}
        <div>
          <div className="mb-4 flex flex-wrap items-end gap-x-8 gap-y-3">
            <Kpi label="総問い合わせ数" value={stats.total.toLocaleString()} unit="件" note="直近30日" />
            <Kpi label="FAQ BOTで解決" value={stats.faq.toLocaleString()} unit="件" note={pct(stats.faqShare)} tone="text-teal-200" />
            <Kpi label="AI BOTで解決" value={stats.ai.toLocaleString()} unit="件" note={pct(stats.aiShare)} tone="text-teal-200" />
            <Kpi
              label="有人対応"
              value={stats.human.toLocaleString()}
              unit="件"
              note={`${pct(stats.humanShare)}／うちAI下書きあり ${stats.withDraft.toLocaleString()}件`}
              tone="text-amber-200"
            />
          </div>

          {/* 積み上げバー */}
          <div className="relative mb-2">
            <div className="flex h-9 w-full overflow-hidden rounded-md bg-teal-950/50 text-[11px] font-medium">
              <div className="flex items-center justify-center bg-teal-500 text-teal-950" style={{ width: pct(stats.faqShare) }}>
                FAQ {stats.faq.toLocaleString()}
              </div>
              <div className="flex items-center justify-center bg-teal-300 text-teal-950" style={{ width: pct(stats.aiShare) }}>
                AI {stats.ai.toLocaleString()}
              </div>
              <div className="flex items-center justify-center bg-amber-300/90 text-amber-950" style={{ width: pct(stats.humanShare) }}>
                有人 {stats.human.toLocaleString()}
              </div>
            </div>
            {/* 目標帯 50〜70% */}
            <div
              className="pointer-events-none absolute inset-y-0 border-x-2 border-dashed border-white/70"
              style={{ left: pct(TARGET.min), width: pct(TARGET.max - TARGET.min) }}
            />
          </div>
          <div className="relative h-4 text-[10px] text-teal-300">
            <span className="absolute -translate-x-1/2" style={{ left: pct(TARGET.min) }}>{pctShort(TARGET.min)}</span>
            <span className="absolute -translate-x-1/2" style={{ left: pct(TARGET.max) }}>{pctShort(TARGET.max)}</span>
            <span className="absolute right-0">目標帯（点線の内側）</span>
          </div>

          {/* 段階ごとに何件減るか */}
          <div className="mt-4 flex flex-wrap items-center gap-2 text-xs">
            <Step value={`${stats.total.toLocaleString()}件`} caption="全問い合わせ" />
            <Drop text={`FAQ BOT で −${stats.faq.toLocaleString()}`} />
            <Step value={`${remaining.toLocaleString()}件`} caption="AI BOTへ" />
            <Drop text={`AI BOT で −${stats.ai.toLocaleString()}`} />
            <Step value={`${stats.human.toLocaleString()}件`} caption="有人対応" strong />
          </div>
        </div>

        {/* 右：削減率 */}
        <div className="flex flex-col justify-center rounded-lg bg-teal-950/60 p-4 text-center">
          <p className="text-xs text-teal-300">有人問い合わせ 削減率</p>
          <p className="my-1 text-5xl font-bold tabular-nums text-white">{pct(stats.rate)}</p>
          <p className="text-[11px] text-teal-300">
            （FAQ解決 {stats.faq.toLocaleString()} + AI解決 {stats.ai.toLocaleString()}）÷ {stats.total.toLocaleString()}
          </p>
          <p
            className={`mt-3 rounded-md px-2 py-1.5 text-[11px] font-medium ${
              stats.inTarget ? "bg-teal-500/20 text-teal-100" : "bg-amber-500/20 text-amber-100"
            }`}
          >
            {stats.inTarget
              ? `目標 ${pctShort(TARGET.min)}–${pctShort(TARGET.max)} を達成`
              : `目標 ${pctShort(TARGET.min)}–${pctShort(TARGET.max)} に対して未達`}
          </p>
          <p className="mt-2 text-[10px] leading-relaxed text-teal-400">
            AI下書きを使った{stats.withDraft.toLocaleString()}件は有人対応に数えています。下書きによる時短分は削減率に含めていません。
          </p>
        </div>
      </div>
    </section>
  );
}

function Kpi({ label, value, unit, note, tone }) {
  return (
    <div>
      <p className="text-[11px] text-teal-300">{label}</p>
      <p className={`text-2xl font-bold tabular-nums ${tone || "text-white"}`}>
        {value}
        <span className="ml-0.5 text-xs font-normal text-teal-300">{unit}</span>
      </p>
      {note && <p className="text-[10px] text-teal-400">{note}</p>}
    </div>
  );
}

function Step({ value, caption, strong }) {
  return (
    <span
      className={`rounded-md px-2.5 py-1.5 leading-tight ${
        strong ? "bg-amber-300/90 text-amber-950" : "bg-teal-950/50 text-teal-100"
      }`}
    >
      <span className="font-bold tabular-nums">{value}</span>
      <span className="ml-1.5 text-[10px] opacity-80">{caption}</span>
    </span>
  );
}

function Drop({ text }) {
  return (
    <span className="text-[11px] text-teal-300">
      <span className="mr-1">→</span>
      {text}
    </span>
  );
}

/* ------------------------------------------------------------------
   一覧の1行。AI下書きがある行は開くと編集・送信できます。
------------------------------------------------------------------ */
function InboxRow({ row, open, onToggle, onUpdate }) {
  const src = SOURCES[row.source];
  const st = STATUSES[row.status];
  const [text, setText] = useState(row.draft || "");
  const [sent, setSent] = useState(false);

  useEffect(() => setText(row.draft || ""), [row.draft]);

  const send = () => {
    onUpdate({ status: "done", draft: text, handledBy: "あなた" });
    setSent(true);
  };

  const makeDraft = () => onUpdate({ status: "ai_draft", draft: row.autoDraft || DRAFT_TEMPLATE(row) });

  return (
    <div className={`border-b border-stone-200 last:border-b-0 ${row.isNew ? "bg-amber-50/40" : ""}`}>
      <button onClick={onToggle} className="flex w-full items-center gap-3 px-4 py-3 text-left hover:bg-stone-50">
        <span className={`flex h-7 w-7 shrink-0 items-center justify-center rounded-md text-[11px] font-bold ${src.tone}`}>
          {src.short}
        </span>
        <span className="hidden w-28 shrink-0 text-[11px] text-stone-400 sm:block">{src.label}</span>

        <span className="min-w-0 flex-1">
          <span className="flex items-baseline gap-2">
            <span className="truncate text-sm font-medium text-stone-800">{row.subject}</span>
            {row.isNew && (
              <span className="shrink-0 rounded bg-amber-500 px-1.5 py-0.5 text-[10px] font-medium text-white">NEW</span>
            )}
          </span>
          <span className="mt-0.5 block truncate text-xs text-stone-500">
            {row.customer}／{row.body}
          </span>
        </span>

        <span className={`hidden shrink-0 rounded-full px-2 py-0.5 text-[11px] ring-1 md:inline ${st.chip}`}>
          {st.label}
        </span>
        <span className="hidden w-20 shrink-0 text-right text-[11px] text-stone-400 sm:block">{row.receivedAt}</span>
        <span className="shrink-0 text-stone-400">{open ? "▾" : "▸"}</span>
      </button>

      {open && (
        <div className="space-y-4 border-t border-stone-200 bg-stone-50 px-4 py-4">
          <div className="flex flex-wrap items-center gap-2 md:hidden">
            <span className={`rounded-full px-2 py-0.5 text-[11px] ring-1 ${st.chip}`}>{st.label}</span>
            <span className="text-[11px] text-stone-400">{row.receivedAt}</span>
          </div>

          <div className="rounded-lg border border-stone-200 bg-white p-3">
            <p className="mb-1 text-[11px] text-stone-400">
              {src.label} / {row.customer} / {row.receivedAt}
            </p>
            <p className="whitespace-pre-wrap text-sm leading-relaxed text-stone-700">{row.body}</p>
          </div>

          <p className="text-[11px] leading-relaxed text-stone-500">{st.hint}</p>

          {row.status === "human" && (
            <div className="space-y-3">
              <div className="rounded-lg border border-rose-200 bg-rose-50 p-3 text-xs leading-relaxed text-rose-800">
                <span className="font-semibold">自動返信を止めている理由：</span>
                {row.reason}
              </div>
              <button
                onClick={makeDraft}
                className="rounded-md bg-teal-700 px-4 py-2 text-sm font-medium text-white hover:bg-teal-800"
              >
                AI下書きを作成する
              </button>
              <p className="text-[11px] text-stone-500">
                下書きを作ると「AI下書きあり・要確認」に変わります。判断は人が行い、文面作成だけをAIが肩代わりします。
              </p>
            </div>
          )}

          {(row.status === "ai_draft" || row.status === "ai_resolved" || row.status === "done") && (
            <div className="space-y-2">
              <div className="flex items-center gap-2">
                <p className="text-xs font-semibold text-stone-600">
                  {row.status === "ai_draft" ? "AIが用意した返信文（編集できます）" : "送信済みの返信文"}
                </p>
                {row.status === "ai_draft" && (
                  <span className="rounded bg-sky-100 px-1.5 py-0.5 text-[10px] text-sky-700">サーバー側でAIが生成</span>
                )}
              </div>

              <textarea
                rows={8}
                value={text}
                readOnly={row.status !== "ai_draft"}
                onChange={(e) => setText(e.target.value)}
                className={`w-full rounded-lg border px-3 py-2 text-sm leading-relaxed outline-none ${
                  row.status === "ai_draft"
                    ? "border-stone-300 bg-white focus:border-teal-500"
                    : "border-stone-200 bg-stone-100 text-stone-500"
                }`}
              />

              {row.status === "ai_draft" && (
                <div className="flex flex-wrap items-center gap-2">
                  <button
                    onClick={send}
                    className="rounded-md bg-teal-700 px-4 py-2 text-sm font-medium text-white hover:bg-teal-800"
                  >
                    この内容で{src.label}に返信する
                  </button>
                  <button
                    onClick={() => onUpdate({ status: "human", reason: "担当者の判断で、AI下書きの利用を取りやめました。" })}
                    className="rounded-md border border-stone-300 px-4 py-2 text-sm text-stone-700 hover:bg-stone-100"
                  >
                    人間対応に戻す
                  </button>
                  <span className="text-[11px] text-stone-400">返信は届いた経路（{src.label}）にそのまま返します。</span>
                </div>
              )}

              {row.status === "done" && (
                <p className="text-[11px] text-stone-500">
                  対応者：{row.handledBy || "—"}{sent && " ／ 送信しました"}
                </p>
              )}

              {row.status === "ai_resolved" && (
                <p className="text-[11px] text-teal-700">
                  この問い合わせはAIが自動で返信し、人の手を介さずに完結しました。削減率に算入されています。
                </p>
              )}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
