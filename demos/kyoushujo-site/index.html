/* ---------- 写真プレースホルダ ---------- */
const PHOTO_TONES = [
  ["#8FB8D6", "#3E6E96"], ["#E2A98F", "#B4643E"], ["#93C6AE", "#41846A"],
  ["#B7A5D6", "#6E5698"], ["#E0C57F", "#B08E32"], ["#8FA8C8", "#43597A"],
];
function Photo({ label, tone = 0, className = "", round = "rounded-2xl", overlay = false }) {
  const [a, b] = PHOTO_TONES[tone % PHOTO_TONES.length];
  return (
    <div className={`relative overflow-hidden ${round} ${className}`}
         style={{ background: `linear-gradient(135deg, ${a} 0%, ${b} 100%)` }}>
      <div className="absolute inset-0 opacity-25"
           style={{ backgroundImage: "repeating-linear-gradient(45deg, rgba(255,255,255,.35) 0 1px, transparent 1px 9px)" }} />
      {overlay && <div className="absolute inset-0" style={{ background: "linear-gradient(180deg, rgba(0,0,0,.20) 0%, rgba(0,0,0,.62) 100%)" }} />}
      <div className="absolute inset-0 flex items-center justify-center p-3">
        <span className="text-[11px] md:text-xs text-white/85 font-medium text-center leading-relaxed">{label}</span>
      </div>
    </div>
  );
}

/* ---------- 読み手ラベル ---------- */
function Audience({ who }) {
  const isS = who === "student";
  return (
    <span className={`inline-flex items-center gap-1.5 text-[11px] font-bold px-2.5 py-1 rounded-full ${
      isS ? "bg-[var(--pri)]/10 text-[var(--pri)]" : "bg-[var(--ink)]/10 text-[var(--ink)]"}`}>
      <span className={`w-1.5 h-1.5 rounded-full ${isS ? "bg-[var(--pri)]" : "bg-[var(--ink)]"}`} />
      {isS ? "この区間は 学生ご本人 に向けて書いています" : "この区間は 保護者の方 に向けて書いています"}
    </span>
  );
}

function SectionHead({ eyebrow, title, lead, who, center = false, plan }) {
  return (
    <div className={`${center ? "text-center mx-auto max-w-2xl" : "max-w-3xl"} mb-8 md:mb-12`}>
      {who && <div className="mb-4"><Audience who={who} /></div>}
      <div className="text-[13px] font-bold text-[var(--pri)] tracking-widest mb-2">{eyebrow}</div>
      <h2 className={`text-2xl md:text-[34px] leading-tight text-[var(--ink)] ${plan.display}`}>{title}</h2>
      {lead && <p className="mt-4 text-[15px] leading-relaxed text-[var(--sub)]">{lead}</p>}
    </div>
  );
}

================================================================== */

  return (
    <div className="sticky top-0 z-50 bg-[#0F1115] text-white border-b border-white/10">
      <div className="max-w-6xl mx-auto px-4 py-2.5 flex items-center gap-3 flex-wrap">
        <span className="text-[11px] font-bold text-white/50 tracking-wider hidden sm:inline">TOPデザイン案</span>
        <div className="flex bg-white/10 rounded-full p-1 gap-1">
          {Object.values(PLANS).map((p) => (
            <button key={p.key} onClick={() => { setPlan(p.key); window.scrollTo({ top: 0 }); }}
              className={`px-3.5 py-1.5 rounded-full text-[13px] font-bold transition ${
                plan === p.key ? "bg-white text-[#0F1115]" : "text-white/70 hover:text-white"}`}>
              {p.label}｜{p.title}
            </button>
          ))}
        </div>
        <span className="text-[11px] text-white/45 hidden md:inline">{PLANS[plan].aim}</span>
        <button onClick={() => setShowIntent(!showIntent)}
          className="ml-auto text-[12px] font-bold px-3 py-1.5 rounded-full border border-white/25 hover:bg-white/10 transition">
          {showIntent ? "設計意図をとじる" : "設計意図をひらく"}

      </div>

  );
}

                  これはデモのため、送信は行われません。実装時は自動返信メールと管理者通知を設定します。
                </p>
                <button onClick={() => setDone(false)} className="mt-5 text-[13px] font-bold text-[var(--pri)] underline">入力画面に戻る</button>
              </div>
            ) : (
              <form onSubmit={submit} className="space-y-4">
                <div className="grid sm:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-[12px] font-bold text-[var(--ink)] mb-1.5">お名前 <span className="text-[#D93838]">必須</span></label>
                    <input className={inputCls("name")} value={f.name} onChange={(e) => set("name", e.target.value)} placeholder="緑川 大地" />
                    {err.name && <p className="text-[11px] text-[#D93838] mt-1">{err.name}</p>}
                  </div>
                  <div>
                    <label className="block text-[12px] font-bold text-[var(--ink)] mb-1.5">ご記入者</label>
                    <select className={inputCls("rel")} value={f.rel} onChange={(e) => set("rel", e.target.value)}>
                      {["本人（学生）", "本人（一般）", "保護者"].map((o) => <option key={o}>{o}</option>)}
                    </select>
                  </div>
                </div>

                <div className="grid sm:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-[12px] font-bold text-[var(--ink)] mb-1.5">ご希望のコース</label>
                    <select className={inputCls("course")} value={f.course} onChange={(e) => set("course", e.target.value)}>
                      {SITE.courses.map((c) => <option key={c.id}>{c.name}</option>)}
                      <option>まだ決めていない</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-[12px] font-bold text-[var(--ink)] mb-1.5">ご相談の内容</label>
                    <select className={inputCls("reason")} value={f.reason} onChange={(e) => set("reason", e.target.value)}>
                      {SITE.contactReasons.map((o) => <option key={o}>{o}</option>)}
                    </select>
                  </div>
                </div>

                <div className="grid sm:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-[12px] font-bold text-[var(--ink)] mb-1.5">電話番号</label>
                    <input className={inputCls("tel")} value={f.tel} onChange={(e) => set("tel", e.target.value)} placeholder="090-0000-0000" inputMode="tel" />
                    {err.tel && err.tel !== " " && <p className="text-[11px] text-[#D93838] mt-1">{err.tel}</p>}
                  </div>
                  <div>
                    <label className="block text-[12px] font-bold text-[var(--ink)] mb-1.5">メールアドレス</label>
                    <input className={inputCls("email")} value={f.email} onChange={(e) => set("email", e.target.value)} placeholder="example@mail.com" inputMode="email" />
                    {err.email && err.email !== " " && <p className="text-[11px] text-[#D93838] mt-1">{err.email}</p>}
                  </div>
                </div>
                <p className="text-[11px] text-[var(--sub)] -mt-1">電話・メールのどちらか一方のご入力で送信できます。</p>

                <div>
                  <label className="block text-[12px] font-bold text-[var(--ink)] mb-1.5">ご連絡しやすい時間帯</label>
                  <div className="flex flex-wrap gap-2">
                    {["指定なし", "午前", "午後", "17時以降", "メールのみ希望"].map((o) => (
                      <button type="button" key={o} onClick={() => set("when", o)}
                        className={`px-3.5 py-2 ${p.roundSm} text-[13px] font-bold border transition ${
                          f.when === o ? "border-[var(--pri)] bg-[var(--pri)] text-white" : "border-[var(--line)] text-[var(--sub)]"}`}>{o}</button>
                    ))}
                  </div>
                </div>

                <div>
                  <label className="block text-[12px] font-bold text-[var(--ink)] mb-1.5">ご質問・ご要望</label>
                  <textarea className={`${inputCls("body")} h-24 resize-none`} value={f.body} onChange={(e) => set("body", e.target.value)}
                    placeholder="例）高校3年の子の入校を検討しています。部活が11月まであるのですが、卒業までどのくらいかかりますか。" />
                </div>

                <label className="flex items-start gap-2.5 cursor-pointer">
                  <input type="checkbox" checked={f.agree} onChange={(e) => set("agree", e.target.checked)} className="mt-1 w-4 h-4 accent-[var(--pri)]" />
                  <span className="text-[12.5px] leading-relaxed text-[var(--sub)]">
                    個人情報の取り扱いに同意します。ご入力いただいた内容は、ご相談への回答以外には使用しません。
                    {err.agree && <span className="block text-[#D93838] font-bold mt-1">{err.agree}</span>}
                  </span>
                </label>

                <button type="submit" className={`w-full py-4 ${p.roundSm} bg-[var(--pri)] text-white font-bold text-[16px]`}>
                  入力内容を確認する
                </button>
                <p className="text-[11px] text-center text-[var(--sub)]">
                  ※ デモのため、送信内容はどこにも保存・送信されません（入力チェックのみ動作します）
                </p>
              </form>
            )}
          </div>
        </div>
      </div>
    </section>
  );
}

/* ==================================================================
   フッター / スマホ固定バー
================================================================== */
function Footer() {
  return (
    <footer className="bg-[var(--ink)] text-white pt-14 pb-28 md:pb-14">
      <div className="max-w-6xl mx-auto px-4">
        <div className="grid md:grid-cols-[1.2fr_1fr_1fr] gap-8">
          <div>
            <div className="flex items-center gap-2.5 mb-4">
              <div className="w-9 h-9 rounded flex items-center justify-center font-black text-white text-lg" style={{ background: "var(--pri)" }}>み</div>
              <div>
                <div className="font-bold">{SITE.school.name}</div>
                <div className="text-[10px] tracking-widest text-white/40">{SITE.school.nameEn}</div>
              </div>
            </div>
            <p className="text-[13px] text-white/60 leading-relaxed">
              {SITE.school.address}<br />{SITE.school.access}<br />{SITE.school.designated}
            </p>
          </div>
          <div>
            <div className="text-[12px] font-bold text-white/40 mb-3 tracking-wider">サイト内</div>
            <ul className="space-y-2 text-[13px] text-white/70">
              {["選ばれる理由", "コース一覧", "料金・支払い方法", "免許取得までの流れ", "よくある質問", "アクセス・送迎バス"].map((l) => <li key={l}>{l}</li>)}
            </ul>
          </div>
          <div>
            <div className="text-[12px] font-bold text-white/40 mb-3 tracking-wider">お問い合わせ</div>
            <a href={`tel:${SITE.school.tel.replace(/-/g, "")}`} className="text-[24px] font-black block leading-none">{SITE.school.tel}</a>
            <div className="text-[12px] text-white/50 mt-2">{SITE.school.telHours}</div>
          </div>
        </div>
        <div className="mt-10 pt-6 border-t border-white/10 text-[11px] text-white/35 leading-relaxed">
          校名・料金・実績・写真はすべて架空のものです。写真は色付きの枠で代用しています。本ページは提案用のTOPデザイン案です。
        </div>
      </div>
    </footer>
  );
}

function MobileBar({ onContact }) {
  return (
    <div className="md:hidden fixed bottom-0 inset-x-0 z-40 bg-white border-t border-[var(--line)] px-3 py-2.5 flex gap-2 shadow-[0_-4px_16px_rgba(0,0,0,.08)]">
      <a href={`tel:${SITE.school.tel.replace(/-/g, "")}`}
         className="flex-1 border-2 border-[var(--pri)] text-[var(--pri)] font-bold text-[14px] py-3 rounded-full text-center">
        電話で相談
      </a>
      <button onClick={onContact} className="flex-1 bg-[var(--pri)] text-white font-bold text-[14px] py-3 rounded-full">
        資料請求・無料相談
      </button>
    </div>
  );
}

/* ==================================================================
   アプリ本体
================================================================== */
function App() {
  const [plan, setPlan] = useState("A");
  const [showIntent, setShowIntent] = useState(false);
  const formRef = useRef(null);
  const p = PLANS[plan];

  const vars = useMemo(() => ({
    "--pri": p.theme.pri, "--pri-dark": p.theme.priDark, "--accent": p.theme.accent,
    "--ink": p.theme.ink, "--sub": p.theme.sub, "--tint": p.theme.tint, "--line": p.theme.line,
  }), [plan]);

  const toContact = () => formRef.current && formRef.current.scrollIntoView({ behavior: "smooth" });

  return (
    <div style={vars} className="min-h-screen bg-white antialiased">
      <PlanSwitch plan={plan} setPlan={setPlan} showIntent={showIntent} setShowIntent={setShowIntent} />
      <Header plan={plan} onContact={toContact} />
      <Hero plan={plan} onContact={toContact} />
      <Campaigns plan={plan} />
      <Reasons plan={plan} />
      <Courses plan={plan} onContact={toContact} />
      <AudienceSwitch />
      <Pricing plan={plan} />
      <Flow plan={plan} />
      <Faq plan={plan} />
      <Contact plan={plan} formRef={formRef} />
      <Footer />
      <MobileBar onContact={toContact} />
      <IntentPanel open={showIntent} onClose={() => setShowIntent(false)} plan={plan} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
