/* ------------------------------------------------------------------
   4. マッチング（加点式）
   1要件 = 1判定。判定は「合致 / 不一致 / 要確認」の3値。
   「判定できないもの」を不一致に丸めないことが、この PoC の肝。
------------------------------------------------------------------ */
const weightOf = (rule) => (rule.weight != null ? rule.weight : WEIGHTS[rule.kind]);

const result = (rule, status, earned, detail) => ({
  kind: rule.kind,
  req: rule.req,
  hard: Boolean(rule.hard),
  status,
  weight: weightOf(rule),
  earned,
  detail,
});

function evaluateRule(rule, p) {
  const w = weightOf(rule);

  if (rule.kind === "entity") {
    const ok = rule.allow.indexOf(p.entity) >= 0;
    return result(rule, ok ? "match" : "miss", ok ? w : 0,
      `事業形態「${p.entity}」は、要件「${rule.req}」を${ok ? "満たします" : "満たしません"}。`);
  }

  if (rule.kind === "industry") {
    if (!rule.allow) {
      return result(rule, "match", w,
        `この制度は業種を限定していません。業種「${p.industry}」も対象に含まれます。`);
    }
    const ok = rule.allow.indexOf(p.industry) >= 0;
    return result(rule, ok ? "match" : "miss", ok ? w : 0,
      ok
        ? `業種「${p.industry}」は、対象業種（${rule.allow.join("・")}）に含まれます。`
        : `業種「${p.industry}」は、対象業種（${rule.allow.join("・")}）に含まれません。`);
  }

  if (rule.kind === "employees") {
    if (p.employees === "" || isNaN(Number(p.employees))) {
      return result(rule, "unknown", 0,
        `従業員数が未入力のため判定できません。要件は「${rule.req}」です。`);
    }
    const n = Number(p.employees);
    const okMin = rule.min == null || n >= rule.min;
    const okMax = rule.max == null || n <= rule.max;
    const ok = okMin && okMax;
    let why;
    if (ok) {
      why = `従業員数 ${n}名 は、要件「${rule.req}」に該当します。`;
    } else if (!okMax) {
      why = `従業員数 ${n}名 は、要件「${rule.req}」の上限を ${n - rule.max}名 超えています。`;
    } else {
      why = `従業員数 ${n}名 は、要件「${rule.req}」の下限に ${rule.min - n}名 足りません。`;
    }
    return result(rule, ok ? "match" : "miss", ok ? w : 0, why);
  }

  if (rule.kind === "region") {
    if (!rule.allow) {
      return result(rule, "match", w,
        `全国が対象のため、所在地「${p.pref}」でも要件を満たします。`);
    }
    const ok = rule.allow.indexOf(p.pref) >= 0;
    return result(rule, ok ? "match" : "miss", ok ? w : 0,
      ok
        ? `所在地「${p.pref}」は、対象地域に含まれます。`
        : `所在地「${p.pref}」は、対象地域（${rule.allow.join("・")}）に含まれません。`);
  }

  if (rule.kind === "years") {
    if (p.founded === "" || isNaN(Number(p.founded))) {
      return result(rule, "unknown", 0,
        `設立（開業）年が未入力のため判定できません。要件は「${rule.req}」です。`);
    }
    const years = NOW_YEAR - Number(p.founded);
    const okMin = rule.min == null || years >= rule.min;
    const okMax = rule.max == null || years <= rule.max;
    const ok = okMin && okMax;
    const head = `${p.founded}年 設立（事業年数 ${years}年）`;
    let why;
    if (ok) {
      why = `${head} は、要件「${rule.req}」に該当します。`;
    } else if (!okMax) {
      why = `${head} は、要件「${rule.req}」を ${years - rule.max}年 超過しています。`;
    } else {
      why = `${head} は、要件「${rule.req}」に ${rule.min - years}年 足りません。`;
    }
    return result(rule, ok ? "match" : "miss", ok ? w : 0, why);
  }

  if (rule.kind === "revenue") {
    const i = tierIndex(p.revenue);
    if (i < 0) {
      return result(rule, "unknown", 0,
        `売上規模が未選択のため判定できません。要件は「${rule.req}」です。`);
    }
    const okMin = rule.minTier == null || i >= tierIndex(rule.minTier);
    const okMax = rule.maxTier == null || i <= tierIndex(rule.maxTier);
    const ok = okMin && okMax;
    return result(rule, ok ? "match" : "miss", ok ? w : 0,
      `直近売上「${tierLabel(p.revenue)}」は、要件「${rule.req}」を${ok ? "満たします" : "満たしません"}。`);
  }

  if (rule.kind === "purpose") {
    const sel = p.purposes;
    if (sel.length === 0) {
      return result(rule, "unknown", 0,
        `検討している取り組みが未選択のため判定できません。この制度の対象は「${rule.req}」です。`);
    }
    const hitPrimary = rule.primary.filter((k) => sel.indexOf(k) >= 0);
    const hitSecondary = (rule.secondary || []).filter((k) => sel.indexOf(k) >= 0);
    if (hitPrimary.length > 0) {
      return result(rule, "match", w,
        `検討中の取り組みに「${purposeLabels(hitPrimary)}」が含まれ、この制度が主たる対象とする取り組みと一致します。`);
    }
    if (hitSecondary.length > 0) {
      const earned = Math.round(w * SECONDARY_RATIO);
      return result(rule, "partial", earned,
        `主たる対象「${purposeLabels(rule.primary)}」は選択されていません。副次的な対象「${purposeLabels(hitSecondary)}」のみ一致するため、配点 ${w}点 のうち ${earned}点 を加点しています。`);
    }
    return result(rule, "miss", 0,
      `検討中の取り組み「${purposeLabels(sel)}」は、この制度の対象「${purposeLabels(rule.primary.concat(rule.secondary || []))}」と一致しません。`);
  }

  // check: 入力項目からは機械的に判定できない要件。0点のまま「要確認」に置く。
  return result(rule, "unknown", 0,
    `「${rule.req}」— 入力情報からは判定できないため、申請前の確認が必要です。`);
}

function matchProgram(program, p) {
  const rows = program.rules.map((r) => evaluateRule(r, p));
  const total = rows.reduce((s, r) => s + r.weight, 0);
  const earned = rows.reduce((s, r) => s + r.earned, 0);
  const unknown = rows.filter((r) => r.status === "unknown").reduce((s, r) => s + r.weight, 0);
  const blocked = rows.filter((r) => r.hard && r.status === "miss");
  return {
    program,
    rows,
    total,
    earned,
    unknown,
    score: total === 0 ? 0 : Math.round((earned / total) * 100),
    potential: total === 0 ? 0 : Math.round(((earned + unknown) / total) * 100),
    blocked,
    eligible: blocked.length === 0,
  };
}

function MatchTab({ profile, setProfile, matches }) {
  const [sortKey, setSortKey] = useState("score");
  const [hideLow, setHideLow] = useState(false);

  const eligible = matches.filter((m) => m.eligible);
  const blocked = matches.filter((m) => !m.eligible);

  const shown = useMemo(() => {
    const list = hideLow ? eligible.filter((m) => m.score >= 50) : eligible.slice();
    list.sort((a, b) => {
      if (sortKey === "amount") return b.program.amountValue - a.program.amountValue;
      if (b.score !== a.score) return b.score - a.score;
      return b.potential - a.potential;
    });
    return list;
  }, [eligible, sortKey, hideLow]);

  return (
    <div className="grid grid-cols-1 gap-5 lg:grid-cols-[320px_1fr]">
      <div className="lg:sticky lg:top-[159px] lg:self-start">
        <ProfileForm profile={profile} onChange={setProfile} onPreset={setProfile} />
      </div>

      <div>
        <div className="mb-3 flex flex-wrap items-center justify-between gap-3 rounded-sm border border-[#ddd7c9] bg-white px-4 py-3">
          <p className="text-sm text-[#2b3742]">
            架空データ {PROGRAMS.length}件 のうち
            <span className="mx-1 font-semibold text-[#12314e]">{eligible.length}件</span>が対象候補、
            <span className="mx-1 font-semibold text-[#8c3a2c]">{blocked.length}件</span>が必須要件により対象外
          </p>
          <div className="flex items-center gap-3">
            <label className="flex items-center gap-1.5 text-xs text-[#6b6558]">
              <input type="checkbox" checked={hideLow} onChange={(e) => setHideLow(e.target.checked)} className="accent-[#12314e]" />
              適合度50%未満を隠す
            </label>
            <label className="flex items-center gap-1.5 text-xs text-[#6b6558]">
              並び順
              <select value={sortKey} onChange={(e) => setSortKey(e.target.value)} className="rounded-sm border border-[#cfc9bb] bg-white px-2 py-1 text-xs">
                <option value="score">適合度が高い順</option>
                <option value="amount">補助上限額が大きい順</option>
              </select>
            </label>
          </div>
        </div>

        {shown.length === 0 ? (
          <div className="rounded-sm border border-dashed border-[#cfc9bb] bg-white px-6 py-16 text-center">
            <p className="text-sm text-[#4a5568]">条件に合う制度がありません。</p>
            <p className="mt-1 text-xs text-[#8a8578]">検討している取り組みを選び直すか、絞り込みを外してください。</p>
          </div>
        ) : (
          <div className="space-y-3">
            {shown.map((m, i) => <ProgramCard key={m.program.id} m={m} rank={i + 1} />)}
          </div>
        )}

        {blocked.length > 0 && (
          <div className="mt-6">
            <h2 className="mb-1 font-serif text-sm text-[#5d6673]">必須要件を満たさないため対象外（{blocked.length}件）</h2>
            <p className="mb-2.5 text-[11px] leading-relaxed text-[#8a8578]">
              対象外の制度も、理由をつけて表示します。「なぜ出てこないのか」が分からない状態を作らないためです。
            </p>
            <div className="space-y-2.5">
              {blocked.map((m) => <BlockedCard key={m.program.id} m={m} />)}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function LogicTab({ matches }) {
  const kinds = ["purpose", "industry", "employees", "entity", "region", "years", "revenue"];
  return (
    <div className="space-y-5">
      <section className="rounded-sm border border-[#ddd7c9] bg-white px-5 py-4">
        <h2 className="font-serif text-lg text-[#12314e]">適合度の計算方法</h2>
        <p className="mt-2 text-sm leading-relaxed text-[#3b4654]">
          適合度は加点式です。制度ごとに定義された要件を1件ずつ判定し、合致した要件の配点を足し上げ、
          その制度の満点で割って百分率にしています。類似度スコアのような「理由を後から説明できない数値」は使っていません。

        <div className="mt-3 rounded-sm bg-[#f5f3ee] px-4 py-3 font-mono text-sm text-[#12314e]">

      </section>

      <section className="rounded-sm border border-[#ddd7c9] bg-white">
        <div className="border-b border-[#e6e1d5] px-5 py-3">
          <h2 className="font-serif text-base text-[#12314e]">配点表</h2>
          <p className="mt-0.5 text-xs text-[#8a8578]">制度によって持つ要件が違うため合計点は一定ではありません。だから百分率に正規化しています。</p>
        </div>
        <div className="overflow-x-auto">
          <table className="w-full min-w-[520px] text-left text-sm">
            <thead className="bg-[#f2efe8] text-xs text-[#6b6558]">
              <tr>
                <th className="px-4 py-2 font-medium">要件区分</th>
                <th className="px-4 py-2 text-right font-medium">配点</th>
                <th className="px-4 py-2 font-medium">考え方</th>
              </tr>
            </thead>
            <tbody className="text-[#2b3742]">
              {[
                ["purpose", "何をしたいかが制度の目的と合っているかを最重視。主目的に合致で満点、副次的な対象のみなら60%（" + Math.round(WEIGHTS.purpose * SECONDARY_RATIO) + "点）"],
                ["industry", "対象業種の指定。指定なしの制度は自動的に満点"],
                ["employees", "従業員数の上限・下限。「小規模事業者」などの規模区分もここで判定"],
                ["entity", "法人／個人事業主の別。制度によっては必須要件（ゲート）"],
                ["region", "対象地域。全国対象の制度では常に満点になるため、制度間の順位には影響しません"],
                ["years", "設立・開業からの年数。創業支援系は上限、投資系は下限で効きます"],
                ["revenue", "売上規模。区分での入力のため配点は小さく置いています"],
                ["check", "入力情報では判定できない要件。1件あたり" + WEIGHTS.check + "点で、満点には含めるが獲得点は0のまま「要確認」に置きます"],
              ].map(([k, note]) => (
                <tr key={k} className="border-t border-[#eceadf]">
                  <td className="whitespace-nowrap px-4 py-2.5 font-medium">{KIND_LABEL[k]}</td>
                  <td className="px-4 py-2.5 text-right font-mono tabular-nums">{WEIGHTS[k]}</td>
                  <td className="px-4 py-2.5 text-xs leading-relaxed text-[#4a5568]">{note}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </section>

      <section className="grid grid-cols-1 gap-4 md:grid-cols-2">
        <div className="rounded-sm border border-[#ddd7c9] bg-white px-5 py-4">
          <h3 className="font-serif text-base text-[#12314e]">判定は「合致／不一致／要確認」の3値</h3>
          <ul className="mt-2.5 space-y-2 text-sm leading-relaxed text-[#3b4654]">
            <li className="flex gap-2"><Chip status="match" /><span>入力情報で要件を満たすと確認できた</span></li>
            <li className="flex gap-2"><Chip status="miss" /><span>入力情報で要件を満たさないと確認できた</span></li>
            <li className="flex gap-2"><Chip status="unknown" /><span>入力情報だけでは判定できない（未入力・書類要件など）</span></li>
            <li className="flex gap-2"><Chip status="partial" /><span>取り組み要件のみの例外。制度の副次的な対象にのみ合致した場合に部分点を入れます</span></li>
          </ul>
          <p className="mt-3 text-xs leading-relaxed text-[#6b6558]">
            要確認を不一致に丸めると、本来使える制度を落とします。逆に合致とみなすと、使えない制度を勧めてしまいます。
            どちらもやらずに「0点のまま、要確認として画面に出す」のがこのPoCの方針です。
          </p>
        </div>
        <div className="rounded-sm border border-[#ddd7c9] bg-white px-5 py-4">
          <h3 className="font-serif text-base text-[#12314e]">必須要件（ゲート）の扱い</h3>
          <p className="mt-2.5 text-sm leading-relaxed text-[#3b4654]">
            「法人限定」「対象地域限定」のように、外れた時点で申請できない要件は<span className="rounded-sm bg-[#12314e] px-1 py-0.5 text-[11px] text-white">必須</span>として区別し、
            満たさない場合は点数に関係なく対象外に振り分けます。
          </p>
          <p className="mt-2.5 text-sm leading-relaxed text-[#3b4654]">
            ただし対象外も画面から消しません。理由を添えて別枠に表示します。
            候補に出ない理由が分からない状態は、提案そのものへの不信につながるためです。
          </p>
        </div>
      </section>

      <section className="rounded-sm border border-[#ddd7c9] bg-white">
        <div className="border-b border-[#e6e1d5] px-5 py-3">
          <h2 className="font-serif text-base text-[#12314e]">いまの入力での全制度の計算結果</h2>
          <p className="mt-0.5 text-xs text-[#8a8578]">「入力タブの内容で、どの要件に何点入ったか」の一覧です。数値は 獲得点／配点。</p>
        </div>
        <div className="overflow-x-auto">
          <table className="w-full min-w-[760px] text-left text-xs">
            <thead className="bg-[#f2efe8] text-[11px] text-[#6b6558]">
              <tr>
                <th className="px-3 py-2 font-medium">制度（すべて架空）</th>
                {kinds.map((k) => <th key={k} className="px-2 py-2 text-center font-medium">{KIND_LABEL[k]}</th>)}
                <th className="px-2 py-2 text-center font-medium">要確認</th>
                <th className="px-3 py-2 text-right font-medium">合計</th>
                <th className="px-3 py-2 text-right font-medium">適合度</th>
              </tr>
            </thead>
            <tbody>
              {matches.map((m) => {
                const byKind = {};
                m.rows.forEach((r) => {
                  if (r.kind === "check") {
                    byKind.check = byKind.check || { earned: 0, weight: 0, n: 0 };
                    byKind.check.weight += r.weight;
                    byKind.check.n += 1;
                  } else {
                    byKind[r.kind] = { earned: r.earned, weight: r.weight, status: r.status };
                  }
                });
                return (
                  <tr key={m.program.id} className={`border-t border-[#eceadf] ${m.eligible ? "" : "bg-[#faf8f3] text-[#9a9488]"}`}>
                    <td className="px-3 py-2">
                      {m.program.name}
                      {!m.eligible && <span className="ml-1.5 rounded-sm bg-[#f7ebe8] px-1 py-0.5 text-[10px] text-[#8c3a2c] ring-1 ring-[#e2c4bc]">対象外</span>}
                    </td>
                    {kinds.map((k) => {
                      const c = byKind[k];
                      if (!c) return <td key={k} className="px-2 py-2 text-center text-[#c8c2b5]">—</td>;
                      const tone = c.status === "match" ? "text-[#1f5c45]" : c.status === "partial" ? "text-[#1d3f63]" : c.status === "unknown" ? "text-[#7a5c1e]" : "text-[#8c3a2c]";
                      return (
                        <td key={k} className={`px-2 py-2 text-center font-mono tabular-nums ${tone}`}>
                          {c.earned}/{c.weight}
                        </td>
                      );
                    })}
                    <td className="px-2 py-2 text-center font-mono tabular-nums text-[#7a5c1e]">
                      {byKind.check ? "0/" + byKind.check.weight : "—"}
                    </td>
                    <td className="px-3 py-2 text-right font-mono tabular-nums">{m.earned}/{m.total}</td>
                    <td className={`px-3 py-2 text-right font-mono tabular-nums font-semibold ${m.eligible ? "text-[#12314e]" : "text-[#9a9488]"}`}>{m.score}%</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
        <p className="border-t border-[#eceadf] px-5 py-3 text-[11px] leading-relaxed text-[#7c7669]">
          配点そのものは仮置きです。本番では、専門家が判定した「事業者×制度」の正解データを用意し、
          取りこぼし（本来該当するのに候補から漏れる）を重く見る形で重みを調整します。
        </p>
      </section>
    </div>
  );
}

            { n: "第3段階", t: "利用者向け機能", d: "動的ヒアリング、締切管理と通知、申請準備チェックリスト、相談履歴。対象範囲を自治体制度へ拡大。" },
          ].map((s) => (
            <div key={s.n} className="rounded-sm border border-[#e6e1d5] bg-[#faf8f3] px-4 py-3">
              <p className="text-[11px] font-medium text-[#a8862f]">{s.n}</p>
              <p className="mt-0.5 font-serif text-sm text-[#12314e]">{s.t}</p>
              <p className="mt-1.5 text-xs leading-relaxed text-[#4a5568]">{s.d}</p>
            </div>
          ))}
        </div>
      </section>
    </div>
  );
}

/* ------------------------------------------------------------------
   8. ルート
------------------------------------------------------------------ */
const TABS = [
  { key: "match", label: "① 事業者情報とマッチング" },
  { key: "logic", label: "② 適合度の計算ロジック" },
  { key: "feas", label: "③ 本番実装に向けて" },
];

function App() {
  const [tab, setTab] = useState("match");
  const [profile, setProfile] = useState(INITIAL_PROFILE);

  const matches = useMemo(() => {
    const list = PROGRAMS.map((p) => matchProgram(p, profile));
    list.sort((a, b) => {
      if (a.eligible !== b.eligible) return a.eligible ? -1 : 1;
      return b.score - a.score;
    });
    return list;
  }, [profile]);

  return (
    <div className="min-h-screen text-[#1c2733]">
      <header className="relative z-20 md:sticky md:top-0">
        <div className="bg-[#12314e] text-white">
          <div className="mx-auto flex max-w-7xl flex-wrap items-baseline gap-x-3 gap-y-1 px-4 py-3">
            <h1 className="font-serif text-lg tracking-tight">補助金・助成金マッチング</h1>
            <span className="rounded-sm bg-white/15 px-1.5 py-0.5 text-[11px]">PoC / 試作版</span>
            <p className="ml-auto text-[11px] text-white/70">適合度の根拠と、満たしていない条件を画面に出すことを目的にした試作です。</p>
          </div>
        </div>

        <div className="border-y border-[#e0cfa4] bg-[#fbf3dd]">
          <div className="mx-auto max-w-7xl px-4 py-2">
            <p className="text-xs leading-relaxed text-[#6b5117]">
              <span className="mr-1.5 rounded-sm bg-[#a8862f] px-1.5 py-0.5 text-[11px] font-medium text-white">重要</span>
              デモ用の架空データです。本番では公募中の制度データを取り込みます。
              <span className="ml-1">
                掲載している制度名・要件・金額・補助率・公募時期は、すべてこのデモのために作った架空のものです。実在する制度の内容を示すものではありません。
              </span>
            </p>
          </div>
        </div>

        <div className="border-b border-[#ddd7c9] bg-white">
          <div className="mx-auto flex max-w-7xl gap-1 px-4">
            {TABS.map((t) => (
              <button
                key={t.key}
                onClick={() => setTab(t.key)}
                className={`-mb-px border-b-2 px-3 py-2.5 text-sm ${
                  tab === t.key
                    ? "border-[#12314e] font-medium text-[#12314e]"
                    : "border-transparent text-[#7c7669] hover:text-[#12314e]"
                }`}
              >
                {t.label}
              </button>
            ))}
          </div>
        </div>
      </header>

      <main className="mx-auto max-w-7xl px-4 py-5">
        {tab === "match" && <MatchTab profile={profile} setProfile={setProfile} matches={matches} />}
        {tab === "logic" && <LogicTab matches={matches} />}
        {tab === "feas" && <FeasibilityTab />}
      </main>

      <footer className="mt-6 border-t border-[#ddd7c9] bg-white">
        <div className="mx-auto max-w-7xl px-4 py-5">
          <p className="text-xs leading-relaxed text-[#7c7669]">
            制度データはすべて架空です。本番では、公募中の制度を出典URL・取得日時つきで取り込み、この画面と同じ構造（必須要件・加点要件・要確認要件）に流し込みます。
            判定はルールエンジンで行い、LLMは要件の抽出に限定する想定です。最終的な適用可否は、必ず各制度の公募要領でご確認いただく前提の設計にしています。
          </p>
          <p className="mt-2 text-[11px] text-[#a09a8c]">
            React + Tailwind の1ファイル構成／保存機能なし（リロードで初期状態に戻ります）
          </p>
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
