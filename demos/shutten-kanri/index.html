// 入金状況。
const PAY_STATUSES = {

/* ------------------------------------------------------------------
   ここから下はイベントに依存しない共通処理です。
------------------------------------------------------------------ */

const WEEK = ["日", "月", "火", "水", "木", "金", "土"];
const toDate = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const addDays = (s, n) => { const d = toDate(s); d.setDate(d.getDate() + n); return iso(d); };
const diffDays = (from, to) => Math.round((toDate(to) - toDate(from)) / 86400000);
const fmtMd = (s) => { const d = toDate(s); return `${d.getMonth() + 1}月${d.getDate()}日(${WEEK[d.getDay()]})`; };
const fmtYmd = (s) => { const d = toDate(s); return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`; };
const yen = (n) => `¥${n.toLocaleString("ja-JP")}`;
const TODAY = iso(new Date());

const boothOf = (id) => BOOTH_TYPES.find((b) => b.id === id);
const planOf = (id) => PLANS.find((p) => p.id === id);
const sessionOf = (id) => EVENT.sessions.find((s) => s.id === id);
const optionLabels = (ids) => (ids || []).map((id) => OPTIONS.find((o) => o.id === id)?.label).filter(Boolean);

// 料金は保存せず、設定から毎回計算します。単価を直せば全画面に反映されます。
const calcFee = (entry) => {
  const base = boothOf(entry.boothTypeId)?.baseFee ?? 0;
  const plan = planOf(entry.planId)?.addFee ?? 0;
  const opt = (entry.optionIds || []).reduce((sum, id) => sum + (OPTIONS.find((o) => o.id === id)?.fee ?? 0), 0);
  const sub = base + plan + opt;
  const tax = Math.round(sub * EVENT.taxRate);
  return { base, plan, opt, sub, tax, total: sub + tax };
};

const dueDateOf = (sessionId) => addDays(sessionOf(sessionId).date, -EVENT.paymentDueDays);

/* ------------------------------------------------------------------

------------------------------------------------------------------ */

  { id: 91, exhibitorId: "e1", sessionId: "s0725", boothTypeId: "cook", planId: "std", optionIds: ["power"], boothNo: "A-04", goods: "自家焙煎コーヒー", status: "done",

  { id: 93, exhibitorId: "e3", sessionId: "s0725", boothTypeId: "craft", planId: "std", optionIds: ["table"], boothNo: "B-03", goods: "木製カトラリー", status: "done",

------------------------------------------------------------------ */

const inputCls = "w-full rounded border border-neutral-300 px-3 py-2 text-sm outline-none focus:border-violet-600";

const btnGhost = "rounded border border-neutral-300 bg-white px-3 py-2 text-sm hover:bg-neutral-100 disabled:text-neutral-400";

const btnBulkOn = "rounded border border-violet-700 bg-violet-700 px-3 py-1.5 text-xs font-medium whitespace-nowrap text-white hover:bg-violet-800 disabled:border-neutral-200 disabled:bg-neutral-200 disabled:text-neutral-400";

/* ------------------------------------------------------------------
   出展者マイページ
------------------------------------------------------------------ */

function MyPage({ exhibitor, entries, actions, toast }) {
  const [modal, setModal] = useState(null); // { kind: "transfer" | "pay", entryId }

  const mine = useMemo(
    () => entries.filter((e) => e.exhibitorId === exhibitor.id)
      .slice()
      .sort((a, b) => sessionOf(b.sessionId).date.localeCompare(sessionOf(a.sessionId).date)),
    [entries, exhibitor.id]
  );

  // 次回出店：今日以降の開催回のうち、キャンセル以外でいちばん近いもの
  const upcoming = mine
    .filter((e) => e.status !== "canceled" && sessionOf(e.sessionId).date >= TODAY)
    .sort((a, b) => sessionOf(a.sessionId).date.localeCompare(sessionOf(b.sessionId).date))[0];

  const billed = mine.filter((e) => e.pay.status !== "none");
  const unpaid = mine.filter((e) => e.pay.status === "unpaid");
  const paid = mine.filter((e) => e.pay.status === "paid");
  const unpaidTotal = unpaid.reduce((sum, e) => sum + calcFee(e).total, 0);
  const nearestDue = unpaid.map((e) => dueDateOf(e.sessionId)).sort()[0];
  const dueIn = nearestDue ? diffDays(TODAY, nearestDue) : null;

  const target = modal ? mine.find((e) => e.id === modal.entryId) : null;

  return (
    <div className="mx-auto max-w-6xl px-4 py-5">
      {/* 次回出店日と時間。最上部に大きく置きます。 */}
      <section className="overflow-hidden rounded-lg border border-violet-900 bg-violet-950 text-violet-50">
        {upcoming ? (
          <div className="flex flex-wrap items-stretch">
            <div className="flex-1 px-5 py-4">
              <p className="text-xs tracking-wide text-violet-300">次回の出店</p>
              <p className="mt-1 flex flex-wrap items-baseline gap-x-3 gap-y-1">
                <span className="text-3xl font-bold tracking-tight sm:text-4xl">{fmtMd(sessionOf(upcoming.sessionId).date)}</span>
                <span className="text-2xl font-semibold tabular-nums sm:text-3xl">
                  {sessionOf(upcoming.sessionId).open}–{sessionOf(upcoming.sessionId).close}
                </span>
                {diffDays(TODAY, sessionOf(upcoming.sessionId).date) >= 0 && (
                  <span className="rounded bg-violet-800 px-2 py-0.5 text-xs text-violet-100">
                    あと{diffDays(TODAY, sessionOf(upcoming.sessionId).date)}日
                  </span>
                )}
              </p>
              <dl className="mt-3 grid gap-x-6 gap-y-1 text-sm sm:grid-cols-2">
                <div className="flex gap-2"><dt className="w-16 shrink-0 text-violet-300">搬入</dt><dd>{sessionOf(upcoming.sessionId).setupFrom} 開始</dd></div>
                <div className="flex gap-2"><dt className="w-16 shrink-0 text-violet-300">撤収</dt><dd>{sessionOf(upcoming.sessionId).teardownBy} まで</dd></div>
                <div className="flex gap-2"><dt className="w-16 shrink-0 text-violet-300">会場</dt><dd>{EVENT.venue}</dd></div>
                <div className="flex gap-2"><dt className="w-16 shrink-0 text-violet-300">区画番号</dt><dd className="tabular-nums">{upcoming.boothNo}</dd></div>
              </dl>
            </div>
            <div className="flex w-full flex-col justify-center gap-2 border-t border-violet-900 bg-violet-900/40 px-5 py-4 sm:w-64 sm:border-l sm:border-t-0">
              <p className="text-xs text-violet-300">出店ステータス</p>
              <p><StatusBadge status={upcoming.status} /></p>
              <p className="text-xs leading-relaxed text-violet-200">{STATUSES[upcoming.status].desc}</p>
              <p className="mt-1 text-xs text-violet-300">
                {boothOf(upcoming.boothTypeId).label} ／ {planOf(upcoming.planId).label}
              </p>
            </div>
          </div>
        ) : (
          <div className="px-5 py-6">
            <p className="text-lg font-semibold">予定されている出店はありません</p>
            <p className="mt-1 text-sm text-violet-200">下の「出店を申請する」から、次回以降の開催回にお申し込みください。</p>
          </div>
        )}
      </section>

      {/* 未払いアラート */}
      {unpaid.length > 0 && (
        <section className="mt-4 rounded-lg border-2 border-rose-500 bg-rose-50 px-4 py-3">
          <div className="flex flex-wrap items-center justify-between gap-3">
            <div>
              <p className="flex items-center gap-2 text-sm font-bold text-rose-800">
                <span className="rounded bg-rose-600 px-1.5 py-0.5 text-xs text-white">未払い</span>
                お支払いが {unpaid.length}件 残っています（合計 {yen(unpaidTotal)}）
              </p>
              <p className="mt-1 text-sm text-rose-700">
                直近のお支払い期限は {fmtYmd(nearestDue)}
                {dueIn >= 0 ? `（あと${dueIn}日）` : `（${-dueIn}日超過）`}です。
                期限を過ぎると出店確定が取り消しになる場合があります。
              </p>
            </div>
            <div className="flex gap-2">
              <button className={btnPrimary} onClick={() => setModal({ kind: "pay", entryId: unpaid[0].id })}>オンラインで支払う</button>
              <button className={btnGhost} onClick={() => setModal({ kind: "transfer", entryId: unpaid[0].id })}>銀行振込を報告する</button>
            </div>
          </div>
        </section>
      )}

      {/* 進捗ステップ */}
      {upcoming && upcoming.status !== "canceled" && (
        <div className="mt-4 flex flex-wrap gap-1.5">
          {STATUS_FLOW.map((key) => {
            const cur = STATUSES[upcoming.status].step;
            const s = STATUSES[key];
            const state = s.step < cur ? "done" : s.step === cur ? "now" : "todo";
            return (
              <div key={key} className={`flex-1 rounded border px-3 py-2 text-xs ${
                state === "now" ? "border-violet-600 bg-violet-50 font-semibold text-violet-800"
                : state === "done" ? "border-neutral-300 bg-neutral-100 text-neutral-500"
                : "border-dashed border-neutral-300 bg-white text-neutral-400"}`}>
                <span className="tabular-nums">{s.step}. </span>{s.label}
              </div>
            );
          })}
        </div>

/* ------------------------------------------------------------------
   主催者の管理画面
------------------------------------------------------------------ */

function AdminPage({ entries, actions, toast }) {
  const nextSession = EVENT.sessions.find((s) => s.date >= TODAY) ?? EVENT.sessions[EVENT.sessions.length - 1];
  const [sessionFilter, setSessionFilter] = useState(nextSession.id);
  const [statusFilter, setStatusFilter] = useState("all");
  const [boothFilter, setBoothFilter] = useState("all");
  const [unpaidOnly, setUnpaidOnly] = useState(false);
  const [query, setQuery] = useState("");
  const [selected, setSelected] = useState([]);

  const nameOf = (id) => EXHIBITORS.find((x) => x.id === id)?.name ?? "";

  const rows = useMemo(() => {
    const q = query.trim().toLowerCase();
    return entries
      .filter((e) => sessionFilter === "all" || e.sessionId === sessionFilter)
      .filter((e) => statusFilter === "all" || e.status === statusFilter)
      .filter((e) => boothFilter === "all" || e.boothTypeId === boothFilter)
      .filter((e) => !unpaidOnly || e.pay.status === "unpaid" || e.pay.status === "reported")
      .filter((e) => !q || [nameOf(e.exhibitorId), e.goods, e.pay.invoiceNo, e.boothNo].some((v) => String(v ?? "").toLowerCase().includes(q)))
      .sort((a, b) => sessionOf(a.sessionId).date.localeCompare(sessionOf(b.sessionId).date) || nameOf(a.exhibitorId).localeCompare(nameOf(b.exhibitorId), "ja"));
  }, [entries, sessionFilter, statusFilter, boothFilter, unpaidOnly, query]);

  const visibleIds = rows.map((r) => r.id);
  const allChecked = visibleIds.length > 0 && visibleIds.every((id) => selected.includes(id));
  const toggle = (id) => setSelected((prev) => (prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]));
  const toggleAll = () => setSelected(allChecked ? selected.filter((id) => !visibleIds.includes(id)) : Array.from(new Set([...selected, ...visibleIds])));

  const selectedRows = entries.filter((e) => selected.includes(e.id));
  const toFix = selectedRows.filter((e) => e.status === "review");
  const toReview = selectedRows.filter((e) => e.status === "applied");

  // 集計は表示中の行に対して出します。絞り込みと数字がずれると使えないためです。
  const sum = (list, f) => list.reduce((acc, e) => acc + f(e), 0);
  const unpaidRows = rows.filter((e) => e.pay.status === "unpaid");
  const reportedRows = rows.filter((e) => e.pay.status === "reported");
  const paidRows = rows.filter((e) => e.pay.status === "paid");

  const stats = [
    { label: "申込", value: `${rows.length}件`, sub: `確定 ${rows.filter((e) => e.status === "fixed").length}／審査中 ${rows.filter((e) => e.status === "review").length}／申請中 ${rows.filter((e) => e.status === "applied").length}` },
    { label: "請求合計", value: yen(sum(rows.filter((e) => e.pay.status !== "none"), (e) => calcFee(e).total)), sub: "税込" },
    { label: "入金済み", value: yen(sum(paidRows, (e) => calcFee(e).total)), sub: `${paidRows.length}件` },
    { label: "未入金", value: yen(sum(unpaidRows, (e) => calcFee(e).total)), sub: `${unpaidRows.length}件（振込確認中 ${reportedRows.length}件）`, alert: unpaidRows.length > 0 },
  ];

  const exportCsv = () => {
    const header = ["出店日", "出展者名", "担当者", "出店区分", "プラン", "区画", "オプション", "販売品", "ステータス", "入金状況", "請求番号", "支払期限", "金額(税込)", "入金日", "入金方法"];
    const body = rows.map((e) => [
      sessionOf(e.sessionId).date,
      nameOf(e.exhibitorId),
      EXHIBITORS.find((x) => x.id === e.exhibitorId)?.person ?? "",
      boothOf(e.boothTypeId).label,
      planOf(e.planId).label,
      e.boothNo,
      optionLabels(e.optionIds).join(" / "),
      e.goods ?? "",
      STATUSES[e.status].label,
      PAY_STATUSES[e.pay.status].label,
      e.pay.invoiceNo ?? "",
      e.pay.status === "none" ? "" : dueDateOf(e.sessionId),
      calcFee(e).total,
      e.pay.paidOn ?? "",
      e.pay.method ?? "",
    ]);
    const csv = [header, ...body]
      .map((line) => line.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(","))
      .join("\r\n");
    // Excelで文字化けしないよう BOM 付き UTF-8 で出力します。
    const url = URL.createObjectURL(new Blob(["\uFEFF" + csv], { type: "text/csv" }));
    const a = document.createElement("a");
    a.href = url;
    // ブラウザによっては日本語のファイル名が落ちるため、ASCIIで組み立てます。
    a.download = `shutten-list_${TODAY}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  };

  return (
    <div className="mx-auto max-w-7xl px-4 py-5">
      <div className="flex flex-wrap items-end justify-between gap-3">
        <div>
          <h1 className="text-lg font-semibold tracking-tight">出展者管理</h1>
          <p className="mt-0.5 text-xs text-neutral-500">{EVENT.organizer} ／ 表示中の {rows.length}件を集計しています。</p>
        </div>
        <div className="flex flex-wrap gap-2">
          <button className={btnGhost} onClick={exportCsv}>CSVで書き出す</button>
        </div>
      </div>

      <div className="mt-3 grid grid-cols-2 gap-2 lg:grid-cols-4">
        {stats.map((s) => (
          <div key={s.label} className={`rounded-lg border px-3 py-2 ${s.alert ? "border-rose-300 bg-rose-50" : "border-neutral-200 bg-white"}`}>
            <p className={`text-xs ${s.alert ? "text-rose-700" : "text-neutral-500"}`}>{s.label}</p>
            <p className={`mt-0.5 text-xl font-semibold tabular-nums ${s.alert ? "text-rose-800" : "text-neutral-900"}`}>{s.value}</p>
            <p className="text-xs text-neutral-500">{s.sub}</p>
          </div>
        ))}
      </div>

      {/* 絞り込み */}
      <div className="mt-3 flex flex-wrap items-center gap-2 rounded-lg border border-neutral-200 bg-white px-3 py-2">
        <label className="flex items-center gap-1.5 text-xs text-neutral-500">
          開催回
          <select value={sessionFilter} onChange={(e) => setSessionFilter(e.target.value)} className="rounded border border-neutral-300 px-2 py-1 text-xs text-neutral-900">
            <option value="all">すべて</option>
            {EVENT.sessions.map((s) => <option key={s.id} value={s.id}>{fmtMd(s.date)}</option>)}
          </select>
        </label>
        <label className="flex items-center gap-1.5 text-xs text-neutral-500">
          ステータス
          <select value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)} className="rounded border border-neutral-300 px-2 py-1 text-xs text-neutral-900">
            <option value="all">すべて</option>
            {Object.entries(STATUSES).map(([k, s]) => <option key={k} value={k}>{s.label}</option>)}
          </select>
        </label>
        <label className="flex items-center gap-1.5 text-xs text-neutral-500">
          出店区分
          <select value={boothFilter} onChange={(e) => setBoothFilter(e.target.value)} className="rounded border border-neutral-300 px-2 py-1 text-xs text-neutral-900">
            <option value="all">すべて</option>
            {BOOTH_TYPES.map((b) => <option key={b.id} value={b.id}>{b.label}</option>)}
          </select>
        </label>
        <label className={`flex cursor-pointer items-center gap-1.5 rounded border px-2 py-1 text-xs ${unpaidOnly ? "border-rose-400 bg-rose-50 font-medium text-rose-700" : "border-neutral-300 text-neutral-600"}`}>
          <input type="checkbox" checked={unpaidOnly} onChange={(e) => setUnpaidOnly(e.target.checked)} className="accent-rose-600" />
          未入金だけを表示
        </label>
        <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="出展者名・請求番号で検索"
          className="w-52 rounded border border-neutral-300 px-2 py-1 text-xs outline-none focus:border-violet-600" />
        {(sessionFilter !== "all" || statusFilter !== "all" || boothFilter !== "all" || unpaidOnly || query) && (
          <button className="text-xs text-neutral-500 underline underline-offset-4"
            onClick={() => { setSessionFilter("all"); setStatusFilter("all"); setBoothFilter("all"); setUnpaidOnly(false); setQuery(""); }}>
            条件をすべて外す
          </button>
        )}
      </div>

      {/* 一括操作 */}
      <div className="mt-2 flex flex-wrap items-center gap-2 rounded-lg border border-violet-200 bg-violet-50 px-3 py-2">
        <span className="text-xs font-medium text-violet-900">選択中 {selected.length}件</span>
        <button className={btnBulkOn}
          disabled={toFix.length === 0}
          onClick={() => { actions.bulkStatus(toFix.map((e) => e.id), "fixed"); setSelected([]); }}>
          審査中 → 確定にする（{toFix.length}件）
        </button>
        <button className={btnBulk} disabled={toReview.length === 0}
          onClick={() => { actions.bulkStatus(toReview.map((e) => e.id), "review"); setSelected([]); }}>
          申請中 → 審査中にする（{toReview.length}件）
        </button>
        <button className={btnBulk} disabled={selected.length === 0} onClick={() => setSelected([])}>選択を解除</button>
        <span className="text-xs text-violet-800">確定にすると、その場で請求（未払い）が発行されます。</span>
      </div>

      <div className="mt-2 overflow-x-auto rounded-lg border border-neutral-200 bg-white">
        <table className="w-full text-left text-sm">
          <thead className="bg-neutral-50 text-xs text-neutral-500">
            <tr>
              <th className="w-8 px-3 py-2"><input type="checkbox" checked={allChecked} onChange={toggleAll} className="accent-violet-700" /></th>
              <th className="px-3 py-2 font-medium">出店日</th>
              <th className="px-3 py-2 font-medium">出展者名</th>
              <th className="px-3 py-2 font-medium">出店区分</th>
              <th className="px-3 py-2 font-medium">プラン</th>
              <th className="px-3 py-2 font-medium">区画</th>
              <th className="whitespace-nowrap px-3 py-2 text-right font-medium">金額(税込)</th>
              <th className="whitespace-nowrap px-3 py-2 font-medium">ステータス</th>
              <th className="whitespace-nowrap px-3 py-2 font-medium">入金状況</th>
              <th className="px-3 py-2 font-medium">操作</th>
            </tr>
          </thead>
          <tbody>
            {rows.length === 0 && (
              <tr><td colSpan="10" className="px-3 py-12 text-center text-sm text-neutral-500">条件に合う申込がありません。「条件をすべて外す」で戻せます。</td></tr>
            )}
            {rows.map((e) => {
              const over = e.pay.status === "unpaid" && diffDays(TODAY, dueDateOf(e.sessionId)) < 0;
              return (
                <tr key={e.id} className={`border-t border-neutral-100 hover:bg-neutral-50 ${selected.includes(e.id) ? "bg-violet-50" : ""}`}>
                  <td className="px-3 py-2"><input type="checkbox" checked={selected.includes(e.id)} onChange={() => toggle(e.id)} className="accent-violet-700" /></td>
                  <td className="whitespace-nowrap px-3 py-2 tabular-nums">{fmtMd(sessionOf(e.sessionId).date)}</td>
                  <td className="px-3 py-2">
                    <span className="font-medium">{nameOf(e.exhibitorId)}</span>
                    <span className="block text-xs text-neutral-500">{e.goods}</span>
                  </td>
                  <td className="whitespace-nowrap px-3 py-2">{boothOf(e.boothTypeId).label}</td>
                  <td className="whitespace-nowrap px-3 py-2">
                    {planOf(e.planId).label}
                    {optionLabels(e.optionIds).length > 0 && (
                      <span className="block text-xs text-neutral-500">OP: {optionLabels(e.optionIds).join("・")}</span>
                    )}
                  </td>
                  <td className="whitespace-nowrap px-3 py-2 tabular-nums">{e.boothNo}</td>
                  <td className="whitespace-nowrap px-3 py-2 text-right tabular-nums">{yen(calcFee(e).total)}</td>
                  <td className="px-3 py-2"><StatusBadge status={e.status} /></td>
                  <td className="whitespace-nowrap px-3 py-2">
                    <PayBadge status={e.pay.status} />
                    {e.pay.status === "unpaid" && (
                      <span className={`block text-xs ${over ? "font-semibold text-rose-700" : "text-neutral-500"}`}>
                        期限 {dueDateOf(e.sessionId)}{over && "（超過）"}
                      </span>
                    )}
                    {e.pay.status === "reported" && e.pay.report && (
                      <span className="block text-xs text-neutral-500">{e.pay.report.date} {e.pay.report.name} {yen(Number(e.pay.report.amount))}</span>
                    )}
                    {e.pay.status === "paid" && <span className="block text-xs text-neutral-500">{e.pay.paidOn} {e.pay.method}</span>}
                  </td>
                  <td className="px-3 py-2">
                    <div className="flex flex-wrap gap-1.5">
                      {e.status === "review" && <button className={btnSmall} onClick={() => actions.bulkStatus([e.id], "fixed")}>確定</button>}
                      {e.status === "applied" && <button className={btnSmall} onClick={() => actions.bulkStatus([e.id], "review")}>審査へ</button>}
                      {(e.pay.status === "unpaid" || e.pay.status === "reported") && (
                        <button className={btnSmall} onClick={() => actions.confirmPayment(e.id)}>入金確認</button>
                      )}
                      {e.pay.status === "unpaid" && <button className={btnSmall} onClick={() => actions.remind(e)}>督促</button>}
                    </div>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      <ServerNote>
        CSVはこの画面の絞り込み結果をそのまま書き出します（BOM付きUTF-8。Excelでそのまま開けます）。督促メールの送信、入金明細との自動照合、請求書PDFの一括発行はサーバー側の処理です。
      </ServerNote>
      {toast}
    </div>
  );
}

/* ------------------------------------------------------------------
   アプリ本体
------------------------------------------------------------------ */

function App() {
  const [screen, setScreen] = useState("mypage");
  const [exhibitorId, setExhibitorId] = useState("e1");
  const [entries, setEntries] = useState(SEED_ENTRIES);
  const [message, setMessage] = useState(null);
  const [nextId, setNextId] = useState(200);

  const notify = (text) => {
    setMessage(text);
    window.setTimeout(() => setMessage((cur) => (cur === text ? null : cur)), 4000);
  };

  const patch = (id, fn) => setEntries((prev) => prev.map((e) => (e.id === id ? fn(e) : e)));

  const actions = {
    downloadInvoice: (e) =>
      notify(`請求書 ${e.pay.invoiceNo} をダウンロードしました（デモ）。本番ではサーバーでPDFを生成します。`),

    issueReceipt: (e) =>
      notify(`領収書 ${e.pay.receiptNo ?? "（発行）"} を発行しました（デモ）。宛名・但し書きは登録情報から差し込みます。`),

    payOnline: (id) =>
      patch(id, (e) => {
        notify(`${yen(calcFee(e).total)} の決済が完了しました（デモ）。領収書を発行できます。`);
        return { ...e, pay: { ...e.pay, status: "paid", paidOn: TODAY, method: "オンライン決済", receiptNo: e.pay.invoiceNo.replace("INV", "RCT") } };
      }),

    reportTransfer: (id, form) =>
      patch(id, (e) => {
        notify("振込報告を受け付けました。事務局が入金を照合すると「入金済み」に変わります。");
        return { ...e, pay: { ...e.pay, status: "reported", report: { date: form.date, name: form.name, amount: Number(form.amount), note: form.note } } };
      }),

    confirmPayment: (id) =>
      patch(id, (e) => {
        notify("入金を確認済みにしました。出展者のマイページにも反映されます。");
        return {
          ...e,
          pay: {
            ...e.pay,
            status: "paid",
            paidOn: e.pay.report?.date ?? TODAY,
            method: e.pay.report ? "銀行振込" : "銀行振込（事務局確認）",
            receiptNo: e.pay.invoiceNo.replace("INV", "RCT"),
          },
        };
      }),

    // 確定にすると請求を発行します。実務では確定と請求はセットで動きます。
    bulkStatus: (ids, next) => {
      if (ids.length === 0) return;
      setEntries((prev) =>
        prev.map((e) => {
          if (!ids.includes(e.id)) return e;
          const shouldBill = next === "fixed" && e.pay.status === "none";
          if (!shouldBill) return { ...e, status: next };
          const seq = String(e.id).slice(-3).padStart(3, "0");
          return {
            ...e,
            status: next,
            pay: { status: "unpaid", invoiceNo: `INV-${sessionOf(e.sessionId).date.replace(/-/g, "").slice(0, 8)}-${seq}`, issuedOn: TODAY },
          };
        })
      );
      notify(
        next === "fixed"
          ? `${ids.length}件を確定にし、請求を発行しました（デモ）。本番では確定通知メールを送信します。`
          : `${ids.length}件を審査中にしました。`
      );
    },

    apply: (form) => {
      const entry = {
        id: nextId,
        exhibitorId: form.exhibitorId,
        sessionId: form.sessionId,
        boothTypeId: form.boothTypeId,
        planId: form.planId,
        optionIds: form.optionIds,
        boothNo: "—",
        goods: form.goods,
        status: "applied",
        pay: { status: "none" },
        note: form.note,
      };
      setEntries((prev) => [...prev, entry]);
      setNextId((n) => n + 1);
      notify(`${fmtYmd(sessionOf(form.sessionId).date)} の出店を申請しました。事務局の確認をお待ちください。`);
    },

    remind: (e) => notify(`${EXHIBITORS.find((x) => x.id === e.exhibitorId).name} 宛に督促メールを送信しました（デモ）。`),
  };

  const exhibitor = EXHIBITORS.find((x) => x.id === exhibitorId);
  const unpaidCount = entries.filter((e) => e.pay.status === "unpaid").length;

  const toast = message ? (
    <div className="fixed inset-x-0 bottom-4 z-50 mx-auto w-fit max-w-[92vw] rounded-lg bg-neutral-900 px-4 py-2.5 text-sm text-white shadow-lg">
      {message}
    </div>
  ) : null;

  return (
    <div className="min-h-screen bg-neutral-100 text-neutral-900">
      <header className="sticky top-0 z-30 border-b border-violet-900 bg-violet-950 text-violet-50">
        <div className="mx-auto flex max-w-7xl flex-wrap items-center gap-x-4 gap-y-2 px-4 py-2.5">
          <div className="flex items-baseline gap-2">
            <span className="text-sm font-semibold tracking-tight">{EVENT.name}</span>
            <span className="text-xs text-violet-400">出店者管理システム デモ</span>
          </div>

          <nav className="flex overflow-hidden rounded border border-violet-700">
            {[
              { key: "mypage", label: "出展者マイページ" },
              { key: "admin", label: "主催者の管理画面" },
            ].map((t) => (
              <button key={t.key} onClick={() => setScreen(t.key)}
                className={`px-3 py-1.5 text-xs font-medium ${screen === t.key ? "bg-violet-100 text-violet-950" : "text-violet-200 hover:bg-violet-900"}`}>
                {t.label}
              </button>
            ))}
          </nav>

          {screen === "mypage" && (
            <label className="flex items-center gap-1.5 text-xs text-violet-300">
              表示する出展者
              <select value={exhibitorId} onChange={(e) => setExhibitorId(e.target.value)}
                className="rounded border border-violet-700 bg-violet-900 px-2 py-1 text-xs text-violet-50">
                {EXHIBITORS.map((x) => <option key={x.id} value={x.id}>{x.name}</option>)}
              </select>
            </label>
          )}

          <span className="ml-auto text-xs text-violet-300">
            {screen === "mypage"
              ? `${exhibitor.name} さまとしてログイン中`
              : `未入金 ${unpaidCount}件`}
          </span>
        </div>
      </header>

      {screen === "mypage"
        ? <MyPage exhibitor={exhibitor} entries={entries} actions={actions} toast={toast} />
        : <AdminPage entries={entries} actions={actions} toast={toast} />}

      <footer className="mx-auto max-w-7xl px-4 pb-8 pt-2 text-xs leading-relaxed text-neutral-500">
        <p>
          デモのため、データはページを開くたびに初期状態へ戻ります（保存はしていません）。
          出店区分・プラン・オプション・料金・ステータスはファイル冒頭の設定オブジェクトにまとめてあり、
          そこを差し替えるだけで別のイベントに対応できます。
        </p>
        <p className="mt-1">
          本番の構成：請求書・領収書のPDF生成、オンライン決済、入金の消込、通知メールはサーバー側で処理します。
        </p>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
