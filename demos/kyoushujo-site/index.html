const yen = (n) => "¥" + n.toLocaleString("ja-JP");

function Kicker({ d, children }) {
  if (d.kicker === "pill") {
    return (
      <span className="inline-block px-3 py-1 text-xs font-bold"
        style={{ background: d.c.brandSoft, color: d.c.brand, borderRadius: 999 }}>
        {children}
      </span>
    );
  }
  return (
    <span className="inline-flex items-center gap-2 text-xs font-bold" style={{ color: d.c.brand, letterSpacing: ".18em" }}>
      <span style={{ width: 28, height: 1, background: d.c.brand, display: "inline-block" }}></span>
      {children}
    </span>
  );
}

function H2({ d, children, sub }) {
  return (
    <div className="mb-8">
      <h2 className="text-2xl md:text-[32px] leading-tight mt-3"
        style={{ fontFamily: d.headFont, fontWeight: d.headWeight, color: d.c.text, letterSpacing: d.tracking }}>
        {children}
      </h2>
      {sub && <p className="mt-3 text-sm md:text-[15px] leading-relaxed" style={{ color: d.c.sub }}>{sub}</p>}
    </div>
  );
}

function Btn({ d, children, kind, onClick, full, small }) {
  const isPrimary = kind === "primary";
  const isGhost = kind === "ghost";
  const st = {
    borderRadius: d.btnRadius,
    fontFamily: d.bodyFont,
    background: isPrimary ? d.c.accent : isGhost ? "transparent" : d.c.brand,
    color: isGhost ? d.c.brand : "#fff",
    border: isGhost ? ("1px solid " + d.c.brand) : "1px solid transparent",
    padding: small ? "8px 16px" : "14px 26px",
    fontSize: small ? 13 : 15,
  };
  return (
    <button onClick={onClick} style={st}
      className={"font-bold transition hover:opacity-85 " + (full ? "w-full " : "") + "inline-flex items-center justify-center gap-2"}>
      {children}
    </button>
  );
}

function Card({ d, children, className, pad }) {
  return (
    <div className={className}
      style={{ background: d.c.surface, borderRadius: d.radius, border: "1px solid " + d.c.line,
        boxShadow: d.cardShadow, padding: pad === false ? 0 : 20 }}>
      {children}
    </div>
  );
}

function Section({ d, id, children, alt }) {
  return (
    <section id={id} className="px-5 py-14 md:py-20" style={{ background: alt ? d.c.brandSoft : "transparent" }}>
      <div className="max-w-5xl mx-auto">{children}</div>
    </section>
  );
}

/* ==================================================================
   料金シミュレーター
   このデモの中心です。教習所サイトで最も多い離脱理由は
   「結局いくらか分からない」なので、総額と内訳をその場で出します。
================================================================== */
function PriceSim({ d, lic, setLic, go, setApplyPrefill }) {
  const [style, setStyle] = useState("commute");
  const [plan, setPlan] = useState("regular");
  const [held, setHeld] = useState("none");
  const [discs, setDiscs] = useState(["student"]);
  const [opts, setOpts] = useState(["safety"]);

  const license = SITE.licenses.find((l) => l.id === lic) || SITE.licenses[0];

  const calc = useMemo(() => {
    const rows = [];
    const base = license.price[style];
    rows.push({ label: license.label + "・" + SITE.styles.find((s) => s.id === style).label + " 基本料金", amount: base });

    const p = SITE.plans.find((x) => x.id === plan);
    if (p.add) rows.push({ label: p.label + "プラン", amount: p.add });

    SITE.options.forEach((o) => {
      if (opts.indexOf(o.id) >= 0 && o.amount) rows.push({ label: o.label, amount: o.amount });
    });

    const h = SITE.held.find((x) => x.id === held);
    const off = h.off[license.cat] || 0;
    if (off) rows.push({ label: h.label + "（学科免除）", amount: -off });

    SITE.discounts.forEach((x) => {
      if (discs.indexOf(x.id) >= 0) rows.push({ label: x.label, amount: -x.amount });
    });

    const total = rows.reduce((a, b) => a + b.amount, 0);
    const monthly = Math.round((total * (1 + SITE.loan.rate) / SITE.loan.times) / 100) * 100;
    const saved = rows.filter((r) => r.amount < 0).reduce((a, b) => a + b.amount, 0);
    return { rows, total, monthly, saved: Math.abs(saved) };
  }, [lic, style, plan, held, discs, opts]);

  const toggle = (arr, setter, id) => {
    setter(arr.indexOf(id) >= 0 ? arr.filter((x) => x !== id) : arr.concat([id]));
  };

  const Choice = ({ items, value, onChange, cols }) => (
    <div className={"grid gap-2 " + (cols === 3 ? "grid-cols-3" : "grid-cols-2")}>
      {items.map((it) => {
        const on = value === it.id;
        return (
          <button key={it.id} onClick={() => onChange(it.id)} className="px-3 py-2 text-[13px] text-left transition"
            style={{ borderRadius: d.radius, border: "1px solid " + (on ? d.c.brand : d.c.line),
              background: on ? d.c.brandSoft : d.c.surface, color: on ? d.c.brandDark : d.c.text, fontWeight: on ? 700 : 400 }}>
            {it.label}
          </button>
        );
      })}
    </div>
  );

  const Check = ({ items, values, onToggle }) => (
    <div className="grid gap-2">
      {items.map((it) => {
        const on = values.indexOf(it.id) >= 0;
        return (
          <button key={it.id} onClick={() => onToggle(it.id)} className="flex items-start gap-3 px-3 py-2 text-left transition"
            style={{ borderRadius: d.radius, border: "1px solid " + (on ? d.c.brand : d.c.line), background: on ? d.c.brandSoft : d.c.surface }}>
            <span className="mt-[2px] flex-none inline-flex items-center justify-center"
              style={{ width: 18, height: 18, borderRadius: d.id === "bright" ? 6 : 2,
                border: "1px solid " + (on ? d.c.brand : d.c.line), background: on ? d.c.brand : "#fff", color: "#fff", fontSize: 12 }}>
              {on ? "✓" : ""}
            </span>
            <span>
              <span className="text-[13px] font-bold" style={{ color: d.c.text }}>{it.label}</span>
              {it.amount ? <span className="text-[13px] ml-2" style={{ color: d.c.brand }}>{it.amount > 0 ? "+" : "−"}{yen(Math.abs(it.amount)).slice(1)}円</span> : null}
              <span className="block text-[12px] mt-[2px]" style={{ color: d.c.sub }}>{it.note || it.desc}</span>
            </span>
          </button>
        );
      })}
    </div>
  );

  return (
    <Section d={d} id="price" alt>
      <Kicker d={d}>PRICE</Kicker>
      <H2 d={d} sub="入学金・学科・技能（規定時限）・検定料・教材費・適性検査料をすべて含んだ総額です。別途かかるのは免許センターの本試験手数料（3,800円程度）だけです。">
        料金シミュレーター
      </H2>

      <div className="grid lg:grid-cols-[1fr_360px] gap-5 items-start">
        <Card d={d}>
          <div className="grid gap-5">
            <div>
              <div className="text-[13px] font-bold mb-2" style={{ color: d.c.text }}>1. 取得する免許</div>
              <Choice items={SITE.licenses} value={lic} onChange={setLic} cols={3} />
            </div>
            <div className="grid sm:grid-cols-2 gap-5">
              <div>
                <div className="text-[13px] font-bold mb-2" style={{ color: d.c.text }}>2. 通い方</div>
                <Choice items={SITE.styles} value={style} onChange={setStyle} />
                <p className="mt-2 text-[12px]" style={{ color: d.c.sub }}>{SITE.styles.find((s) => s.id === style).desc}</p>
              </div>
              <div>
                <div className="text-[13px] font-bold mb-2" style={{ color: d.c.text }}>3. お持ちの免許</div>
                <Choice items={SITE.held} value={held} onChange={setHeld} />
              </div>
            </div>
            <div>
              <div className="text-[13px] font-bold mb-2" style={{ color: d.c.text }}>4. 予約プラン</div>
              <Choice items={SITE.plans} value={plan} onChange={setPlan} cols={3} />
              <p className="mt-2 text-[12px]" style={{ color: d.c.sub }}>{SITE.plans.find((p) => p.id === plan).desc}</p>
            </div>
            <div className="grid sm:grid-cols-2 gap-5">
              <div>
                <div className="text-[13px] font-bold mb-2" style={{ color: d.c.text }}>5. 割引（併用できます）</div>
                <Check items={SITE.discounts} values={discs} onToggle={(id) => toggle(discs, setDiscs, id)} />
              </div>
              <div>
                <div className="text-[13px] font-bold mb-2" style={{ color: d.c.text }}>6. オプション</div>
                <Check items={SITE.options} values={opts} onToggle={(id) => toggle(opts, setOpts, id)} />
              </div>
            </div>
          </div>
        </Card>

        <div className="lg:sticky lg:top-[120px]">
          <Card d={d}>
            <div className="text-[13px] font-bold" style={{ color: d.c.sub }}>お見積り（税込）</div>
            <div className="mt-2 grid gap-1 text-[13px]">
              {calc.rows.map((r, i) => (
                <div key={i} className="flex justify-between gap-3 py-[3px]" style={{ color: r.amount < 0 ? d.c.brand : d.c.text }}>
                  <span>{r.label}</span>
                  <span className="flex-none tabular-nums">{r.amount < 0 ? "−" + yen(-r.amount).slice(1) : yen(r.amount).slice(1)}円</span>
                </div>
              ))}
            </div>
            <div className="mt-4 pt-4 flex items-end justify-between" style={{ borderTop: "1px solid " + d.c.line }}>
              <span className="text-[13px] font-bold" style={{ color: d.c.text }}>合計</span>
              <span style={{ fontFamily: d.headFont, fontWeight: d.headWeight, fontSize: 30, color: d.c.brand, lineHeight: 1 }}>
                {yen(calc.total)}
              </span>
            </div>
            {calc.saved > 0 && (
              <div className="mt-2 text-[12px] px-3 py-2" style={{ background: d.c.brandSoft, color: d.c.brandDark, borderRadius: d.radius }}>
                割引・免除の合計 {yen(calc.saved)} が反映されています
              </div>
            )}
            <div className="mt-3 text-[12px]" style={{ color: d.c.sub }}>
              {SITE.loan.label}なら 月々 <b style={{ color: d.c.text }}>{yen(calc.monthly)}</b> の目安です（金利年{(SITE.loan.rate * 100).toFixed(1)}%・審査あり）
            </div>
            <div className="mt-4">
              <Btn d={d} kind="primary" full onClick={() => {
                setApplyPrefill({ license: lic, style: style, total: calc.total });
                go("apply");
              }}>この内容で仮申込に進む</Btn>
            </div>
            <p className="mt-3 text-[11px] leading-relaxed" style={{ color: d.c.sub }}>
              規定時限を超えた場合の追加教習料は1時限5,500円、再検定は1回5,500円です。安心パックにお入りの場合は規定内で無料になります。
            </p>
          </Card>
        </div>
      </div>
    </Section>
  );
}

/* ================== 入校日・空き状況・送迎バス ================== */
function Schedule({ d, go, setLic }) {
  const [route, setRoute] = useState(SITE.buses[0].id);
  const bus = SITE.buses.find((b) => b.id === route);
  const mark = (s) => s === "○" ? { c: d.c.brand, t: "空きあり" } : s === "△" ? { c: d.c.accent, t: "残りわずか" } : { c: "#B9BFC5", t: "満了" };

  return (
    <Section d={d} id="schedule">
      <Kicker d={d}>SCHEDULE</Kicker>
      <H2 d={d} sub="入校日ごとの空き状況です。× の日は受付を締め切っています。表の記号を押すと、その免許で仮申込に進めます。">
        入校日の空き状況と送迎バス
      </H2>

      <Card d={d} pad={false} className="overflow-x-auto">
        <table className="w-full text-[13px]" style={{ minWidth: 560 }}>
          <thead>
            <tr style={{ background: d.c.bg }}>
              <th className="text-left px-4 py-3" style={{ color: d.c.sub, fontWeight: 700 }}>入校日</th>
              {SITE.licenses.map((l) => (
                <th key={l.id} className="px-3 py-3 text-center" style={{ color: d.c.sub, fontWeight: 700 }}>{l.label}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {SITE.intakes.map((it, i) => (
              <tr key={i} style={{ borderTop: "1px solid " + d.c.line }}>
                <td className="px-4 py-3 font-bold" style={{ color: d.c.text }}>{it.date}</td>
                {SITE.licenses.map((l) => {
                  const s = it.stock[l.id];
                  const m = mark(s);
                  return (
                    <td key={l.id} className="px-3 py-3 text-center">
                      <button disabled={s === "×"} onClick={() => { setLic(l.id); go("apply"); }}
                        title={m.t} className="font-bold disabled:cursor-not-allowed"
                        style={{ color: m.c, fontSize: 18, opacity: s === "×" ? .5 : 1 }}>{s}</button>
                    </td>
                  );
                })}
              </tr>
            ))}
          </tbody>
        </table>
      </Card>
      <p className="mt-3 text-[12px]" style={{ color: d.c.sub }}>
        ○ 空きあり／△ 残りわずか（3名以下）／× 満了。空き状況は管理画面から更新でき、更新すると即座にこの表に反映されます。
      </p>

      <div className="mt-10 grid md:grid-cols-[220px_1fr] gap-4 items-start">
        <div className="grid gap-2">
          {SITE.buses.map((b) => (
            <button key={b.id} onClick={() => setRoute(b.id)} className="px-4 py-3 text-left text-[13px] transition"
              style={{ borderRadius: d.radius, border: "1px solid " + (route === b.id ? d.c.brand : d.c.line),
                background: route === b.id ? d.c.brandSoft : d.c.surface,
                color: route === b.id ? d.c.brandDark : d.c.text, fontWeight: route === b.id ? 700 : 400 }}>
              {b.name}
            </button>
          ))}
        </div>
        <Card d={d}>
          <div className="text-[13px] font-bold mb-3" style={{ color: d.c.text }}>{bus.name}｜停留所</div>
          <div className="flex flex-wrap items-center gap-2 mb-5">
            {bus.stops.map((s, i) => (
              <span key={s} className="flex items-center gap-2 text-[13px]" style={{ color: d.c.sub }}>
                <span className="px-3 py-1" style={{ background: d.c.bg, borderRadius: d.btnRadius, color: d.c.text }}>{s}</span>
                {i < bus.stops.length - 1 && <span style={{ color: d.c.line }}>→</span>}
              </span>
            ))}
          </div>
          <div className="text-[13px] font-bold mb-2" style={{ color: d.c.text }}>始発停留所の発車時刻</div>
          <div className="flex flex-wrap gap-2">
            {bus.times.map((t) => (
              <span key={t} className="px-3 py-1 text-[13px] tabular-nums"
                style={{ border: "1px solid " + d.c.line, borderRadius: d.btnRadius, color: d.c.text }}>{t}</span>
            ))}
          </div>
          <p className="mt-4 text-[12px]" style={{ color: d.c.sub }}>
            道路状況により5分ほど前後します。最寄りに停留所がない場合はご相談ください。
          </p>
        </Card>
      </div>
    </Section>
  );
}

/* ==================================================================
   Web仮申込フォーム
   入力 → 確認 → 完了の3段階。必須・形式・年齢の検証つき。
   送信内容はどこにも保存も送信もしません（デモのため）。
================================================================== */
/* フォーム部品。Apply の外に置いています。コンポーネントを関数の内側で
   定義すると、1文字入力するたびに作り直されて入力欄のフォーカスが外れます。 */
function Field({ d, label, required, err, children }) {
  return (
    <div>
      <label className="flex items-center gap-2 text-[13px] font-bold mb-1" style={{ color: d.c.text }}>
        {label}
        {required && <span className="px-[6px] py-[1px] text-[10px]" style={{ background: d.c.accent, color: "#fff", borderRadius: 3 }}>必須</span>}
      </label>
      {children}
      {err && <p className="mt-1 text-[12px]" style={{ color: "#D9534F" }}>{err}</p>}
    </div>
  );
}

function TextInput({ d, value, onChange, err, type, ph }) {
  return (
    <input type={type || "text"} value={value} placeholder={ph}
      onChange={(e) => onChange(e.target.value)}
      className="w-full px-3 py-[10px] text-[14px] outline-none"
      style={{ border: "1px solid " + (err ? "#D9534F" : d.c.line), borderRadius: d.radius, background: d.c.surface, color: d.c.text }} />
  );
}

function Select({ d, value, onChange, children }) {
  return (
    <select value={value} onChange={(e) => onChange(e.target.value)}
      className="w-full px-3 py-[10px] text-[14px] outline-none"
      style={{ border: "1px solid " + d.c.line, borderRadius: d.radius, background: d.c.surface, color: d.c.text }}>
      {children}
    </select>
  );
}

const EMPTY = { name: "", kana: "", birth: "", tel: "", mail: "", license: "at", style: "commute", intake: "", bus: "", note: "", agree: false };

function Apply({ d, prefill }) {
  const [f, setF] = useState(EMPTY);
  const [step, setStep] = useState(1);
  const [errs, setErrs] = useState({});

  useEffect(() => {
    if (prefill) setF((p) => Object.assign({}, p, { license: prefill.license, style: prefill.style }));
  }, [prefill]);

  const set = (k, v) => setF(Object.assign({}, f, { [k]: v }));

  const validate = () => {
    const e = {};
    if (!f.name.trim()) e.name = "お名前をご入力ください";
    if (!f.kana.trim()) e.kana = "フリガナをご入力ください";
    else if (!/^[ァ-ヶー\s　]+$/.test(f.kana)) e.kana = "全角カタカナでご入力ください";
    if (!f.birth) e.birth = "生年月日をご入力ください";
    else {
      const b = new Date(f.birth);
      const age = (new Date("2026-08-17") - b) / (365.25 * 24 * 3600 * 1000);
      if (age < 17.5) e.birth = "普通車は18歳の誕生日の2か月前から入校できます（現在の年齢では入校日が限られます）";
      if (age > 90 || age < 0) e.birth = "生年月日をご確認ください";
    }
    if (!f.tel.trim()) e.tel = "電話番号をご入力ください";
    else if (!/^0\d{9,10}$/.test(f.tel.replace(/[-\s]/g, ""))) e.tel = "ハイフンなし10〜11桁でご入力ください";
    if (!f.mail.trim()) e.mail = "メールアドレスをご入力ください";
    else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.mail)) e.mail = "メールアドレスの形式をご確認ください";
    if (!f.intake) e.intake = "希望入校日をお選びください";
    if (!f.agree) e.agree = "個人情報の取り扱いにご同意ください";
    setErrs(e);
    return Object.keys(e).length === 0;
  };

  const lic = SITE.licenses.find((l) => l.id === f.license);
  const stl = SITE.styles.find((s) => s.id === f.style);
  const avail = SITE.intakes.filter((it) => it.stock[f.license] !== "×");

  if (step === 3) {
    return (
      <Section d={d} id="apply">
        <Card d={d}>
          <div className="text-center py-8">
            <div className="inline-flex items-center justify-center mb-5"
              style={{ width: 64, height: 64, borderRadius: d.numberStyle === "circle" ? 999 : 4, background: d.c.brandSoft, color: d.c.brand, fontSize: 30 }}>✓</div>
            <h2 style={{ fontFamily: d.headFont, fontWeight: d.headWeight, fontSize: 24, color: d.c.text }}>仮申込を受け付けました</h2>
            <p className="mt-4 text-[14px] leading-relaxed" style={{ color: d.c.sub }}>
              ご入力のメールアドレスに、受付内容と<b style={{ color: d.c.text }}>必要書類のご案内</b>をお送りしました。<br />
              1営業日以内に担当者からお電話でご連絡します。この時点で費用は発生しません。
            </p>
            <div className="mt-6 inline-block text-left px-5 py-4 text-[13px]" style={{ background: d.c.bg, borderRadius: d.radius, color: d.c.text }}>
              <div>受付番号：<b>2026-0817-0031</b></div>
              <div className="mt-1">{lic.label}／{stl.label}／{f.intake} 入校希望</div>
            </div>
            <div className="mt-6">
              <Btn d={d} kind="ghost" onClick={() => { setF(EMPTY); setStep(1); }}>最初に戻る（デモ）</Btn>
            </div>
            <p className="mt-6 text-[12px]" style={{ color: d.c.sub }}>
              ※ デモのため、入力内容はどこにも保存・送信されていません。
            </p>
          </div>
        </Card>
      </Section>
    );
  }

  if (step === 2) {
    const rows = [
      ["お名前", f.name + "（" + f.kana + "）"],
      ["生年月日", f.birth],
      ["電話番号", f.tel],
      ["メールアドレス", f.mail],
      ["希望免許", lic.label],
      ["通い方", stl.label],
      ["希望入校日", f.intake],
      ["送迎バス", f.bus || "利用しない・未定"],
      ["ご質問", f.note || "（なし）"],
    ];
    return (
      <Section d={d} id="apply">
        <Kicker d={d}>CONFIRM</Kicker>
        <H2 d={d} sub="内容をご確認ください。修正する場合は「入力に戻る」を押してください。">入力内容の確認</H2>
        <Card d={d}>
          <div className="grid gap-0 text-[14px]">
            {rows.map((r, i) => (
              <div key={i} className="grid sm:grid-cols-[160px_1fr] gap-1 sm:gap-4 py-3"
                style={{ borderTop: i === 0 ? "none" : "1px solid " + d.c.line }}>
                <span style={{ color: d.c.sub }}>{r[0]}</span>
                <span style={{ color: d.c.text }}>{r[1]}</span>
              </div>
            ))}
          </div>
          <div className="mt-6 flex flex-wrap gap-3">
            <Btn d={d} kind="primary" onClick={() => setStep(3)}>この内容で送信する</Btn>
            <Btn d={d} kind="ghost" onClick={() => setStep(1)}>入力に戻る</Btn>
          </div>
        </Card>
      </Section>
    );
  }

  return (
    <Section d={d} id="apply">
      <Kicker d={d}>ENTRY</Kicker>
      <H2 d={d} sub="所要3分。この時点で費用は発生しません。1営業日以内に担当者からご連絡します。">
        Web仮申込
      </H2>
      <Card d={d}>
        <div className="grid sm:grid-cols-2 gap-5">
          <Field d={d} label="お名前" required err={errs.name}>
            <TextInput d={d} value={f.name} onChange={(v) => set("name", v)} err={errs.name} ph="南野 太郎" />
          </Field>
          <Field d={d} label="フリガナ" required err={errs.kana}>
            <TextInput d={d} value={f.kana} onChange={(v) => set("kana", v)} err={errs.kana} ph="ミナミノ タロウ" />
          </Field>
          <Field d={d} label="生年月日" required err={errs.birth}>
            <TextInput d={d} type="date" value={f.birth} onChange={(v) => set("birth", v)} err={errs.birth} />
          </Field>
          <Field d={d} label="電話番号" required err={errs.tel}>
            <TextInput d={d} value={f.tel} onChange={(v) => set("tel", v)} err={errs.tel} ph="09012345678" />
          </Field>
          <div className="sm:col-span-2">
            <Field d={d} label="メールアドレス" required err={errs.mail}>
              <TextInput d={d} type="email" value={f.mail} onChange={(v) => set("mail", v)} err={errs.mail} ph="you@example.com" />
            </Field>
          </div>

          <Field d={d} label="希望する免許" required>
            <Select d={d} value={f.license} onChange={(v) => set("license", v)}>
              {SITE.licenses.map((l) => <option key={l.id} value={l.id}>{l.label}</option>)}
            </Select>
          </Field>
          <Field d={d} label="通い方" required>
            <Select d={d} value={f.style} onChange={(v) => set("style", v)}>
              {SITE.styles.map((s) => <option key={s.id} value={s.id}>{s.label}</option>)}
            </Select>
          </Field>

          <Field d={d} label="希望入校日" required err={errs.intake}>
            <Select d={d} value={f.intake} onChange={(v) => set("intake", v)}>
              <option value="">選択してください</option>
              {avail.map((it) => (
                <option key={it.date} value={it.date}>{it.date}{it.stock[f.license] === "△" ? "（残りわずか）" : ""}</option>
              ))}
            </Select>
          </Field>
          <Field d={d} label="送迎バス">
            <Select d={d} value={f.bus} onChange={(v) => set("bus", v)}>
              <option value="">利用しない・未定</option>
              {SITE.buses.map((b) => b.stops.slice(0, -1).map((s) => (
                <option key={b.id + s} value={b.name + "／" + s}>{b.name}／{s}</option>
              )))}
            </Select>
          </Field>

          <div className="sm:col-span-2">
            <Field d={d} label="ご質問・ご要望">
              <textarea value={f.note} onChange={(e) => set("note", e.target.value)} rows={4}
                placeholder="通えるのが平日夜だけです、といったご事情もこちらにご記入ください。"
                className="w-full px-3 py-[10px] text-[14px] outline-none"
                style={{ border: "1px solid " + d.c.line, borderRadius: d.radius, background: d.c.surface, color: d.c.text }} />
            </Field>
          </div>
        </div>

        <div className="mt-5 px-4 py-3 text-[12px] leading-relaxed" style={{ background: d.c.bg, borderRadius: d.radius, color: d.c.sub }}>
          <b style={{ color: d.c.text }}>入校日にお持ちいただくもの</b>：住民票（本籍地の記載あり・マイナンバーの記載なし・3か月以内）／本人確認書類／印鑑／眼鏡・コンタクト（必要な方）
        </div>

        <label className="mt-5 flex items-start gap-3 cursor-pointer">
          <input type="checkbox" checked={f.agree} onChange={(e) => set("agree", e.target.checked)} className="mt-1" />
          <span className="text-[13px]" style={{ color: d.c.text }}>
            個人情報の取り扱いに同意します
            <span className="block text-[12px]" style={{ color: d.c.sub }}>いただいた情報は入校手続きのご案内にのみ使用します。</span>
          </span>
        </label>
        {errs.agree && <p className="mt-1 text-[12px]" style={{ color: "#D9534F" }}>{errs.agree}</p>}

        <div className="mt-6">
          <Btn d={d} kind="primary" full onClick={() => { if (validate()) setStep(2); }}>入力内容を確認する</Btn>
        </div>
        <p className="mt-3 text-[12px] text-center" style={{ color: d.c.sub }}>
          お電話でのお申し込みも承ります　
          <a href={"tel:" + SITE.school.tel.replace(/-/g, "")} style={{ color: d.c.brand, fontWeight: 700 }}>{SITE.school.tel}</a>
        </p>
      </Card>
    </Section>
  );
}

/* ================== アクセス・フッター ================== */
function Access({ d }) {
  return (
    <Section d={d} alt>
      <Kicker d={d}>ACCESS</Kicker>
      <H2 d={d}>アクセス</H2>
      <div className="grid md:grid-cols-2 gap-4 items-start">
        <Card d={d}>
          <div className="grid gap-3 text-[14px]">
            <div>
              <div className="text-[12px]" style={{ color: d.c.sub }}>所在地</div>
              <div style={{ color: d.c.text }}>{SITE.school.address}</div>
            </div>
            <div>
              <div className="text-[12px]" style={{ color: d.c.sub }}>受付時間</div>
              <div style={{ color: d.c.text }}>{SITE.school.telNote}／休校日：{SITE.school.holiday}</div>
            </div>
            <div>
              <div className="text-[12px] mb-1" style={{ color: d.c.sub }}>交通</div>
              <ul className="grid gap-1">
                {SITE.school.access.map((a) => (
                  <li key={a} className="flex gap-2" style={{ color: d.c.text }}>
                    <span style={{ color: d.c.brand }}>・</span>{a}
                  </li>
                ))}
              </ul>
            </div>
          </div>
        </Card>
        <div className="flex items-center justify-center text-[13px]"
          style={{ height: 260, background: d.c.surface, border: "1px dashed " + d.c.line, borderRadius: d.radius, color: d.c.sub }}>
          Googleマップ埋め込み位置（本番では実際の地図が入ります）
        </div>
      </div>
    </Section>
  );
}

function Footer({ d, go }) {
  return (
    <footer style={{ background: d.c.dark, color: "#fff" }}>
      <div className="max-w-5xl mx-auto px-5 py-12">
        <div className="grid md:grid-cols-[1fr_auto] gap-8 items-start">
          <div>
            <div style={{ fontFamily: d.headFont, fontWeight: d.headWeight, fontSize: 20 }}>{SITE.school.name}</div>
            <div className="mt-2 text-[13px]" style={{ color: "rgba(255,255,255,.7)" }}>{SITE.school.address}</div>
            <a href={"tel:" + SITE.school.tel.replace(/-/g, "")} className="mt-3 inline-block font-bold" style={{ fontSize: 24 }}>{SITE.school.tel}</a>
            <div className="text-[12px]" style={{ color: "rgba(255,255,255,.7)" }}>{SITE.school.telNote}</div>
          </div>
          <div className="grid gap-2 text-[13px]">
            {NAV.map((n) => (
              <button key={n.id} onClick={() => go(n.id)} className="text-left hover:opacity-70" style={{ color: "rgba(255,255,255,.85)" }}>{n.label}</button>
            ))}
          </div>
        </div>
        <div className="mt-10 pt-5 text-[11px] leading-relaxed" style={{ borderTop: "1px solid rgba(255,255,255,.2)", color: "rgba(255,255,255,.55)" }}>
          このページはポートフォリオ用のデモです。校名・料金・時刻・お客様の声はすべて架空のものです。
          入力内容はどこにも保存・送信されません。
        </div>
      </div>
    </footer>
  );
}

/* ================== スマホ固定CTA ================== */
function MobileBar({ d, go }) {
  return (
    <div className="sm:hidden fixed bottom-0 left-0 right-0 z-40 grid grid-cols-2 gap-2 p-3"
      style={{ background: d.c.surface, borderTop: "1px solid " + d.c.line }}>
      <a href={"tel:" + SITE.school.tel.replace(/-/g, "")} className="py-3 text-center font-bold text-[14px]"
        style={{ border: "1px solid " + d.c.brand, color: d.c.brand, borderRadius: d.btnRadius }}>電話する</a>
      <button onClick={() => go("apply")} className="py-3 text-center font-bold text-[14px]"
        style={{ background: d.c.accent, color: "#fff", borderRadius: d.btnRadius }}>Web仮申込</button>
    </div>
  );
}

/* ================== 全体 ================== */
function App() {
  const [designId, setDesignId] = useState("bright");
  const [note, setNote] = useState(false);
  const [lic, setLic] = useState("at");
  const [prefill, setPrefill] = useState(null);
  const d = DESIGNS[designId];

  const go = (id) => {
    const el = document.getElementById(id);
    if (el) window.scrollTo({ top: el.offsetTop - 110, behavior: "smooth" });
  };

  return (
    <div style={{ background: d.c.bg, fontFamily: d.bodyFont, color: d.c.text, minHeight: "100vh", paddingBottom: 72 }}>
      <DemoBar d={d} setDesign={setDesignId} note={note} setNote={setNote} />
      <Header d={d} go={go} />
      <Hero d={d} go={go} />
      <News d={d} />
      <Licenses d={d} go={go} setLic={setLic} />
      <PriceSim d={d} lic={lic} setLic={setLic} go={go} setApplyPrefill={setPrefill} />
      <Flow d={d} />
      <Reasons d={d} />
      <Schedule d={d} go={go} setLic={setLic} />
      <Voices d={d} />
      <Faq d={d} />
      <Apply d={d} prefill={prefill} />
      <Access d={d} />
      <Footer d={d} go={go} />
      <MobileBar d={d} go={go} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
