<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EC向け問い合わせ自動応答 デモ | 定型は自動で片づけ、判断が要るものだけ人に残す</title>
<meta name="description" content="選択式の自動応答・AIの自動応答・有人対応の3段階で問い合わせを切り分けるデモです。どこまでが自動で片づき、何が人に残るのかを画面上で確認できます。掲載データはすべてデモ用の想定値です。">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
/* ------------------------------------------------------------------
   :root のトークンは索引ページ（リポジトリ直下の index.html）から
   そのまま持ってきています。ここで新しい色や寸法は作っていません。
------------------------------------------------------------------ */
:root {
  --c-base:         #ffffff;
  --c-paper:        #f5f1e8;
  --c-ink:          #1b1c1e;
  --c-ink-2:        #4c4f54;
  --c-ink-3:        #7d8087;
  --c-rule:         #ddd7c8;
  --c-rule-strong:  #b3ab98;
  --c-accent:       #2d4257;
  --c-accent-tint:  #eef1f3;
  --c-caution:      #9c463b;
  --c-caution-tint: #f3e9e6;
  --font-mincho: "Hiragino Mincho ProN","Yu Mincho","YuMincho","MS PMincho","Noto Serif JP",serif;
  --font-gothic: "Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","YuGothic",Meiryo,"Noto Sans JP",sans-serif;
  --fs-note:  13px;  --fs-body: 15px;  --fs-sub: 18px;  --fs-head: 24px;  --fs-title: 33px;
  --lh-body: 1.9;  --lh-head: 1.45;  --ls-body: 0.04em;  --ls-head: 0.06em;
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 16px;  --sp-4: 32px;  --sp-5: 64px;
  --rule-1: 1px;  --rule-2: 2px;
}

html { -webkit-text-size-adjust: 100%; }

/* Tailwind の preflight は実行時に head の末尾へ挿入されるため、
   body と a はセレクタの詳細度を上げて上書きされないようにしています。 */
html body {
  margin: 0;
  background: var(--c-base);
  color: var(--c-ink);
  font-family: var(--font-gothic);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  letter-spacing: var(--ls-body);
  text-align: left;
}

*, *::before, *::after { border-radius: 0; box-shadow: none; }

body a {
  color: var(--c-accent);
  text-decoration: underline;
  text-underline-offset: 3px;
}

body a:hover { text-decoration-thickness: 2px; }

:focus-visible { outline: var(--rule-2) solid var(--c-accent); outline-offset: 2px; }

/* ------------------------------------------------------------------
   版面
------------------------------------------------------------------ */
.p-topbar { border-top: 3px solid var(--c-accent); }

.p-sheet {
  max-width: 1080px;
  margin: 0 auto;
  padding: 0 var(--sp-3);
}

.p-section { padding-top: var(--sp-5); }
.p-section:last-of-type { padding-bottom: var(--sp-5); }

/* ------------------------------------------------------------------
   ヘッダー
------------------------------------------------------------------ */
.p-masthead { padding-top: var(--sp-4); padding-bottom: var(--sp-4); }

.p-masthead__kicker {
  font-size: var(--fs-note);
  letter-spacing: var(--ls-head);
  color: var(--c-ink-3);
  margin: 0 0 var(--sp-2);
}

.p-masthead__title {
  font-family: var(--font-mincho);
  font-size: var(--fs-title);
  line-height: var(--lh-head);
  letter-spacing: var(--ls-head);
  font-weight: 600;
  color: var(--c-ink);
  margin: 0;
  padding-bottom: var(--sp-3);
  border-bottom: var(--rule-2) solid var(--c-accent);
}

.p-masthead__lead {
  margin: var(--sp-3) 0 0;
  max-width: 42em;
  color: var(--c-ink-2);
}

.p-masthead__meta {
  margin: var(--sp-3) 0 0;
  font-size: var(--fs-note);
  color: var(--c-ink-3);
}

.p-masthead__meta a { margin-left: var(--sp-2); }

/* ------------------------------------------------------------------
   注記帯
------------------------------------------------------------------ */
.p-notice {
  margin-top: var(--sp-4);
  background: var(--c-caution-tint);
  border-left: 3px solid var(--c-caution);
  padding: var(--sp-3);
}

.p-notice__title {
  margin: 0 0 var(--sp-1);
  font-size: var(--fs-note);
  font-weight: 700;
  letter-spacing: var(--ls-head);
  color: var(--c-caution);
}

.p-notice__body {
  margin: 0 0 var(--sp-2);
  font-size: var(--fs-note);
  line-height: 1.8;
  color: var(--c-ink-2);
}

.p-notice__body:last-child { margin-bottom: 0; }

/* ------------------------------------------------------------------
   節見出し
------------------------------------------------------------------ */
.p-heading {
  margin: 0 0 var(--sp-3);
  padding-bottom: var(--sp-2);
  border-bottom: var(--rule-2) solid var(--c-rule-strong);
}

.p-heading__no {
  display: block;
  font-size: var(--fs-note);
  letter-spacing: var(--ls-head);
  color: var(--c-accent);
  margin-bottom: var(--sp-1);
}

.p-heading__text {
  font-family: var(--font-mincho);
  font-size: var(--fs-head);
  line-height: var(--lh-head);
  letter-spacing: var(--ls-head);
  font-weight: 600;
  margin: 0;
}

.p-lead {
  margin: 0 0 var(--sp-3);
  max-width: 44em;
  color: var(--c-ink-2);
}

.p-note {
  margin: var(--sp-2) 0 0;
  font-size: var(--fs-note);
  line-height: 1.8;
  color: var(--c-ink-3);
}

/* ------------------------------------------------------------------
   切り分けの要約
------------------------------------------------------------------ */
.p-scope {
  border-left: 3px solid var(--c-accent);
  background: var(--c-accent-tint);
  padding: var(--sp-3);
  margin-bottom: var(--sp-3);
}

.p-scope p { margin: 0; }
.p-scope__sub { margin-top: var(--sp-1) !important; font-size: var(--fs-note); color: var(--c-ink-2); }
.p-scope strong { font-weight: 700; color: var(--c-accent); }

/* ------------------------------------------------------------------
   画面の切り替え（罫線で下線を引くだけの札）
------------------------------------------------------------------ */
.p-tabs {
  display: flex;
  overflow-x: auto;
  border-top: var(--rule-1) solid var(--c-rule);
  border-bottom: var(--rule-2) solid var(--c-rule-strong);
}

.p-tab {
  flex: 0 0 auto;
  font-family: var(--font-gothic);
  font-size: var(--fs-note);
  letter-spacing: var(--ls-body);
  white-space: nowrap;
  padding: var(--sp-2) var(--sp-3);
  margin-bottom: -2px;
  color: var(--c-ink-2);
  background: transparent;
  border: 0;
  border-bottom: 3px solid transparent;
  cursor: pointer;
}

.p-tab:hover { background: var(--c-accent-tint); }

.p-tab[aria-current="page"] {
  color: var(--c-accent);
  font-weight: 700;
  border-bottom-color: var(--c-accent);
}

/* ------------------------------------------------------------------
   ボタン
------------------------------------------------------------------ */
.p-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--sp-2);
}

.p-actions__spacer { flex: 1 1 auto; }

.p-btn {
  font-family: var(--font-gothic);
  font-size: var(--fs-note);
  letter-spacing: var(--ls-body);
  color: var(--c-accent);
  background: var(--c-accent-tint);
  border: var(--rule-1) solid var(--c-rule-strong);
  padding: var(--sp-1) var(--sp-2);
  cursor: pointer;
}

.p-btn:hover { background: var(--c-base); }
.p-btn:disabled { color: var(--c-ink-3); background: var(--c-base); border-color: var(--c-rule); cursor: not-allowed; }

.p-btn--main {
  font-size: var(--fs-body);
  font-weight: 700;
  background: var(--c-base);
  border: var(--rule-2) solid var(--c-accent);
  padding: var(--sp-2) var(--sp-3);
}

.p-btn--main:hover { background: var(--c-accent-tint); }

.p-btn--quiet { color: var(--c-ink-2); background: var(--c-base); }

.p-choice {
  font-family: var(--font-gothic);
  font-size: var(--fs-note);
  letter-spacing: var(--ls-body);
  color: var(--c-ink-2);
  background: var(--c-base);
  border: var(--rule-1) solid var(--c-rule-strong);
  padding: var(--sp-1) var(--sp-2);
  cursor: pointer;
}

.p-choice:hover { background: var(--c-accent-tint); }

.p-choice[aria-pressed="true"] {
  color: var(--c-accent);
  font-weight: 700;
  background: var(--c-accent-tint);
  border-color: var(--c-accent);
}

.p-choice__n { margin-left: var(--sp-1); font-feature-settings: "tnum" 1; }

/* ------------------------------------------------------------------
   お客さま画面（やり取りと、段階の表）
------------------------------------------------------------------ */
.p-split {
  display: grid;
  grid-template-columns: 1fr 300px;
  gap: var(--sp-4);
  align-items: start;
}

.p-chat {
  border-top: var(--rule-2) solid var(--c-accent);
  border-bottom: var(--rule-2) solid var(--c-rule-strong);
  min-width: 0;
}

.p-chat__head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: var(--sp-2);
  padding: var(--sp-2) 0 var(--sp-3);
  border-bottom: var(--rule-1) solid var(--c-rule);
}

.p-chat__shop {
  font-family: var(--font-mincho);
  font-size: var(--fs-sub);
  line-height: var(--lh-head);
  letter-spacing: var(--ls-head);
  font-weight: 600;
  margin: 0;
}

.p-chat__hours { font-size: var(--fs-note); color: var(--c-ink-3); }

/* 紙色を地にして、やり取りの枠であることを罫線だけで示します */
.p-chat__log {
  height: 26rem;
  overflow-y: auto;
  padding: var(--sp-3);
  background: var(--c-paper);
  border-bottom: var(--rule-1) solid var(--c-rule);
}

.p-chat__ctrl { padding: var(--sp-3) 0; }

.p-msg { margin-bottom: var(--sp-3); }
.p-msg:last-child { margin-bottom: 0; }

.p-msg__who {
  display: block;
  margin-bottom: var(--sp-1);
  font-size: var(--fs-note);
  letter-spacing: var(--ls-head);
  color: var(--c-ink-3);
}

.p-msg__body {
  display: block;
  max-width: 44em;
  padding: var(--sp-2) var(--sp-3);
  font-size: var(--fs-body);
  line-height: 1.85;
  white-space: pre-wrap;
  border: var(--rule-1) solid var(--c-rule);
  background: var(--c-base);
  color: var(--c-ink);
}

/* お客さまの発言は右に寄せ、罫線も右側に置きます */
.p-msg--user { text-align: right; }
.p-msg--user .p-msg__body {
  display: inline-block;
  text-align: left;
  border: var(--rule-1) solid var(--c-rule-strong);
  border-right: 3px solid var(--c-accent);
  background: var(--c-accent-tint);
}

.p-msg--bot .p-msg__body { border-left: 3px solid var(--c-rule-strong); }
.p-msg--closing .p-msg__body { border-left-color: var(--c-accent); background: var(--c-accent-tint); }
.p-msg--system .p-msg__body { border-left-color: var(--c-rule); color: var(--c-ink-2); }

.p-msg__ai {
  display: block;
  margin-bottom: var(--sp-1);
  font-size: var(--fs-note);
  font-weight: 700;
  letter-spacing: var(--ls-head);
  color: var(--c-accent);
}

/* 選択肢 */
.p-opts { display: flex; flex-wrap: wrap; gap: var(--sp-2); }

.p-opt {
  font-family: var(--font-gothic);
  font-size: var(--fs-note);
  letter-spacing: var(--ls-body);
  text-align: left;
  color: var(--c-ink);
  background: var(--c-base);
  border: var(--rule-1) solid var(--c-rule-strong);
  border-left: 3px solid var(--c-accent);
  padding: var(--sp-2);
  cursor: pointer;
}

.p-opt:hover { background: var(--c-accent-tint); }
.p-opt__more { margin-left: var(--sp-2); color: var(--c-ink-3); }

.p-ask { display: flex; gap: var(--sp-2); margin-bottom: var(--sp-2); }

.p-ask__input {
  flex: 1 1 auto;
  min-width: 0;
  font-family: var(--font-gothic);
  font-size: var(--fs-body);
  color: var(--c-ink);
  background: var(--c-base);
  border: var(--rule-1) solid var(--c-rule-strong);
  padding: var(--sp-1) var(--sp-2);
}

.p-ask__input:focus { border-color: var(--c-accent); }

/* 段階の表 */
.p-rail {
  border-top: var(--rule-2) solid var(--c-accent);
  border-bottom: var(--rule-1) solid var(--c-rule-strong);
  min-width: 0;
}

.p-rail__head { padding: var(--sp-2) 0 var(--sp-3); border-bottom: var(--rule-1) solid var(--c-rule); }

.p-rail__title {
  margin: 0;
  font-size: var(--fs-note);
  font-weight: 700;
  letter-spacing: var(--ls-head);
  color: var(--c-accent);
}

.p-rail__note { margin: var(--sp-1) 0 0; font-size: var(--fs-note); color: var(--c-ink-3); }

.p-rail__list { margin: 0; padding: 0; list-style: none; }

.p-rail__item {
  padding: var(--sp-3) 0;
  border-bottom: var(--rule-1) solid var(--c-rule);
  border-left: 3px solid transparent;
  padding-left: var(--sp-2);
}

.p-rail__item.is-active { border-left-color: var(--c-accent); background: var(--c-accent-tint); }

.p-rail__row { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-2); }

.p-rail__label { font-size: var(--fs-note); font-weight: 700; color: var(--c-ink); }
.p-rail__item.is-active .p-rail__label { color: var(--c-accent); }

.p-rail__pct {
  flex: 0 0 auto;
  font-size: var(--fs-sub);
  font-weight: 700;
  color: var(--c-accent);
  font-feature-settings: "tnum" 1;
}

.p-rail__item--human .p-rail__pct { color: var(--c-ink-2); }

.p-rail__cum { margin: var(--sp-1) 0 0; font-size: var(--fs-note); color: var(--c-ink-3); }
.p-rail__desc { margin: var(--sp-1) 0 0; font-size: var(--fs-note); line-height: 1.8; color: var(--c-ink-2); }

.p-rail__foot { padding: var(--sp-3) var(--sp-2); }
.p-rail__foot p { margin: 0; }

.p-rail__big {
  font-size: var(--fs-title);
  line-height: 1.25;
  font-weight: 700;
  color: var(--c-accent);
  font-feature-settings: "tnum" 1;
}

/* ------------------------------------------------------------------
   集計
------------------------------------------------------------------ */
.p-tiles {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--sp-3);
  margin-bottom: var(--sp-4);
}

.p-tile {
  border-top: var(--rule-2) solid var(--c-accent);
  border-bottom: var(--rule-1) solid var(--c-rule-strong);
  padding: var(--sp-2) 0 var(--sp-3);
  min-width: 0;
}

.p-tile--human { border-top-color: var(--c-rule-strong); }

.p-tile__label {
  margin: 0 0 var(--sp-1);
  font-size: var(--fs-note);
  letter-spacing: var(--ls-head);
  color: var(--c-ink-2);
}

.p-tile__num {
  margin: 0;
  font-size: var(--fs-title);
  line-height: 1.25;
  font-weight: 700;
  color: var(--c-accent);
  font-feature-settings: "tnum" 1;
}

.p-tile--human .p-tile__num { color: var(--c-ink-2); }
.p-tile__unit { font-size: var(--fs-sub); font-weight: 500; margin-left: 2px; }

.p-tile__sub {
  margin: var(--sp-1) 0 0;
  font-size: var(--fs-note);
  line-height: 1.7;
  color: var(--c-ink-3);
}

/* 積み上げの帯 */
.p-bar {
  display: flex;
  height: 34px;
  border: var(--rule-1) solid var(--c-rule-strong);
}

.p-bar__seg {
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  white-space: nowrap;
  font-size: var(--fs-note);
  font-feature-settings: "tnum" 1;
}

.p-bar__seg--faq { background: var(--c-accent); color: var(--c-base); }
.p-bar__seg--ai { background: var(--c-ink-2); color: var(--c-base); }
.p-bar__seg--human { background: var(--c-paper); color: var(--c-ink); }

/* 目標帯といまの位置 */
.p-scale { position: relative; height: 4.4em; margin-top: var(--sp-1); }

.p-scale__band {
  position: absolute;
  top: 0;
  height: 8px;
  border-left: var(--rule-2) solid var(--c-rule-strong);
  border-right: var(--rule-2) solid var(--c-rule-strong);
  border-bottom: var(--rule-1) solid var(--c-rule-strong);
}

.p-scale__band-label {
  position: absolute;
  top: 10px;
  font-size: var(--fs-note);
  color: var(--c-ink-3);
  transform: translateX(-50%);
  white-space: nowrap;
}

.p-scale__now { position: absolute; top: 0; height: 26px; border-left: var(--rule-2) solid var(--c-accent); }

.p-scale__now-label {
  position: absolute;
  top: 28px;
  font-size: var(--fs-note);
  font-weight: 700;
  color: var(--c-accent);
  white-space: nowrap;
  font-feature-settings: "tnum" 1;
}

.p-verdict {
  margin-top: var(--sp-3);
  border-left: 3px solid var(--c-accent);
  background: var(--c-accent-tint);
  padding: var(--sp-2) var(--sp-3);
  font-size: var(--fs-note);
  color: var(--c-ink-2);
}

.p-verdict--miss { border-left-color: var(--c-caution); background: var(--c-caution-tint); color: var(--c-caution); }

/* ------------------------------------------------------------------
   表
------------------------------------------------------------------ */
.p-scroll {
  overflow-x: auto;
  border-top: var(--rule-2) solid var(--c-rule-strong);
  border-bottom: var(--rule-2) solid var(--c-rule-strong);
}

.p-table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--fs-note);
  line-height: 1.75;
}

.p-table--flow { min-width: 620px; }

.p-table th, .p-table td {
  padding: var(--sp-2);
  border-bottom: var(--rule-1) solid var(--c-rule);
  text-align: left;
  vertical-align: top;
}

.p-table thead th {
  background: var(--c-paper);
  border-bottom: var(--rule-1) solid var(--c-rule-strong);
  font-weight: 700;
  color: var(--c-ink-2);
  letter-spacing: var(--ls-head);
  white-space: nowrap;
}

.p-table tbody tr:last-child td { border-bottom: 0; }

.p-table .is-num { text-align: right; white-space: nowrap; font-feature-settings: "tnum" 1; }
.p-table .is-name { font-weight: 700; color: var(--c-ink); }
.p-table .is-plain { color: var(--c-ink-2); }
.p-table .is-total { font-weight: 700; color: var(--c-accent); }

/* 札 */
.p-mark {
  display: inline-block;
  white-space: nowrap;
  font-size: var(--fs-note);
  letter-spacing: var(--ls-head);
  padding: 0 var(--sp-2);
  border: var(--rule-1) solid var(--c-rule-strong);
  background: var(--c-base);
  color: var(--c-ink-2);
}

.p-mark--strong { background: var(--c-accent-tint); border-color: var(--c-accent); color: var(--c-accent); font-weight: 700; }
.p-mark--watch { background: var(--c-paper); color: var(--c-ink); font-weight: 700; }
.p-mark--alert { background: var(--c-caution-tint); border-color: var(--c-caution); color: var(--c-caution); font-weight: 700; }
.p-mark--muted { border-color: var(--c-rule); color: var(--c-ink-3); }

.p-empty {
  padding: var(--sp-4) var(--sp-2);
  border-top: var(--rule-2) solid var(--c-rule-strong);
  border-bottom: var(--rule-2) solid var(--c-rule-strong);
  color: var(--c-ink-2);
}

.p-empty p { margin: 0; }

/* ------------------------------------------------------------------
   受信トレイ
------------------------------------------------------------------ */
.p-filters {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: var(--sp-2);
  padding: var(--sp-3) 0;
  border-top: var(--rule-2) solid var(--c-rule-strong);
  border-bottom: var(--rule-1) solid var(--c-rule);
  font-size: var(--fs-note);
  color: var(--c-ink-3);
}

.p-filters__label { flex: 0 0 auto; width: 5em; letter-spacing: var(--ls-head); color: var(--c-ink-2); }

.p-list {
  margin: 0;
  padding: 0;
  list-style: none;
  border-top: var(--rule-2) solid var(--c-rule-strong);
  border-bottom: var(--rule-2) solid var(--c-rule-strong);
}

.p-item { border-bottom: var(--rule-1) solid var(--c-rule); }
.p-item:last-child { border-bottom: 0; }

.p-item__btn {
  display: block;
  width: 100%;
  text-align: left;
  background: var(--c-base);

const pct = (n) => `${(n * 100).toFixed(1)}%`;
const pctShort = (n) => `${Math.round(n * 100)}%`;
const markClass = (tone) => (tone && tone !== "plain" ? `p-mark p-mark--${tone}` : "p-mark");

/* 現在の集計。BASELINE にデモ操作分を加算します。 */
function useStats(live) {
  return useMemo(() => {
    const total = BASELINE.total + live.total;
    const faq = BASELINE.faq + live.faq;
    const ai = BASELINE.ai + live.ai;
    const human = total - faq - ai;
    const rate = total > 0 ? (faq + ai) / total : 0;
    return {
      total, faq, ai, human, rate,
      faqShare: faq / total,
      aiShare: ai / total,
      humanShare: human / total,
      withDraft: BASELINE.humanWithDraft,
      inTarget: rate >= TARGET.min && rate <= TARGET.max,
    };
  }, [live]);
}

            <h2 className="p-heading__text">同じ返信を二度書かないために</h2>
          </div>

          <div className="p-def">
            <p className="p-def__label">定型かどうかは、質問の側で決まります</p>
            <p className="p-def__body">
              同じ返信を毎回書いてしまうのは、質問の大半が定型だからです。
              定型の質問に定型の答えを返す作業は、人がやっても機械がやっても中身が変わりません。
              先に選択肢で受けて、そこから漏れたものだけをAIが受け、
              それでも解決しないものだけが人に届く形にしています。
            </p>
          </div>

          <div className="p-def">
            <p className="p-def__label">自動返信を止める線は、こちらで引きます</p>
            <p className="p-def__body">
              返金・クレーム・法人取引など、判断や決裁が要るものはAIの自動返信の対象から外しています。
              運営側の一覧では、外した行に<strong>その理由を1件ずつ表示</strong>しています。
              なぜ人に回ってきたのか説明できない状態を作らないためです。
            </p>
          </div>

          <div className="p-def">
            <p className="p-def__label">人に残った分も、文面作成だけは肩代わりします</p>
            <p className="p-def__body">
              人に残る問い合わせにも、AIが返信の下書きを用意します。
              判断は人が行い、文章を書く手間だけをAIが引き受ける形です。
              下書きによる時短分は削減率には含めていません。数字を大きく見せないためです。
            </p>
          </div>

          <div className="p-def">
            <p className="p-def__label">AIの処理はすべてサーバー側で行います</p>
            <p className="p-def__body">
              この画面はブラウザだけで動く確認用のため、AIの応答はあらかじめ用意した内容を返しています。
              実装時は、回答生成も返信下書きの作成もすべてサーバー側で処理し、
              APIキーがブラウザに露出しない構成にします。

          </div>

          <div className="p-def">
            <p className="p-def__label">流入元をまとめる方法</p>
            <p className="p-def__body">
              {Object.keys(SOURCES).map((k) => SOURCES[k].label).join("・")}
              からの受信も、サーバー側で行います。各チャネルのWebhookを受け取り、
              共通のスキーマに正規化して1つのテーブルに保存することで、この一元管理画面が成り立ちます。
              送信も同じ経路を逆にたどるため、担当者はチャネルを意識せず返信できます。

          <div className="p-def">
            <p className="p-def__label">設定の置き場所</p>
            <p className="p-def__body">

              （<code>FAQ_TREE</code> / <code>AI_RESPONSES</code> / <code>STATUSES</code>）にまとめています。
              ブランドごとの差し替えはこの部分だけで完結します。
            </p>
          </div>

          <div className="p-colophon">
            <p>掲載しているデータは、すべてデモ用の想定値です。実在する企業・人物・実績とは関係ありません。</p>
            <p>React ＋ Tailwind CSS の1ファイル構成（CDN読み込み・ビルド不要）。意匠は索引ページと共通です。</p>
            <p>
              ほかのサンプルは
              <a href="../../index.html">業務の悩み 索引</a>

      </div>
    </React.Fragment>

}

/* ==================================================================
   【1】お客さま側の画面
================================================================== */

function CustomerChat({ stats, onResolve, onEscalate }) {
  const [stage, setStage] = useState("faq");     // faq | ai | escalate | closed
  const [log, setLog] = useState([{ from: "bot", text: BRAND.greeting }]);
  const [options, setOptions] = useState(FAQ_TREE);
  const [trail, setTrail] = useState([]);        // 選択済みのラベル
  const [pending, setPending] = useState(null);  // 回答表示後の「解決した？」
  const [input, setInput] = useState("");
  const [aiFails, setAiFails] = useState(0);
  const scroller = useRef(null);

  useEffect(() => {
    if (scroller.current) scroller.current.scrollTop = scroller.current.scrollHeight;
  }, [log, stage, pending]);

  const say = (from, text, extra) => setLog((p) => [...p, { from, text, ...extra }]);

  const reset = () => {
    setStage("faq");
    setLog([{ from: "bot", text: BRAND.greeting }]);
    setOptions(FAQ_TREE);
    setTrail([]);
    setPending(null);
    setInput("");
    setAiFails(0);
  };

  const chooseFaq = (node) => {
    say("user", node.label);
    setTrail((p) => [...p, node.label]);
    if (node.children) {
      say("bot", "詳しい内容をお選びください。");
      setOptions(node.children);
    } else {
      say("bot", node.answer, { answered: true });
      setOptions([]);
      setPending("faq");
    }
  };

  const faqSolved = () => {
    say("user", "解決しました");
    say("bot", "お役に立てて何よりです。ほかにご不明な点がありましたら、いつでもお声がけください。", { closing: true });
    setPending(null);
    setStage("closed");
    onResolve("faq");
  };

  const toAi = () => {
    say("user", "解決しませんでした");
    say(
      "bot",
      "承知しました。AIアシスタントが対応いたします。\nお困りの内容を、そのままの言葉でご記入ください。注文番号や商品名を添えていただけると、より正確にお答えできます。",
      { system: true }
    );
    setPending(null);
    setOptions([]);
    setStage("ai");
  };

  const askAi = (text) => {
    const q = text.trim();
    if (!q) return;
    say("user", q);
    setInput("");

    const scored = AI_RESPONSES.map((r) => ({
      r,
      hits: r.keywords.filter((k) => q.includes(k)).length,
    })).sort((a, b) => b.hits - a.hits);

    const best = scored[0];
    if (best && best.hits > 0) {
      say("bot", best.r.reply, { ai: true });
      setPending("ai");
    } else {
      say("bot", AI_FALLBACK, { ai: true });
      setPending("ai");
    }
  };

  const aiSolved = () => {
    say("user", "解決しました");
    say("bot", "ありがとうございます。またお困りの際はいつでもご相談ください。", { closing: true });
    setPending(null);
    setStage("closed");
    onResolve("ai");
  };

  const aiFailed = () => {
    say("user", "まだ解決していません");
    const n = aiFails + 1;
    setAiFails(n);
    setPending(null);
    if (n >= ESCALATE_AFTER) {
      say("bot", "お手数をおかけしております。担当者が直接確認いたしますので、以下をご記入ください。", { system: true });
      setStage("escalate");
    } else {
      say("bot", "失礼いたしました。別の言い方でもう一度お聞かせいただけますか。\nこのまま担当者におつなぎすることもできます。", { system: true });
    }
  };

  const submitEscalation = (payload) => {
    onEscalate(payload);
    say("user", `${SOURCES[payload.source].label} での連絡を希望`);
    say(
      "bot",
      `受付番号 SUP-2026-${String(Math.floor(1000 + trail.length * 7 + payload.body.length % 900)).slice(0, 4)} で承りました。\n担当者が確認のうえ、${ESCALATION_FORM.intro}\n\n${BRAND.hours}`,
      { closing: true }
    );
    setStage("closed");
  };

  const stageLabel =
    stage === "faq" ? "選択式の自動応答"
    : stage === "ai" ? "AIの自動応答"
    : stage === "escalate" ? "有人対応へ引き渡し"
    : "対応完了";

  return (
    <section className="p-section">
      <div className="p-heading">
        <span className="p-heading__no">一</span>
        <h2 className="p-heading__text">お客さまから見たやり取り</h2>
      </div>

      <p className="p-lead">
        まず選択肢で受けます。ここで片づけば人は動きません。
        選択肢で解決しなければAIが自由入力で受け、それでも解決しなければ担当者に引き渡します。
        引き渡された分は、運営側の一覧に「人の判断が必要」として1件増えます。
      </p>

      <div className="p-split">
        <div className="p-chat">
          <div className="p-chat__head">
            <p className="p-chat__shop">{BRAND.name} {BRAND.supportName}</p>
            <span className="p-chat__hours">{BRAND.hours}</span>
            <span className="p-actions__spacer" />
            <span className={stage === "escalate" ? "p-mark p-mark--alert" : stage === "closed" ? "p-mark p-mark--muted" : "p-mark p-mark--strong"}>
              {stageLabel}
            </span>
          </div>

          <div className="p-chat__log" ref={scroller}>
            {log.map((m, i) => (
              <Bubble key={i} m={m} />
            ))}

            {stage === "escalate" ? <EscalationForm onSubmit={submitEscalation} /> : null}
          </div>

          <div className="p-chat__ctrl">
            {pending ? (
              <div className="p-actions">
                <button
                  type="button"
                  className="p-btn p-btn--main"
                  onClick={pending === "faq" ? faqSolved : aiSolved}
                >
                  解決しました
                </button>
                <button
                  type="button"
                  className="p-btn"
                  onClick={pending === "faq" ? toAi : aiFailed}
                >
                  {pending === "faq" ? "解決しなかった" : "まだ解決していません"}
                </button>
              </div>
            ) : null}

            {!pending && stage === "faq" && options.length > 0 ? (
              <div className="p-opts">
                {options.map((o) => (
                  <button key={o.id} type="button" className="p-opt" onClick={() => chooseFaq(o)}>
                    {o.label}
                    {o.children ? <span className="p-opt__more">さらに選ぶ</span> : null}
                  </button>
                ))}
                {trail.length > 0 ? (
                  <button type="button" className="p-btn p-btn--quiet" onClick={reset}>
                    最初から選び直す
                  </button>
                ) : null}
              </div>
            ) : null}

            {!pending && stage === "ai" ? (
              <div>
                <div className="p-ask">
                  <input
                    className="p-ask__input"
                    value={input}
                    onChange={(e) => setInput(e.target.value)}
                    onKeyDown={(e) => { if (e.key === "Enter") askAi(input); }}
                    placeholder="お困りの内容をご記入ください"
                    aria-label="お困りの内容"
                  />
                  <button type="button" className="p-btn p-btn--main" onClick={() => askAi(input)}>送信</button>
                </div>
                <div className="p-actions">
                  {AI_SUGGESTIONS.map((s) => (
                    <button key={s} type="button" className="p-choice" onClick={() => askAi(s)}>{s}</button>
                  ))}
                  <button
                    type="button"
                    className="p-btn p-btn--quiet"
                    onClick={() => { say("user", "担当者につないでほしい"); setStage("escalate"); }}
                  >
                    担当者につなぐ
                  </button>
                </div>
              </div>
            ) : null}

            {stage === "closed" ? (
              <button type="button" className="p-btn p-btn--main" onClick={reset}>最初からやり直す</button>
            ) : null}

            {stage === "escalate" ? (
              <p className="p-note" style={{ margin: 0 }}>上のフォームにご記入のうえ、送信してください。</p>
            ) : null}
          </div>
        </div>

        <StageRail stage={stage} stats={stats} />
      </div>
    </section>
  );
}

function Bubble({ m }) {
  const cls =
    m.from === "user" ? "p-msg p-msg--user"
    : m.closing ? "p-msg p-msg--bot p-msg--closing"
    : m.system ? "p-msg p-msg--bot p-msg--system"
    : "p-msg p-msg--bot";

  return (
    <div className={cls}>
      <span className="p-msg__who">{m.from === "user" ? "お客さま" : BRAND.supportName}</span>
      <span className="p-msg__body">
        {m.ai ? <span className="p-msg__ai">AIの自動応答（サーバー側で生成）</span> : null}
        {m.text}
      </span>
    </div>
  );
}

function EscalationForm({ onSubmit }) {
  const [draft, setDraft] = useState({ name: "", contact: "", orderNo: "", body: "" });
  const [source, setSource] = useState("form");
  const [touched, setTouched] = useState(false);

  const missing = ESCALATION_FORM.fields.filter((f) => f.required && !String(draft[f.key]).trim());

  const submit = () => {
    setTouched(true);
    if (missing.length > 0) return;
    onSubmit({ ...draft, source });
  };

  return (
    <div className="p-form">
      <div className="p-form__head">
        <h3 className="p-form__title">担当者へのお問い合わせ</h3>
        <p className="p-form__intro">{ESCALATION_FORM.intro}</p>
      </div>

      {ESCALATION_FORM.fields.map((f) => {
        const bad = touched && f.required && !String(draft[f.key]).trim();
        const id = `esc-${f.key}`;
        return (
          <div className="p-field" key={f.key}>
            <label className="p-field__label" htmlFor={id}>
              {f.label}
              {f.required ? <span className="p-field__req">必須</span> : null}
            </label>
            {f.type === "textarea" ? (
              <textarea
                id={id}
                className={`p-input${bad ? " is-error" : ""}`}
                rows={3}
                value={draft[f.key]}
                placeholder={f.placeholder}
                onChange={(e) => setDraft((p) => ({ ...p, [f.key]: e.target.value }))}
              />
            ) : (
              <input
                id={id}
                className={`p-input${bad ? " is-error" : ""}`}
                value={draft[f.key]}
                placeholder={f.placeholder}
                onChange={(e) => setDraft((p) => ({ ...p, [f.key]: e.target.value }))}
              />
            )}
            {bad ? <p className="p-field__err">{f.label}をご記入ください。</p> : null}
          </div>
        );
      })}

      <div className="p-field">
        <span className="p-field__label">ご希望の連絡方法</span>
        <div className="p-actions">
          {Object.keys(SOURCES).map((k) => (
            <button
              key={k}
              type="button"
              className="p-choice"
              aria-pressed={source === k}
              onClick={() => setSource(k)}
            >
              {SOURCES[k].label}
            </button>
          ))}
        </div>
      </div>

      <div className="p-field">
        <button type="button" className="p-btn p-btn--main" onClick={submit}>
          この内容で担当者に送信する
        </button>
        <p className="p-note">
          送信すると、運営側の一元管理画面に「{STATUSES.human.label}」として追加されます。
          上のタブから確認できます。
        </p>
      </div>
    </div>
  );
}

/* 段階ごとの想定解決率 */
function StageRail({ stage, stats }) {
  const shares = { faq: stats.faqShare, ai: stats.aiShare, human: stats.humanShare };
  const active = stage === "faq" ? "faq" : stage === "ai" ? "ai" : stage === "escalate" ? "human" : null;
  let cum = 0;

  return (
    <aside className="p-rail">
      <div className="p-rail__head">
        <p className="p-rail__title">この段階までで片づく割合</p>
        <p className="p-rail__note">直近30日の実績にもとづく想定値です。</p>
      </div>

      <ol className="p-rail__list">
        {STAGE_DEFS.map((s) => {
          const share = shares[s.key];
          if (s.key !== "human") cum += share;
          const isActive = active === s.key;
          return (
            <li
              key={s.key}
              className={`p-rail__item${s.key === "human" ? " p-rail__item--human" : ""}${isActive ? " is-active" : ""}`}
            >
              <div className="p-rail__row">
                <span className="p-rail__label">{s.label}</span>
                <span className="p-rail__pct">{pctShort(share)}</span>
              </div>
              {s.key !== "human" ? (
                <p className="p-rail__cum">ここまでで累計 {pctShort(cum)} が完結</p>
              ) : (
                <p className="p-rail__cum">ここに到達するのは全体の {pctShort(share)}</p>
              )}
              <p className="p-rail__desc">{s.desc}</p>
            </li>
          );
        })}
      </ol>

      <div className="p-rail__foot">
        <p className="p-rail__title">有人対応の削減率</p>
        <p className="p-rail__big">{pct(stats.rate)}</p>
        <p className="p-rail__note">目標 {pctShort(TARGET.min)}〜{pctShort(TARGET.max)}</p>
      </div>
    </aside>
  );
}

/* ==================================================================
   【2】運営側の一元管理
================================================================== */

function AdminConsole({ stats, inbox, setInbox }) {
  const [openId, setOpenId] = useState(null);
  const [filterStatus, setFilterStatus] = useState("all");
  const [filterSource, setFilterSource] = useState("all");

  const counts = useMemo(() => {
    const c = { all: inbox.length };
    Object.keys(STATUSES).forEach((k) => (c[k] = inbox.filter((r) => r.status === k).length));
    return c;
  }, [inbox]);

  const rows = useMemo(
    () =>
      inbox.filter(
        (r) =>
          (filterStatus === "all" || r.status === filterStatus) &&
          (filterSource === "all" || r.source === filterSource)
      ),
    [inbox, filterStatus, filterSource]
  );

  const update = (id, patch) =>
    setInbox((p) => p.map((r) => (r.id === id ? { ...r, ...patch } : r)));

  return (
    <React.Fragment>
      <KpiPanel stats={stats} />

      <section className="p-section">
        <div className="p-heading">
          <span className="p-heading__no">二</span>
          <h2 className="p-heading__text">受信トレイ</h2>
        </div>

        <p className="p-lead">
          {Object.keys(SOURCES).map((k) => SOURCES[k].label).join("・")}
          は、サーバー側で受信した時点で同じ形式に変換しているため、担当者はこの1画面だけを見れば足ります。
          返信もこの画面から、届いた経路にそのまま返します。
          「{STATUSES.human.label}」の行には、<strong>なぜ自動返信を止めたのかを1件ずつ書いています</strong>。
        </p>

        <div className="p-filters">
          <span className="p-filters__label">状態</span>
          <button type="button" className="p-choice" aria-pressed={filterStatus === "all"} onClick={() => setFilterStatus("all")}>
            すべて<span className="p-choice__n">{counts.all}</span>
          </button>
          {STATUS_ORDER.map((k) => (
            <button
              key={k}
              type="button"
              className="p-choice"
              aria-pressed={filterStatus === k}
              onClick={() => setFilterStatus(k)}
            >
              {STATUSES[k].label}<span className="p-choice__n">{counts[k]}</span>
            </button>
          ))}
        </div>

        <div className="p-filters">
          <span className="p-filters__label">流入元</span>
          <button type="button" className="p-choice" aria-pressed={filterSource === "all"} onClick={() => setFilterSource("all")}>
            すべて
          </button>
          {Object.keys(SOURCES).map((k) => (
            <button
              key={k}
              type="button"
              className="p-choice"
              aria-pressed={filterSource === k}
              onClick={() => setFilterSource(k)}
            >
              {SOURCES[k].label}
            </button>
          ))}
        </div>

        {rows.length === 0 ? (
          <div className="p-empty" style={{ marginTop: "var(--sp-3)" }}>
            <p>該当する問い合わせはありません。</p>
          </div>
        ) : (
          <ul className="p-list" style={{ marginTop: "var(--sp-3)" }}>
            {rows.map((r) => (
              <InboxRow
                key={r.id}
                row={r}
                open={openId === r.id}
                onToggle={() => setOpenId(openId === r.id ? null : r.id)}
                onUpdate={(patch) => update(r.id, patch)}
              />
            ))}
          </ul>
        )}

        <p className="p-note">
          行を開くと、届いた本文と、AIが用意した返信文を確認できます。
          「{STATUSES.human.label}」の行では、下書きを作るところまでをAIに任せ、送るかどうかは人が決めます。
        </p>
      </section>
    </React.Fragment>
  );
}

/* 削減率のパネル：どの段階で何件減るかを見せる中心 */

  return (
    <section className="p-section">
      <div className="p-heading">
        <span className="p-heading__no">一</span>
        <h2 className="p-heading__text">どこで何件が片づいているか</h2>
      </div>

      <p className="p-lead">
        直近30日の内訳です。この画面で解決・引き渡しの操作をすると、その分がここに加算されます。
      </p>

      <div className="p-tiles">
        <div className="p-tile">
          <p className="p-tile__label">総問い合わせ数</p>
          <p className="p-tile__num">{stats.total.toLocaleString()}<span className="p-tile__unit">件</span></p>
          <p className="p-tile__sub">直近30日</p>
        </div>
        <div className="p-tile">
          <p className="p-tile__label">選択式で解決</p>
          <p className="p-tile__num">{stats.faq.toLocaleString()}<span className="p-tile__unit">件</span></p>
          <p className="p-tile__sub">{pct(stats.faqShare)}／人の対応なし</p>
        </div>
        <div className="p-tile">
          <p className="p-tile__label">AIで解決</p>
          <p className="p-tile__num">{stats.ai.toLocaleString()}<span className="p-tile__unit">件</span></p>
          <p className="p-tile__sub">{pct(stats.aiShare)}／人の対応なし</p>
        </div>
        <div className="p-tile p-tile--human">
          <p className="p-tile__label">人に残る</p>
          <p className="p-tile__num">{stats.human.toLocaleString()}<span className="p-tile__unit">件</span></p>
          <p className="p-tile__sub">
            {pct(stats.humanShare)}／うちAI下書きあり {stats.withDraft.toLocaleString()}件
          </p>
        </div>
      </div>

      <div className="p-bar">
        <div className="p-bar__seg p-bar__seg--faq" style={{ width: pct(stats.faqShare) }}>
          選択式 {stats.faq.toLocaleString()}
        </div>
        <div className="p-bar__seg p-bar__seg--ai" style={{ width: pct(stats.aiShare) }}>
          AI {stats.ai.toLocaleString()}
        </div>
        <div className="p-bar__seg p-bar__seg--human" style={{ width: pct(stats.humanShare) }}>
          人 {stats.human.toLocaleString()}
        </div>
      </div>

      <div className="p-scale">
        <span
          className="p-scale__band"
          style={{ left: pct(TARGET.min), width: pct(TARGET.max - TARGET.min) }}
        />
        <span
          className="p-scale__band-label"
          style={{ left: pct((TARGET.min + TARGET.max) / 2) }}
        >
          目標帯 {pctShort(TARGET.min)}〜{pctShort(TARGET.max)}
        </span>
        <span className="p-scale__now" style={{ left: pct(stats.rate) }} />
        <span
          className="p-scale__now-label"
          style={stats.rate > 0.75 ? { right: 0 } : { left: pct(stats.rate) }}
        >
          いま {pct(stats.rate)}
        </span>
      </div>

      <p className={stats.inTarget ? "p-verdict" : "p-verdict p-verdict--miss"}>
        {stats.inTarget
          ? `目標 ${pctShort(TARGET.min)}〜${pctShort(TARGET.max)} を満たしています。`
          : `目標 ${pctShort(TARGET.min)}〜${pctShort(TARGET.max)} に対して外れています。`}
        {" "}削減率は（選択式 {stats.faq.toLocaleString()} ＋ AI {stats.ai.toLocaleString()}）÷ {stats.total.toLocaleString()} で計算しています。
      </p>

      <div className="p-scroll" style={{ marginTop: "var(--sp-4)" }}>
        <table className="p-table p-table--flow">
          <thead>
            <tr>
              <th>段階</th>
              <th className="is-num">ここで片づく</th>
              <th className="is-num">次に残る</th>
              <th>この段階が受けるもの</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td className="is-name">受け付けた全件</td>
              <td className="is-num is-plain">—</td>
              <td className="is-num is-total">{stats.total.toLocaleString()}件</td>
              <td className="is-plain">直近30日に届いたすべての問い合わせ</td>
            </tr>
            <tr>
              <td className="is-name">{STAGE_DEFS[0].label}</td>
              <td className="is-num is-total">{stats.faq.toLocaleString()}件</td>
              <td className="is-num is-plain">{remaining.toLocaleString()}件</td>
              <td className="is-plain">{STAGE_DEFS[0].desc}</td>
            </tr>
            <tr>
              <td className="is-name">{STAGE_DEFS[1].label}</td>
              <td className="is-num is-total">{stats.ai.toLocaleString()}件</td>
              <td className="is-num is-plain">{stats.human.toLocaleString()}件</td>
              <td className="is-plain">{STAGE_DEFS[1].desc}</td>
            </tr>
            <tr>
              <td className="is-name">{STAGE_DEFS[2].label}</td>
              <td className="is-num is-plain">—</td>
              <td className="is-num is-total">{stats.human.toLocaleString()}件</td>
              <td className="is-plain">{STAGE_DEFS[2].desc}</td>
            </tr>
          </tbody>
        </table>
      </div>

      <p className="p-note">
        AI下書きを使った {stats.withDraft.toLocaleString()}件は、人が確認して送っているため有人対応に数えています。
        下書きによる時短分は削減率に含めていません。
      </p>
    </section>
  );
}

/* ------------------------------------------------------------------
   一覧の1行。AI下書きがある行は開くと編集・送信できます。
------------------------------------------------------------------ */
function InboxRow({ row, open, onToggle, onUpdate }) {
  const src = SOURCES[row.source];
  const st = STATUSES[row.status];
  const [text, setText] = useState(row.draft || "");
  const [sent, setSent] = useState(false);

  useEffect(() => setText(row.draft || ""), [row.draft]);

  const send = () => {
    onUpdate({ status: "done", draft: text, handledBy: "あなた" });
    setSent(true);
  };

  const makeDraft = () => onUpdate({ status: "ai_draft", draft: row.autoDraft || DRAFT_TEMPLATE(row) });

  return (
    <li className="p-item">
      <button type="button" className="p-item__btn" aria-expanded={open} onClick={onToggle}>
        <span className="p-item__row">
          <span className="p-item__src"><span className="p-mark">{src.label}</span></span>
          <span className="p-item__subject">
            {row.subject}
            {row.isNew ? <span className="p-item__new">　新着</span> : null}
          </span>
          <span className={markClass(st.tone)}>{st.label}</span>
          <span className="p-item__time">{row.receivedAt}</span>
        </span>
        <span className="p-item__sub">{row.customer}／{row.body}</span>
        {row.status === "human" && row.reason ? (
          <span className="p-item__why">自動返信を止めている理由：{row.reason}</span>
        ) : null}
      </button>

      {open ? (
        <div className="p-panel">
          <div className="p-quote">
            <p className="p-quote__meta">{src.label}／{row.customer}／{row.receivedAt}</p>
            <p className="p-quote__body">{row.body}</p>
          </div>

          <p className="p-hint">{st.hint}</p>

          {row.status === "human" ? (
            <React.Fragment>
              <p className="p-reason">
                <strong>自動返信を止めている理由：</strong>{row.reason}
              </p>
              <p className="p-actions" style={{ margin: 0 }}>
                <button type="button" className="p-btn p-btn--main" onClick={makeDraft}>
                  AI下書きを作成する
                </button>
              </p>
              <p className="p-note">
                下書きを作ると「{STATUSES.ai_draft.label}」に変わります。
                判断は人が行い、文面作成だけをAIが肩代わりします。
              </p>
            </React.Fragment>
          ) : null}

          {row.status === "ai_draft" || row.status === "ai_resolved" || row.status === "done" ? (
            <div>
              <p className="p-draft__label">
                {row.status === "ai_draft" ? "AIが用意した返信文（編集できます）" : "送信済みの返信文"}
                {row.status === "ai_draft" ? <span className="p-draft__tag">サーバー側でAIが生成</span> : null}
              </p>

              <textarea
                className="p-input"
                rows={8}
                value={text}
                readOnly={row.status !== "ai_draft"}
                aria-label="返信文"
                onChange={(e) => setText(e.target.value)}
              />

              {row.status === "ai_draft" ? (
                <React.Fragment>
                  <div className="p-actions" style={{ marginTop: "var(--sp-3)" }}>
                    <button type="button" className="p-btn p-btn--main" onClick={send}>
                      この内容で{src.label}に返信する
                    </button>
                    <button
                      type="button"
                      className="p-btn"
                      onClick={() => onUpdate({ status: "human", reason: "担当者の判断で、AI下書きの利用を取りやめました。" })}
                    >
                      人の判断に戻す
                    </button>
                  </div>
                  <p className="p-note">返信は届いた経路（{src.label}）にそのまま返します。</p>
                </React.Fragment>
              ) : null}

              {row.status === "done" ? (
                <p className="p-note">対応者：{row.handledBy || "—"}{sent ? "／送信しました" : ""}</p>
              ) : null}

              {row.status === "ai_resolved" ? (
                <p className="p-note">
                  この問い合わせはAIが自動で返信し、人の手を介さずに完結しました。削減率に算入されています。
                </p>
              ) : null}
            </div>
          ) : null}
        </div>
      ) : null}
    </li>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
