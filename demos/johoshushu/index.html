<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>定期的な情報収集の自動化 デモ | 差分レポートで確認する</title>
<meta name="description" content="競合の価格や補助金の公募情報を定期的に取りに行き、前回との差分だけをレポートにする仕組みのデモ。収集設定・収集結果・差分レポート・通知ルール・実行履歴・手作業との比較の6画面。掲載データはすべて架空で、実在のサイトにはアクセスしていません。">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
/* ==================================================================
   配色・字送りは索引ページ（リポジトリ直下の index.html）と同一です。
   このファイルで新しいトークンは定義していません。
================================================================== */
:root {
  --c-base:         #ffffff;
  --c-paper:        #f5f1e8;
  --c-ink:          #1b1c1e;
  --c-ink-2:        #4c4f54;
  --c-ink-3:        #7d8087;
  --c-rule:         #ddd7c8;
  --c-rule-strong:  #b3ab98;
  --c-accent:       #2d4257;
  --c-accent-tint:  #eef1f3;
  --c-caution:      #9c463b;
  --c-caution-tint: #f3e9e6;
  --font-mincho: "Hiragino Mincho ProN","Yu Mincho","YuMincho","MS PMincho","Noto Serif JP",serif;
  --font-gothic: "Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","YuGothic",Meiryo,"Noto Sans JP",sans-serif;
  --fs-note:  13px;  --fs-body: 15px;  --fs-sub: 18px;  --fs-head: 24px;  --fs-title: 33px;
  --lh-body: 1.9;  --lh-head: 1.45;  --ls-body: 0.04em;  --ls-head: 0.06em;
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 16px;  --sp-4: 32px;  --sp-5: 64px;
  --rule-1: 1px;  --rule-2: 2px;
}

html { -webkit-text-size-adjust: 100%; }

/* Tailwind の preflight は実行時に head の末尾へ挿入されるため、
   body と a はセレクタの詳細度を上げて上書きされないようにしています。 */
html body {
  margin: 0;
  background: var(--c-base);
  color: var(--c-ink);
  font-family: var(--font-gothic);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  letter-spacing: var(--ls-body);
  text-align: left;
}

*, *::before, *::after { border-radius: 0; box-shadow: none; }

body a {
  color: var(--c-accent);
  text-decoration: underline;
  text-underline-offset: 3px;
}

body a:hover { text-decoration-thickness: 2px; }

:focus-visible { outline: var(--rule-2) solid var(--c-accent); outline-offset: 2px; }

/* ------------------------------------------------------------------
   版面
------------------------------------------------------------------ */
.p-topbar { border-top: 3px solid var(--c-accent); }

.p-sheet {
  max-width: 940px;
  margin: 0 auto;
  padding: 0 var(--sp-3);
}

.p-section { padding-top: var(--sp-5); }
.p-section:last-of-type { padding-bottom: var(--sp-5); }

/* ------------------------------------------------------------------
   ヘッダー
------------------------------------------------------------------ */
.p-masthead { padding-top: var(--sp-4); padding-bottom: var(--sp-4); }

.p-masthead__kicker {
  font-size: var(--fs-note);
  letter-spacing: var(--ls-head);
  color: var(--c-ink-3);
  margin: 0 0 var(--sp-2);
}

.p-masthead__title {
  font-family: var(--font-mincho);
  font-size: var(--fs-title);
  line-height: var(--lh-head);
  letter-spacing: var(--ls-head);
  font-weight: 600;
  color: var(--c-ink);
  margin: 0;
  padding-bottom: var(--sp-3);
  border-bottom: var(--rule-2) solid var(--c-accent);
}

.p-masthead__lead {
  margin: var(--sp-3) 0 0;
  max-width: 40em;
  color: var(--c-ink-2);
}

.p-masthead__meta {
  margin: var(--sp-3) 0 0;
  font-size: var(--fs-note);
  color: var(--c-ink-3);
}

/* ------------------------------------------------------------------
   注記帯
------------------------------------------------------------------ */
.p-notice {
  margin-top: var(--sp-4);
  background: var(--c-caution-tint);
  border-left: 3px solid var(--c-caution);
  padding: var(--sp-3);
}

.p-notice__title {
  margin: 0 0 var(--sp-1);
  font-size: var(--fs-note);
  font-weight: 700;
  letter-spacing: var(--ls-head);
  color: var(--c-caution);
}

.p-notice__body {
  margin: 0;
  font-size: var(--fs-note);
  line-height: 1.8;
  color: var(--c-ink-2);
}

.p-notice__body + .p-notice__body { margin-top: var(--sp-2); }

/* ------------------------------------------------------------------
   目次
------------------------------------------------------------------ */
.p-nav {
  margin-top: var(--sp-3);
  padding: var(--sp-2) 0;
  border-top: var(--rule-1) solid var(--c-rule);
  border-bottom: var(--rule-1) solid var(--c-rule);
  font-size: var(--fs-note);
  color: var(--c-ink-3);
}

.p-nav ul { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: var(--sp-2) var(--sp-3); }

/* ------------------------------------------------------------------
   節見出し
------------------------------------------------------------------ */
.p-heading {
  margin: 0 0 var(--sp-3);
  padding-bottom: var(--sp-2);
  border-bottom: var(--rule-2) solid var(--c-rule-strong);
}

.p-heading__no {
  display: block;
  font-size: var(--fs-note);
  letter-spacing: var(--ls-head);
  color: var(--c-accent);
  margin-bottom: var(--sp-1);
}

.p-heading__text {
  font-family: var(--font-mincho);
  font-size: var(--fs-head);
  line-height: var(--lh-head);
  letter-spacing: var(--ls-head);
  font-weight: 600;
  margin: 0;
}

.p-lead {
  margin: 0 0 var(--sp-3);
  max-width: 42em;
  color: var(--c-ink-2);
}

.p-sub {
  font-family: var(--font-mincho);
  font-size: var(--fs-sub);
  line-height: var(--lh-head);
  letter-spacing: var(--ls-head);
  font-weight: 600;
  margin: var(--sp-4) 0 var(--sp-2);
  padding-bottom: var(--sp-1);
  border-bottom: var(--rule-1) solid var(--c-rule-strong);
}

.p-note {
  margin: var(--sp-2) 0 0;
  font-size: var(--fs-note);
  line-height: 1.8;
  color: var(--c-ink-3);
}

.p-note--caution { color: var(--c-caution); }

/* ------------------------------------------------------------------
   操作
------------------------------------------------------------------ */
.p-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: var(--sp-2);
  margin-bottom: var(--sp-3);
  font-size: var(--fs-note);
  color: var(--c-ink-3);
}

.p-toolbar__spacer { flex: 1 1 auto; }

.p-btn {
  font-family: var(--font-gothic);
  font-size: var(--fs-note);
  letter-spacing: var(--ls-body);
  color: var(--c-accent);
  background: var(--c-accent-tint);
  border: var(--rule-1) solid var(--c-rule-strong);
  padding: var(--sp-1) var(--sp-2);
  cursor: pointer;
}

.p-btn:hover { background: var(--c-base); }

.p-btn[aria-pressed="true"] {
  background: var(--c-accent);
  border-color: var(--c-accent);
  color: var(--c-base);
}

.p-btn--main {
  font-size: var(--fs-body);
  padding: var(--sp-2) var(--sp-4);
  background: var(--c-accent);
  border-color: var(--c-accent);
  color: var(--c-base);
}

.p-btn--main:hover { background: var(--c-accent); opacity: 0.86; }

.p-btn--main:disabled,
.p-btn--main:disabled:hover {
  background: var(--c-rule-strong);
  border-color: var(--c-rule-strong);
  color: var(--c-base);
  cursor: default;
  opacity: 1;
}

/* ------------------------------------------------------------------
   枠と段組
------------------------------------------------------------------ */
.p-box { border: var(--rule-1) solid var(--c-rule-strong); background: var(--c-base); }

.p-box__head {
  background: var(--c-paper);
  border-bottom: var(--rule-1) solid var(--c-rule-strong);
  padding: var(--sp-2);
  font-size: var(--fs-note);
  font-weight: 700;
  letter-spacing: var(--ls-head);
  color: var(--c-accent);
}

.p-box__body { padding: var(--sp-2); }
.p-box__body--flush { padding: 0; }

.p-cols {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  align-items: start;
  gap: var(--sp-3);
}

.p-cols--2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }

/* 選択肢 */
.p-choice {
  display: flex;
  gap: var(--sp-2);
  align-items: flex-start;
  padding: var(--sp-2);
  border-bottom: var(--rule-1) solid var(--c-rule);
  cursor: pointer;
}

.p-choice:last-child { border-bottom: 0; }
.p-choice:hover { background: var(--c-accent-tint); }

.p-choice input {
  flex: 0 0 auto;
  margin: 7px 0 0;
  accent-color: var(--c-accent);
}

.p-choice__body { flex: 1 1 auto; min-width: 0; }
.p-choice__label { display: block; font-size: var(--fs-body); line-height: 1.6; }
.p-choice__note { display: block; font-size: var(--fs-note); line-height: 1.7; color: var(--c-ink-3); margin-top: 2px; }

/* 入力 */
.p-input, .p-select {
  font-family: var(--font-gothic);
  font-size: var(--fs-body);
  letter-spacing: var(--ls-body);
  color: var(--c-ink);
  background: var(--c-base);
  border: var(--rule-1) solid var(--c-rule-strong);
  padding: var(--sp-1) var(--sp-2);
  width: 100%;
  max-width: 12em;
}

.p-field { margin-bottom: var(--sp-3); }
.p-field:last-child { margin-bottom: 0; }

.p-field__label {
  display: block;
  margin: 0 0 var(--sp-1);
  font-size: var(--fs-note);
  font-weight: 700;
  letter-spacing: var(--ls-head);
  color: var(--c-accent);
}

.p-field__note { margin: var(--sp-1) 0 0; font-size: var(--fs-note); color: var(--c-ink-3); }

.p-inline { display: flex; align-items: baseline; gap: var(--sp-2); flex-wrap: wrap; }
.p-inline--tight { display: inline-flex; flex-wrap: nowrap; margin-left: var(--sp-2); }

/* ------------------------------------------------------------------
   数字
------------------------------------------------------------------ */
.p-stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  border-top: var(--rule-2) solid var(--c-accent);
  border-left: var(--rule-1) solid var(--c-rule);
}

.p-stat {
  padding: var(--sp-2) var(--sp-3) var(--sp-3);
  border-right: var(--rule-1) solid var(--c-rule);
  border-bottom: var(--rule-1) solid var(--c-rule);
}

.p-stat__label { margin: 0 0 var(--sp-1); font-size: var(--fs-note); letter-spacing: var(--ls-head); color: var(--c-ink-2); }

.p-stat__num {
  margin: 0;
  font-size: var(--fs-title);
  line-height: 1.2;
  font-weight: 700;
  color: var(--c-accent);
  letter-spacing: 0.01em;
  font-feature-settings: "tnum" 1;
}

.p-stat__unit { font-size: var(--fs-sub); font-weight: 500; margin-left: 2px; }
.p-stat__note { margin: var(--sp-1) 0 0; font-size: var(--fs-note); line-height: 1.7; color: var(--c-ink-3); }

.p-stat--caution .p-stat__num { color: var(--c-caution); }
.p-stat--muted .p-stat__num { color: var(--c-ink-3); }
.p-stat--text .p-stat__num { font-size: var(--fs-head); }

/* 差分レポートの要約は8枠。desktopは4列、スマートフォンは2列。 */
.p-stats--4 { grid-template-columns: repeat(4, 1fr); }
/* 手作業との比較の結果は4枠。枠が狭いので2列に固定する。 */
.p-stats--2 { grid-template-columns: repeat(2, 1fr); border-top: 0; border-left: 0; }

/* ------------------------------------------------------------------
   表
------------------------------------------------------------------ */
.p-tablewrap {
  overflow-x: auto;
  border-top: var(--rule-2) solid var(--c-rule-strong);
  border-bottom: var(--rule-2) solid var(--c-rule-strong);
}

.p-table {
  width: 100%;
  min-width: 820px;
  border-collapse: collapse;
  font-size: var(--fs-note);
  line-height: 1.75;
}

.p-table th, .p-table td {
  padding: var(--sp-2);
  text-align: left;
  vertical-align: top;
  border-bottom: var(--rule-1) solid var(--c-rule);
  border-left: var(--rule-1) solid transparent;
}

.p-table thead th {
  background: var(--c-paper);
  color: var(--c-ink-2);
  font-weight: 700;
  letter-spacing: var(--ls-head);
  white-space: nowrap;
  border-bottom: var(--rule-1) solid var(--c-rule-strong);
}

.p-table thead th.is-group {
  text-align: center;
  border-left: var(--rule-1) solid var(--c-rule-strong);
}

/* 差分レポートの表は列が少ないので、下限幅を下げて横スクロールを短くする。 */
.p-table--diff { min-width: 660px; }

.p-table tbody tr:last-child td { border-bottom: 0; }
.p-table td.is-num { text-align: right; white-space: nowrap; font-feature-settings: "tnum" 1; }
.p-table td.is-tight { white-space: nowrap; }
.p-table td.is-prev { color: var(--c-ink-3); }
.p-table .is-sep { border-left: var(--rule-1) solid var(--c-rule); }

.p-table tbody tr.is-notify td { background: var(--c-accent-tint); }
.p-table tbody tr.is-notify td:first-child { border-left: 3px solid var(--c-accent); }
.p-table tbody tr.is-gone td { color: var(--c-ink-3); }

.p-strike { text-decoration: line-through; text-decoration-thickness: 1px; }

/* 変化の表示 */
.p-move { display: block; }
.p-move + .p-move { margin-top: 2px; }
.p-move__name { color: var(--c-ink-3); margin-right: var(--sp-1); }
.p-move__from { color: var(--c-ink-3); }
.p-move__arrow { color: var(--c-ink-3); margin: 0 var(--sp-1); }
.p-move__to { font-weight: 700; }
.p-move__pct { margin-left: var(--sp-1); font-feature-settings: "tnum" 1; }
.p-move__pct--caution { color: var(--c-caution); }
.p-move__pct--accent { color: var(--c-accent); }

/* 分類ラベル */
.p-tag {
  display: inline-block;
  font-size: var(--fs-note);
  line-height: 1.6;
  padding: 0 var(--sp-1);
  white-space: nowrap;
  border: var(--rule-1) solid var(--c-rule-strong);
  background: var(--c-base);
  color: var(--c-ink-2);
}

.p-tag--caution { color: var(--c-caution); border-color: var(--c-caution); background: var(--c-caution-tint); }
.p-tag--accent  { color: var(--c-accent);  border-color: var(--c-accent);  background: var(--c-accent-tint); }
.p-tag--added { color: var(--c-accent); border-color: var(--c-accent); }
.p-tag--removed { color: var(--c-ink-3); border-color: var(--c-rule); }
.p-tag--edit { color: var(--c-ink-2); }
.p-tag--same { color: var(--c-ink-3); border-color: var(--c-rule); }
.p-tag--notify { color: var(--c-base); background: var(--c-accent); border-color: var(--c-accent); }
.p-tag--off { color: var(--c-ink-3); border-color: var(--c-rule); }
.p-tag--fail { color: var(--c-caution); border-color: var(--c-caution); background: var(--c-caution-tint); }

/* ------------------------------------------------------------------
   実行の状態
------------------------------------------------------------------ */
.p-run {
  border-top: var(--rule-2) solid var(--c-accent);
  padding: var(--sp-3) 0 0;
  margin-top: var(--sp-4);
}

.p-run__line { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-3); }
.p-run__state { font-size: var(--fs-note); color: var(--c-ink-2); }

.p-progress { margin: var(--sp-3) 0 0; padding: 0; list-style: none; border-top: var(--rule-1) solid var(--c-rule); }

.p-progress li {
  display: flex;
  gap: var(--sp-3);
  padding: var(--sp-1) var(--sp-2);
  border-bottom: var(--rule-1) solid var(--c-rule);
  font-size: var(--fs-note);
}

.p-progress__name { flex: 1 1 auto; min-width: 0; }
.p-progress__state { flex: 0 0 auto; color: var(--c-ink-3); }
.p-progress__state--done { color: var(--c-accent); }

.p-empty {
  border: var(--rule-1) dashed var(--c-rule-strong);
  padding: var(--sp-4) var(--sp-3);
  text-align: center;
  color: var(--c-ink-3);
  font-size: var(--fs-note);
  background: var(--c-paper);
}

/* ------------------------------------------------------------------
   用語・注記
------------------------------------------------------------------ */
.p-terms {
  background: var(--c-paper);
  border-top: var(--rule-2) solid var(--c-rule-strong);
  padding: var(--sp-3);
}

.p-terms dl { margin: 0; }

.p-terms dt {
  font-size: var(--fs-note);
  font-weight: 700;
  letter-spacing: var(--ls-head);
  color: var(--c-accent);
  margin-bottom: var(--sp-1);
}

.p-terms dd { margin: 0 0 var(--sp-3); color: var(--c-ink); }
.p-terms dd:last-of-type { margin-bottom: 0; }

.p-sources { margin: 0; padding: 0; list-style: none; border-top: var(--rule-1) solid var(--c-rule); }

.p-sources li {
  display: flex;
  gap: var(--sp-2);
  padding: var(--sp-3) var(--sp-2);
  border-bottom: var(--rule-1) solid var(--c-rule);
  font-size: var(--fs-note);
  line-height: 1.85;
  color: var(--c-ink-2);
}

.p-sources__no { flex: 0 0 auto; width: 3.6em; color: var(--c-ink-3); }
.p-sources__body { flex: 1 1 auto; }
.p-sources__body strong { font-weight: 700; color: var(--c-ink); }

.p-steps { margin: 0; padding: 0; list-style: none; border-top: var(--rule-1) solid var(--c-rule); }

.p-steps li {
  display: flex;
  gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-2);
  border-bottom: var(--rule-1) solid var(--c-rule);
}

.p-steps__no { flex: 0 0 auto; width: 2.2em; font-family: var(--font-mincho); font-size: var(--fs-sub); color: var(--c-accent); }
.p-steps__body { flex: 1 1 auto; }
.p-steps__body p { margin: 0; }
.p-steps__note { margin-top: var(--sp-1) !important; font-size: var(--fs-note); color: var(--c-ink-2); }

.p-colophon {
  margin-top: var(--sp-4);
  padding-top: var(--sp-3);
  border-top: var(--rule-2) solid var(--c-rule-strong);
  font-size: var(--fs-note);
  color: var(--c-ink-3);
}

.p-colophon p { margin: 0 0 var(--sp-1); }
.p-colophon p:last-child { margin-bottom: 0; }

/* ------------------------------------------------------------------
   スマートフォン
------------------------------------------------------------------ */
@media (max-width: 640px) {
  :root {
    --fs-title: 26px;
    --fs-head: 20px;
    --fs-sub: 17px;
    --sp-5: 48px;
  }

  .p-stat__num { font-size: 28px; }
  .p-stat--text .p-stat__num { font-size: var(--fs-sub); }
  .p-stats--4, .p-stats--2 { grid-template-columns: repeat(2, 1fr); }
  .p-input, .p-select { max-width: 100%; }
  .p-btn--main { width: 100%; text-align: center; }
  .p-inline--tight { margin-left: 0; }
}
</style>
</head>
<body>
<div id="root"></div>
<script>Babel.registerPreset("react-classic", { presets: [[Babel.availablePresets["react"], { runtime: "classic" }]] });</script>
<script type="text/babel" data-presets="react-classic">
const { useState, useMemo, useRef, useEffect } = React;

/* ==================================================================
   このデモについて

   ・掲載しているサイト名・商品名・価格・制度名は、すべて架空です。
     実在するサイトへのアクセスは一切行っていません。
     「前回取得分」「今回取得分」の2世代のデータをあらかじめ持たせ、
     実行ボタンで両者を突き合わせて差分を出しています。
   ・入力した内容はどこにも保存・送信されません。ブラウザのメモリ上に
     だけ置き、リロードすると初期状態に戻ります。
     localStorage / Cookie / 外部送信のいずれも使っていません。

   転用のしかた

   下の PRESETS を差し替えるだけで、別の用途のデモになります。
   画面側のコードは、収集対象の中身も項目の意味も知りません。
   ・targets … 収集先（サイト）
   ・fields  … 取得して差分を見る項目。primary が値の上下を見る項目
   ・rules   … 通知条件のひな形
   ・rows    … 前回取得分(prev)と今回取得分(curr)の2世代データ
================================================================== */

/* ------------------------------------------------------------------
   1. 共通設定
------------------------------------------------------------------ */
const CONFIG = {
  title: "定期的な情報収集の自動化",
  subtitle: "毎朝の目視チェックを、差分レポート1枚に置き換える",

------------------------------------------------------------------ */
const NOW = new Date();
const p2 = (n) => String(n).padStart(2, "0");
const nf = (n) => Number(n).toLocaleString("ja-JP");

const fmtTime = (d) =>
  `${d.getFullYear()}/${p2(d.getMonth() + 1)}/${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}`;

function fmtValue(field, v) {
  if (v === null || v === undefined || v === "") return "—";
  if (field.type === "money" || field.type === "num") return nf(v) + field.unit;
  return String(v);
}

function pctChange(from, to) {
  if (typeof from !== "number" || typeof to !== "number" || from === 0) return null;
  return ((to - from) / from) * 100;
}

const fmtPct = (p) => (p >= 0 ? "＋" : "−") + Math.abs(p).toFixed(1) + "％";

// 実行履歴の過去分に使う、毎回同じ値が出る擬似乱数
function seeded(i) {
  const x = Math.sin(i * 127.1 + 311.7) * 43758.5453;
  return x - Math.floor(x);
}

// 実行時刻を頻度の区切りに合わせる
function snapNow(freq) {
  const d = new Date(NOW.getTime());
  d.setSeconds(0, 0);
  d.setMinutes(0);
  if (freq.key !== "hourly") {
    d.setHours(freq.key === "twice" ? (d.getHours() >= 18 ? 18 : 6) : 6);
    if (freq.key === "weekly") d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    if (freq.key === "monthly") d.setDate(1);
  }
  while (d.getTime() > NOW.getTime()) d.setTime(d.getTime() - freq.stepMs);
  return d;
}

function fmtDuration(sec) {
  if (sec < 60) return `${Math.round(sec)}秒`;
  if (sec < 3600) return `${Math.round(sec / 60)}分`;
  const h = Math.floor(sec / 3600);
  const m = Math.round((sec - h * 3600) / 60);
  return m === 0 ? `${nf(h)}時間` : `${nf(h)}時間${m}分`;
}

/* ------------------------------------------------------------------
   4. 差分の判定
      前回取得分と今回取得分を、選ばれている項目だけで突き合わせます。
------------------------------------------------------------------ */
function buildDiff(preset, targetKeys, fieldKeys) {
  const fields = preset.fields.filter((f) => fieldKeys.includes(f.key));
  const primary = fields.find((f) => f.primary);

  return preset.rows
    .filter((r) => targetKeys.includes(r.target))
    .map((r) => {
      if (!r.prev) return { row: r, kind: "added", changes: [] };
      if (!r.curr) return { row: r, kind: "removed", changes: [] };

      const changes = fields
        .filter((f) => r.prev[f.key] !== r.curr[f.key])
        .map((f) => ({
          field: f,
          from: r.prev[f.key],
          to: r.curr[f.key],
          pct: f.type === "money" || f.type === "num" ? pctChange(r.prev[f.key], r.curr[f.key]) : null,
        }));

      if (changes.length === 0) return { row: r, kind: "same", changes: [] };

      const pc = primary ? changes.find((c) => c.field.key === primary.key) : null;
      if (pc) return { row: r, kind: pc.to > pc.from ? "up" : "down", changes, primaryChange: pc };
      return { row: r, kind: "edit", changes };
    });
}

/* ------------------------------------------------------------------
   5. 通知ルールの判定
------------------------------------------------------------------ */
function ruleActive(rule, fieldKeys) {
  return !rule.field || fieldKeys.includes(rule.field);
}

function matchRule(rule, state, d) {
  if (!state || !state.on) return false;
  const th = Number(state.threshold) || 0;
  switch (rule.kind) {
    case "pct-down": {
      const c = d.changes.find((c) => c.field.key === rule.field);
      return !!c && c.pct !== null && c.pct <= -th;
    }
    case "pct-up": {
      const c = d.changes.find((c) => c.field.key === rule.field);
      return !!c && c.pct !== null && c.pct >= th;
    }
    case "status-to": {
      const c = d.changes.find((c) => c.field.key === rule.field);
      return !!c && c.to === rule.value;
    }
    case "field-changed":
      return d.changes.some((c) => c.field.key === rule.field);
    case "added":
      return d.kind === "added";
    case "removed":
      return d.kind === "removed";
    default:
      return false;
  }
}

/* ==================================================================
   表示部品
================================================================== */
function Heading({ no, text }) {
  return (
    <div className="p-heading">
      <span className="p-heading__no">{no}</span>
      <h2 className="p-heading__text">{text}</h2>
    </div>
  );
}

function Stat({ label, num, unit, note, tone, text }) {
  const cls =
    "p-stat" +
    (tone === "caution" ? " p-stat--caution" : tone === "muted" ? " p-stat--muted" : "") +
    (text ? " p-stat--text" : "");
  return (
    <div className={cls}>
      <p className="p-stat__label">{label}</p>
      <p className="p-stat__num">
        {num}
        {unit ? <span className="p-stat__unit">{unit}</span> : null}
      </p>
      {note ? <p className="p-stat__note">{note}</p> : null}
    </div>
  );
}

function Tag({ kind, children }) {
  return <span className={`p-tag p-tag--${kind}`}>{children}</span>;
}

function KindTag({ kind, preset }) {
  const meta = KIND_META[kind];
  const dir = kind === "up" || kind === "down";
  return (
    <Tag kind={dir ? preset.kindTone[kind] : meta.tag}>
      {dir ? preset.kindLabels[kind] : meta.label}
    </Tag>
  );
}

function Move({ change, preset }) {
  const tone = preset.kindTone[change.pct !== null && change.pct > 0 ? "up" : "down"];
  return (
    <span className="p-move">
      <span className="p-move__name">{change.field.label}</span>
      <span className="p-move__from">{fmtValue(change.field, change.from)}</span>
      <span className="p-move__arrow">→</span>
      <span className="p-move__to">{fmtValue(change.field, change.to)}</span>
      {change.pct !== null ? (
        <span className={"p-move__pct p-move__pct--" + tone}>
          {fmtPct(change.pct)}
        </span>
      ) : null}
    </span>
  );
}

/* ==================================================================
   三　差分レポート
================================================================== */
const FILTERS = [
  { key: "changed", label: "変わったものすべて" },
  { key: "notify", label: "通知条件に当てはまるもの" },
  { key: "up", label: "値上がり" },
  { key: "down", label: "値下がり" },
  { key: "added", label: "新規" },
  { key: "removed", label: "消えた" },
  { key: "edit", label: "項目の変更" },
  { key: "same", label: "変化なし" },
];

function SectionDiff({ preset, diffs, counts, notified, hasRun, currAt }) {
  const [filter, setFilter] = useState("changed");

  const list = useMemo(() => {
    if (filter === "changed") return diffs.filter((d) => d.kind !== "same");
    if (filter === "notify") return diffs.filter((d) => notified.has(d.row.id));
    return diffs.filter((d) => d.kind === filter);
  }, [diffs, filter, notified]);

  const changedCount = diffs.length - counts.same;

  return (
    <section className="p-section" id="diff">
      <Heading no="三" text="差分レポート" />

      <p className="p-lead">
        前回と今回を突き合わせて、変わった行だけを抜き出したものです。
        毎回届くのはこの表です。全件を見比べる作業は、ここでなくなります。
      </p>

      {!hasRun ? (
        <div className="p-empty">上の「収集を実行する」を押すと、ここに差分が出ます。</div>
      ) : (
        <React.Fragment>
          <div className="p-stats p-stats--4">
            <Stat label="今回の確認対象" num={nf(changedCount)} unit="件" note={`延べ ${diffs.length} 件のうち`} />
            <Stat label={preset.kindLabels.up} num={nf(counts.up)} unit="件" tone={preset.kindTone.up} />
            <Stat label={preset.kindLabels.down} num={nf(counts.down)} unit="件" tone={preset.kindTone.down} />
            <Stat label="新規" num={nf(counts.added)} unit="件" />
            <Stat label="消えた" num={nf(counts.removed)} unit="件" tone="muted" />
            <Stat label="項目の変更" num={nf(counts.edit)} unit="件" note="値の上下以外の変更" />
            <Stat label="変化なし" num={nf(counts.same)} unit="件" tone="muted" note="見なくてよい行" />
            <Stat label="通知条件に該当" num={nf(notified.size)} unit="件" note="表の中で強調されます" />
          </div>

          <p className="p-lead" style={{ marginTop: "var(--sp-4)" }}>
            {fmtTime(currAt)} 時点。延べ {diffs.length} 件を取得し、
            そのうち {counts.same} 件は前回とまったく同じでした。
            見るべきは残り <strong>{changedCount}</strong> 件、
            うち通知条件に当てはまるのは <strong>{notified.size}</strong> 件です。
          </p>

          <div className="p-toolbar">
            <span>絞り込み</span>
            <span className="p-toolbar__spacer" />
            {FILTERS.map((f) => (
              <button
                key={f.key}
                type="button"
                className="p-btn"
                aria-pressed={filter === f.key}
                onClick={() => setFilter(f.key)}
              >
                {f.key === "up" || f.key === "down" ? preset.kindLabels[f.key] : f.label}
              </button>
            ))}
          </div>

          {list.length === 0 ? (
            <div className="p-empty">この区分に当てはまる行はありません。</div>
          ) : (
            <div className="p-tablewrap">
              <table className="p-table p-table--diff">
                <thead>
                  <tr>
                    <th>区分</th>
                    <th>収集対象</th>
                    <th>{preset.idField.label}</th>
                    <th>変わった内容</th>
                    <th>通知</th>
                  </tr>
                </thead>
                <tbody>
                  {list.map((d) => {
                    const t = preset.targets.find((x) => x.key === d.row.target);
                    const isNotify = notified.has(d.row.id);
                    return (
                      <tr key={d.row.id} className={isNotify ? "is-notify" : ""}>
                        <td className="is-tight">
                          <KindTag kind={d.kind} preset={preset} />
                        </td>
                        <td className="is-tight">{t.short}</td>
                        <td>
                          {d.row[preset.idField.key]}
                          <span className="p-move__name" style={{ marginLeft: "var(--sp-1)" }}>
                            {d.row[preset.subField.key]}
                          </span>
                        </td>
                        <td>
                          {d.kind === "added" ? (
                            <span>
                              今回から掲載されました。
                              {preset.fields
                                .filter((f) => f.primary)
                                .map((f) => ` ${f.label} ${fmtValue(f, d.row.curr[f.key])}。`)}
                            </span>
                          ) : d.kind === "removed" ? (
                            <span>
                              前回まで掲載されていましたが、今回は取得できませんでした。
                              {preset.fields
                                .filter((f) => f.primary)
                                .map((f) => ` 前回の${f.label}は ${fmtValue(f, d.row.prev[f.key])}。`)}
                            </span>
                          ) : d.kind === "same" ? (
                            <span style={{ color: "var(--c-ink-3)" }}>前回と同じです。</span>
                          ) : (
                            d.changes.map((c) => <Move key={c.field.key} change={c} preset={preset} />)
                          )}
                        </td>
                        <td className="is-tight">
                          {isNotify ? <Tag kind="notify">通知</Tag> : <span style={{ color: "var(--c-ink-3)" }}>—</span>}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}

          <p className="p-note">
            表が画面に収まらないときは、表の中を横にスクロールすると「変わった内容」の列が出ます。
          </p>
          <p className="p-note">
            このデモは、各区分を見てもらうために変化する行を多めに入れてあります。
            実際の運用では、1回の実行で変わる行は 0〜3 件程度に収まることが多く、
            そのぶん確認は短く済みます。
          </p>
        </React.Fragment>
      )}
    </section>
  );
}

/* ==================================================================
   四　通知ルール
================================================================== */
function SectionRules({ preset, cfg, setCfg, hitCounts, fieldKeys, notifiedSize }) {
  const setRule = (key, patch) =>
    setCfg((c) => ({ ...c, rules: { ...c.rules, [key]: { ...c.rules[key], ...patch } } }));

  return (
    <section className="p-section" id="rules">
      <Heading no="四" text="通知ルール" />

      <p className="p-lead">
        「価格が5％以上下がったら知らせる」のように、報告してほしい条件を決めます。
        条件に当てはまった行は、上の差分レポートで色を変えて表示されます。
        しきい値の数字を動かすと、当てはまる件数がその場で変わります。
      </p>

      <div className="p-box">
        <div className="p-box__head">通知する条件（該当 合計 {notifiedSize} 件）</div>
        <div className="p-box__body p-box__body--flush">
          {preset.rules.map((r) => {
            const st = cfg.rules[r.key];
            const active = ruleActive(r, fieldKeys);
            return (
              <div className="p-choice" key={r.key} style={{ cursor: "default" }}>
                <input
                  type="checkbox"
                  checked={st.on}
                  disabled={!active}
                  onChange={(e) => setRule(r.key, { on: e.target.checked })}
                  id={`rule-${r.key}`}
                />
                <span className="p-choice__body">
                  <span className="p-choice__label">
                    <label htmlFor={`rule-${r.key}`} style={{ cursor: active ? "pointer" : "default" }}>
                      {r.label}
                    </label>
                    {r.suffix ? (
                      <span className="p-inline p-inline--tight">
                        <input
                          className="p-input"
                          style={{ maxWidth: "5em" }}
                          type="number"
                          min="0"
                          max="90"
                          step="1"
                          value={st.threshold}
                          disabled={!active || !st.on}
                          onChange={(e) => setRule(r.key, { threshold: e.target.value })}
                          aria-label={`${r.label}のしきい値`}
                        />
                        <span>{r.suffix}</span>
                      </span>
                    ) : null}
                  </span>
                  <span className="p-choice__note">
                    {r.note}
                    {!active ? (
                      <React.Fragment>
                        　<Tag kind="off">対象の項目を外しているため無効</Tag>
                      </React.Fragment>
                    ) : st.on ? (
                      `　該当 ${hitCounts[r.key] || 0} 件`
                    ) : (
                      "　この条件は使いません"
                    )}
                  </span>
                </span>
              </div>
            );
          })}
        </div>
      </div>

      <p className="p-note">
        条件を厳しくすれば通知は減り、緩めれば増えます。
        運用の初期は緩めに設定し、実際に届いた通知を見ながら数か月かけて締めていくのが現実的です。

}

/* ==================================================================

================================================================== */
function SectionSaving({ preset, freq, currCount, changedCount, saving, setSaving }) {
  const num = (v, d) => {
    const n = Number(v);
    return Number.isFinite(n) && n >= 0 ? n : d;
  };

  const count = num(saving.count, 0);
  const sec = num(saving.sec, 0);
  const wage = num(saving.wage, 0);
  const runs = freq.perMonth;

  const manualPerRun = count * sec;
  const autoPerRun = Math.min(changedCount, count) * sec;
  const cutPerRun = Math.max(manualPerRun - autoPerRun, 0);

  const manualMonth = manualPerRun * runs;
  const autoMonth = autoPerRun * runs;
  const cutMonth = cutPerRun * runs;
  const cutYear = cutMonth * 12;
  const yen = Math.round((cutMonth / 3600) * wage);

  return (
    <section className="p-section" id="saving">
      <Heading no="六" text="手作業との比較" />

      <p className="p-lead">
        いま目視で確認している件数と、1件あたりにかかる秒数を入れてください。
        自動化した場合との差を出します。自動化しても確認がゼロになるわけではなく、
        「変わった行だけを見る時間」は残ります。その分を差し引いた数字です。
      </p>

      <div className="p-cols p-cols--2">
        <div className="p-box">
          <div className="p-box__head">入力</div>
          <div className="p-box__body">
            <div className="p-field">
              <label className="p-field__label" htmlFor="sv-count">1回に目視で確認している件数</label>
              <div className="p-inline">
                <input
                  id="sv-count"
                  className="p-input"
                  type="number"
                  min="0"
                  max="9999"
                  value={saving.count}
                  onChange={(e) => setSaving((s) => ({ ...s, count: e.target.value }))}
                />
                <span>件</span>
                <button
                  type="button"
                  className="p-btn"
                  onClick={() => setSaving((s) => ({ ...s, count: String(currCount) }))}
                >
                  いまの収集件数（{currCount}件）を入れる
                </button>
              </div>
            </div>

            <div className="p-field">
              <label className="p-field__label" htmlFor="sv-sec">1件あたりの目視の秒数</label>
              <div className="p-inline">
                <input
                  id="sv-sec"
                  className="p-input"
                  type="number"
                  min="0"
                  max="600"
                  value={saving.sec}
                  onChange={(e) => setSaving((s) => ({ ...s, sec: e.target.value }))}
                />
                <span>秒</span>
              </div>
              <p className="p-field__note">
                ページを開き、前回の値を思い出し、見比べて、必要ならメモする。ここまでの時間です。
              </p>
            </div>

            <div className="p-field">
              <label className="p-field__label" htmlFor="sv-wage">人件費の換算に使う時給（想定値）</label>
              <div className="p-inline">
                <input
                  id="sv-wage"
                  className="p-input"
                  type="number"
                  min="0"
                  max="20000"
                  step="100"
                  value={saving.wage}
                  onChange={(e) => setSaving((s) => ({ ...s, wage: e.target.value }))}
                />
                <span>円</span>
              </div>
            </div>

            <div className="p-field">
              <span className="p-field__label">実行の頻度（一の設定に連動）</span>
              <p style={{ margin: 0 }}>
                {freq.label}　月あたり {nf(runs)} 回
              </p>
            </div>
          </div>
        </div>

        <div className="p-box">
          <div className="p-box__head">結果</div>
          <div className="p-box__body p-box__body--flush">
            <div className="p-stats p-stats--2">
              <Stat
                label="いまの手作業（月あたり）"
                num={fmtDuration(manualMonth)}
                note={`1回 ${fmtDuration(manualPerRun)} × ${nf(runs)} 回`}
                tone="caution"
                text
              />
              <Stat
                label="自動化した後（月あたり）"
                num={fmtDuration(autoMonth)}
                note={`差分 ${Math.min(changedCount, count)} 件だけを確認`}
                text
              />
              <Stat
                label="削減できる時間（月あたり）"
                num={fmtDuration(cutMonth)}
                note={`年あたり ${fmtDuration(cutYear)}`}
                text
              />
              <Stat
                label="人件費に換算（月あたり・想定値）"
                num={nf(yen)}
                unit="円"
                note={`時給 ${nf(wage)} 円で計算`}
                tone="caution"
              />
            </div>
          </div>
        </div>
      </div>

      <p className="p-note">
        計算式は次のとおりです。手作業＝件数 × 秒数 × 月あたりの実行回数。
        自動化後＝変化した件数 × 秒数 × 月あたりの実行回数。削減時間＝その差。
        時給は入力した想定値であり、実績値ではありません。

      <p className="p-note p-note--caution">
        頻度を「1時間ごと」にすると、手作業の数字が現実離れした値になります。
        それは計算の誤りではなく、その頻度は人手では回せないという意味です。

  );
}

/* ==================================================================
   本体
================================================================== */
function defaultsFor(preset) {
  const rules = {};
  preset.rules.forEach((r) => {
    rules[r.key] = { on: r.defaultOn, threshold: r.defaultThreshold === undefined ? 0 : r.defaultThreshold };
  });
  return {
    targetKeys: preset.targets.map((t) => t.key),
    fieldKeys: preset.fields.filter((f) => f.defaultOn).map((f) => f.key),
    freqKey: preset.defaultFreq,
    rules,
  };
}

function App() {
  const [presetKey, setPresetKey] = useState(PRESETS[0].key);
  const preset = PRESETS.find((p) => p.key === presetKey);

  const [cfg, setCfg] = useState(() => defaultsFor(PRESETS[0]));
  const [phase, setPhase] = useState("idle");
  const [doneTargets, setDoneTargets] = useState([]);
  const [liveRuns, setLiveRuns] = useState([]);
  const [saving, setSaving] = useState({
    count: "30",
    sec: String(CONFIG.defaultWatchSeconds),
    wage: String(CONFIG.defaultWage),
  });

  const timers = useRef([]);
  useEffect(() => () => timers.current.forEach(clearTimeout), []);

  const freq = FREQUENCIES.find((f) => f.key === cfg.freqKey);
  const fields = preset.fields.filter((f) => cfg.fieldKeys.includes(f.key));

  /* 差分の計算。設定を変えると、ここが再計算されます。 */
  const diffs = useMemo(
    () => buildDiff(preset, cfg.targetKeys, cfg.fieldKeys),
    [preset, cfg.targetKeys, cfg.fieldKeys]
  );

  const counts = useMemo(() => {
    const c = { up: 0, down: 0, added: 0, removed: 0, edit: 0, same: 0 };
    diffs.forEach((d) => { c[d.kind] += 1; });
    return c;
  }, [diffs]);

  /* 通知の判定 */
  const { notified, hitCounts } = useMemo(() => {
    const set = new Set();
    const hits = {};
    preset.rules.forEach((r) => { hits[r.key] = 0; });
    diffs.forEach((d) => {
      preset.rules.forEach((r) => {
        if (!ruleActive(r, cfg.fieldKeys)) return;
        if (matchRule(r, cfg.rules[r.key], d)) {
          hits[r.key] += 1;
          set.add(d.row.id);
        }
      });
    });
    return { notified: set, hitCounts: hits };
  }, [diffs, preset, cfg.rules, cfg.fieldKeys]);

  const changedCount = diffs.length - counts.same;
  const currCount = diffs.filter((d) => d.row.curr).length;

  /* 実行の時刻 */
  const snapped = useMemo(() => snapNow(freq), [freq]);
  const currAt = snapped;
  const prevAt = new Date(snapped.getTime() - freq.stepMs);
  const nextRunAt = new Date(snapped.getTime() + freq.stepMs);

  /* 実行履歴（過去分はデモ用の記録） */
  const runs = useMemo(() => {
    const past = [];
    for (let i = 1; i <= CONFIG.historyRows; i++) {
      const t = new Date(snapped.getTime() - freq.stepMs * i);
      const ch = Math.floor(seeded(i * 3 + freq.perMonth) * 7);
      // 5回前は取得に失敗した回とする。失敗も1件の記録として残ることを示す。
      if (i === 5) {
        past.push({
          time: t,
          total: 0,
          changed: 0,
          notified: 1,
          sec: 21,
          label: "取得に失敗（相手先が応答せず）",
          fail: true,
        });
        continue;
      }
      past.push({
        time: t,
        total: Math.max(currCount - Math.floor(seeded(i * 11) * 3), 0),
        changed: ch,
        notified: Math.floor(seeded(i * 7 + 1) * (ch + 1)),
        sec: 4 + Math.floor(seeded(i * 5) * 6),
        label: i === 1 ? "前回取得分" : null,
      });
    }
    return [...liveRuns, ...past].slice(0, 12);
  }, [liveRuns, snapped, freq, currCount]);

  /* 実行 */
  const canRun = cfg.targetKeys.length > 0 && cfg.fieldKeys.length > 0 && phase !== "running";

  const run = () => {
    timers.current.forEach(clearTimeout);
    timers.current = [];
    setPhase("running");
    setDoneTargets([]);

    const list = preset.targets.filter((t) => cfg.targetKeys.includes(t.key));
    list.forEach((t, i) => {
      timers.current.push(
        setTimeout(() => setDoneTargets((p) => [...p, t.key]), CONFIG.stepMs * (i + 1))
      );
    });

    timers.current.push(
      setTimeout(() => {
        setPhase("done");
        setLiveRuns((prev) => [
          {
            time: new Date(),
            total: currCount,
            changed: changedCount,
            notified: notified.size,
            sec: 3 + list.length,
            live: true,
          },
          ...prev,
        ]);
      }, CONFIG.stepMs * (list.length + 1))
    );
  };

  const switchPreset = (key) => {
    const p = PRESETS.find((x) => x.key === key);
    timers.current.forEach(clearTimeout);
    timers.current = [];
    setPresetKey(key);
    setCfg(defaultsFor(p));
    setPhase("idle");
    setDoneTargets([]);
    setLiveRuns([]);
    setSaving((s) => ({ ...s, count: String(p.rows.filter((r) => r.curr).length) }));
  };

  const hasRun = phase === "done";

  return (
    <React.Fragment>
      <div className="p-topbar" />

      <div className="p-sheet">
        <header className="p-masthead">
          <p className="p-masthead__kicker">中小企業向け　業務改善・自動化サンプル</p>
          <h1 className="p-masthead__title">{CONFIG.title}</h1>
          <p className="p-masthead__lead">
            {CONFIG.subtitle}。競合の価格を毎朝見に行く、補助金の公募ページを定期的に開く、
            更新があったかどうかを目で確かめる。この一連の作業を機械に任せ、
            変わったところだけを1枚のレポートにする仕組みの見本です。画面上で実際に動きます。
          </p>
          <p className="p-masthead__meta">
            収集設定・収集結果・差分レポート・通知ルール・実行履歴・手作業との比較の6画面
          </p>

          <div className="p-notice">
            <p className="p-notice__title">この画面のデータについて</p>
            <p className="p-notice__body">
              掲載しているサイト名・商品名・価格・制度名は、すべてデモ用の架空のものです。
              実在するサイトへのアクセスは一切行っていません。
              「前回取得分」と「今回取得分」の2世代のデータをあらかじめ持たせ、
              実行ボタンでその2つを突き合わせています。
            </p>
            <p className="p-notice__body">
              実際の納品物は Python のスクリプトです。サーバー上で定期実行し、
              差分レポートをメールで送る形になります。
              収集先サイトの利用規約と robots.txt は着手前に確認し、許容される範囲でのみ実施します。
            </p>
          </div>

          <nav className="p-nav" aria-label="画面の目次">
            <ul>
              <li><a href="#settings">一　収集設定</a></li>
              <li><a href="#results">二　収集結果</a></li>
              <li><a href="#diff">三　差分レポート</a></li>
              <li><a href="#rules">四　通知ルール</a></li>
              <li><a href="#history">五　実行履歴</a></li>
              <li><a href="#saving">六　手作業との比較</a></li>
              <li><a href="#notes">七　実装と運用について</a></li>
            </ul>
          </nav>
        </header>

        <SectionSettings
          preset={preset}
          onPreset={switchPreset}
          cfg={cfg}
          setCfg={setCfg}
          freq={freq}
          phase={phase}
          doneTargets={doneTargets}
          onRun={run}
          canRun={canRun}
          nextRunAt={nextRunAt}
        />

        <SectionResults
          preset={preset}
          diffs={diffs}
          fields={fields}
          prevAt={prevAt}
          currAt={currAt}
          hasRun={hasRun}
        />

        <SectionDiff
          preset={preset}
          diffs={diffs}
          counts={counts}
          notified={notified}
          hasRun={hasRun}
          currAt={currAt}
        />

        <SectionRules
          preset={preset}
          cfg={cfg}
          setCfg={setCfg}
          hitCounts={hitCounts}
          fieldKeys={cfg.fieldKeys}
          notifiedSize={notified.size}
        />

        <SectionHistory runs={runs} freq={freq} nextRunAt={nextRunAt} />

        <SectionSaving
          preset={preset}
          freq={freq}
          currCount={currCount}
          changedCount={changedCount}
          saving={saving}
          setSaving={setSaving}
        />

        <SectionNotes />
      </div>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
